<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Post screen checks</title><style>body{margin:20px;background:#edf0ea;color:#223c35;font:15px system-ui}nav{display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;padding:8px 14px;background:white;border:1px solid #83978c;border-radius:6px;font:inherit}iframe{display:block;border:1px solid #6e8477;margin-top:15px}pre{white-space:pre-wrap;max-width:1100px}#stage{width:max-content}</style></head><body><h1>Trading Post · rendered checks</h1><nav id="sizes"></nav><p id="report" role="status">Loading…</p><div id="stage"><iframe id="frame" title="Trading Post preview" src="./?screencheck=20261009-post1"></iframe></div><button id="audit">Audit current screen</button><pre id="details"></pre><script>
const sizes=[[1024,540],[1366,650],[768,900],[390,667],[320,568],[640,360]],frame=document.querySelector('#frame');let size=sizes[0];
function audit(){const d=frame.contentDocument,w=frame.contentWindow;if(!d?.body||!w.TradingPostPreview)return;const controls=[...d.querySelectorAll('button')].filter(el=>el.getClientRects().length),short=controls.filter(el=>el.getBoundingClientRect().height<43.9),errors=[];if(d.documentElement.scrollWidth>size[0]+1)errors.push('Horizontal overflow');if(short.length)errors.push('Short buttons: '+short.map(b=>b.textContent.trim()).join(', '));document.querySelector('#report').textContent=size.join(' × ')+' · '+(errors.join('; ')||'No horizontal overflow; visible buttons ≥ 44 px');document.querySelector('#details').textContent=JSON.stringify({viewport:size,documentWidth:d.documentElement.scrollWidth,state:w.TradingPostPreview.getState(),visibleButtons:controls.length,errors},null,2);}
function resize(s){size=s;frame.width=s[0];frame.height=s[1];document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===s.join('x')));setTimeout(audit,150);}
document.querySelector('#sizes').innerHTML=sizes.map(s=>'<button data-size="'+s.join('x')+'">'+s.join(' × ')+'</button>').join('');document.querySelector('#sizes').addEventListener('click',e=>{if(e.target.dataset.size)resize(e.target.dataset.size.split('x').map(Number));});document.querySelector('#audit').onclick=audit;frame.onload=audit;resize(size);
</script></body></html>
