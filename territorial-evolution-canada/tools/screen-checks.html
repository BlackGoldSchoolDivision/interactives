<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canada through time · screen checks</title>
<style>body{margin:0;background:#edf2f6;color:#18344c;font:16px/1.5 system-ui,sans-serif}header{padding:12px 18px;background:white;border-bottom:1px solid #d9e3ea}h1{font-size:20px;margin:0 0 8px}label{font-weight:700}select,button{font:inherit;padding:8px;border:1px solid #b7c6d0;border-radius:7px;background:white;color:inherit;min-height:44px}#status{margin:8px 0 0;font-size:14px}.stage{padding:16px;overflow:auto}iframe{display:block;border:1px solid #a7bac6;background:white}</style></head>
<body><header><h1>Canada through time · screen checks</h1><label>Screen <select id="screen"><option value="1024,540">Small Chromebook · 1024 × 540</option><option value="1366,650">Laptop · 1366 × 650</option><option value="768,900">Tablet · 768 × 900</option><option value="390,667">Phone · 390 × 667</option><option value="320,568">Small phone · 320 × 568</option><option value="640,360">Landscape phone · 640 × 360</option></select></label> <button id="measure">Check layout</button><p id="status" role="status">Loading…</p></header><main class="stage"><iframe id="preview" title="Canada map screen preview" src="../index.html?year=1905"></iframe></main>
<script>
const frame=document.querySelector('#preview'),screen=document.querySelector('#screen'),status=document.querySelector('#status');
function measure(){const doc=frame.contentDocument;if(!doc?.body||doc.documentElement.dataset.ready!=='true'){status.textContent='Loading…';return;}const win=frame.contentWindow,root=doc.documentElement,map=doc.querySelector('#map').getBoundingClientRect();const controls=[...doc.querySelectorAll('button,select')].filter(element=>element.getBoundingClientRect().height>0);const short=controls.filter(element=>element.getBoundingClientRect().height<43.5);const overflow=Math.max(0,Math.max(root.scrollWidth,doc.body.scrollWidth)-root.clientWidth);status.textContent=`${win.innerWidth} × ${win.innerHeight} · Horizontal overflow: ${overflow} px · Map: ${Math.round(map.width)} × ${Math.round(map.height)} px · Controls under 44 px: ${short.length} · Date: ${doc.querySelector('#story-year').textContent}`;}
function size(){const[width,height]=screen.value.split(',').map(Number);frame.style.width=width+'px';frame.style.height=height+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}
screen.addEventListener('change',size);document.querySelector('#measure').addEventListener('click',measure);frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(measure);});size();
</script></body></html>
