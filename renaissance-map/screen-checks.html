<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renaissance Atlas screen checks</title><style>body{font:16px Arial;margin:12px;background:#ddd}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;padding:10px}iframe{border:0;background:white}label{display:inline-block;margin:8px}input{width:80px;font:inherit}</style><h1>Renaissance Atlas screen checks</h1><nav><button data-width="1024" data-height="540">1024 × 540</button><button data-width="1366" data-height="650">1366 × 650</button><button data-width="768" data-height="900">768 × 900</button><button data-width="390" data-height="667">390 × 667</button><button data-width="320" data-height="568">320 × 568</button><button data-width="640" data-height="360">640 × 360</button></nav><label>Width <input id="width" type="number" value="1024"></label><label>Height <input id="height" type="number" value="540"></label><button id="resize">Resize frame</button><p id="size">1024 × 540</p><iframe id="frame" title="Activity at test size" src="index.html" width="1024" height="540"></iframe><script>const f=document.querySelector('iframe');function size(w,h){f.width=w;f.height=h;document.querySelector('#width').value=w;document.querySelector('#height').value=h;document.querySelector('#size').textContent=w+' × '+h;}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>size(b.dataset.width,b.dataset.height));document.querySelector('#resize').onclick=()=>size(document.querySelector('#width').value,document.querySelector('#height').value);</script></html>
