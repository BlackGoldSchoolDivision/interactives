<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Illustrated atlas screen checks</title><style>body{margin:0;background:#d0d7dd;font:15px Arial}nav{min-height:55px;display:flex;align-items:center;gap:8px;padding:8px;flex-wrap:wrap;box-sizing:border-box}button{padding:8px 12px;min-height:40px}iframe{display:block;border:0;width:1363px;height:860px;max-width:none}</style></head><body><nav><button data-size="1363,860">Desktop</button><button data-size="1024,540">1024 × 540</button><button data-size="1366,650">1366 × 650</button><button data-size="768,900">768 × 900</button><button data-size="390,667">390 × 667</button><button data-size="320,568">320 × 568</button><button data-size="640,360">640 × 360</button></nav><iframe id="frame" src="illustrated-scene.html?v=scene5-full"></iframe><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(",");const f=document.getElementById("frame");f.style.width=w+"px";f.style.height=h+"px";});</script></body></html>
