<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Illustrated scene screen checks</title><style>body{margin:0;background:#d0d7dd;font:15px Arial}nav{height:55px;display:flex;align-items:center;gap:8px;padding:8px;box-sizing:border-box}button{padding:8px 12px;min-height:40px}iframe{display:block;border:0;width:1363px;height:860px;max-width:none}</style></head><body><nav><button data-size="1363,860">Desktop</button><button data-size="1024,540">Small screen</button><button data-size="640,360">Compact</button><button data-size="390,844">Phone</button></nav><iframe id="frame" src="illustrated-scene.html?v=scene3"></iframe><script>document.querySelectorAll("button").forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(",");const f=document.getElementById("frame");f.style.width=w+"px";f.style.height=h+"px";});</script></body></html>
