<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communication board screen checks</title>
<style>body{margin:12px;font:14px Arial}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{min-height:44px;padding:8px}iframe{display:block;border:2px solid #456;width:1024px;height:540px}#dimensions{font-weight:bold}</style>
<nav aria-label="Test viewport"><button data-w="1024" data-h="540">1024 × 540</button><button data-w="1366" data-h="650">1366 × 650</button><button data-w="768" data-h="900">768 × 900</button><button data-w="390" data-h="667">390 × 667</button><button data-w="320" data-h="568">320 × 568</button><button data-w="640" data-h="360">640 × 360</button><button id="zoom">200% zoom</button></nav><p id="dimensions">1024 × 540</p><iframe id="preview" title="Communication board test viewport" src="./index.html"></iframe>
<script>let zoom=false,w=1024,h=540;function fit(){const f=document.querySelector('iframe');f.style.width=(w/(zoom?2:1))+'px';f.style.height=(h/(zoom?2:1))+'px';f.style.zoom=zoom?'2':'1';document.querySelector('#dimensions').textContent=w+' × '+h+(zoom?' · 200% simulated layout zoom':'')}document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=Number(b.dataset.w);h=Number(b.dataset.h);fit()});document.querySelector('#zoom').onclick=()=>{zoom=!zoom;fit();document.querySelector('#zoom').textContent=zoom?'Reset zoom':'200% zoom'};</script></html>
