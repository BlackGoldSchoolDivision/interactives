/* Shared pure functions: no word generation, network calls, or student accounts. */
const MorphCore = (() => {
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function random(seed) { let s = seed >>> 0; return () => { s = (Math.imul(1664525,s)+1013904223) >>> 0; return s / 4294967296; }; }
  function shuffle(items, rng = Math.random) { const result = [...items]; for(let i=result.length-1;i>0;i--) { const j=Math.floor(rng()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; } return result; }
  function options(answer, pool, rng = Math.random) { return shuffle([answer,...shuffle([...new Set(pool)].filter(x=>x!==answer),rng).slice(0,2)],rng); }
  const partsCorrect = (selected, parts) => selected.length === parts.length && selected.every((p,i)=>p===parts[i]);
  const wrongGroups = (assignments, cards) => cards.filter(c=>assignments[c.id]!==c.group).map(c=>c.id);
  const wordSum = parts => parts.filter(Boolean).join(' + ');
  const summary = entries => ({completed:entries.filter(x=>x.completed).length,independent:entries.filter(x=>x.completed&&!x.supported).length,supported:entries.filter(x=>x.completed&&x.supported).length});
  return {escape,random,shuffle,options,partsCorrect,wrongGroups,wordSum,summary};
})();
if(typeof module !== 'undefined' && module.exports) module.exports=MorphCore;

  return `<div class="solo">${workhead()}${steps(m)}<section class="card">${content}${message?feedback(message,messageType):''}${hinted&&!answered?feedback(stage==='build'?`Start with the full base ${m.parts[1]}. ${m.parts[0]?m.parts[0]+'- means '+partMeaning(m,0)+'.':'No prefix is needed.'} ${m.parts[2]?'-'+m.parts[2]+' '+partMeaning(m,2)+'.':'No suffix is needed.'}`:stage==='spell'?m.rule:`Read the sentence again. Think about the jobs of ${MorphCore.wordSum(m.parts)}.`,'hint','Try this clue'):''}</section></div>`;}
function complete(){const stats=MorphCore.summary(results);const supportedIds=results.filter(x=>x.supported).map(x=>x.id);return `<section class="card solo"><p class="eyebrow">Round complete</p><h1 class="success-title">You built ${stats.completed} words.</h1><p class="lead">Your explanations connect small word parts to bigger meanings. Keep noticing these words when you read and write.</p><div class="stat-grid"><div class="stat"><strong>${stats.independent}</strong><span>Completed without hints or retries</span></div><div class="stat"><strong>${stats.supported}</strong><span>Practised with support</span></div></div><div class="evidence-list">${results.map(r=>{const m=DATA.missions.find(m=>m.id===r.id);return `<div><strong>${e(MorphCore.wordSum(m.parts))} → ${e(m.word)}</strong>${e(m.meanings[0])}${m.rule?`<p class="tiny space-sm">${e(m.rule)}</p>`:''}</div>`;}).join('')}</div><div class="actions">${supportedIds.length?button('Revisit supported words','review','','primary'):button('Try six more','start',`data-level="${level}"`,'primary')}${button('Choose another set','home')}${button('Print these missions','print',`data-key="false"`)}</div><p class="note space">Try a transfer task: find or write a new sentence using one word from the round. Discuss how the word’s parts help with its meaning.</p></section>`;}
function lab(){const bases=[...new Set(allWords.map(m=>m.parts[1]))].sort();const words=allWords.filter(m=>m.parts[1]===labBase);let m=words.find(m=>m.word===labWord)||words[0];labWord=m.word;return `<div class="section-head"><div><p class="eyebrow">Word Lab · explore at your own pace</p><h1 style="font-size:2.6rem">Same base. New possibilities.</h1><p>Compare real words. Word sums keep the full base visible.</p></div></div><div class="split"><section class="card"><label class="field">Choose a base<select id="lab-base">${bases.map(b=>`<option value="${e(b)}" ${b===labBase?'selected':''}>${e(b)} · ${e(DATA.bases[b]||'')}</option>`).join('')}</select></label><div class="sum">Base: ${e(labBase)} <span class="muted smalltext">· ${e(DATA.bases[labBase])}</span></div><h3>Investigate a word</h3><div class="library">${words.map(w=>button(e(w.word),'lab-word',`data-word="${e(w.word)}" aria-pressed="${w.word===m.word}"`)).join('')}</div><p class="note">These are selected real words, not every possible member of the family. Not every prefix and suffix can combine with every base.</p></section><section class="card"><p class="eyebrow">${e(m.word)}</p><div class="tiles">${sumTiles(m.parts)}</div><p class="sum">${e(MorphCore.wordSum(m.parts))} → ${e(m.word)}</p><h3>${e(m.meanings[0])}</h3><p>${e(m.sentence.replace('___',m.word))}</p>${m.rule?feedback(m.rule,'hint','Notice the spelling'):feedback('The parts join without changing the base spelling.')}<div class="actions">${button('Hear the word','speak',`data-text="${e(m.word)}"`)}</div></section></div><section class="card space"><h3>Talk about your discovery</h3><p>What stays the same? What changes? Explain the affix’s job, then use the word in a sentence of your own.</p></section>`;}
function teacher(){return `<div class="section-head"><div><p class="eyebrow">Teacher corner</p><h1 style="font-size:2.7rem">Make the thinking visible.</h1><p>Designed for roughly Grades 3–6. Use adult-supported examples with younger learners.</p></div></div><div class="split"><section class="card"><h2>A short teaching routine</h2><div class="evidence-list"><div><strong>1 · Model one word</strong>Read a sentence, name the full base, and explain the prefix or suffix. Use a word sum.</div><div><strong>2 · Practise and compare</strong>Play six missions with a partner. Ask students to explain a choice before checking it.</div><div><strong>3 · Return to reading and writing</strong>Find another family member in a text. Write a new sentence and explain the meaning. Revisit the words later.</div></div><p class="note space">“Without hints or retries” describes this round only. It is not a reading level, grade or diagnostic score.</p></section><section class="card"><h2>Take it off screen</h2><p>Print a six-word activity with room for word sums, spellings and explanations.</p><label class="field space">Mission set<select id="print-level">${Object.entries(DATA.levels).map(([id,l])=>`<option value="${id}" ${id===printLevel?'selected':''}>${e(l.title)}</option>`).join('')}</select></label><div class="actions">${button('Print activity','print',`data-key="false"`,'primary')}${button('Print with answer key','print',`data-key="true"`)}</div><p class="tiny muted space">If a round is active for this set, printing uses its words. Otherwise, it uses the first six words in the set.</p></section></div><section class="card space"><h2>What is in the bank?</h2><p>36 game missions, plus six comparison words in the Word Lab. Silent-e removal, y-to-i and consonant doubling are taught through specific examples; these are not universal rules without exceptions.</p><div class="wordbank space">${DATA.missions.map(m=>button(e(m.word),'preview',`data-word="${e(m.word)}"`)).join('')}</div></section><div class="space">${researchPanel()}</div>`;}
function printable(key){const items=deck.length&&DATA.missions.find(m=>m.id===deck[0].id)?.level===printLevel?deck:DATA.missions.filter(m=>m.level===printLevel).slice(0,6);const sheet=`<p>${e(DATA.levels[printLevel].title)} · Name: ____________________ &nbsp; Date: ______________</p><p>Read each sentence. Build a word from meaningful parts. Write the full base in a word sum, then write the finished spelling and explain its meaning.</p>${items.map((m,i)=>`<section class="print-item"><h3>${i+1}. ${e(m.sentence.replace('___','____________'))}</h3><p>Meaning clue: ${e(m.meanings[0])}</p><p>Word sum: _______________________________________________________</p><p>Finished spelling: ____________________________</p><p>Explain the meaning in your own words:</p><div class="writing-lines"></div></section>`).join('')}<p class="print-footer">Morpheme Missions · interactives.blackgold.ca/morpheme-missions/</p>`;const answers=key?`<section class="key"><h2>Teacher answer key</h2>${items.map((m,i)=>`<section class="print-item"><h3>${i+1}. ${e(MorphCore.wordSum(m.parts))} → ${e(m.word)}</h3><p>${e(m.meanings[0])}</p>${m.rule?`<p>${e(m.rule)}</p>`:''}<p>${m.parts.map((p,j)=>p?e(p+': '+partMeaning(m,j)):'').filter(Boolean).join('; ')}</p></section>`).join('')}<p>Accept accurate explanations in students’ own words. Ask learners to write a new sentence as an extension.</p></section>`:'';printPage('Morpheme Missions — activity',sheet+answers);}
function render(focus=false){navActive(route);draw(route==='game'?game():route==='lab'?lab():teacher(),focus);}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled||b.dataset.action==='speak')return;const action=b.dataset.action;const m=deck[round];
  if(action==='route'){route=b.dataset.route;render(true);return;}
  if(action==='home'){deck=[];route='game';render(true);return;}
  if(action==='resume'){route='game';render(true);return;}
  if(action==='start'){start(b.dataset.level);return;}
  if(action==='pick'){selected[Number(b.dataset.column)]=b.dataset.part;message='';render();return;}
  if(action==='hint'){hinted=true;supported=true;announce('A hint is shown below the activity.');render();return;}
  if(action==='check-build'){
    if(!MorphCore.partsCorrect(selected,m.parts)){supported=true;const wrong=selected.map((p,i)=>p!==m.parts[i]?['prefix','base','suffix'][i]:null).filter(Boolean);message=`Revisit your ${wrong.join(' and ')}. Use the meaning clue and the full base. You can change a tile and check again.`;messageType='error';announce(message);render();return;}
    stage=m.spellings.length?'spell':'meaning';answered=false;chosen=null;hinted=false;message=m.spellings.length?'You found the meaningful parts. Now investigate the finished spelling.':'The parts fit. Now explain how the word works in the sentence.';messageType='success';render(true);return;
  }
  if(action==='answer-spell'){chosen=b.dataset.answer;answered=chosen===m.word;if(!answered)supported=true;message=answered?m.rule:`That spelling does not fit this word sum. ${m.rule} Choose again.`;messageType=answered?'success':'error';announce(message);render();return;}
  if(action==='to-meaning'){stage='meaning';answered=false;chosen=null;message='';hinted=false;render(true);return;}
  if(action==='answer-meaning'){chosen=b.dataset.answer;answered=chosen===m.meanings[0];if(!answered)supported=true;message=answered?`${m.word} means “${m.meanings[0]}” here. The base and the affixes work together.`:`That meaning does not fit this sentence. Read the word sum and think about each part’s job. Try again or use a hint.`;messageType=answered?'success':'error';announce(message);render();return;}
  if(action==='next'){results.push({id:m.id,completed:true,supported});round++;if(round<deck.length)newRound();render(true);return;}
  if(action==='review'){start(level,results.filter(x=>x.supported).map(x=>x.id));return;}
  if(action==='lab-word'){labWord=b.dataset.word;render();return;}
  if(action==='preview'){const word=allWords.find(m=>m.word===b.dataset.word);labBase=word.parts[1];labWord=word.word;route='lab';render(true);return;}
  if(action==='print'){if(route==='game')printLevel=level;printable(b.dataset.key==='true');return;}
});
document.addEventListener('change',event=>{if(event.target.id==='lab-base'){labBase=event.target.value;labWord='';render();}if(event.target.id==='print-level'){printLevel=event.target.value;}});
render();
</script></body></html>
