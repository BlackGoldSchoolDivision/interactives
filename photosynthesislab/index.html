<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photosynthesis Virtual Lab</title>
    
    <link rel="stylesheet" href="app.css?v=20261005">
    <script src="vendor/react18.min.js"></script>
    <script src="vendor/react-dom18.min.js"></script>
    
    
    
    <style>
        body {
            background-color: #f0f0f0;
            color: #333333;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Tab Styles */
        .gizmo-tabs {
            display: flex;
            background: #d4d4d4;
            border-bottom: 2px solid #a0a0a0;
            padding-left: 10px;
            padding-top: 5px;
        }

        .gizmo-tab {
            background: #e5e5e5;
            border: 1px solid #a0a0a0;
            border-bottom: none;
            padding: 6px 20px;
            margin-right: 2px;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
        }

        .gizmo-tab.active {
            background: #ffffff;
            border-top: 2px solid #ffffff;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 3;
        }
        
        .gizmo-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: #ffffff;
        }

        /* Panel Container */
        .gizmo-panel {
            background: #ffffff;
            border: 1px solid #a0a0a0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Horizontal Tracks (Light & CO2) */
        .track-light::-webkit-slider-runnable-track { height: 8px; background: #6b21a8; border-radius: 4px; border: 1px solid #4c1d95; }
        .track-co2::-webkit-slider-runnable-track { height: 8px; background: #0d9488; border-radius: 4px; border: 1px solid #0f766e; }
        
        /* Horizontal Thumbs */
        .track-light::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 12px; background: #a855f7; border: 1px solid #333; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .track-co2::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 12px; background: #2dd4bf; border: 1px solid #333; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

        /* Vertical Slider Container (rotated via CSS for Temperature) */
        .vertical-slider-container {
            position: absolute;
            top: 60px;
            left: 20px;
            height: 120px;
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        
        .vertical-slider-wrapper {
            transform: rotate(-90deg);
            transform-origin: center center;
            width: 100px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .track-temp::-webkit-slider-runnable-track { height: 8px; background: #94a3b8; border-radius: 4px; border: 1px solid #64748b; }
        .track-temp::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 14px; background: #ef4444; border: 1px solid #7f1d1d; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: -1px 1px 3px rgba(0,0,0,0.3); }

        .value-box {
            background: #e5e7eb;
            border: 1px inset #9ca3af;
            padding: 2px 8px;
            text-align: right;
            width: 50px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .color-bar {
            width: 4px;
            height: 100%;
        }

        .description-card {
            background-color: #e8e3ce;
            border: 1px solid #d0c8b0;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .description-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
        }
        
        /* Table Styles */
        .gizmo-table th {
            background: #d4d4d4;
            border: 1px solid #a0a0a0;
            font-size: 12px;
            padding: 4px 8px;
            text-align: center;
        }
        .gizmo-table td {
            border: 1px solid #ccc;
            font-size: 12px;
            padding: 4px 8px;
            text-align: center;
            background: #fff;
        }
    </style>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600&display=swap');body{font-family:Nunito,system-ui,sans-serif!important;background:#f8f6ef!important;color:#24483b!important;padding:24px!important}.lab-heading,.lab-notebook{max-width:1152px;margin:0 auto 24px}.lab-heading h1{font:600 clamp(1.6rem,4vw,2.6rem) Lexend,system-ui;margin:18px 0 12px}.lab-heading a{color:#167563}.lab-notebook{padding:20px;background:#fff;border:1px solid #dfe8e1;border-radius:16px;line-height:1.6}.lab-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.lab-actions button{background:#087b68;color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:700}.lab-actions button:disabled{opacity:.5}.gizmo-panel{border-radius:0 0 16px 16px!important;border-color:#bfcdc5!important;overflow:hidden;box-shadow:0 6px 20px #284a3010}.gizmo-tab{background:#e5efe9!important;border-color:#bfcdc5!important}.gizmo-tab.active{background:#fff!important;color:#176551!important}.description-card{background:#f1f7f2!important;border-color:#c7dacd!important}.description-card::after{display:none}.gizmo-tabs{flex-wrap:wrap;gap:2px}button{min-height:44px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #147cad;outline-offset:3px}@media(max-width:600px){body{padding:12px!important}.w-32{width:95px!important}.lab-notebook{padding:16px}.description-card{padding:18px!important}.gizmo-table{min-width:450px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head>

</body>
</html>
