<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photosynthesis Virtual Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background-color: #f0f0f0;
            color: #333333;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Tab Styles */
        .gizmo-tabs {
            display: flex;
            background: #d4d4d4;
            border-bottom: 2px solid #a0a0a0;
            padding-left: 10px;
            padding-top: 5px;
        }

        .gizmo-tab {
            background: #e5e5e5;
            border: 1px solid #a0a0a0;
            border-bottom: none;
            padding: 6px 20px;
            margin-right: 2px;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
        }

        .gizmo-tab.active {
            background: #ffffff;
            border-top: 2px solid #ffffff;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 3;
        }
        
        .gizmo-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: #ffffff;
        }

        /* Panel Container */
        .gizmo-panel {
            background: #ffffff;
            border: 1px solid #a0a0a0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Horizontal Tracks (Light & CO2) */
        .track-light::-webkit-slider-runnable-track { height: 8px; background: #6b21a8; border-radius: 4px; border: 1px solid #4c1d95; }
        .track-co2::-webkit-slider-runnable-track { height: 8px; background: #0d9488; border-radius: 4px; border: 1px solid #0f766e; }
        
        /* Horizontal Thumbs */
        .track-light::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 12px; background: #a855f7; border: 1px solid #333; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .track-co2::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 12px; background: #2dd4bf; border: 1px solid #333; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }

        /* Vertical Slider Container (rotated via CSS for Temperature) */
        .vertical-slider-container {
            position: absolute;
            top: 60px;
            left: 20px;
            height: 120px;
            width: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        
        .vertical-slider-wrapper {
            transform: rotate(-90deg);
            transform-origin: center center;
            width: 100px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .track-temp::-webkit-slider-runnable-track { height: 8px; background: #94a3b8; border-radius: 4px; border: 1px solid #64748b; }
        .track-temp::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 14px; background: #ef4444; border: 1px solid #7f1d1d; border-radius: 2px; margin-top: -8px; cursor: pointer; box-shadow: -1px 1px 3px rgba(0,0,0,0.3); }

        .value-box {
            background: #e5e7eb;
            border: 1px inset #9ca3af;
            padding: 2px 8px;
            text-align: right;
            width: 50px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .color-bar {
            width: 4px;
            height: 100%;
        }

        .description-card {
            background-color: #e8e3ce;
            border: 1px solid #d0c8b0;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .description-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
        }
        
        /* Table Styles */
        .gizmo-table th {
            background: #d4d4d4;
            border: 1px solid #a0a0a0;
            font-size: 12px;
            padding: 4px 8px;
            text-align: center;
        }
        .gizmo-table td {
            border: 1px solid #ccc;
            font-size: 12px;
            padding: 4px 8px;
            text-align: center;
            background: #fff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Component for the 3D/Isometric visual chamber
        const IsometricChamber = ({ light, temp, lightColor, rate }) => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let lastTime = 0;
                let bubbles = [];
                let bubbleAccumulator = 0;

                const animate = (time) => {
                    const dt = time - lastTime;
                    lastTime = time;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Bubble spawning based on oxygen flow rate
                    const bubblesPerSec = rate / 5; 
                    
                    if (dt > 0 && rate > 0) {
                        bubbleAccumulator += (bubblesPerSec * dt) / 1000;
                        while (bubbleAccumulator > 1) {
                            bubbles.push({
                                x: 12 + Math.random() * 8, // constrain within tube
                                y: 150, // start at bottom of tube
                                radius: Math.random() * 2 + 1,
                                speed: Math.random() * 30 + 40
                            });
                            bubbleAccumulator -= 1;
                        }
                    }

                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.strokeStyle = 'rgba(100,150,255,0.5)';
                    
                    for (let i = bubbles.length - 1; i >= 0; i--) {
                        let b = bubbles[i];
                        b.y -= (b.speed * dt) / 1000;
                        
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        
                        if (b.y < 30) {
                            bubbles.splice(i, 1);
                        }
                    }

                    animationId = requestAnimationFrame(animate);
                };

                animationId = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationId);
            }, [rate]);

            // Light color overlay mapping
            const activeLightStyle = lightColor === 'WHITE' 
                ? `rgba(255, 255, 255, ${light / 100 * 0.7})` 
                : `rgba(255, 100, 100, ${light / 100 * 0.7})`;

            return (
                <div className="relative w-full h-[350px] bg-gradient-to-b from-[#e5e5e5] to-[#f5f5f5] overflow-hidden border-b border-gray-300">
                    
                    <div className="absolute inset-0" style={{ transform: 'scale(1.1) translate(20px, 20px)' }}>
                        
                        <svg className="absolute top-0 left-0 w-full h-full pointer-events-none" style={{ zIndex: 0 }}>
                            <path d="M 0 220 C 50 220, 80 200, 150 150" fill="none" stroke="#333" strokeWidth="4" />
                            <path d="M 300 130 L 450 200" fill="none" stroke="#666" strokeWidth="2" />
                        </svg>

                        <div className="absolute top-[80px] left-[60px] w-[280px] h-[220px]" style={{ zIndex: 5 }}>
                            
                            <div className="absolute bottom-0 left-0 w-full h-[60px] bg-[#d4d4d4] border-b-[8px] border-l-[8px] border-[#a0a0a0]" 
                                 style={{ transform: 'skewX(-45deg)', transformOrigin: 'bottom left' }}></div>
                            
                            <div className="absolute bottom-[8px] left-[8px] w-full h-[60px] bg-[#e0f0ff] opacity-80" 
                                 style={{ transform: 'skewX(-45deg)', transformOrigin: 'bottom left' }}>
                                <div className="absolute bottom-2 left-4 w-4 h-3 bg-gray-300 rounded-full shadow"></div>
                                <div className="absolute bottom-4 left-8 w-5 h-4 bg-gray-400 rounded-full shadow"></div>
                                <div className="absolute bottom-6 left-2 w-3 h-2 bg-gray-300 rounded-full shadow"></div>
                                <div className="absolute top-4 right-10 w-4 h-3 bg-gray-300 rounded-full shadow"></div>
                            </div>

                            <div className="absolute bottom-[60px] left-[60px] w-full h-[140px] bg-blue-100/30 border border-white/50" 
                                 style={{ transform: 'skewX(-45deg)', transformOrigin: 'bottom left' }}></div>

                            {}
                            <svg className="absolute bottom-[10px] left-[70px] w-[140px] h-[160px]" viewBox="0 0 100 100">
                                <g stroke="#4ade80" strokeWidth="2" fill="none" strokeLinecap="round">
                                    <path d="M50 100 Q45 50 30 10" />
                                    <path d="M50 100 Q55 60 70 20" />
                                    <path d="M50 100 Q50 50 50 15" />
                                    <path d="M45 80 L35 75 M48 60 L30 50 M46 40 L25 35" stroke="#22c55e" strokeWidth="3"/>
                                    <path d="M55 85 L65 80 M52 65 L70 55 M54 45 L75 35" stroke="#22c55e" strokeWidth="3"/>
                                    <path d="M50 70 L40 65 M50 50 L38 45" stroke="#22c55e" strokeWidth="3"/>
                                </g>
                                <circle cx="35" cy="75" r="2" fill="white" opacity={rate > 10 ? 0.8 : 0} />
                                <circle cx="70" cy="55" r="3" fill="white" opacity={rate > 30 ? 0.8 : 0} />
                                <circle cx="40" cy="30" r="2" fill="white" opacity={rate > 50 ? 0.8 : 0} />
                            </svg>

                            <div className="absolute bottom-[60px] left-0 w-[60px] h-[140px] bg-blue-50/40 border border-white/60" 
                                 style={{ transform: 'skewY(-45deg)', transformOrigin: 'bottom left' }}></div>

                            <div className="absolute bottom-[60px] left-[60px] w-full h-[140px] bg-white/20 border border-white/60 shadow-[inset_0_0_20px_rgba(255,255,255,0.5)]">
                                <div className="absolute inset-0 bg-white" style={{ opacity: light / 100 * 0.2, mixBlendMode: 'overlay' }}></div>
                            </div>
                            
                            <svg className="absolute -top-[50px] left-0 w-[340px] h-[110px] pointer-events-none">
                                <path d="M 0 110 L 60 50 L 340 50" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2" />
                                <path d="M 0 110 L 120 0 L 250 0 L 340 50" fill="none" stroke="rgba(255,255,255,0.6)" strokeWidth="1" />
                                <path d="M 120 0 L 170 110 M 250 0 L 170 110" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="1" />
                            </svg>
                        </div>

                        {}
                        <div className="absolute top-[20px] left-[130px]" style={{ zIndex: 6 }}>
                            <svg width="140" height="70">
                                <polygon points="40,0 100,0 140,50 0,50" fill="#9ca3af" stroke="#4b5563" strokeWidth="1"/>
                                <polygon points="40,0 100,0 70,50" fill="#d1d5db" />
                                <circle cx="70" cy="55" r="10" fill="white" />
                                <polygon points="70,55 160,200 -20,200" fill={activeLightStyle} style={{ mixBlendMode: 'plus-lighter' }} />
                                <rect x="65" y="-15" width="10" height="15" fill="#333" />
                                <path d="M 70 -15 C 70 -30, 40 -40, 20 -30" fill="none" stroke="#333" strokeWidth="4" />
                            </svg>
                        </div>

                        {}
                        <div className="absolute top-[130px] left-[260px]" style={{ zIndex: 7 }}>
                            <svg width="180" height="200">
                                <rect x="0" y="40" width="80" height="20" fill="#9ca3af" stroke="#4b5563" strokeWidth="1" transform="rotate(15 0 40)" />
                                <text x="15" y="65" fontSize="10" fill="#333" transform="rotate(15 0 40)" letterSpacing="1">OXYGEN</text>
                                <rect x="75" y="55" width="25" height="30" fill="#6b7280" rx="3" />
                                <rect x="85" y="-20" width="30" height="150" fill="rgba(255,255,255,0.7)" stroke="#64748b" strokeWidth="2" rx="15" />
                                
                                {/* Liquid level displacement mapped to the current rate */}
                                <rect x="87" y={100 - (rate * 0.8)} width="26" height={30 + (rate * 0.8)} fill="#93c5fd" opacity="0.8" rx="2" />
                                
                                <g stroke="#475569" strokeWidth="1">
                                    <line x1="115" y1="0" x2="120" y2="0" /> <text x="122" y="4" fontSize="10" fill="#333">100</text>
                                    <line x1="115" y1="20" x2="120" y2="20" /> <text x="122" y="24" fontSize="10" fill="#333">80</text>
                                    <line x1="115" y1="40" x2="120" y2="40" /> <text x="122" y="44" fontSize="10" fill="#333">60</text>
                                    <line x1="115" y1="60" x2="120" y2="60" /> <text x="122" y="64" fontSize="10" fill="#333">40</text>
                                    <line x1="115" y1="80" x2="120" y2="80" /> <text x="122" y="84" fontSize="10" fill="#333">20</text>
                                    <line x1="115" y1="100" x2="120" y2="100" /> <text x="122" y="104" fontSize="10" fill="#333">0</text>
                                </g>

                                <rect x="80" y="-10" width="10" height="4" fill="#9ca3af" />
                            </svg>
                            
                            <canvas ref={canvasRef} width="30" height="130" className="absolute top-[-10px] left-[85px] pointer-events-none" style={{ zIndex: 10 }}></canvas>
                        </div>

                    </div>
                </div>
            );
        };

        const App = () => {
            // Independent Variables State
            const [lightColor, setLightColor] = useState('WHITE');
            const [light, setLight] = useState(30);
            const [co2, setCo2] = useState(500);
            const [temp, setTemp] = useState(30.0);

            // Tab State
            const [activeRightTab, setActiveRightTab] = useState('DESCRIPTION');
            const [dataPoints, setDataPoints] = useState([]);
            
            const currentRate = useMemo(() => {
                const lightFactor = light / 100;
                const co2Factor = co2 / (co2 + 200); 
                
                const optimalTemp = 30;
                let tempFactor = Math.exp(-Math.pow(temp - optimalTemp, 2) / 150);
                if (temp > 40) tempFactor *= Math.max(0, 1 - (temp - 40) / 5);

                const maxTheoreticalRate = 121.8;
                let rate = lightFactor * co2Factor * tempFactor * maxTheoreticalRate;
                
                if (lightColor === 'COLOR') rate *= 0.85; 
                
                return Math.max(0, rate);
            }, [light, co2, temp, lightColor]);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (activeRightTab === 'DESCRIPTION' || activeRightTab === 'TABLE') return;
                
                // Important safety check for chart canvas presence
                if (!chartRef.current) return;

                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const labels = dataPoints.map((_, i) => `Trial ${i + 1}`);
                const rates = dataPoints.map(d => d.rate.toFixed(1));

                chartInstance.current = new Chart(ctx, {
                    type: activeRightTab === 'BAR CHART' ? 'bar' : 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Oxygen Flow (mL/h)',
                            data: rates,
                            backgroundColor: 'rgba(59, 130, 246, 0.6)',
                            borderColor: 'rgba(37, 99, 235, 1)',
                            borderWidth: 1,
                            pointBackgroundColor: '#2563eb',
                            fill: activeRightTab === 'GRAPH'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                max: 100,
                                title: { display: true, text: 'Oxygen (mL/h)' }
                            }
                        }
                    }
                });

                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [dataPoints, activeRightTab]);

            const handleRecord = () => {
                setDataPoints([...dataPoints, {
                    lightColor, light, co2, temp: temp.toFixed(1), rate: currentRate
                }]);
            };

            return (
                <div className="max-w-6xl mx-auto flex flex-col md:flex-row gap-6">
                    
                    <div className="w-full md:w-[500px] flex-shrink-0">
                        <div className="gizmo-tabs">
                            <button className={`gizmo-tab ${lightColor === 'WHITE' ? 'active' : ''}`} onClick={() => setLightColor('WHITE')}>WHITE</button>
                            <button className={`gizmo-tab ${lightColor === 'COLOR' ? 'active' : ''}`} onClick={() => setLightColor('COLOR')}>COLOR</button>
                        </div>
                        
                        <div className="gizmo-panel">
                            <div className="relative">
                                {/* Temperature Control Overlay */}
                                <div className="vertical-slider-container">
                                    <div className="text-center font-bold text-sm mb-1">{temp.toFixed(1)}</div>
                                    <div className="text-xs font-bold transform -rotate-90 origin-bottom mt-16 whitespace-nowrap" style={{ height: 0 }}>
                                        Temperature (°C)
                                    </div>
                                    <div className="vertical-slider-wrapper">
                                        <input type="range" min="0" max="50" step="0.1" 
                                            value={temp} onChange={(e) => setTemp(Number(e.target.value))}
                                            className="track-temp w-full" 
                                        />
                                    </div>
                                </div>

                                <IsometricChamber light={light} temp={temp} lightColor={lightColor} rate={currentRate} />
                            </div>

                            {}
                            <div className="p-5 flex flex-col gap-5">
                                <div className="flex items-center">
                                    <div className="w-32 font-bold text-sm">Light intensity</div>
                                    <input type="range" min="0" max="100" step="1" 
                                        value={light} onChange={(e) => setLight(Number(e.target.value))}
                                        className="track-light flex-grow mx-3" 
                                    />
                                    <div className="flex items-center border border-gray-400 bg-white">
                                        <div className="value-box">{light}</div>
                                        <div className="w-6 text-center text-sm font-bold">%</div>
                                        <div className="color-bar bg-purple-600"></div>
                                    </div>
                                </div>

                                <div className="flex items-center">
                                    <div className="w-32 font-bold text-sm">CO₂ level</div>
                                    <input type="range" min="0" max="1000" step="10" 
                                        value={co2} onChange={(e) => setCo2(Number(e.target.value))}
                                        className="track-co2 flex-grow mx-3" 
                                    />
                                    <div className="flex items-center border border-gray-400 bg-white">
                                        <div className="value-box">{co2}</div>
                                        <div className="w-10 text-center text-sm font-bold">ppm</div>
                                        <div className="color-bar bg-teal-500"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="w-full md:flex-grow">
                        <div className="gizmo-tabs">
                            {['DESCRIPTION', 'TABLE', 'BAR CHART', 'GRAPH'].map(tab => (
                                <button key={tab} 
                                    className={`gizmo-tab ${activeRightTab === tab ? 'active' : ''}`} 
                                    onClick={() => setActiveRightTab(tab)}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>

                        <div className="gizmo-panel p-6 h-[510px] flex flex-col">
                            
                            {activeRightTab === 'DESCRIPTION' && (
                                <div className="description-card p-8 h-full flex flex-col">
                                    <div className="flex justify-between items-start mb-6">
                                        <h2 className="text-xl font-bold">Gizmo Status</h2>
                                        <button onClick={handleRecord} className="p-2 bg-gray-200 hover:bg-gray-300 rounded border border-gray-400 title='Record Data'">
                                            <svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                                        </button>
                                    </div>
                                    
                                    <p className="mb-10 text-gray-800 leading-relaxed max-w-sm">
                                        With this Gizmo, you can observe how a plant produces oxygen from water, sunlight, and carbon dioxide.
                                    </p>
                                    
                                    <div className="font-bold space-y-2 mt-auto pb-8">
                                        <div>Intensity of light: {light}%</div>
                                        <div>Temperature: {temp.toFixed(1)} °C</div>
                                        <div>Carbon dioxide level: {co2} ppm</div>
                                        <div className="mt-2 text-lg">Oxygen flow: {currentRate.toFixed(1)} mL/h</div>
                                        <div className="mt-6 text-gray-700 font-normal">
                                            {lightColor === 'WHITE' ? 'White' : 'Colored'} light is being used.
                                        </div>
                                    </div>
                                </div>
                            )}

                            {}
                            {activeRightTab === 'TABLE' && (
                                <div className="h-full flex flex-col">
                                    <div className="flex justify-between mb-2">
                                        <h3 className="font-bold">Recorded Data</h3>
                                        <button onClick={handleRecord} className="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">Record Data</button>
                                    </div>
                                    <div className="flex-grow overflow-auto border border-gray-300">
                                        <table className="w-full gizmo-table border-collapse">
                                            <thead className="sticky top-0">
                                                <tr>
                                                    <th>Trial</th>
                                                    <th>Light</th>
                                                    <th>Intensity (%)</th>
                                                    <th>CO₂ (ppm)</th>
                                                    <th>Temp (°C)</th>
                                                    <th>Flow (mL/h)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {dataPoints.length === 0 ? (
                                                    <tr><td colSpan="6" className="py-8 text-gray-500">No data recorded. Adjust sliders and click Record Data.</td></tr>
                                                ) : (
                                                    dataPoints.map((row, i) => (
                                                        <tr key={i} className="hover:bg-blue-50">
                                                            <td>{i + 1}</td>
                                                            <td>{row.lightColor}</td>
                                                            <td>{row.light}</td>
                                                            <td>{row.co2}</td>
                                                            <td>{row.temp}</td>
                                                            <td className="font-bold text-blue-700">{row.rate.toFixed(1)}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {}
                            {(activeRightTab === 'BAR CHART' || activeRightTab === 'GRAPH') && (
                                <div className="h-full flex flex-col">
                                    <div className="flex justify-between mb-4">
                                        <h3 className="font-bold">{activeRightTab === 'BAR CHART' ? 'Bar Chart' : 'Line Graph'}</h3>
                                        <button onClick={handleRecord} className="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">Record Data</button>
                                    </div>
                                    <div className="flex-grow relative">
                                        {dataPoints.length === 0 ? (
                                            <div className="absolute inset-0 flex items-center justify-center text-gray-500 border border-dashed border-gray-300">
                                                Record data points to generate the graph.
                                            </div>
                                        ) : (
                                            <canvas ref={chartRef}></canvas>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
