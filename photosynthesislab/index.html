<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photosynthesis Lab</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Load Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Recharts (and its dependencies) -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1) translateX(var(--drift)); }
            100% { transform: translateY(-250px) scale(1.5) translateX(calc(var(--drift) * 3)); opacity: 0; }
        }
        
        .bubble {
            animation: floatUp linear forwards;
        }

        /* Input Range Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -4px; /* offset for track */
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #334155;
            border-radius: 4px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    // Convert PascalCase (e.g. RefreshCw) to kebab-case (e.g. refresh-cw) for Lucide
                    const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                    
                    // Render the target element for Lucide to replace
                    iconRef.current.innerHTML = `<i data-lucide="${kebabName}"></i>`;
                    
                    // Safely create the icon scoped ONLY to this span to prevent React DOM conflicts
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: {
                            class: className,
                            width: size,
                            height: size,
                            stroke: "currentColor",
                            "stroke-width": 2,
                            "stroke-linecap": "round",
                            "stroke-linejoin": "round"
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const INITIAL_STATE = {
            lightIntensity: 50, // 0-100%
            temperature: 25, // 0-50 C
            co2Level: 450, // 0-1000 ppm
            lightColor: 'white', // white, red, blue, green
            waterSupply: true,
            isRunning: false,
        };

        const calculateOxygenRate = (state) => {
            if (!state.waterSupply) return 0;

            // 1. Light Intensity Factor
            let lightFactor = (state.lightIntensity / 100) * 1.2;
            if (state.lightIntensity > 80) lightFactor = 1.0 + (state.lightIntensity - 80) / 200; 

            // 2. Temperature Factor (Bell curve, optimal around 28C)
            let tempFactor = 1;
            if (state.temperature < 10) tempFactor = state.temperature / 10;
            else if (state.temperature > 40) tempFactor = Math.max(0, 1 - (state.temperature - 40) / 10);
            else tempFactor = 1 - Math.pow((state.temperature - 28) / 20, 2);

            // 3. CO2 Factor
            let co2Factor = Math.min(1.5, state.co2Level / 400);

            // 4. Light Color Factor (Action Spectrum Approximation)
            let colorFactor = 1.0;
            switch (state.lightColor) {
                case 'red': colorFactor = 0.9; break; 
                case 'blue': colorFactor = 1.1; break; 
                case 'green': colorFactor = 0.2; break; 
                default: colorFactor = 1.0;
            }

            let baseRate = 50;
            let rate = baseRate * lightFactor * tempFactor * co2Factor * colorFactor;

            // Random noise for realism
            const noise = (Math.random() - 0.5) * 2;
            rate += noise;

            return Math.max(0, Math.round(rate));
        };

        const Bubbles = ({ rate }) => {
            const [bubbles, setBubbles] = useState([]);

            useEffect(() => {
                if (rate <= 0) return;

                const intervalMs = Math.max(50, (60 / rate) * 1000);

                const spawnBubble = () => {
                    const newBubble = {
                        id: Math.random().toString(36).substr(2, 9),
                        left: 20 + Math.random() * 60,
                        size: 2 + Math.random() * 4,
                        duration: 1.5 + Math.random() * 1.5,
                        drift: (Math.random() - 0.5) * 20,
                        delay: Math.random() * 0.2
                    };

                    setBubbles(prev => {
                        const next = [...prev, newBubble];
                        if (next.length > 50) return next.slice(next.length - 50);
                        return next;
                    });
                };

                const intervalId = setInterval(spawnBubble, intervalMs);
                return () => clearInterval(intervalId);
            }, [rate]);

            return (
                <div className="absolute inset-0 pointer-events-none overflow-hidden">
                    {bubbles.map(b => (
                        <div 
                            key={b.id}
                            className="bubble absolute bottom-10 rounded-full border border-white/50"
                            style={{
                                left: `${b.left}%`,
                                width: `${b.size}px`,
                                height: `${b.size}px`,
                                backgroundColor: 'rgba(255,255,255,0.4)',
                                animationDuration: `${b.duration}s`,
                                animationDelay: `${b.delay}s`,
                                '--drift': `${b.drift}px`
                            }}
                        />
                    ))}
                </div>
            );
        };

        function PhotosynthesisLab() {
            const [envState, setEnvState] = useState(INITIAL_STATE);
            const [dataLog, setDataLog] = useState([]);
            const [currentRate, setCurrentRate] = useState(0);
            const [time, setTime] = useState(0);
            
            // State for reflection journal
            const [journal, setJournal] = useState({ q1: '', q2: '', q3: '' });

            useEffect(() => {
                let interval;
                if (envState.isRunning) {
                    interval = setInterval(() => {
                        setTime((prevTime) => prevTime + 1);
                        
                        const newRate = calculateOxygenRate(envState);
                        setCurrentRate(newRate);

                        setDataLog((prevLog) => {
                            const newEntry = {
                                time: time + 1,
                                rate: newRate,
                                intensity: envState.lightIntensity,
                                temp: envState.temperature,
                                co2: envState.co2Level
                            };
                            return [...prevLog, newEntry].slice(-30);
                        });
                    }, 1000); 
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [envState, time]);

            const handleSliderChange = (setting, value) => {
                setEnvState(prev => ({ ...prev, [setting]: parseFloat(value) }));
            };

            const toggleSimulation = () => {
                setEnvState(prev => ({ ...prev, isRunning: !prev.isRunning }));
            };

            const resetSimulation = () => {
                setEnvState({ ...INITIAL_STATE, isRunning: false });
                setDataLog([]);
                setTime(0);
                setCurrentRate(0);
                setJournal({ q1: '', q2: '', q3: '' });
            };

            const handleExportData = () => {
                if (dataLog.length === 0) return;

                const headers = ["Time (s)", "O2 Rate (bubbles/min)", "Light Intensity (%)", "Temp (C)", "CO2 (ppm)"];
                const csvRows = [headers.join(",")];
                
                dataLog.forEach(row => {
                    const values = [row.time, row.rate, row.intensity, row.temp, row.co2];
                    csvRows.push(values.join(","));
                });

                csvRows.push("");
                csvRows.push("Reflection Journal Responses");
                csvRows.push(`Q1: Adjust light intensity to 0%. Describe what happens to the rate.,"${journal.q1.replace(/"/g, '""')}"`);
                csvRows.push(`Q2: Which light color produces the highest oxygen rate?,"${journal.q2.replace(/"/g, '""')}"`);
                csvRows.push(`Q3: How does extreme temperature (e.g. 50C) affect the plant?,"${journal.q3.replace(/"/g, '""')}"`);

                const csvString = csvRows.join("\n");
                const blob = new Blob([csvString], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                a.setAttribute('download', 'photosynthesis_data.csv');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const getPlantStatus = () => {
                if (!envState.waterSupply) return { status: 'Dead', color: 'grayscale(100%) brightness(50%)', msg: 'Needs Water' };
                if (envState.temperature > 45) return { status: 'Dying', color: 'sepia(80%) hue-rotate(10deg)', msg: 'Too Hot' };
                if (envState.temperature < 5) return { status: 'Dormant', color: 'brightness(70%)', msg: 'Too Cold' };
                if (currentRate > 80) return { status: 'Thriving', color: 'brightness(110%) contrast(110%)', msg: 'High O2 Production' };
                if (currentRate > 20) return { status: 'Healthy', color: 'none', msg: 'Normal O2 Production' };
                if (envState.lightColor === 'green') return { status: 'Struggling', color: 'brightness(90%)', msg: 'Poor Light Absorption' };
                return { status: 'Struggling', color: 'brightness(80%)', msg: 'Low O2 Production' };
            };

            const plantInfo = getPlantStatus();

            const getLightOverlayColor = () => {
                if (envState.lightIntensity === 0) return 'rgba(0,0,0,0.5)';
                const alpha = (envState.lightIntensity / 100) * 0.4;
                switch (envState.lightColor) {
                    case 'red': return `rgba(255, 0, 0, ${alpha})`;
                    case 'blue': return `rgba(0, 0, 255, ${alpha})`;
                    case 'green': return `rgba(0, 255, 0, ${alpha})`;
                    default: return `rgba(255, 255, 255, ${alpha})`;
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 p-4 font-sans select-none flex flex-col">
                    
                    <header className="mb-4 text-center relative">
                        <h1 className="text-3xl font-bold text-white tracking-wide shadow-sm">
                            Interactive Photosynthesis Inquiry Lab
                        </h1>
                        <div className="absolute right-4 top-0 flex space-x-2">
                            <button 
                                onClick={toggleSimulation}
                                className={`flex items-center px-4 py-2 rounded font-semibold transition-colors ${envState.isRunning ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}`}
                            >
                                <Icon name={envState.isRunning ? 'Pause' : 'Play'} size={18} className="mr-1"/>
                                {envState.isRunning ? 'Pause' : 'Start'}
                            </button>
                            <button 
                                onClick={resetSimulation}
                                className="flex items-center px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded font-semibold transition-colors"
                            >
                                <Icon name="RefreshCw" size={18} className="mr-1"/> Reset
                            </button>
                        </div>
                    </header>

                    <div className="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-4 h-full">
                        
                        {}
                        <div className="lg:col-span-2 flex flex-col gap-4">
                            <div className="relative bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-inner flex-grow min-h-[400px]">
                                
                                <div className="absolute inset-0 bg-gradient-to-b from-slate-700 to-slate-900 z-0"></div>
                                
                                <div 
                                    className="absolute top-0 left-1/2 transform -translate-x-1/2 w-48 h-32 rounded-b-full blur-2xl z-10 transition-colors duration-500"
                                    style={{ backgroundColor: getLightOverlayColor() }}
                                ></div>

                                <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 w-64 h-80 z-20">
                                    <div className="absolute inset-0 border-x-4 border-b-4 border-white/20 rounded-b-2xl bg-cyan-900/10"></div>
                                    
                                    {envState.waterSupply && (
                                        <div className="absolute bottom-0 w-full h-[90%] bg-blue-500/10 rounded-b-xl border-t border-blue-400/30 overflow-hidden">
                                            <div 
                                                className="absolute bottom-2 left-1/2 transform -translate-x-1/2 text-green-500 transition-all duration-1000 origin-bottom"
                                                style={{ filter: plantInfo.color }}
                                            >
                                                <svg width="120" height="250" viewBox="0 0 100 200" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M50 200 C 40 150, 60 100, 50 20 C 45 40, 30 60, 45 80 C 50 90, 70 70, 55 50 C 45 100, 75 120, 55 140 Z" />
                                                    <path d="M48 180 C 20 160, 10 120, 30 100 C 35 110, 45 140, 45 160 Z" />
                                                    <path d="M52 170 C 80 140, 90 90, 70 80 C 65 95, 55 130, 55 150 Z" />
                                                    <path d="M49 130 C 25 110, 20 70, 40 50 C 42 65, 48 90, 47 110 Z" />
                                                    <path d="M51 120 C 75 90, 80 50, 60 30 C 58 45, 52 70, 53 90 Z" />
                                                </svg>
                                            </div>

                                            {envState.isRunning && currentRate > 0 && (
                                                <Bubbles rate={currentRate} />
                                            )}
                                        </div>
                                    )}
                                    
                                    <div className="absolute inset-0 border-x-4 border-b-4 border-white/10 rounded-b-2xl pointer-events-none shadow-[inset_10px_0_20px_rgba(255,255,255,0.1)]"></div>
                                    
                                    <div className="absolute left-1 bottom-10 text-white/30 text-xs font-mono">100ml -</div>
                                    <div className="absolute left-1 bottom-32 text-white/30 text-xs font-mono">200ml -</div>
                                    <div className="absolute left-1 bottom-56 text-white/30 text-xs font-mono">300ml -</div>
                                </div>

                                <div className="absolute top-4 left-4 bg-slate-900/80 p-3 rounded-lg border border-slate-700 backdrop-blur-sm z-30">
                                    <div className="text-sm text-slate-400 uppercase tracking-wider mb-1">Plant Status</div>
                                    <div className="flex items-center space-x-2">
                                        <div className={`w-3 h-3 rounded-full ${plantInfo.status === 'Thriving' || plantInfo.status === 'Healthy' ? 'bg-green-500' : plantInfo.status === 'Dead' ? 'bg-red-500' : 'bg-yellow-500'}`}></div>
                                        <span className="font-bold text-lg">{plantInfo.status}</span>
                                    </div>
                                    <div className="text-xs text-slate-300 mt-1">{plantInfo.msg}</div>
                                </div>

                                <div className="absolute top-4 right-4 bg-slate-900/80 p-3 rounded-lg border border-slate-700 backdrop-blur-sm z-30 min-w-[150px]">
                                    <div className="text-sm text-slate-400 uppercase tracking-wider mb-1">O₂ Production</div>
                                    <div className="text-2xl font-bold text-cyan-400">
                                        {currentRate} <span className="text-sm text-slate-300 font-normal">bubbles/min</span>
                                    </div>
                                </div>
                            </div>

                            {}
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                                <h2 className="text-xl font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2 flex items-center">
                                    <span className="bg-slate-700 p-1 rounded mr-2"><Icon name="Beaker" size={16} /></span>
                                    Dashboard Control Panel
                                </h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-6">
                                    <div className="flex flex-col">
                                        <label className="text-sm text-slate-400 mb-2 flex items-center"><Icon name="Droplets" size={14} className="mr-1"/> Water Supply</label>
                                        <div className="flex bg-slate-900 rounded-lg p-1 border border-slate-700">
                                            <button 
                                                onClick={() => setEnvState(prev => ({...prev, waterSupply: true}))}
                                                className={`flex-1 py-1 text-sm rounded transition-colors ${envState.waterSupply ? 'bg-blue-500 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                                            >ON</button>
                                            <button 
                                                onClick={() => setEnvState(prev => ({...prev, waterSupply: false}))}
                                                className={`flex-1 py-1 text-sm rounded transition-colors ${!envState.waterSupply ? 'bg-slate-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                                            >OFF</button>
                                        </div>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-sm text-slate-400 mb-2 flex items-center justify-between">
                                            <span className="flex items-center"><Icon name="Sun" size={14} className="mr-1"/> Light Intensity</span>
                                            <span className="text-white font-mono">{envState.lightIntensity}%</span>
                                        </label>
                                        <input 
                                            type="range" min="0" max="100" 
                                            value={envState.lightIntensity}
                                            onChange={(e) => handleSliderChange('lightIntensity', e.target.value)}
                                        />
                                        <div className="flex justify-between text-xs text-slate-500 mt-1 font-mono">
                                            <span>0%</span><span>100%</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-sm text-slate-400 mb-2 flex items-center justify-between">
                                            <span className="flex items-center"><Icon name="Thermometer" size={14} className="mr-1"/> Temperature</span>
                                            <span className="text-white font-mono">{envState.temperature}°C</span>
                                        </label>
                                        <input 
                                            type="range" min="0" max="50" 
                                            value={envState.temperature}
                                            onChange={(e) => handleSliderChange('temperature', e.target.value)}
                                        />
                                        <div className="flex justify-between text-xs text-slate-500 mt-1 font-mono">
                                            <span>0°C</span><span>50°C</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-sm text-slate-400 mb-2 flex items-center justify-between">
                                            <span className="flex items-center"><Icon name="Wind" size={14} className="mr-1"/> CO₂ Level</span>
                                            <span className="text-white font-mono">{envState.co2Level} ppm</span>
                                        </label>
                                        <input 
                                            type="range" min="0" max="1000" step="10"
                                            value={envState.co2Level}
                                            onChange={(e) => handleSliderChange('co2Level', e.target.value)}
                                        />
                                        <div className="flex justify-between text-xs text-slate-500 mt-1 font-mono">
                                            <span>0</span><span>1000</span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col">
                                        <label className="text-sm text-slate-400 mb-2 flex items-center"><Icon name="Sun" size={14} className="mr-1"/> Light Color</label>
                                        <div className="flex justify-between space-x-1">
                                            {['white', 'red', 'blue', 'green'].map(color => (
                                                <button
                                                    key={color}
                                                    onClick={() => setEnvState(prev => ({ ...prev, lightColor: color }))}
                                                    className={`flex-1 py-1 text-xs font-bold rounded capitalize border transition-all
                                                        ${envState.lightColor === color ? 'border-white opacity-100 scale-105 shadow-sm' : 'border-transparent opacity-50 hover:opacity-100'}
                                                    `}
                                                    style={{ 
                                                        backgroundColor: color === 'white' ? '#f8fafc' : color === 'red' ? '#ef4444' : color === 'blue' ? '#3b82f6' : '#22c55e',
                                                        color: color === 'white' ? '#0f172a' : 'white'
                                                    }}
                                                >
                                                    {color}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        {}
                        <div className="bg-slate-800 rounded-xl border border-slate-700 flex flex-col h-full overflow-hidden shadow-md max-h-[calc(100vh-100px)] lg:max-h-full">
                            
                            <div className="p-4 border-b border-slate-700 bg-slate-800/50 shrink-0">
                                <h2 className="text-xl font-semibold text-slate-200">Data & Observations</h2>
                            </div>
                            
                            <div className="flex-grow p-4 flex flex-col gap-4 overflow-y-auto">
                                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 h-64 shrink-0 flex flex-col">
                                    <h3 className="text-center text-sm text-slate-400 mb-2 font-semibold">Oxygen Production Rate Over Time</h3>
                                    <div className="flex-grow">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={dataLog}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#334155" />
                                                <XAxis 
                                                    dataKey="time" 
                                                    stroke="#94a3b8" 
                                                    tick={{fill: '#94a3b8', fontSize: 12}}
                                                    label={{ value: 'Time (s)', position: 'insideBottomRight', offset: -5, fill: '#94a3b8', fontSize: 12 }}
                                                />
                                                <YAxis 
                                                    stroke="#94a3b8" 
                                                    tick={{fill: '#94a3b8', fontSize: 12}}
                                                    domain={[0, 'dataMax + 20']}
                                                    label={{ value: 'Rate', angle: -90, position: 'insideLeft', fill: '#94a3b8', fontSize: 12 }}
                                                />
                                                <Tooltip 
                                                    contentStyle={{ backgroundColor: '#1e293b', border: '1px solid #475569', borderRadius: '0.5rem', color: '#f8fafc' }}
                                                    itemStyle={{ color: '#38bdf8' }}
                                                    labelStyle={{ color: '#94a3b8' }}
                                                />
                                                <Line 
                                                    type="monotone" 
                                                    dataKey="rate" 
                                                    name="O2 Rate"
                                                    stroke="#38bdf8" 
                                                    strokeWidth={3} 
                                                    dot={false}
                                                    isAnimationActive={false} 
                                                />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-3">
                                    <div className="text-sm font-semibold text-slate-300 border-b border-slate-700 pb-1">Reflection Journal</div>
                                    
                                    <div className="flex flex-col gap-1">
                                        <label className="text-xs text-slate-400">1. Adjust light intensity to 0%. Describe what happens to the rate.</label>
                                        <textarea 
                                            value={journal.q1}
                                            onChange={(e) => setJournal(prev => ({ ...prev, q1: e.target.value }))}
                                            className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 resize-none h-16 transition-colors" 
                                            placeholder="Enter observation..."
                                        />
                                    </div>

                                    <div className="flex flex-col gap-1">
                                        <label className="text-xs text-slate-400">2. Which light color produces the highest oxygen rate?</label>
                                        <textarea 
                                            value={journal.q2}
                                            onChange={(e) => setJournal(prev => ({ ...prev, q2: e.target.value }))}
                                            className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 resize-none h-16 transition-colors" 
                                            placeholder="Enter observation..."
                                        />
                                    </div>

                                    <div className="flex flex-col gap-1">
                                        <label className="text-xs text-slate-400">3. How does extreme temperature (e.g., 50°C) affect the plant?</label>
                                        <textarea 
                                            value={journal.q3}
                                            onChange={(e) => setJournal(prev => ({ ...prev, q3: e.target.value }))}
                                            className="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 resize-none h-16 transition-colors" 
                                            placeholder="Enter observation..."
                                        />
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-slate-700 flex justify-center pb-2">
                                        <button 
                                            onClick={handleExportData}
                                            disabled={dataLog.length === 0}
                                            className={`flex items-center px-4 py-2 text-white rounded font-semibold transition-colors text-sm w-full justify-center ${dataLog.length === 0 ? 'bg-slate-600 cursor-not-allowed opacity-50' : 'bg-blue-600 hover:bg-blue-700'}`}
                                        >
                                            <Icon name="Download" size={16} className="mr-2"/> 
                                            {dataLog.length === 0 ? 'Run simulation to export' : 'Export Data Log'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PhotosynthesisLab />);
    </script>
</body>
</html>
