<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabCraft - Science Lab Generator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        
        /* Custom Scrollbar for Editor */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Print Styles */
        @media print {
            body { 
                background-color: white !important; 
            }
            .no-print { 
                display: none !important; 
            }
            .print-container { 
                width: 100% !important; 
                max-width: 100% !important;
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
            }
            main {
                overflow: visible !important;
                max-height: none !important;
            }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            /* Ensure background colors print correctly */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden">

    <nav class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center no-print z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500 p-2 rounded-lg flex items-center justify-center h-10 w-10">
                <i class="fa-solid fa-flask text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl leading-tight tracking-tight">LabCraft</h1>
                <p class="text-xs text-slate-400">Alberta Science Template Generator</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <!-- Mobile View Toggle -->
            <div class="md:hidden flex bg-slate-800 p-1 rounded-lg">
                <button id="tab-editor" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors bg-blue-500 text-white" onclick="switchTab('editor')">
                    Editor
                </button>
                <button id="tab-preview" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-white" onclick="switchTab('preview')">
                    Preview
                </button>
            </div>
            <button onclick="window.print()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold transition-colors shadow-lg">
                <i class="fa-solid fa-print"></i>
                <span class="hidden sm:inline">Print / PDF</span>
            </button>
        </div>
    </nav>

    <main class="flex-grow p-0 md:p-6 flex gap-6 overflow-hidden h-full relative">
        
        <!-- Editor Panel -->
        <div id="editor-panel" class="w-full md:w-1/3 md:min-w-[400px] h-full no-print flex flex-col bg-white md:rounded-xl md:shadow-sm border border-slate-200">
            
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex flex-col gap-3 flex-shrink-0 md:rounded-t-xl">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-gear text-blue-600"></i> Configuration
                </h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="loadTemplate('blank')" class="text-[11px] font-bold uppercase tracking-wider bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Create
                    </button>
                    <button onclick="loadTemplate('bioaccumulation')" class="text-[11px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700 px-2 py-1.5 rounded hover:bg-indigo-200 transition-colors">Bioaccumulation</button>
                    <button onclick="loadTemplate('bottleFlip')" class="text-[11px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-700 px-2 py-1.5 rounded hover:bg-emerald-200 transition-colors">Bottle Flip</button>
                </div>
            </div>

            <div class="p-5 overflow-y-auto flex-grow space-y-6">
                <!-- Basic Info -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Lab Title</label>
                        <input type="text" id="input-title" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" oninput="updateData('title', this.value)">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Grade Level</label>
                            <select id="input-grade" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" onchange="handleGradeChange(this.value)">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Curriculum Topic</label>
                            <select id="input-topic" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" onchange="updateData('topic', this.value)">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Essential Question</label>
                        <input type="text" id="input-essentialQuestion" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" oninput="updateData('essentialQuestion', this.value)">
                    </div>
                </div>

                <hr class="border-slate-200" />

                <!-- Materials & Safety -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1 flex justify-between">
                            Materials List <span class="text-xs font-normal text-slate-500">(One per line)</span>
                        </label>
                        <textarea id="input-materials" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow h-24 resize-y" oninput="updateData('materials', this.value)"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Safety Precautions <span class="text-xs font-normal text-slate-500">(Optional)</span></label>
                        <textarea id="input-safety" class="w-full p-2 border border-red-300 rounded focus:ring-2 focus:ring-red-500 outline-none transition-shadow h-16 resize-y text-red-700 bg-red-50" oninput="updateData('safety', this.value)"></textarea>
                    </div>
                </div>

                <hr class="border-slate-200" />

                <!-- Procedure & Variables -->
                <div class="space-y-4">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="input-includeVariables" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" onchange="updateData('includeVariables', this.checked)">
                        <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-700">Include Variables Table</span>
                    </label>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Hypothesis Prompt / Hints</label>
                        <input type="text" id="input-hypothesisFormat" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow text-sm" oninput="updateData('hypothesisFormat', this.value)">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1 flex justify-between">
                            Procedure <span class="text-xs font-normal text-slate-500">(One step per line)</span>
                        </label>
                        <textarea id="input-procedure" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow h-32 resize-y" oninput="updateData('procedure', this.value)"></textarea>
                    </div>
                </div>

                <hr class="border-slate-200" />

                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-slate-700">Data Tables</label>
                        <button onclick="addTable()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded font-bold hover:bg-blue-200 transition-colors shadow-sm"><i class="fa-solid fa-plus mr-1"></i> Add Table</button>
                    </div>
                    
                    <div id="tables-editor-container" class="space-y-3">
                        <!-- Table editors injected here by JS -->
                    </div>
                </div>

                <hr class="border-slate-200" />

                <!-- Analysis & Post-Lab -->
                <div class="space-y-4 pb-10">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1 flex justify-between">
                            Analysis Questions <span class="text-xs font-normal text-slate-500">(One per line)</span>
                        </label>
                        <textarea id="input-analysisQuestions" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition-shadow h-32 resize-y" oninput="updateData('analysisQuestions', this.value)"></textarea>
                    </div>

                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="input-includeCER" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer" onchange="updateData('includeCER', this.checked)">
                        <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-700">Include CER Conclusion Section</span>
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" id="input-includeRubric" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer" onchange="updateData('includeRubric', this.checked)">
                        <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-700">Include Assessment Rubric</span>
                    </label>
                </div>
            </div>
        </div>

        <div id="preview-panel" class="hidden md:flex flex-grow h-full bg-slate-300/30 p-2 md:rounded-xl justify-center overflow-y-auto custom-scrollbar relative border border-slate-200 md:border-none w-full">
            <!-- Background Grid Pattern for Editor feel -->
            <div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <div class="bg-white sm:rounded-xl sm:shadow-lg sm:border border-slate-200 w-full max-w-4xl print-container relative z-10 my-0 md:my-4 h-fit min-h-full">
                <!-- Preview content injected here -->
                <div id="preview-content" class="p-8 sm:p-12 space-y-8 text-slate-900">
                </div>
            </div>
        </div>

    </main>

    <script>
        // Curriculum Data
        const CURRICULUM_DATA = {
            "Grade 7": ["Interactions and Ecosystems", "Plants for Food and Fibre", "Heat and Temperature", "Structures and Forces", "Planet Earth", "General Science Skills"],
            "Grade 8": ["Mix and Flow of Matter", "Cells and Systems", "Light and Optical Systems", "Mechanical Systems", "Freshwater and Saltwater Systems", "General Science Skills"],
            "Grade 9": ["Biological Diversity", "Matter and Chemical Change", "Environmental Chemistry", "Electrical Principles and Technologies", "Space Exploration", "General Science Skills"]
        };

        // Templates based on user request
        const TEMPLATES = {
            blank: {
                title: "New Science Lab",
                grade: "Grade 8",
                topic: "Mix and Flow of Matter",
                essentialQuestion: "What are we investigating today?",
                hypothesisFormat: "If [independent variable] changes, then [dependent variable] will...",
                materials: "Item 1\nItem 2",
                safety: "",
                includeVariables: true,
                procedure: "Step 1\nStep 2",
                tables: [
                    { title: "Data Collection", headers: ["Independent Variable", "Trial 1", "Trial 2", "Average"], rows: 3 }
                ],
                analysisQuestions: "What were your main findings?\nWere there any sources of error?",
                includeCER: true,
                includeRubric: true
            },
            bioaccumulation: {
                title: "Bioaccumulation Lab",
                grade: "Grade 7",
                topic: "Interactions and Ecosystems",
                essentialQuestion: "What level of the food chain will have the greatest amount of DDT present?",
                hypothesisFormat: "If... then...",
                materials: "1 “shaker” cup\n9 small cups (minnows)\n3 medium cups (sunfish)\n1 large cup (osprey)\n20 Fruit Loops of the same color (producers)\n10 Fruit Loops of the same color (producers with DDT)",
                safety: "Do not consume the lab materials. Wash hands after handling.",
                includeVariables: true,
                procedure: "Place all of the Fruit Loops into the “shaker” cup to represent the producer population.\nIn the data table record the amounts of DDT per producer. (10 contaminants per 30 producers total = 1/3)\nCarefully give the shaker cup a good shake.\nSimulate minnows eating some of the producers by randomly removing 3 Fruit Loops from the shaker cup into a small cup.\nRepeat for the remaining eight small cups. Record the amount of DDT in the minnows.\nSimulate the sunfish eating minnows. Empty the contents of 2 small cups into one of the medium cups. Repeat for all medium cups. Record DDT.\nSimulate an osprey eating sunfish. Empty the contents of 2 medium cups into the large cup. Record DDT.\nCalculate the average amount of DDT for each organism.",
                tables: [
                    { title: "Amount of DDT per organism", headers: ["Organism", "Trial 1", "Trial 2", "Trial 3", "Average (DDT/org)"], rows: 4 }
                ],
                analysisQuestions: "Construct a food chain to illustrate the flow of energy between the organisms used in this simulation.\nWhat happened to the amount of DDT per organism as you move up the food chain?\nWhich organism contained the largest concentration of DDT?\nWhy is DDT harmful to osprey?\nIf the osprey population were to decrease due to DDT, what are two other populations that would be affected and how?",
                includeCER: true,
                includeRubric: false
            },
            bottleFlip: {
                title: "Bottle Flip Lab",
                grade: "Grade 7",
                topic: "General Science Skills",
                essentialQuestion: "What is the ideal amount of water for a successful bottle flip?",
                hypothesisFormat: "Example: If I put 1/4 cup water in a 500mL bottle then it will land the most times.",
                materials: "Plastic bottle\nMeasuring cup\nFunnel\nWater\nMasking Tape",
                safety: "Wipe up any spills immediately to prevent slipping hazards. Do not throw bottles at other students.",
                includeVariables: true,
                procedure: "Measure your chosen amount of water with the measuring cup.\nCarefully pour it into the empty water bottle using the funnel.\nPut the lid back on the water bottle tightly.\nUsing the technique your group has chosen, take turns flipping the bottle 5 times each.\nRecord the results after each flip.\nChoose another measurement of water and repeat steps 1-5.",
                tables: [
                    { title: "Amount 1:", headers: ["Trial 1", "Trial 2", "Trial 3", "Trial 4", "Trial 5"], rows: 4 },
                    { title: "Amount 2:", headers: ["Trial 1", "Trial 2", "Trial 3", "Trial 4", "Trial 5"], rows: 4 },
                    { title: "Amount 3:", headers: ["Trial 1", "Trial 2", "Trial 3", "Trial 4", "Trial 5"], rows: 4 }
                ],
                analysisQuestions: "How many successful flips did YOU have?\nHow many successful flips did YOUR GROUP have?\nGraph It! On a piece of graph paper, draw a graph to visually represent the data you gathered.",
                includeCER: true,
                includeRubric: true
            }
        };

        // Current application state
        let labData = JSON.parse(JSON.stringify(TEMPLATES.blank));

        
        // Initialize the app
        window.onload = () => {
            initSelectDropdowns();
            populateEditor();
            renderPreview();
        };

        function initSelectDropdowns() {
            const gradeSelect = document.getElementById('input-grade');
            gradeSelect.innerHTML = '';
            Object.keys(CURRICULUM_DATA).forEach(grade => {
                const opt = document.createElement('option');
                opt.value = grade;
                opt.textContent = grade;
                gradeSelect.appendChild(opt);
            });
            updateTopicDropdown(labData.grade);
        }

        function updateTopicDropdown(grade) {
            const topicSelect = document.getElementById('input-topic');
            topicSelect.innerHTML = '';
            CURRICULUM_DATA[grade].forEach(topic => {
                const opt = document.createElement('option');
                opt.value = topic;
                opt.textContent = topic;
                topicSelect.appendChild(opt);
            });
        }

        function handleGradeChange(newGrade) {
            labData.grade = newGrade;
            updateTopicDropdown(newGrade);
            // Auto-select first topic of new grade
            labData.topic = CURRICULUM_DATA[newGrade][0];
            document.getElementById('input-topic').value = labData.topic;
            renderPreview();
        }

        function updateData(key, value) {
            labData[key] = value;
            renderPreview();
        }

        function loadTemplate(templateName) {
            labData = JSON.parse(JSON.stringify(TEMPLATES[templateName]));
            populateEditor();
            renderPreview();
        }

        function populateEditor() {
            document.getElementById('input-title').value = labData.title;
            document.getElementById('input-grade').value = labData.grade;
            updateTopicDropdown(labData.grade);
            document.getElementById('input-topic').value = labData.topic;
            document.getElementById('input-essentialQuestion').value = labData.essentialQuestion;
            document.getElementById('input-materials').value = labData.materials;
            document.getElementById('input-safety').value = labData.safety;
            document.getElementById('input-includeVariables').checked = labData.includeVariables;
            document.getElementById('input-hypothesisFormat').value = labData.hypothesisFormat;
            document.getElementById('input-procedure').value = labData.procedure;
            document.getElementById('input-analysisQuestions').value = labData.analysisQuestions;
            document.getElementById('input-includeCER').checked = labData.includeCER;
            document.getElementById('input-includeRubric').checked = labData.includeRubric;
            
            renderTableEditors();
        }

        function renderTableEditors() {
            const container = document.getElementById('tables-editor-container');
            container.innerHTML = '';
            
            labData.tables.forEach((table, i) => {
                const tableUI = document.createElement('div');
                tableUI.className = "p-3 bg-slate-50 rounded border border-slate-200 space-y-3 relative transition-all";
                tableUI.innerHTML = `
                    <button onclick="removeTable(${i})" class="absolute top-2 right-2 text-slate-400 hover:text-red-500 transition-colors" title="Remove Table">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Table Title</label>
                        <input type="text" value="${escapeHtml(table.title)}" oninput="updateTable(${i}, 'title', this.value)" class="w-full p-1.5 text-sm border border-slate-300 rounded outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <div class="col-span-3">
                            <label class="block text-xs font-medium text-slate-600 mb-1">Column Headers (comma separated)</label>
                            <input type="text" value="${escapeHtml(table.headers.join(', '))}" oninput="updateTable(${i}, 'headers', this.value)" class="w-full p-1.5 text-sm border border-slate-300 rounded outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Empty Rows</label>
                            <input type="number" min="1" max="20" value="${table.rows}" oninput="updateTable(${i}, 'rows', this.value)" class="w-full p-1.5 text-sm border border-slate-300 rounded outline-none focus:border-blue-500">
                        </div>
                    </div>
                `;
                container.appendChild(tableUI);
            });
        }

        function updateTable(index, field, value) {
            if (field === 'headers') {
                labData.tables[index].headers = value.split(',').map(s => s.trim());
            } else if (field === 'rows') {
                labData.tables[index].rows = parseInt(value) || 1;
            } else {
                labData.tables[index][field] = value;
            }
            renderPreview();
        }

        function addTable() {
            labData.tables.push({ title: "New Table", headers: ["Col 1", "Col 2"], rows: 3 });
            renderTableEditors();
            renderPreview();
        }

        function removeTable(index) {
            labData.tables.splice(index, 1);
            renderTableEditors();
            renderPreview();
        }

        // Helper to escape HTML to prevent basic layout breaks
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Mobile Tab Switcher
        function switchTab(tab) {
            const editorPanel = document.getElementById('editor-panel');
            const previewPanel = document.getElementById('preview-panel');
            const btnEditor = document.getElementById('tab-editor');
            const btnPreview = document.getElementById('tab-preview');

            if (tab === 'editor') {
                editorPanel.classList.remove('hidden');
                editorPanel.classList.add('flex');
                previewPanel.classList.add('hidden');
                previewPanel.classList.remove('flex');
                
                btnEditor.classList.replace('text-slate-300', 'bg-blue-500');
                btnEditor.classList.replace('hover:text-white', 'text-white');
                btnPreview.classList.replace('bg-blue-500', 'text-slate-300');
                btnPreview.classList.replace('text-white', 'hover:text-white');
            } else {
                editorPanel.classList.add('hidden');
                editorPanel.classList.remove('flex');
                previewPanel.classList.remove('hidden');
                previewPanel.classList.add('flex');
                
                btnPreview.classList.replace('text-slate-300', 'bg-blue-500');
                btnPreview.classList.replace('hover:text-white', 'text-white');
                btnEditor.classList.replace('bg-blue-500', 'text-slate-300');
                btnEditor.classList.replace('text-white', 'hover:text-white');
            }
        }

        function renderPreview() {
            const preview = document.getElementById('preview-content');
            
            // Build Materials List
            let materialsHtml = '';
            if (labData.materials.trim()) {
                const items = labData.materials.split('\n').filter(i => i.trim());
                materialsHtml = `<ul class="list-disc pl-5 space-y-1">` + 
                    items.map(item => `<li>${escapeHtml(item)}</li>`).join('') + 
                    `</ul>`;
            }

            // Build Procedure List
            let procedureHtml = '';
            if (labData.procedure.trim()) {
                const steps = labData.procedure.split('\n').filter(s => s.trim());
                procedureHtml = `<ol class="list-decimal pl-6 space-y-2">` + 
                    steps.map(step => `<li class="pl-2">${escapeHtml(step)}</li>`).join('') + 
                    `</ol>`;
            }

            // Build Tables
            let tablesHtml = '';
            if (labData.tables.length > 0) {
                tablesHtml = `
                    <div class="space-y-6 page-break pt-4">
                        <h2 class="text-xl font-bold flex items-center gap-2 mb-3 border-b-2 border-slate-200 pb-1">
                            <i class="fa-solid fa-table-list text-slate-700"></i> Data Collection
                        </h2>
                        ${labData.tables.map(table => `
                            <div class="mb-6 avoid-break">
                                ${table.title ? `<h3 class="font-bold mb-2 text-slate-800">${escapeHtml(table.title)}</h3>` : ''}
                                <table class="w-full border-collapse border border-slate-400 text-sm">
                                    <thead>
                                        <tr class="bg-slate-100">
                                            ${table.headers.map(h => `<th class="border border-slate-400 p-2 text-left">${escapeHtml(h)}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${Array(table.rows).fill('').map(() => `
                                            <tr>
                                                ${table.headers.map(() => `<td class="border border-slate-400 p-2 h-10"></td>`).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Build Analysis Questions
            let questionsHtml = '';
            if (labData.analysisQuestions.trim()) {
                const questions = labData.analysisQuestions.split('\n').filter(q => q.trim());
                questionsHtml = `
                    <div class="page-break pt-4">
                        <h2 class="text-xl font-bold flex items-center gap-2 mb-4 border-b-2 border-slate-200 pb-1">
                            <i class="fa-solid fa-file-pen text-slate-700"></i> Analysis Questions
                        </h2>
                        <div class="space-y-16 mt-6">
                            ${questions.map((q, i) => `
                                <div class="avoid-break">
                                    <p class="font-semibold mb-2">${i + 1}. ${escapeHtml(q)}</p>
                                    <div class="w-full border-b border-dashed border-slate-400 mt-8"></div>
                                    <div class="w-full border-b border-dashed border-slate-400 mt-8"></div>
