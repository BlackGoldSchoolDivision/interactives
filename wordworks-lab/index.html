</style></head><body><div class="topline"></div><header class="wrap masthead"><div class="brand"><span class="brand-icon" aria-hidden="true">W</span><span>WordWorks Lab</span><span class="brand-subtitle">Word Quest</span></div><div class="header-actions"><span class="best-pill" id="headerNote">Three levels. Eight words. Your next challenge.</span><button type="button" class="quiet" id="chooseLevel" hidden>Choose level</button></div></header><main class="wrap"><div class="hero"><div><p class="eyebrow">Word Quest</p><h1>Build it. <em>Solve it.</em></h1><p>Follow the clue. Pick your word parts. Discover a whole new meaning.</p></div><div class="wordmark" aria-hidden="true"><span>re</span><b>+</b><span>play</span><b>+</b><span>ed</span></div></div><div class="app" id="app"></div></main><footer class="wrap footer"><strong>WordWorks Lab</strong> · Big ideas start with small word parts.</footer><script>
    // Every accepted word is curated. The spelling field handles changes to the base word.
    const raw = [
      ['re','play','','replay','to play again',1],['re','read','','reread','to read again',1],['re','build','','rebuild','to build again',1],['re','write','','rewrite','to write again',1],['re','pack','','repack','to pack again',1],
      ['un','kind','','unkind','not kind',1],['un','fair','','unfair','not fair',1],['un','happy','','unhappy','not happy',1],['un','safe','','unsafe','not safe',1],['un','clear','','unclear','not clear',1],
      ['','help','ful','helpful','giving help; useful',1],['','play','ful','playful','full of play and fun',1],['','joy','ful','joyful','full of joy',1],['','colour','ful','colourful','full of colour',1],['','fear','less','fearless','without fear',1],['','care','less','careless','without enough care',1],['','hope','less','hopeless','without hope',1],['','dark','ness','darkness','the state of being dark',1],['','kind','ness','kindness','the quality of being kind',1],['','teach','er','teacher','a person who teaches',1],['','paint','er','painter','a person who paints',1],['','read','er','reader','a person who reads',1],
      ['dis','agree','','disagree','to have a different opinion',2],['dis','like','','dislike','to not like something',2],['dis','connect','','disconnect','to separate a connection',2],['dis','appear','','disappear','to go out of sight',2],['dis','honest','','dishonest','not honest',2],
      ['pre','heat','','preheat','to heat before using',2],['pre','view','','preview','to see before the full version',2],['pre','pay','','prepay','to pay in advance',2],['pre','plan','','preplan','to plan in advance',2],
      ['mis','read','','misread','to read incorrectly',2],['mis','spell','','misspell','to spell incorrectly',2],['mis','place','','misplace','to put in the wrong place',2],['mis','count','','miscount','to count incorrectly',2],
      ['over','cook','','overcook','to cook for too long',2],['over','fill','','overfill','to fill too much',2],['under','cook','','undercook','to cook too little',2],['under','pay','','underpay','to pay too little',2],
      ['','break','able','breakable','able to be broken',2],['','read','able','readable','able to be read',2],['','wash','able','washable','able to be washed',2],['','enjoy','ment','enjoyment','the feeling of enjoying something',2],['','move','ment','movement','the act of moving',2],['','agree','ment','agreement','a shared decision or understanding',2],['','pay','ment','payment','money given to pay for something',2],['','fair','ness','fairness','the quality of being fair',2],['','power','less','powerless','without power',2],
      ['un','help','ful','unhelpful','not giving help or not useful',3],['un','break','able','unbreakable','not able to be broken',3],['dis','agree','ment','disagreement','a difference of opinion',3],['re','play','ed','replayed','played again in the past',3],['pre','heat','ed','preheated','heated before using',3],['mis','spell','ed','misspelled','spelled incorrectly in the past',3],['un','kind','ness','unkindness','the quality of being unkind',3],['re','build','ing','rebuilding','building again right now',3],['re','use','able','reusable','able to be used again',3,'The final e in use is dropped before -able.'],['un','happy','ness','unhappiness','the state of not being happy',3,'The y in happy changes to i before -ness.'],['','run','er','runner','a person who runs',3,'The final n in run is doubled before -er.'],['','hope','ful','hopeful','full of hope',3,'The final e in hope is kept before -ful: hopeful.'],['','care','ful','careful','full of care; acting with care',3,'The final e in care is kept before -ful: careful.'],['','happy','ness','happiness','the state of being happy',3,'The y in happy changes to i before -ness.']
    ];
    const words=raw.map(([p,b,s,word,meaning,tier,note=''])=>({p,b,s,word,meaning,tier,note}));
    const baseMeaning={agree:'have the same opinion',appear:'come into view',break:'separate into pieces',build:'put together',care:'give attention',clear:'easy to understand',colour:'a visible hue',connect:'join together',cook:'prepare with heat',dark:'without much light',enjoy:'take pleasure in',fair:'just and equal',fear:'a feeling of danger',fill:'make full',happy:'feeling glad',heat:'make warm',help:'give assistance',honest:'truthful',hope:'wish for a good outcome',joy:'great happiness',kind:'caring toward others',like:'enjoy or approve of',move:'change position',pack:'put things together',paint:'put colour on',pay:'give money for',place:'a location; put somewhere',plan:'decide ahead',play:'have fun',power:'ability to act',read:'understand written words',run:'move quickly',safe:'free from danger',spell:'name letters in order',teach:'help someone learn',use:'put to work',view:'look at',wash:'clean with water',write:'make words with letters',count:'say numbers in order'};
    const prefixMeaning={re:'again',un:'not',dis:'not or opposite',pre:'before',mis:'wrongly',over:'too much',under:'too little'};
    const suffixMeaning={ful:'full of; having',less:'without',ness:'state or quality',er:'person who does it',able:'can be',ment:'act or result',ed:'happened in the past',ing:'happening now'};
    const allBases=Object.keys(baseMeaning).sort();
(()=>{'use strict';
const app=document.getElementById('app');
const tierNames=['','Starter','Builder','Advanced'];
let state={tier:1,deck:[],round:0,score:0,streak:0,hints:0,selected:{p:null,b:null,s:null},options:null,answered:false,attempts:0,wrong:[],message:''};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
const sample=(a,n)=>shuffle(a).slice(0,n);
function best(tier){try{return Number(localStorage.getItem('wordworks-best-'+tier))||0}catch{return 0}}
function saveBest(tier,score){try{if(score>best(tier))localStorage.setItem('wordworks-best-'+tier,String(score))}catch{}}
function scrollToApp(){app.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function render(){
 document.getElementById('chooseLevel').hidden=!state.deck.length;
 document.getElementById('headerNote').textContent=state.deck.length?tierNames[state.tier]+' quest':'Three levels. Eight words. Your next challenge.';
 app.innerHTML=!state.deck.length?homeHTML():state.round>=state.deck.length?finishHTML():questHTML();
}
function homeHTML(){
 const levels=[{name:'Starter',description:'One prefix or suffix. A great place to start.',example:'<span class="example-prefix">re</span><i>+</i><span class="example-base">play</span>'},{name:'Builder',description:'More word parts. More ways to change meaning.',example:'<span class="example-prefix">dis</span><i>+</i><span class="example-base">agree</span>'},{name:'Advanced',description:'Combine more parts and spot spelling changes.',example:'<span class="example-prefix">un</span><i>+</i><span class="example-base">help</span><i>+</i><span class="example-suffix">ful</span>'}];
 return '<div class="section-bar"><h2>Choose your quest</h2><p>Eight clues in every round</p></div><div class="levels">'+levels.map((level,i)=>`<button type="button" class="level" data-start="${i+1}" aria-label="Start ${level.name} quest"><span class="level-top"><b class="level-number">0${i+1}</b><span class="level-badge">8 words</span></span><span class="level-body"><strong class="level-title">${level.name}</strong><span class="level-description">${level.description}</span><span class="level-example" aria-hidden="true">${level.example}</span><span class="level-bottom"><span class="level-best">Best: ${best(i+1)} / 800</span><span class="level-start">Start quest →</span></span></span></button>`).join('')+'</div><div class="home-tip"><strong>Small parts. New meanings.</strong><span>A <span class="key p">prefix</span> goes before a <span class="key b">base word</span>. A <span class="key s">suffix</span> goes after it. Choose the parts that match the clue.</span></div>';
}
function selectedParts(){return ['p','b','s'].map((type,i)=>`<span class="assembled-part ${type} ${state.selected[type]!==null?'filled':''}"><small>${['Prefix','Base','Suffix'][i]}</small><b>${state.selected[type]===null?'?':state.selected[type]===''?'—':escape(state.selected[type])}</b></span>`).join('')}
function builtWord(){
 if(['p','b','s'].every(type=>state.selected[type]!==null)){const match=words.find(w=>['p','b','s'].every(type=>w[type]===state.selected[type]));if(match)return match.word}
 if(['p','b','s'].every(type=>state.selected[type]===null))return 'Choose your word parts';
 return ['p','b','s'].map(type=>state.selected[type]===null?'·':state.selected[type]||'').join('');
}
function ready(){return ['p','b','s'].every(type=>state.selected[type]!==null)}
function questHTML(){const w=state.deck[state.round];
 return `<section class="quest ${state.answered?'answered':''}" aria-label="${tierNames[state.tier]} word quest"><div class="quest-meta"><div class="round-tag"><span class="tier-label">${tierNames[state.tier]}</span><span>Word <b>${state.round+1}</b> of ${state.deck.length}</span></div><div class="score"><strong>${state.score}</strong><span>points</span><span class="streak">${state.streak} in a row</span></div></div><div class="progress" role="progressbar" aria-label="Words completed" aria-valuenow="${state.round+(state.answered?1:0)}" aria-valuemin="0" aria-valuemax="${state.deck.length}"><span style="width:${(state.round+(state.answered?1:0))/state.deck.length*100}%"></span></div><div class="quest-board"><section class="clue-panel" aria-labelledby="clueHeading"><div class="clue"><p class="small-title">Build the word that means…</p><h2 id="clueHeading" tabindex="-1">${escape(w.meaning)}</h2></div><div class="builder"><div class="builder-label">Your word in the making</div><div class="assembled-parts" aria-label="Your selected word parts">${selectedParts()}</div><div class="built-word ${['p','b','s'].every(type=>state.selected[type]===null)?'empty':''}" id="builtWord" aria-live="polite">${escape(builtWord())}</div><div class="builder-actions"><button type="button" class="secondary" data-hint ${state.answered?'disabled':''}>Hint${state.hints?` (${state.hints})`:''}</button><button type="button" class="primary" data-check ${!ready()||state.answered?'disabled':''}>Check word →</button></div></div></section><section class="parts-panel" aria-label="Choose your word parts">${choiceGroup('p','Prefix','Before the base word',state.options.p,1)}${choiceGroup('b','Base word','The main meaning',state.options.b,2)}${choiceGroup('s','Suffix','After the base word',state.options.s,3)}<p class="parts-note">A word can use <b>No prefix</b> or <b>No suffix</b>. Choose one option in each row.</p></section></div><div class="feedback" id="feedback" role="status" aria-live="polite">${feedbackHTML(w)}</div><p class="quest-help">Pick your parts, check your word, then discover how the meaning fits together.</p></section>`;
}
function choiceGroup(type,label,help,items,number){return `<div class="pick-group ${type}"><div class="group-label"><span class="group-name"><b class="group-number">0${number}</b>${escape(label)}</span><small>${escape(help)}</small></div><div class="choices" role="group" aria-label="Choose ${label.toLowerCase()}">${items.map(v=>`<button type="button" class="choice ${type} ${v===''?'is-none':''} ${state.selected[type]===v?'selected':''} ${state.wrong.includes(type)&&state.selected[type]===v?'wrong':''}" data-choice="${type}" data-value="${escape(v)}" aria-pressed="${state.selected[type]===v}" ${state.answered?'disabled':''}>${escape(v||'No '+label.toLowerCase())}</button>`).join('')}</div></div>`}
function feedbackHTML(w){
 if(!state.message)return '';
 if(!state.answered)return `<div class="message try"><div><strong>${state.messageKind==='hint'?'A little help':'Keep building!'}</strong>${escape(state.message)}</div></div>`;
 const meanings=[w.p&&`${w.p}- means ${prefixMeaning[w.p]}`,`${w.b} means ${baseMeaning[w.b]}`,w.s&&`-${w.s} means ${suffixMeaning[w.s]}`].filter(Boolean).join(' · ');
 return `<div class="message good"><div><strong>You built ${escape(w.word)}!</strong>${escape(meanings)}${w.note?`<span class="spelling-note">Spelling clue: ${escape(w.note)}</span>`:''}</div><button type="button" class="primary" data-next>${state.round===state.deck.length-1?'See results →':'Next word →'}</button></div>`;
}
function finishHTML(){saveBest(state.tier,state.score);return `<section class="finish" aria-labelledby="finishHeading"><span class="finish-badge">${tierNames[state.tier]} quest complete</span><h2 id="finishHeading" tabindex="-1">${state.score>=600?'That’s some word power.':'Your word power is growing.'}</h2><div class="final-score">${state.score} / 800</div><p>You solved all ${state.deck.length} clues.<br>Your best ${tierNames[state.tier].toLowerCase()} score is <b>${best(state.tier)}</b>.</p><div class="finish-actions"><button type="button" class="primary" data-start="${state.tier}">Play again →</button><button type="button" class="secondary" data-home>Choose another level</button></div></section>`}
function setupRound(){
 const w=state.deck[state.round];if(!w)return;
 const choices=(key,pool)=>shuffle([w[key],...sample(pool.filter(v=>v!==w[key]&&v!==''),w[key]===''?3:2),...(w[key]===''?[]:[''])]);
 state.options={p:choices('p',Object.keys(prefixMeaning)),b:shuffle([w.b,...sample(allBases.filter(v=>v!==w.b),3)]),s:choices('s',Object.keys(suffixMeaning))};
 state.selected={p:null,b:null,s:null};state.answered=false;state.attempts=0;state.hints=0;state.wrong=[];state.message='';state.messageKind='';
}
function start(tier){state={...state,tier,deck:sample(words.filter(w=>w.tier===tier),8),round:0,score:0,streak:0};setupRound();render();document.getElementById('clueHeading')?.focus({preventScroll:true});scrollToApp()}
function focusChoice(type,value){[...app.querySelectorAll('[data-choice]')].find(b=>b.dataset.choice===type&&b.dataset.value===value)?.focus({preventScroll:true})}
function showFeedback(){document.getElementById('feedback')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
function home(){state.deck=[];render();app.querySelector('[data-start]')?.focus({preventScroll:true});scrollToApp()}
document.getElementById('chooseLevel').addEventListener('click',home);
app.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el||el.disabled)return;
 if(el.dataset.start){start(Number(el.dataset.start));return}
 if(el.hasAttribute('data-home')){home();return}
 if(el.dataset.choice){if(state.answered)return;const type=el.dataset.choice,value=el.dataset.value;state.selected[type]=value;state.wrong=[];state.message='';state.messageKind='';render();focusChoice(type,value);return}
 if(el.hasAttribute('data-hint')){
  if(state.answered)return;const w=state.deck[state.round],next=['b','p','s'].find(type=>state.selected[type]!==w[type]);state.wrong=[];state.messageKind='hint';
  if(next){state.selected[next]=w[next];state.hints++;state.message=`The ${next==='b'?'base word':next==='p'?'prefix':'suffix'} is in place. Choose the remaining parts.`}else state.message='All the parts are in place. Check your word!';
  render();app.querySelector('[data-hint]')?.focus({preventScroll:true});showFeedback();return;
 }
 if(el.hasAttribute('data-check')){
  if(state.answered||!ready())return;state.attempts++;const w=state.deck[state.round],wrong=['p','b','s'].filter(type=>state.selected[type]!==w[type]);
  if(wrong.length){state.wrong=wrong;state.streak=0;state.messageKind='retry';state.message=`${wrong.length===1?'One part needs':'Some parts need'} another look. ${wrong.includes('p')?'Think about the prefix’s meaning. ':''}${wrong.includes('b')?'Which base word carries the clue’s main idea? ':''}${wrong.includes('s')?'Think about the suffix’s meaning.':''}`;render();focusChoice(wrong[0],state.selected[wrong[0]])}
  else{state.answered=true;state.wrong=[];state.streak++;state.score+=Math.max(40,100-state.hints*20-Math.max(0,state.attempts-1)*15);state.message='correct';render();app.querySelector('[data-next]')?.focus({preventScroll:true})}
  showFeedback();return;
 }
 if(el.hasAttribute('data-next')){if(!state.answered)return;state.round++;setupRound();render();(document.getElementById('clueHeading')||document.getElementById('finishHeading'))?.focus({preventScroll:true});scrollToApp()}
});
render();
})();

</script></body></html>
