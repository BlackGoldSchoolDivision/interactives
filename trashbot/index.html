<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbot Creator</title>
  
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM for logic/UI -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for parsing JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Animations for the Robot and UI */
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-bounce-slow {
      animation: bounce-slow 2s infinite;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-5deg); }
      75% { transform: translateX(5px) rotate(5deg); }
    }
    .animate-shake {
      animation: shake 0.5s infinite;
    }

    @keyframes chomp {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1) rotate(5deg); }
    }
    .animate-chomp {
      animation: chomp 0.4s infinite;
    }

    body {
      background-color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Simple SVG Icon Components to replace external libraries ---
    const IconCheck = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const IconArrowRight = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const IconArrowLeft = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
    const IconPlay = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const IconRefresh = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>;

    // --- Data Definitions ---
    const ROBOT_BASES = [
      { id: 'wheels', name: 'Speedy Wheels', icon: '🛞', desc: 'Fast but slips on messes.' },
      { id: 'tracks', name: 'Tank Tracks', icon: '🚜', desc: 'Slow but goes over anything.' },
      { id: 'legs', name: 'Spider Legs', icon: '🦵', desc: 'Can step over toys!' }
    ];

    const ROBOT_ARMS = [
      { id: 'grabber', name: 'Pinchers', icon: '🦀', desc: 'Grabs one thing at a time.' },
      { id: 'scoop', name: 'Big Scoop', icon: '🥄', desc: 'Scoops up big piles.' },
      { id: 'vacuum', name: 'Vacuum', icon: '🌪️', desc: 'Sucks up tiny crumbs.' }
    ];

    const ALL_TRAINING_ITEMS = [
      { id: 'banana', name: 'Banana Peel', icon: '🍌', trueType: 'trash' },
      { id: 'keys', name: 'House Keys', icon: '🔑', trueType: 'keep' },
      { id: 'paper', name: 'Crumpled Paper', icon: '📄', trueType: 'trash' },
      { id: 'bear', name: 'Teddy Bear', icon: '🧸', trueType: 'keep' },
      { id: 'apple', name: 'Apple Core', icon: '🍎', trueType: 'trash' },
      { id: 'can', name: 'Soda Can', icon: '🥫', trueType: 'trash' },
      { id: 'wrapper', name: 'Candy Wrapper', icon: '🍬', trueType: 'trash' },
      { id: 'box', name: 'Empty Box', icon: '📦', trueType: 'trash' },
      { id: 'sock', name: 'Dirty Sock', icon: '🧦', trueType: 'trash' },
      { id: 'phone', name: 'Cell Phone', icon: '📱', trueType: 'keep' },
      { id: 'book', name: 'Library Book', icon: '📘', trueType: 'keep' },
      { id: 'glasses', name: 'Glasses', icon: '👓', trueType: 'keep' },
      { id: 'gamepad', name: 'Controller', icon: '🎮', trueType: 'keep' },
      { id: 'toycar', name: 'Toy Car', icon: '🚗', trueType: 'keep' }
    ];

    const INTERVENTIONS = [
      { id: 'button', name: 'Big Red Button', icon: '🔴', action: 'Press the Button!' },
      { id: 'voice', name: 'Voice Command', icon: '🗣️', action: 'Yell "STOP!"' },
      { id: 'remote', name: 'Remote Control', icon: '🎮', action: 'Press Override!' }
    ];

    // This component renders a cohesive robot by layering SVG parts together
    const RobotPreview = ({ base, arm, status, className = "" }) => {
      // Colors
      const bodyColor = "#cbd5e1"; // slate-300
      const accentColor = "#64748b"; // slate-500
      const screenColor = status === 'danger' ? "#fee2e2" : "#1e293b"; // red or dark slate
      const eyeColor = status === 'danger' ? "#ef4444" : (status === 'stopped' ? "#64748b" : "#4ade80"); // red, grey, or green

      return (
        <svg viewBox="0 0 200 200" className={`w-full h-full max-h-[300px] ${className}`} style={{ overflow: 'visible' }}>
          
          {/* BASE LAYER (Behind the body) */}
          {base?.id === 'legs' && (
            <g stroke="#475569" strokeWidth="8" fill="none" strokeLinecap="round" strokeLinejoin="round">
              {/* Back Legs */}
              <path d="M 70 140 L 40 170 L 40 190" stroke="#334155" />
              <path d="M 130 140 L 160 170 L 160 190" stroke="#334155" />
              {/* Front Legs */}
              <path d="M 80 145 L 60 180 L 60 200" />
              <path d="M 120 145 L 140 180 L 140 200" />
            </g>
          )}

          {base?.id === 'tracks' && (
            <g>
              <rect x="40" y="140" width="120" height="40" rx="20" fill="#334155" />
              <rect x="45" y="145" width="110" height="30" rx="15" fill="#475569" />
              {/* Tread lines */}
              {[50, 70, 90, 110, 130].map(x => (
                <line key={x} x1={x} y1="140" x2={x} y2="180" stroke="#1e293b" strokeWidth="4" />
              ))}
            </g>
          )}

          {base?.id === 'wheels' && (
            <g>
              {/* Axle */}
              <rect x="50" y="155" width="100" height="10" fill="#475569" />
              {/* Wheels */}
              <circle cx="50" cy="160" r="30" fill="#334155" />
              <circle cx="50" cy="160" r="15" fill="#94a3b8" />
              <circle cx="150" cy="160" r="30" fill="#334155" />
              <circle cx="150" cy="160" r="15" fill="#94a3b8" />
            </g>
          )}

          {/* ARMS LAYER (Behind/Sides of body) */}
          {arm?.id === 'grabber' && (
            <g stroke={accentColor} strokeWidth="8" fill="none" strokeLinecap="round" strokeLinejoin="round">
              {/* Left Grabber */}
              <path d="M 60 100 L 20 100" />
              <path d="M 20 100 L 10 80 M 20 100 L 10 120" stroke="#ef4444" strokeWidth="6" />
              {/* Right Grabber */}
              <path d="M 140 100 L 180 100" />
              <path d="M 180 100 L 190 80 M 180 100 L 190 120" stroke="#ef4444" strokeWidth="6" />
            </g>
          )}

          {arm?.id === 'scoop' && (
            <g stroke={accentColor} strokeWidth="8" fill="none" strokeLinecap="round" strokeLinejoin="round">
              {/* Left Scoop */}
              <path d="M 60 100 L 30 120" />
              <path d="M 10 100 Q 10 140 40 140" fill="#f59e0b" stroke="#d97706" />
              {/* Right Scoop */}
              <path d="M 140 100 L 170 120" />
              <path d="M 190 100 Q 190 140 160 140" fill="#f59e0b" stroke="#d97706" />
            </g>
          )}

          {arm?.id === 'vacuum' && (
            <g stroke={accentColor} strokeWidth="10" fill="none" strokeLinecap="round" strokeLinejoin="round">
              {/* Left Hose */}
              <path d="M 60 100 Q 20 90 20 130" />
              <rect x="10" y="130" width="20" height="15" fill="#3b82f6" stroke="none" />
              {/* Right Hose */}
              <path d="M 140 100 Q 180 90 180 130" />
              <rect x="170" y="130" width="20" height="15" fill="#3b82f6" stroke="none" />
            </g>
          )}

          {/* MAIN BODY LAYER */}
          <g>
            {/* Antenna */}
            <line x1="100" y1="50" x2="100" y2="20" stroke={accentColor} strokeWidth="6" strokeLinecap="round" />
            <circle cx="100" cy="20" r="8" fill={status === 'danger' ? '#ef4444' : '#fbbf24'} />
            
            {/* Torso / Head */}
            <rect x="60" y="50" width="80" height="100" rx="20" fill={bodyColor} stroke={accentColor} strokeWidth="6" />
            
            {/* Screen / Face */}
            <rect x="70" y="65" width="60" height="45" rx="10" fill={screenColor} stroke="#0f172a" strokeWidth="4" />
            
            {/* Eyes */}
            {status === 'stopped' ? (
              // Dead/Stopped Eyes (X X)
              <g stroke={eyeColor} strokeWidth="4" strokeLinecap="round">
                <line x1="80" y1="80" x2="90" y2="90" />
                <line x1="90" y1="80" x2="80" y2="90" />
                <line x1="110" y1="80" x2="120" y2="90" />
                <line x1="120" y1="80" x2="110" y2="90" />
              </g>
            ) : status === 'danger' ? (
              // Angry Eyes
              <g stroke={eyeColor} strokeWidth="5" strokeLinecap="round">
                <line x1="78" y1="80" x2="92" y2="88" />
                <line x1="122" y1="80" x2="108" y2="88" />
                <circle cx="85" cy="90" r="4" fill={eyeColor} stroke="none" />
                <circle cx="115" cy="90" r="4" fill={eyeColor} stroke="none" />
              </g>
            ) : (
              // Happy / Idle Eyes
              <g fill={eyeColor}>
                <circle cx="85" cy="85" r="6" />
                <circle cx="115" cy="85" r="6" />
                {/* Blink / Happy curve */}
                {status === 'eating' && (
                  <path d="M 80 85 Q 85 75 90 85 M 110 85 Q 115 75 120 85" stroke={screenColor} strokeWidth="4" fill="none" />
                )}
              </g>
            )}

            {/* Mouth */}
            {status === 'eating' ? (
               <rect x="85" y="120" width="30" height="15" rx="5" fill="#1e293b" />
            ) : status === 'danger' ? (
               <path d="M 85 130 Q 100 120 115 130" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round" />
            ) : (
               <path d="M 85 125 Q 100 135 115 125" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round" />
            )}
            
            {/* Chest Panel */}
            <rect x="75" y="115" width="50" height="25" rx="5" fill="#f8fafc" opacity="0.5" />
            <circle cx="85" cy="127" r="4" fill="#ef4444" />
            <circle cx="100" cy="127" r="4" fill="#3b82f6" />
            <circle cx="115" cy="127" r="4" fill="#eab308" />
          </g>
        </svg>
      );
    };

    function TrashbotApp() {
      const [step, setStep] = useState(1);
      
      // Step 1: Design
      const [selectedBase, setSelectedBase] = useState(null);
      const [selectedArm, setSelectedArm] = useState(null);

      // Step 2: Train
      const [currentRoundItems, setCurrentRoundItems] = useState([]);
      const [unassignedItems, setUnassignedItems] = useState([]);
      const [trashItems, setTrashItems] = useState([]);
      const [keepItems, setKeepItems] = useState([]);

      // Initialize a random round of items
      useEffect(() => {
        startNewRound();
      }, []);

      const startNewRound = () => {
        // Shuffle the full bank and pick 5 random items
        const shuffled = [...ALL_TRAINING_ITEMS].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 5);
        setCurrentRoundItems(selected);
        setUnassignedItems(selected);
        setTrashItems([]);
        setKeepItems([]);
      };

      // Step 3: Intervention
      const [selectedIntervention, setSelectedIntervention] = useState(null);

      // Step 4: Simulation
      const [simStep, setSimStep] = useState(0);
      const [simMessage, setSimMessage] = useState("");
      const [robotStatus, setRobotStatus] = useState("idle"); // idle, thinking, eating, danger, stopped
      const [interventionActive, setInterventionActive] = useState(false);

      // New states for Simulation & Reflection
      const [activeSimIcon, setActiveSimIcon] = useState("");
      const [currentMistake, setCurrentMistake] = useState(null);
      const [revealedQ1, setRevealedQ1] = useState(false);
      const [revealedQ2, setRevealedQ2] = useState(false);
      const simActiveRef = React.useRef(false);

      const delay = (ms) => new Promise(res => setTimeout(res, ms));

      const moveItem = (item, destination) => {
        setUnassignedItems(prev => prev.filter(i => i.id !== item.id));
        setTrashItems(prev => prev.filter(i => i.id !== item.id));
        setKeepItems(prev => prev.filter(i => i.id !== item.id));

        if (destination === 'unassigned') setUnassignedItems(prev => [...prev, item]);
        if (destination === 'trash') setTrashItems(prev => [...prev, item]);
        if (destination === 'keep') setKeepItems(prev => [...prev, item]);
      };

      const resetGame = () => {
        simActiveRef.current = false;
        setStep(1);
        setSelectedBase(null);
        setSelectedArm(null);
        startNewRound(); // Get 5 new random items for the next playthrough
        setSelectedIntervention(null);
        setSimStep(0);
        setRobotStatus("idle");
        setInterventionActive(false);
        setActiveSimIcon("");
        setRevealedQ1(false);
        setRevealedQ2(false);
      };

      const renderStep1Design = () => (
        <div className="space-y-8 animate-in fade-in duration-500">
          <div className="text-center">
            <h2 className="text-4xl font-black text-blue-600 mb-2">Step 1: Build Your Trashbot! 🤖</h2>
            <p className="text-xl text-gray-600">Click the parts to assemble your custom robot.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 items-center">
            
            {/* Parts Selection */}
            <div className="lg:col-span-2 space-y-6">
              <div className="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 shadow-sm">
                <h3 className="text-xl font-bold mb-4 text-blue-800">1. Choose a Base (Movement)</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {ROBOT_BASES.map(base => (
                    <button 
                      key={base.id}
                      onClick={() => setSelectedBase(base)}
                      className={`p-4 rounded-2xl border-4 text-center transition-all ${selectedBase?.id === base.id ? 'border-blue-500 bg-blue-100 scale-105 shadow-md' : 'border-white bg-white hover:border-blue-300 hover:shadow-sm'}`}
                    >
                      <div className="text-4xl mb-2">{base.icon}</div>
                      <div className="font-bold text-lg text-slate-800">{base.name}</div>
                      <div className="text-sm text-slate-600 mt-1">{base.desc}</div>
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-purple-50 p-6 rounded-3xl border-4 border-purple-200 shadow-sm">
                <h3 className="text-xl font-bold mb-4 text-purple-800">2. Choose Arms (Collection)</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {ROBOT_ARMS.map(arm => (
                    <button 
                      key={arm.id}
                      onClick={() => setSelectedArm(arm)}
                      className={`p-4 rounded-2xl border-4 text-center transition-all ${selectedArm?.id === arm.id ? 'border-purple-500 bg-purple-100 scale-105 shadow-md' : 'border-white bg-white hover:border-purple-300 hover:shadow-sm'}`}
                    >
                      <div className="text-4xl mb-2">{arm.icon}</div>
                      <div className="font-bold text-lg text-slate-800">{arm.name}</div>
                      <div className="text-sm text-slate-600 mt-1">{arm.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Live Robot Preview */}
            <div className="bg-slate-100 p-6 rounded-3xl border-8 border-slate-200 shadow-inner flex flex-col items-center justify-center min-h-[350px]">
              <h3 className="text-lg font-bold text-slate-500 mb-4 uppercase tracking-widest">Live Preview</h3>
              <div className="w-full flex-grow flex items-center justify-center">
                 <RobotPreview 
                    base={selectedBase} 
                    arm={selectedArm} 
                    status="idle" 
                    className="animate-bounce-slow drop-shadow-xl" 
                 />
              </div>
              {(!selectedBase || !selectedArm) && (
                 <p className="text-slate-400 font-medium mt-4 text-center">Select parts to see your robot!</p>
              )}
            </div>
          </div>

          <div className="flex justify-end pt-4 border-t-2 border-slate-100">
            <button 
              onClick={() => setStep(2)} 
              disabled={!selectedBase || !selectedArm}
              className="bg-blue-600 disabled:bg-slate-300 text-white px-8 py-4 rounded-full font-bold text-xl flex items-center gap-3 shadow-lg hover:bg-blue-700 hover:scale-105 transition-all disabled:hover:scale-100 disabled:shadow-none"
            >
              Next: Train Robot <IconArrowRight />
            </button>
          </div>
        </div>
      );

      const renderStep2Train = () => (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="text-center">
            <h2 className="text-4xl font-black text-green-600 mb-2">Step 2: Train Your Trashbot! 🧠</h2>
            <p className="text-xl text-gray-600">Robots don't know what trash is. Sort these items so it learns patterns!</p>
          </div>

          {unassignedItems.length > 0 ? (
            <div className="bg-yellow-100 p-6 rounded-3xl border-4 border-yellow-300 text-center shadow-sm">
              <h3 className="font-bold text-xl text-yellow-800 mb-4">Items to Sort ({unassignedItems.length} left):</h3>
              <div className="flex flex-wrap justify-center gap-4">
                {unassignedItems.map(item => (
                  <div key={item.id} className="bg-white p-4 rounded-2xl border-4 border-yellow-200 shadow-md flex flex-col items-center transform transition hover:-translate-y-1">
                    <span className="text-5xl mb-3 filter drop-shadow-md">{item.icon}</span>
                    <span className="font-bold text-slate-700 mb-3">{item.name}</span>
                    <div className="flex gap-2 w-full">
                      <button onClick={() => moveItem(item, 'trash')} className="flex-1 bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded-xl text-sm font-bold transition-colors">🗑️ Trash</button>
                      <button onClick={() => moveItem(item, 'keep')} className="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 py-2 rounded-xl text-sm font-bold transition-colors">🧸 Keep</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-green-100 p-4 rounded-2xl border-4 border-green-300 text-center shadow-sm">
               <p className="text-xl font-bold text-green-800 flex items-center justify-center gap-2">
                 <IconCheck /> All items sorted! Great training!
               </p>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-red-50 p-6 rounded-3xl border-4 border-red-200 min-h-[250px] shadow-sm">
              <h3 className="text-2xl font-black text-red-600 text-center border-b-4 border-red-200 pb-3 mb-4">🗑️ IT IS TRASH</h3>
              <div className="flex flex-wrap gap-3 justify-center">
                {trashItems.map(item => (
                  <div key={item.id} onClick={() => moveItem(item, 'unassigned')} className="bg-white p-3 rounded-xl border-2 border-red-300 cursor-pointer hover:bg-red-100 hover:scale-105 transition-transform flex items-center gap-2 shadow-sm font-bold text-slate-700">
                    <span className="text-3xl">{item.icon}</span> <span>{item.name}</span>
                  </div>
                ))}
                {trashItems.length === 0 && <p className="text-red-400 font-medium italic w-full text-center mt-8">Put trash items here...</p>}
              </div>
            </div>

            <div className="bg-blue-50 p-6 rounded-3xl border-4 border-blue-200 min-h-[250px] shadow-sm">
              <h3 className="text-2xl font-black text-blue-600 text-center border-b-4 border-blue-200 pb-3 mb-4">🧸 NOT TRASH (Keep)</h3>
              <div className="flex flex-wrap gap-3 justify-center">
                {keepItems.map(item => (
                  <div key={item.id} onClick={() => moveItem(item, 'unassigned')} className="bg-white p-3 rounded-xl border-2 border-blue-300 cursor-pointer hover:bg-blue-100 hover:scale-105 transition-transform flex items-center gap-2 shadow-sm font-bold text-slate-700">
                    <span className="text-3xl">{item.icon}</span> <span>{item.name}</span>
                  </div>
                ))}
                 {keepItems.length === 0 && <p className="text-blue-400 font-medium italic w-full text-center mt-8">Put safe items here...</p>}
              </div>
            </div>
          </div>

          <div className="flex justify-between pt-4 border-t-2 border-slate-100">
            <button onClick={() => setStep(1)} className="bg-slate-200 text-slate-700 px-6 py-4 rounded-full font-bold text-lg flex items-center gap-2 hover:bg-slate-300 transition-colors">
              <IconArrowLeft /> Back
            </button>
            <button 
              onClick={() => setStep(3)} 
              disabled={unassignedItems.length > 0}
              className="bg-green-600 disabled:bg-slate-300 text-white px-8 py-4 rounded-full font-bold text-xl flex items-center gap-3 shadow-lg hover:bg-green-700 hover:scale-105 transition-all disabled:hover:scale-100 disabled:shadow-none"
            >
              Next: Safety Tools <IconArrowRight />
            </button>
          </div>
        </div>
      );

      const renderStep3Intervention = () => (
        <div className="space-y-6 animate-in fade-in duration-500">
           <div className="text-center">
            <h2 className="text-4xl font-black text-orange-500 mb-2">Step 3: Safety First! 🛡️</h2>
            <p className="text-xl text-gray-600 max-w-2xl mx-auto">Sometimes AI robots make mistakes when they see something new. How will you stop Trashbot if it grabs the wrong thing?</p>
          </div>

          <div className="bg-orange-50 p-8 rounded-3xl border-4 border-orange-200 max-w-3xl mx-auto shadow-sm">
            <div className="grid grid-cols-1 gap-4">
              {INTERVENTIONS.map(tool => (
                 <button 
                 key={tool.id}
                 onClick={() => setSelectedIntervention(tool)}
                 className={`p-6 rounded-2xl border-4 text-left flex items-center gap-6 transition-all ${selectedIntervention?.id === tool.id ? 'border-orange-500 bg-orange-100 scale-105 shadow-md' : 'border-white bg-white hover:border-orange-300 hover:shadow-sm'}`}
               >
                 <div className="text-6xl filter drop-shadow-md">{tool.icon}</div>
                 <div>
                    <div className="font-bold text-2xl text-slate-800">{tool.name}</div>
                    <div className="text-orange-700 font-medium text-lg mt-1">Use this to save items!</div>
                 </div>
               </button>
              ))}
            </div>
          </div>

          <div className="flex justify-between mt-8 pt-4 border-t-2 border-slate-100">
            <button onClick={() => setStep(2)} className="bg-slate-200 text-slate-700 px-6 py-4 rounded-full font-bold text-lg flex items-center gap-2 hover:bg-slate-300 transition-colors">
              <IconArrowLeft /> Back
            </button>
            <button 
              onClick={() => { setStep(4); startSimulation(); }} 
              disabled={!selectedIntervention}
              className="bg-purple-600 disabled:bg-slate-300 text-white px-8 py-4 rounded-full font-bold text-xl flex items-center gap-3 shadow-lg hover:bg-purple-700 hover:scale-105 transition-all disabled:hover:scale-100 disabled:shadow-none animate-bounce"
            >
              <IconPlay /> Test the Robot!
            </button>
          </div>
        </div>
      );

      const runSimulationLoop = async (sequence) => {
        for (let i = 0; i < sequence.length; i++) {
          if (!simActiveRef.current) return;
          const item = sequence[i];
          setActiveSimIcon(item.icon);
          
          if (item.isMistake) {
            setSimMessage(`Uh oh! Trashbot sees the ${item.name}!`);
            setRobotStatus("idle");
            await delay(3000);
            if (!simActiveRef.current) return;
            
            setSimMessage(`Trashbot: "I've never seen this before... I think it's TRASH!"`);
            setRobotStatus("thinking");
            await delay(3000);
            if (!simActiveRef.current) return;
            
            setRobotStatus("danger");
            setSimMessage("GRABBING IT!");
            setInterventionActive(true);
            return; // Wait for user to intervene
          } else {
            setSimMessage(`Trashbot sees: ${item.name}...`);
            setRobotStatus("idle");
            await delay(2500);
            if (!simActiveRef.current) return;
            
            setSimMessage(`Thinking... Is it Trash or Keep?`);
            setRobotStatus("thinking");
            await delay(2500);
            if (!simActiveRef.current) return;
            
            const isTrash = trashItems.some(t => t.id === item.id);
            if (isTrash) {
              setSimMessage(`"It's TRASH!" Using ${selectedArm.name} to clean it up!`);
              setRobotStatus("eating");
              await delay(3500);
            } else {
              const trueTrash = item.trueType === 'trash';
              if (trueTrash) {
                setSimMessage(`"NOT TRASH!" Oh no, it left the garbage on the floor because of bad training!`);
              } else {
                setSimMessage(`"NOT TRASH!" Leaving it safely alone.`);
              }
              setRobotStatus("idle");
              await delay(3500);
            }
            if (!simActiveRef.current) return;
            setActiveSimIcon("");
            await delay(1000);
          }
        }
      };

      const startSimulation = () => {
        setSimStep(0);
        setInterventionActive(false);
        simActiveRef.current = true;
        
        const sequence = [];
        // Add a 'Keep' item to show it leaving something alone based on training
        if (keepItems.length > 0) sequence.push(keepItems[0]);
        // Add a 'Trash' item to show it picking something up based on training
        if (trashItems.length > 0) sequence.push(trashItems[0]);
        
        // Pick a random mistake item for the final event
        const MISTAKES = [
          { id: 'cat', name: 'Family Cat', icon: '🐈' },
          { id: 'dog', name: 'Puppy', icon: '🐶' },
          { id: 'sandwich', name: 'Tasty Sandwich', icon: '🥪' },
          { id: 'laptop', name: 'Mom\'s Laptop', icon: '💻' },
          { id: 'plant', name: 'House Plant', icon: '🪴' }
        ];
        const randomMistake = MISTAKES[Math.floor(Math.random() * MISTAKES.length)];
        setCurrentMistake(randomMistake);
        
        sequence.push({ ...randomMistake, isMistake: true });
        
        runSimulationLoop(sequence);
      };

      const handleIntervention = () => {
        simActiveRef.current = false;
        setInterventionActive(false);
        setRobotStatus("stopped");
        setSimMessage(`PHEW! You used the ${selectedIntervention.name} to STOP the robot! You saved the ${currentMistake?.name}!`);
        setTimeout(() => {
          setStep(5);
        }, 4500);
      };

      const renderStep4Simulation = () => (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="text-center">
            <h2 className="text-4xl font-black text-purple-600 mb-2">Step 4: Testing Lab 🧪</h2>
            <p className="text-xl text-gray-600">Watch your robot work. Be ready to use your safety tool!</p>
          </div>

          <div className="bg-slate-800 rounded-3xl border-8 border-slate-700 relative overflow-hidden h-[500px] flex flex-col shadow-2xl">
            
            {/* Status Bubble */}
            <div className="absolute top-6 left-1/2 transform -translate-x-1/2 w-11/12 max-w-2xl bg-white p-4 rounded-2xl shadow-xl border-4 border-purple-300 text-xl md:text-2xl font-bold text-center z-10 text-slate-800 transition-all">
              {simMessage}
            </div>

            {/* Action Area */}
            <div className="absolute bottom-0 w-full h-2/3 flex justify-between items-end px-4 md:px-16 pb-12 border-b-8 border-slate-600 bg-gradient-to-t from-slate-900 to-transparent">
              
              {/* The Cohesive SVG Robot */}
              <div className={`transition-all duration-1000 transform origin-bottom w-48 h-48 md:w-64 md:h-64
                ${robotStatus === 'danger' ? 'translate-x-full scale-110 animate-shake' : ''} 
                ${robotStatus === 'eating' ? 'animate-chomp' : 'animate-bounce-slow'}`}
              >
                 <RobotPreview base={selectedBase} arm={selectedArm} status={robotStatus} />
                 
                 {robotStatus === 'danger' && <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 text-red-500 text-3xl font-black tracking-widest animate-pulse bg-white px-4 py-1 rounded-full border-4 border-red-500 whitespace-nowrap">GRABBING!</div>}
                 {robotStatus === 'stopped' && <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 text-slate-500 text-3xl font-black tracking-widest bg-white px-4 py-1 rounded-full border-4 border-slate-500 whitespace-nowrap">STOPPED 🛑</div>}
              </div>

              {/* The Target Item */}
              <div className="text-8xl md:text-9xl filter drop-shadow-2xl z-0 transition-all">
                {activeSimIcon}
              </div>
            </div>

            {/* Big Emergency Intervention Overlay */}
            {interventionActive && (
              <div className="absolute inset-0 bg-red-600/40 backdrop-blur-sm flex items-center justify-center z-20">
                 <button 
                  onClick={handleIntervention}
                  className="bg-red-600 text-white p-10 rounded-3xl shadow-2xl border-8 border-red-800 text-4xl font-black animate-bounce hover:bg-red-500 hover:scale-110 transition-all flex flex-col items-center gap-4"
                 >
                    <span className="text-8xl filter drop-shadow-lg">{selectedIntervention.icon}</span>
                    <span className="uppercase tracking-wider">{selectedIntervention.action}</span>
                 </button>
              </div>
            )}
          </div>
        </div>
      );

      const renderStep5Reflect = () => (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="text-center">
            <h2 className="text-5xl font-black text-pink-500 mb-4">Step 5: You Did It! 🎉</h2>
            <p className="text-2xl text-slate-600 mb-8">You successfully built, trained, and corrected an AI robot!</p>
          </div>

          <div className="bg-pink-50 p-8 rounded-3xl border-4 border-pink-200 max-w-3xl mx-auto space-y-8 shadow-sm">
            <div>
              <h3 className="font-black text-3xl mb-4 text-pink-800 flex items-center gap-3">
                <span className="text-4xl">🤔</span> Think About It:
              </h3>
              <p className="text-xl font-bold text-slate-700 mb-3">Why did Trashbot try to throw away the {currentMistake?.name}?</p>
              
              {!revealedQ1 ? (
                <button onClick={() => setRevealedQ1(true)} className="bg-pink-200 hover:bg-pink-300 text-pink-800 px-6 py-3 rounded-xl font-bold shadow-sm transition-colors text-lg">Reveal Answer 👀</button>
              ) : (
                <div className="bg-white p-6 rounded-2xl border-2 border-pink-100 flex gap-4 text-slate-700 shadow-sm animate-in fade-in">
                  <span className="text-4xl">💡</span>
                  <p className="text-lg leading-relaxed"><strong>Answer:</strong> AI robots only know what we teach them! Trashbot was looking for patterns, but it hadn't been trained on the {currentMistake?.name}, so it made a guess and got it wrong.</p>
                </div>
              )}
            </div>

            <div>
              <p className="text-xl font-bold text-slate-700 mb-3">Why is your {selectedIntervention?.name} important?</p>
              
              {!revealedQ2 ? (
                <button onClick={() => setRevealedQ2(true)} className="bg-pink-200 hover:bg-pink-300 text-pink-800 px-6 py-3 rounded-xl font-bold shadow-sm transition-colors text-lg">Reveal Answer 👀</button>
              ) : (
                <div className="bg-white p-6 rounded-2xl border-2 border-pink-100 flex gap-4 text-slate-700 shadow-sm animate-in fade-in">
                  <span className="text-4xl">🛡️</span>
                  <p className="text-lg leading-relaxed"><strong>Answer:</strong> Even the smartest robots make mistakes when they see something totally new. Humans always need a way to step in and stop them to keep everyone safe.</p>
                </div>
              )}
            </div>
          </div>

          <div className="text-center mt-12">
            <button 
              onClick={resetGame}
              className="bg-blue-600 text-white px-10 py-5 rounded-full font-black text-2xl inline-flex items-center gap-3 shadow-xl hover:bg-blue-700 hover:scale-105 transition-all"
            >
              <IconRefresh /> Build Another Robot!
            </button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
          <div className="w-full max-w-6xl">
            
            {/* Header & Progress */}
            <header className="bg-white p-6 rounded-3xl shadow-sm border-4 border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
              <h1 className="text-3xl md:text-4xl font-black tracking-tight flex items-center gap-3">
                🤖 <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Trashbot Creator</span>
              </h1>
              <div className="flex gap-3">
                {[1, 2, 3, 4, 5].map(s => (
                  <div 
                    key={s} 
                    className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-lg transition-all shadow-sm
                      ${step === s ? 'bg-blue-600 text-white scale-110 ring-4 ring-blue-200' : 
                        step > s ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400 border-2 border-slate-200'}`}
                  >
                    {step > s ? <IconCheck /> : s}
                  </div>
                ))}
              </div>
            </header>

            {/* Main Content Card */}
            <main className="bg-white p-6 md:p-10 rounded-3xl shadow-xl border-4 border-slate-200 min-h-[700px]">
              {step === 1 && renderStep1Design()}
              {step === 2 && renderStep2Train()}
              {step === 3 && renderStep3Intervention()}
              {step === 4 && renderStep4Simulation()}
              {step === 5 && renderStep5Reflect()}
            </main>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrashbotApp />);
  </script>
</body>
</html>
