<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Releveling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Prosemirror-like styles for generated content */
        .generated-content p { margin-bottom: 1em; line-height: 1.7; }
        .generated-content ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .generated-content li { margin-bottom: 0.5em; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const IconWand = () => (
            <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path>
                <path d="M17.8 11.8L19 13"></path><path d="M10.2 6.2L9 5"></path><path d="M17.8 6.2L19 5"></path><path d="M10.2 11.8L9 13"></path>
                <path d="M14 8l-9 9-3-3 9-9z"></path>
            </svg>
        );

        const IconSpinner = () => (
            <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        );

        const IconBook = () => (
            <svg width="28" height="28" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        );

        const IconSettings = () => (
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        );

        const IconTarget = () => (
             <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" className="text-blue-500">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </svg>
        );

        const IconEye = () => (
            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" className="text-blue-500">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        );

        const IconAlert = () => (
            <svg className="text-red-500 flex-shrink-0 mt-0.5" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const IconLink = () => (
             <svg width="48" height="48" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
        );


        // --- Main Component ---
        const App = () => {
            const [gradeLevel, setGradeLevel] = useState(12);
            const [focusMode, setFocusMode] = useState('vocabulary');
            const [inputText, setInputText] = useState("Cellular respiration is a complex metabolic pathway that breaks down glucose and produces adenosine triphosphate (ATP). The stages of aerobic cellular respiration include glycolysis, pyruvate oxidation, the citric acid cycle, and oxidative phosphorylation.");
            const [adaptedContent, setAdaptedContent] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            // --- Handlers ---
            const handleTransform = async () => {
                if (!inputText.trim()) {
                    setError("Please enter some text to adapt.");
                    return;
                }

                setError('');
                setIsLoading(true);
                setAdaptedContent('');

                try {
                    let modeInstructions = "";
                    if (focusMode === 'vocabulary') {
                        modeInstructions = "Simplify complex words. Highlight changed/simplified words using this exact HTML tag: <span class='bg-amber-100 text-amber-900 px-1 rounded font-medium'>simplified word</span>";
                    } else if (focusMode === 'structure') {
                        modeInstructions = "Use shorter, simpler sentences. Highlight significantly changed sentences using this exact HTML tag: <span class='bg-emerald-100 text-emerald-900 px-1 rounded font-medium'>simplified sentence</span>";
                    } else if (focusMode === 'summary') {
                        modeInstructions = "Output an HTML unordered list summarizing the text. Format it as: <ul class='list-disc pl-5 space-y-2'><li>point 1</li></ul>. You can highlight simplified terms using the <span class='bg-amber-100 text-amber-900 px-1 rounded font-medium'> class.";
                    }

                    const prompt = `
                        You are an expert reading intervention specialist. Rewrite the following text to a Grade ${gradeLevel} reading level.
                        
                        CRITICAL RULES:
                        1. Output ONLY raw HTML. Do not include markdown formatting (do NOT wrap in \`\`\`html).
                        2. ${modeInstructions}
                        
                        Original Text:
                        "${inputText}"
                    `;

                    // For the immersive environment, leave API key empty
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result.candidates?.[0];

                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        let textResult = candidate.content.parts[0].text;
                        // Clean up markdown fences
                        textResult = textResult.replace(/```html/gi, '').replace(/```/g, '');
                        setAdaptedContent(textResult);
                    } else {
                        throw new Error("Unexpected API response structure.");
                    }

                } catch (err) {
                    console.error(err);
                    setError("Failed to generate adapted text. Please try again.");
                } finally {
                    setIsLoading(false);
                }
            };

            const getModeBadgeText = () => {
                switch(focusMode) {
                    case 'vocabulary': return "Vocabulary Mode";
                    case 'structure': return "Structure Mode";
                    case 'summary': return "Summary Mode";
                    default: return "Adapted";
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 text-slate-800">
                    <div className="max-w-5xl mx-auto space-y-6">
                        
                        {/* Header */}
                        <header className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex items-center gap-4">
                            <div className="bg-blue-600 p-3 rounded-xl text-white shadow-inner">
                                <IconBook />
                            </div>
                            <div className="flex-grow">
                                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">AI Text Releveling</h1>
                                <p className="text-slate-500 font-medium mt-1">Paste any text and adapt its readability dynamically.</p>
                            </div>
                        </header>

                        {/* Controls Section */}
                        <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                <IconSettings />
                                Configuration Parameters
                            </h2>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                                {/* Grade Level Slider */}
                                <div className="space-y-4">
                                    <div className="flex justify-between items-end">
                                        <label htmlFor="gradeLevel" className="font-semibold text-slate-700 flex items-center gap-2">
                                            <IconTarget />
                                            Target Reading Level
                                        </label>
                                        <span className="text-2xl font-black text-blue-600">Grade {gradeLevel}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        id="gradeLevel" 
                                        min="3" max="12" step="1" 
                                        value={gradeLevel}
                                        onChange={(e) => setGradeLevel(parseInt(e.target.value))}
                                        className="w-full h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                    />
                                    <div className="flex justify-between text-xs font-semibold text-slate-400 px-1">
                                        <span>Elementary (3)</span>
                                        <span>Middle (8)</span>
                                        <span>High School (12)</span>
                                    </div>
                                </div>

                                {/* Focus Mode Selector */}
                                <div className="space-y-4">
                                    <label htmlFor="focusMode" className="font-semibold text-slate-700 flex items-center gap-2">
                                        <IconEye />
                                        Differentiation Focus
                                    </label>
                                    <div className="relative">
                                        <select 
                                            id="focusMode" 
                                            value={focusMode}
                                            onChange={(e) => setFocusMode(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 pr-10 appearance-none font-medium shadow-sm transition-all outline-none"
                                        >
                                            <option value="vocabulary">Simplify Vocabulary</option>
                                            <option value="structure">Adapt Sentence Structure</option>
                                            <option value="summary">Bullet Point Summary</option>
                                        </select>
                                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                                            <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex justify-end border-t border-slate-100 pt-6">
                                <button 
                                    onClick={handleTransform}
                                    disabled={isLoading}
                                    className="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center gap-2"
                                >
                                    {isLoading ? <IconSpinner /> : <IconWand />}
                                    <span>{isLoading ? "Adapting Text..." : "Transform Text"}</span>
                                </button>
                            </div>
                        </section>

                        {/* Error Message Display */}
                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl flex items-start gap-3">
                                <IconAlert />
                                <p className="text-red-700 font-medium">{error}</p>
                            </div>
                        )}

                        {/* Input & Output Panes */}
                        <section className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                            
                            {/* Original Text Input Panel */}
                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col overflow-hidden">
                                <div className="bg-slate-100 border-b border-slate-200 p-4 px-6 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-bold text-slate-700">Source Text</h3>
                                        <p className="text-xs text-slate-500 font-medium">Paste your text here</p>
                                    </div>
                                </div>
                                <div className="p-0 flex-grow relative">
                                    <textarea 
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        placeholder="Paste the text you want to adapt here..." 
                                        className="w-full h-full min-h-[300px] p-6 text-lg text-slate-700 leading-relaxed resize-none focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                                    />
                                </div>
                            </div>

                            {/* Adapted Text Panel */}
                            <div className="bg-white border-2 border-blue-100 rounded-2xl shadow-md flex flex-col overflow-hidden relative min-h-[300px]">
                                <div className="absolute top-4 right-4 text-blue-200 opacity-50 pointer-events-none">
                                    <IconLink />
                                </div>
                                
                                <div className="bg-blue-50 border-b border-blue-100 p-4 px-6 flex justify-between items-center z-10">
                                    <div>
                                        <h3 className="font-bold text-blue-900">Adapted Output</h3>
                                        <p className="text-xs text-blue-600 font-bold uppercase tracking-wider mt-1">Target: Grade {gradeLevel}</p>
                                    </div>
                                    <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                                        {getModeBadgeText()}
                                    </span>
                                </div>
                                
                                {/* Output Content Area */}
                                <div className="p-6 text-lg text-slate-800 leading-relaxed flex-grow z-10 relative bg-white">
                                    {isLoading ? (
                                        <div className="absolute inset-0 bg-white/90 w-full h-full flex flex-col items-center justify-center text-slate-400 space-y-4">
                                            <IconSpinner />
                                            <p className="font-medium animate-pulse text-blue-500">AI is rewriting text...</p>
                                        </div>
                                    ) : !adaptedContent ? (
                                        <div className="w-full h-full flex items-center justify-center text-slate-400 italic">
                                            Output will appear here after clicking "Transform Text".
                                        </div>
                                    ) : (
                                        <div 
                                            className="generated-content transition-opacity duration-300"
                                            dangerouslySetInnerHTML={{ __html: adaptedContent }}
                                        />
                                    )}
                                </div>
                                
                                {/* Legend for highlights */}
                                <div className="bg-slate-50 border-t border-slate-200 p-3 px-6 text-xs flex flex-wrap gap-4 z-10 text-slate-600">
                                    <strong className="text-slate-800">Legend:</strong>
                                    <div className="flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-full bg-amber-200 border border-amber-300 inline-block"></span>
                                        <span>Vocabulary changes</span>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-full bg-emerald-200 border border-emerald-300 inline-block"></span>
                                        <span>Structural changes</span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
