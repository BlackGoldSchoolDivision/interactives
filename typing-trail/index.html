3c/button>\n    \u003cbutton class=\"btn\" id=\"refresh\" hidden>Refresh\u003c/button>\n    \u003ca class=\"btn\" id=\"usageLink\" target=\"_blank\" rel=\"noopener\" hidden title=\"Every class and teacher, and a daily log. Counts only. Updates every morning.\">📊 Usage report\u003c/a>\n    \u003cbutton class=\"btn\" id=\"usageMake\" hidden title=\"Every class and teacher, and a daily log. Counts only.\">📊 Make usage report\u003c/button>\n    \u003ca class=\"btn\" id=\"langLink\" target=\"_top\" hidden title=\"Changes only the language of this dashboard. What students see is set for each class in Class settings.\">Français\u003c/a>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n  \u003cp id=\"loading\" class=\"muted\">Loading…\u003c/p>\n  \u003csection id=\"notice\" class=\"panel\" hidden>\u003c/section>\n\n  \u003csection id=\"start\" class=\"panel start\" hidden>\n    \u003ch1 style=\"margin-top:0\">Start a class\u003c/h1>\n    \u003clabel class=\"lang-pick\">Class language \u003cselect id=\"newLang\">\u003coption value=\"English\">English\u003c/option>\u003coption value=\"Français\">Français\u003c/option>\u003c/select>\n      \u003cspan class=\"small\">What students see. You can change it later in Class settings.\u003c/span>\u003c/label>\n    \u003cdiv id=\"fromClassroom\" hidden>\n      \u003cp class=\"muted\">Pick one of your Google Classroom classes. Typing Trail adds all its students, and they sign in with their school accounts.\u003c/p>\n      \u003cul class=\"course-list\" id=\"courseList\">\u003c/ul>\n      \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"postIt\" checked> Post the Typing Trail link in the Google Classroom class\u003c/label>\n    \u003c/div>\n    \u003cp class=\"err\" id=\"startErr\" role=\"alert\">\u003c/p>\n    \u003cp class=\"muted\" id=\"noCourses\" hidden>Typing Trail works through Google Classroom, and no Google Classroom classes where you teach were found. Create the class in Google Classroom, then reload this page.\u003c/p>\n    \u003cdetails>\n      \u003csummary>Already have a Typing Trail sheet?\u003c/summary>\n      \u003cp>Paste its link to add it to your classes.\u003c/p>\n      \u003cdiv class=\"copy-row\">\u003cinput type=\"text\" id=\"attachUrl\" placeholder=\"https://docs.google.com/spreadsheets/d/…\">\u003cbutton class=\"btn\" id=\"attachGo\">Add it\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"cancelNew\" hidden>Back to my class\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"dash\" hidden>\n    \u003cp class=\"flash\" id=\"flash\" role=\"status\" hidden>\u003c/p>\n    \u003cdiv class=\"dash-head\" id=\"teach-overview\">\n      \u003cdiv>\u003ch1 id=\"className\">\u003c/h1>\u003cp class=\"class-lang\" id=\"classLang\">\u003c/p>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003ca class=\"btn\" id=\"sheetLink\" target=\"_blank\" rel=\"noopener\">Open sheet\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"tiles\" id=\"tiles\">\u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-link\">\n      \u003ch2>Student link\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">Students open it from Google Classroom. Only students in the linked Google Classroom class can sign in.\u003c/p>\n      \u003cdiv class=\"copy-row\">\u003cinput type=\"text\" id=\"classLink\" readonly aria-label=\"Student link\">\u003cbutton class=\"btn\" id=\"copyLink\">Copy\u003c/button>\u003c/div>\n      \u003cdiv class=\"cr-box small\" id=\"crBox\" hidden>\n        \u003cspan>Linked to \u003cb id=\"crName\">\u003c/b>. \u003cspan id=\"crAuto\">Students who join or leave that class are added or taken off within a few minutes.\u003c/span> \u003cspan id=\"crChecked\">\u003c/span>\u003c/span>\n        \u003cbutton class=\"btn tiny\" id=\"postBtn\">Post link in Classroom\u003c/button>\n        \u003cbutton class=\"btn tiny\" id=\"syncBtn\">Sync students now\u003c/button>\n        \u003ca class=\"btn tiny\" id=\"tryLink\" target=\"_blank\" rel=\"noopener\" title=\"Opens the class as yourself. Your results are saved, but you aren't in class totals or on the leaderboard.\">Try it yourself\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"add-box link-box\" id=\"linkBox\" hidden>\n        \u003cp style=\"margin:0\">\u003cb>⚠️ This class isn't linked to Google Classroom, so students can't sign in.\u003c/b> Pick its Google Classroom class. Its students are added, and anyone not in it can no longer sign in (their work stays).\u003c/p>\n        \u003cdiv class=\"row\">\u003cselect id=\"linkPick\" aria-label=\"Google Classroom class\">\u003c/select>\u003cbutton class=\"btn primary\" id=\"linkGo\">Link\u003c/button>\u003c/div>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"linkPost\" checked> Post the Typing Trail link in the Google Classroom class\u003c/label>\n        \u003cp class=\"small\" id=\"linkMsg\" role=\"status\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-settings\">\n      \u003ch2>Class settings\u003c/h2>\n      \u003cdiv class=\"opts\">\n        \u003clabel>Language\u003cselect data-opt=\"Language\">\u003coption value=\"English\">English\u003c/option>\u003coption value=\"Français\">Français\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">What students see: lessons, stories, games and the keyboard.\u003c/span>\u003c/label>\n        \u003clabel data-fr-only>Keyboard\u003cselect data-opt=\"Keyboard\">\u003coption value=\"Auto\">Find it automatically\u003c/option>\u003coption value=\"Canadian French\">Canadian French\u003c/option>\u003coption value=\"Canadian Multilingual\">Canadian Multilingual (CSA)\u003c/option>\u003coption value=\"English (US)\">English (US)\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">For French classes. Typing Trail can tell from the keys students press.\u003c/span>\u003c/label>\n        \u003clabel>Games\u003cselect data-opt=\"Games\">\u003coption value=\"Always\">Always\u003c/option>\u003coption value=\"After a lesson\">After a lesson\u003c/option>\u003coption value=\"Off\">Off\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">\"After a lesson\" gives one game round per finished lesson.\u003c/span>\u003c/label>\n        \u003clabel>Speed goal (words a minute)\u003cselect data-opt=\"Speed goal\">\u003coption>8\u003c/option>\u003coption>10\u003c/option>\u003coption>12\u003c/option>\u003coption>15\u003c/option>\u003coption>20\u003c/option>\u003coption>25\u003c/option>\u003coption>30\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Meeting it earns the 5th star.\u003c/span>\u003c/label>\n        \u003clabel>Class leaderboard\u003cselect data-opt=\"Leaderboard\">\u003coption value=\"On\">On\u003c/option>\u003coption value=\"Off\">Off\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Shows names and XP to classmates.\u003c/span>\u003c/label>\n        \u003clabel>Story Corner\u003cselect data-opt=\"Story Corner\">\u003coption value=\"On\">On\u003c/option>\u003coption value=\"Off\">Off\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Reading passages with questions.\u003c/span>\u003c/label>\n        \u003clabel>Lesson order\u003cselect data-opt=\"Lesson order\">\u003coption value=\"Any order\">Any order\u003c/option>\u003coption value=\"In order\">In order\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">\"In order\" opens each lesson once the one before it is done.\u003c/span>\u003c/label>\n        \u003clabel>Stars to open the next lesson\u003cselect data-opt=\"Stars to unlock\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003coption>5\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Used with \"In order\". 1 star means just finish it.\u003c/span>\u003c/label>\n        \u003clabel>Lessons open up to\u003cselect data-opt=\"Lessons open up to\">\u003coption value=\"All units\">All units\u003c/option>\u003coption value=\"Home Row\">Home Row\u003c/option>\u003coption value=\"Top Row\">Top Row\u003c/option>\u003coption value=\"Bottom Row\">Bottom Row\u003c/option>\u003coption value=\"Accents\" data-fr-only>Accents\u003c/option>\u003coption value=\"Capitals &amp; Punctuation\">Capitals &amp; Punctuation\u003c/option>\u003coption value=\"Numbers\">Numbers\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Open the Trail one unit at a time. Lessons a student already did stay open.\u003c/span>\u003c/label>\n        \u003clabel>Secrets and seasonal extras\u003cselect data-opt=\"Extras\">\u003coption value=\"On\">On\u003c/option>\u003coption value=\"Off\">Off\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Hidden surprises students can discover.\u003c/span>\u003c/label>\n      \u003c/div>\n      \u003clabel style=\"display:block;margin-top:14px;font-family:var(--font-ui);font-weight:600\">Extra blocked words\n        \u003cspan class=\"small\" style=\"font-family:var(--font-read);font-weight:400\">These never appear in this class's lessons or games. Separate with commas.\u003c/span>\n        \u003ctextarea id=\"blockBox\" rows=\"2\" style=\"margin-top:6px\">\u003c/textarea>\u003c/label>\n      \u003cdiv class=\"row\" style=\"display:flex;gap:8px;align-items:center;margin-top:8px\">\u003cbutton class=\"btn\" id=\"blockSave\">Save blocked words\u003c/button>\u003cspan class=\"small\" id=\"blockMsg\">\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"reportsPanel\" hidden>\n      \u003ch2>Flagged by students\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">Text a student reported with the 🚩 button. Add any problem word to the blocked list above.\u003c/p>\n      \u003cul class=\"recent\" id=\"reportList\">\u003c/ul>\n      \u003cbutton class=\"btn\" id=\"clearReports\" style=\"margin-top:8px\">Clear this list\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-students\">\n      \u003ch2>Students\u003c/h2>\n      \u003cdiv class=\"scroll\">\u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Student\u003c/th>\u003cth>Lessons\u003c/th>\u003cth>Stars\u003c/th>\u003cth>Level\u003c/th>\u003cth>Accuracy\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Last active\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"rows\">\u003c/tbody>\n      \u003c/table>\u003c/div>\n      \u003cp class=\"small\" style=\"margin:10px 0 0\">Accuracy and speed are averages of each student's last five lessons. Click a name for details.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"panel\" id=\"detail\" hidden>\u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-roster\">\n      \u003ch2>Roster\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">This list comes from the Google Classroom class. To add or take off a student, change the Google Classroom class.\u003c/p>\n      \u003cdiv class=\"scroll\">\u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Student\u003c/th>\u003cth>Email\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"rosterRows\">\u003c/tbody>\n      \u003c/table>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"storyPanel\">\n      \u003ch2>Story Corner\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 12px\">Students read and type a passage, then answer your questions. They also see 8 Chromebook Helpers stories, 9 classic stories and 8 Typing Trail stories. Add your own here.\u003c/p>\n      \u003cdiv id=\"passageList\">\u003c/div>\n      \u003cbutton class=\"btn\" id=\"newPassage\">Add a passage\u003c/button>\n      \u003cdiv class=\"add-box pform\" id=\"passageForm\" hidden>\n        \u003clabel for=\"pTitle\">Title\u003c/label>\n        \u003cinput type=\"text\" id=\"pTitle\" maxlength=\"60\" placeholder=\"Our trip to the farm\">\n        \u003clabel for=\"pText\">Passage \u003cspan class=\"small\" id=\"pCount\">\u003c/span>\u003c/label>\n        \u003ctextarea id=\"pText\" rows=\"6\" placeholder=\"Write or paste a short passage, a few sentences long.\">\u003c/textarea>\n        \u003cfieldset>\u003clegend>Question 1\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ1\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Answer\u003cinput type=\"text\" id=\"pA1\" maxlength=\"80\" placeholder=\"Peter / Peter Rabbit\">\u003c/label>\n          \u003clabel>Wrong choices (optional)\u003cinput type=\"text\" id=\"pW1\" maxlength=\"180\" placeholder=\"Flopsy, Mopsy\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cfieldset>\u003clegend>Question 2\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ2\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Answer\u003cinput type=\"text\" id=\"pA2\" maxlength=\"80\" placeholder=\"\">\u003c/label>\n          \u003clabel>Wrong choices (optional)\u003cinput type=\"text\" id=\"pW2\" maxlength=\"180\" placeholder=\"\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cfieldset>\u003clegend>Question 3\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ3\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Answer\u003cinput type=\"text\" id=\"pA3\" maxlength=\"80\" placeholder=\"\">\u003c/label>\n          \u003clabel>Wrong choices (optional)\u003cinput type=\"text\" id=\"pW3\" maxlength=\"180\" placeholder=\"\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cp class=\"small\">Students type their answer. Add wrong choices (separated by commas) to make it multiple choice instead. If more than one answer is right, separate them with /. Use text you wrote or have permission to use.\u003c/p>\n        \u003cdiv class=\"row\" style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\ pan>' : x.acc != null && x.acc \u003c 85 ? '\u003cspan class=\"flag\">Check in\u003c/span>' : '';\n    return `\u003ctr class=\"${selected === s.name ? 'sel' : ''}\">\n      \u003ctd>\u003cbutton class=\"name-btn\" data-i=\"${i}\">${esc(s.name)}\u003c/button>${flag}${s.open ? '\u003cspan class=\"flag ok\">All lessons open\u003c/span>' : ''}\u003c/td>\n      \u003ctd>\u003cdiv class=\"bar\" title=\"${x.done} of ${total}\">\u003ci style=\"width:${100 * x.done / total}%\">\u003c/i>\u003c/div>\n        \u003cdiv class=\"small\">${x.done} of ${total} done${x.next ? `, next is ${esc(x.next.title)}` : ''}\u003c/div>\u003c/td>\n      \u003ctd>${x.stars} \u003cspan class=\"star\">★\u003c/span>\u003c/td>\n      \u003ctd>\u003cspan class=\"lvl\">${esc(buddyFor(s))} Lv ${s.level || 1}\u003c/span>\u003cdiv class=\"small\">${s.xp || 0} XP\u003c/div>\u003c/td>\n      \u003ctd>${x.acc != null ? Math.round(x.acc) + '%' : '–'}\u003c/td>\n      \u003ctd>${x.wpm != null ? Math.round(x.wpm) + ' wpm' : '–'}\u003c/td>\n      \u003ctd>${ago(s.last, now)}\u003c/td>\u003c/tr>`;\n  }).join('') || `\u003ctr>\u003ctd colspan=\"7\" class=\"muted\">${d.classroom ? 'No students yet. Students in the Google Classroom class show up here.' : 'Link this class to Google Classroom to bring in its students.'}\u003c/td>\u003c/tr>`;\n\n  $('#rosterRows').innerHTML = d.students.map(s => `\u003ctr>\u003ctd>${esc(s.name)}\u003c/td>\u003ctd>${esc(s.email)}\u003c/td>\n    \u003ctd class=\"row-actions\">\u003cbutton class=\"btn tiny danger\" data-act=\"remove\" data-name=\"${esc(s.name)}\">Remove\u003c/button>\u003c/td>\u003c/tr>`).join('')\n    + (d.staff || []).map(s => `\u003ctr>\u003ctd>${esc(s.name)}\u003c/td>\u003ctd>${esc(s.email)} \u003cspan class=\"flag ok\">Teacher\u003c/span>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>`).join('')\n    + (d.others || []).map(s => `\u003ctr class=\"out\">\u003ctd>${esc(s.name)}\u003c/td>\u003ctd>${s.email ? esc(s.email) : ''} ${s.status === 'removed' ? '\u003cspan class=\"flag\">Removed\u003c/span>' : '\u003cspan class=\"flag\">Not in the Google Classroom class\u003c/span>'}\u003c/td>\n    \u003ctd class=\"row-actions\">${s.status === 'removed' ? `\u003cbutton class=\"btn tiny\" data-act=\"restore\" data-name=\"${esc(s.name)}\">Add back\u003c/button>` : ''}\u003c/td>\u003c/tr>`).join('')\n    || '\u003ctr>\u003ctd colspan=\"3\" class=\"muted\">No students yet.\u003c/td>\u003c/tr>';\n\n  renderHeat(d.classKeys);\n\n  const recent = [];\n  d.students.forEach(s => s.attempts.forEach(a => recent.push({ name: s.name, a })));\n  d.students.forEach(s => (s.storyLog || []).forEach(a => recent.push({ name: s.name, a: Object.assign({}, a, { title: 'the story ' + a.title + (a.total ? ` (${a.right} of ${a.total} right)` : '') }) })));\n  recent.sort((p, q) => q.a.t - p.a.t);\n  $('#recent').innerHTML = recent.slice(0, 10).map(({ name, a }) =>\n    `\u003cli>\u003cspan>\u003cb>${esc(name)}\u003c/b> finished ${esc(a.title)} ${starStr(a.stars)}\u003c/span>\u003cspan class=\"small\">${a.acc}%&nbsp;&nbsp;${ago(a.t, now)}\u003c/span>\u003c/li>`\n  ).join('') || '\u003cli class=\"muted\">Nothing yet. Results appear here as students finish lessons.\u003c/li>';\n\n  const idx = all.findIndex(s => s.name === selected);\n  if (idx >= 0) renderDetail(idx); else $('#detail').hidden = true;\n}\n\n\n/** Students first, then the class's teachers (their own practice; never in the class numbers). */\nconst everyone = d => d.students.concat(d.staff || []);\nconst SPACE_LABEL = 'space';\nfunction renderHeat(keys) {\n  const rows = LANG === 'Français' ? ['1234567890', 'qwertyuiop', 'asdfghjkl;', 'zxcvbnm,.é', 'èàçêâîôûëï'] : ['1234567890', 'qwertyuiop', \"asdfghjkl;'\", 'zxcvbnm,./'];\n  const max = Math.max(1, ...Object.values(keys));\n  const cell = (k, label, cls = '') => {\n    const c = keys[k] || 0, a = c ? 0.12 + 0.78 * c / max : 0;\n    return `\u003cdiv class=\"hk ${cls}\" style=\"background:rgba(var(--heat),${a.toFixed(2)})\" title=\"${c} mistakes\">${esc(label)}\u003csmall>${c || ''}\u003c/small>\u003c/div>`;\n  };\n  $('#heat').innerHTML = rows.map((r, i) => `\u003cdiv class=\"heat-row\" style=\"padding-left:${i * 14}px\">${[...r].map(k => cell(k, k)).join('')}\u003c/div>`).join('')\n    + `\u003cdiv class=\"heat-row\" style=\"padding-left:110px\">${cell('space', SPACE_LABEL, 'space')}\u003c/div>`;\n}\n\nfunction renderDetail(i) {\n  const s = everyone(DATA)[i], now = Date.now();\n  const tricky = Object.entries(s.keyErr).sort((a, b) => b[1] - a[1]).slice(0, 6);\n  const games = Object.entries(s.games);\n  $('#detail').hidden = false;\n  $('#detail').innerHTML = `\n    \u003cdiv class=\"detail-head\">\n      \u003cdiv>\u003ch2 style=\"margin-bottom:4px\">${esc(s.name)}\u003c/h2>\n        \u003cdiv class=\"detail-meta\">${s.email ? `\u003cspan>${esc(s.email)}\u003c/span>` : ''}\u003c/div>\u003c/div>\n      \u003cdiv class=\"pacts\">${lockControls(s)}\u003cbutton class=\"btn\" id=\"closeDetail\">Close\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003ch3>Lessons \u003cspan class=\"small\">(the number is the lesson, the colour is its best stars)\u003c/span>\u003c/h3>\n    ${UNITS.map(u => `\u003cdiv class=\"unit-row\">${u.icon} ${esc(u.name)}\u003c/div>\u003cdiv class=\"lesson-grid\">${TRAIL.filter(l => l.unit === u.id).map(l => {\n      const st = s.stars[l.id] || 0;\n      return `\u003cspan class=\"lc ${st ? 's' + st : ''}\" title=\"Lesson ${l.n}: ${esc(l.title)}, ${st ? st + ' stars' : 'not yet'}\">${l.n}\u003c/span>`;\n    }).join('')}\u003c/div>`).join('')}\n    \u003ch3>Keys to practise\u003c/h3>\n    \u003cp style=\"margin:0\">${tricky.length ? tricky.map(([k, c]) => `\u003ckbd>${esc(k)}\u003c/kbd>×${c}`).join(' ') : '\u003cspan class=\"muted\">No mistakes recorded yet.\u003c/span>'}\u003c/p>\n    \u003ch3>Story Corner\u003c/h3>\n    ${Object.keys(s.stories || {}).length ? `\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Story\u003c/th>\u003cth>Best stars\u003c/th>\u003cth>Questions\u003c/th>\u003cth>Bonus\u003c/th>\u003cth>Times\u003c/th>\u003cth>Last\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${\n      Object.values(s.stories).sort((a, b) => b.last - a.last).map(x => `\u003ctr>\u003ctd>${esc(x.title)}\u003c/td>\u003ctd>${starStr(x.s)}\u003c/td>\u003ctd>${x.q ? x.r + ' of ' + x.q : '–'}\u003c/td>\u003ctd>${x.b ? '⭐' : '–'}\u003c/td>\u003ctd>${x.n}\u003c/td>\u003ctd>${ago(x.last, now)}\u003c/td>\u003c/tr>`).join('')\n    }\u003c/tbody>\u003c/table>\u003c/div>` : '\u003cp class=\"small\" style=\"margin:0\">No stories read yet.\u003c/p>'}\n    ${games.length ? `\u003ch3>Game bests\u003c/h3>\u003cp style=\"margin:0\">${games.map(([k, v]) => `${esc(k)}: \u003cb>${v}\u003c/b>`).join('&nbsp;&nbsp; ')}\u003c/p>` : ''}\n    \u003ch3>Recent lessons\u003c/h3>\n    \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Lesson\u003c/th>\u003cth>Stars\u003c/th>\u003cth>Accuracy\u003c/th>\u003cth>Speed\u003c/th>\u003cth>Time\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    ${s.attempts.slice().reverse().slice(0, 10).map(a => `\u003ctr>\u003ctd>${ago(a.t, now)}\u003c/td>\u003ctd>${a.n}. ${esc(a.title)}\u003c/td>\u003ctd>${starStr(a.stars)}\u003c/td>\n      \u003ctd>${a.acc}%\u003c/td>\u003ctd>${a.wpm} wpm\u003c/td>\u003ctd>${Math.floor(a.sec / 60)}:${String(a.sec % 60).padStart(2, '0')}\u003c/td>\u003c/tr>`).join('')\n      || '\u003ctr>\u003ctd colspan=\"6\" class=\"muted\">No lessons yet.\u003c/td>\u003c/tr>'}\n    \u003c/tbody>\u003c/table>\u003c/div>`;\n  $('#closeDetail').addEventListener('click', () => { selected = null; $('#detail').hidden = true; render(); });\n}\n\nconst BUDDY_STAGES = { bird: ['🥚', '🐣', '🐥', '🦉', '🦅'], dragon: ['🥚', '🦎', '🐊', '🐲', '🐉'], cat: ['🐱', '🐈', '🐆', '🐅', '🦁'],\n  sea: ['🥚', '🐟', '🐠', '🐬', '🐳'], bug: ['🥚', '🐛', '🐞', '🐝', '🦋'], moose: ['🫎', '🫎', '🫎', '🫎', '🫎'] };\nfunction buddyFor(s) {\n  const lv = s.level || 1, st = [1, 3, 5, 7, 9].filter(l => lv >= l).length - 1;\n  return (BUDDY_STAGES[s.avatar] || BUDDY_STAGES.bird)[Math.max(0, st)];\n}\n\n/* ---------- Story Corner passages ---------- */\nlet EDITING = null;\nfunction renderPassages() {\n  const list = (DATA && DATA.passages) || [];\n  $('#passageList').innerHTML = list.map(p => `\u003cdiv class=\"passage ${p.shown && !p.blockedWord ? '' : 'off'}\">\n    \u003cdiv>\u003cb>${esc(p.title)}\u003c/b>\u003cdiv class=\"ptext\">${esc(p.text.length > 160 ? p.text.slice(0, 160) + '…' : p.text)}\u003c/div>\n      \u003cdiv class=\"pmeta\">${p.questions.length} question${p.questions.length === 1 ? '' : 's'}, read by ${p.readers} student${p.readers === 1 ? '' : 's'}${p.shown ? '' : ', hidden from students'}\u003c/div>\n      ${p.blockedWord ? `\u003cdiv class=\"warn\">Hidden from students: it contains the blocked word \"${esc(p.blockedWord)}\".\u003c/div>` : ''}\u003c/div>\n    \u003cdiv class=\"pacts\">\u003cbutton class=\"btn tiny\" data-pact=\"toggle\" data-pid=\"${esc(p.id)}\">${p.shown ? 'Hide' : 'Show'}\u003c/button>\n      \u003cbutton class=\"btn tiny\" data-pact=\"edit\" data-pid=\"${esc(p.id)}\">Edit\u003c/button>\n      \u003cbutton class=\"btn tiny danger\" data-pact=\"delete\" data-pid=\"${esc(p.id)}\">Delete\u003c/button>\u003c/div>\u003c/div>`).join('')\n    || '\u003cp class=\"small\">No passages of your own yet.\u003c/p>';\n}\nfunction openPassageForm(p) {\n  EDITING = p ? p.id : null;\n  $('#passageForm').hidden = false; $('#newPassage').hidden = true;\n  $('#pTitle').value = p ? p.title : ''; $('#pText').value = p ? p.text : '';\n  for (let i = 1; i \u003c= 3; i++) {\n    const q = p && p.questions[i - 1];\n    $('#pQ' + i).value = q ? q.q : ''; $('#pA' + i).value = q ? q.a : ''; $('#pW' + i).value = q ? q.w : '';\n  }\n  $('#pMsg').textContent = '';\n  countPassage();\n  $('#pTitle').focus();\n}\nfunction closePassageForm() { EDITING = null; $('#passageForm').hidden = true; $('#newPassage').hidden = false; }\nfunction countPassage() {\n  const n = $('#pText').value.trim().length;\n  $('#pCount').textContent = n ? `(${n} of 1500 characters)` : '';\n}\n$('#pText').addEventListener('input', countPassage);\n$('#newPassage').addEventListener('click', () => openPassageForm(null));\n$('#pCancel').addEventListener('click', closePassageForm);\n$('#pSave').addEventListener('click', async () => {\n  const p = { id: EDITING, title: $('#pTitle').value, text: $('#pText').value, questions: [1, 2, 3].map(i => ({ q: $('#pQ' + i).value, a: $('#pA' + i).value, w: $('#pW' + i).value })) };\n  busy($('#pSave'), true); $('#pMsg').textContent = 'Saving…';\n  try { DATA.passages = await api('savePassage', CUR, p); closePassageForm(); renderPassages(); flash('Passage saved. Students see it the next time they open Typing Trail.'); }\n  catch (e) { $('#pMsg').textContent = cleanErr(e); }\n  busy($('#pSave'), false);\n});\ndocument.addEventListener('click', async e => {\n  const b = e.target.closest('[data-pact]');\n  if (!b || !DATA) return;\n  const p = (DATA.passages || []).find(x => x.id === b.dataset.pid);\n  if (!p) return;\n  if (b.dataset.pact === 'edit') return openPassageForm(p);\n  if (b.dataset.pact === 'delete' && !b.dataset.armed) {\n    b.dataset.armed = '1'; b.textContent = 'Click again to delete';\n    setTimeout(() => { delete b.dataset.armed; b.textContent = 'Delete'; }, 3000);\n    return;\n  }\n  busy(b, true);\n  try {\n    DATA.passages = b.dataset.pact === 'delete' ? await api('deletePassage', CUR, p.id) : await api('setPassageShown', CUR, p.id, !p.shown);\n    renderPassages();\n  } catch (err) { flash(cleanErr(err)); }\n});\n\n\n/* ---------- lesson order: one student can open every lesson ---------- */\nfunction lockControls(s) {\n  const o = (DATA && DATA.options) || {};\n  const classLock = o['Lesson order'] === 'In order' || (o['Lessons open up to'] && o['Lessons open up to'] !== 'All units');\n  if (!classLock && !s.open) return '';\n  return `\u003cbutton class=\"btn\" data-open-all=\"${esc(s.name)}\" data-on=\"${s.open ? '0' : '1'}\">${s.open ? '🔒 Use the class lesson order' : '🔓 Open all lessons for ' + esc(s.name.split(' ')[0])}\u003c/button>`;\n}\ndocument.addEventListener('click', async e => {\n  const b = e.target.closest('[data-open-all]');\n  if (!b) return;\n  busy(b, true);\n  try { await api('setAllOpen', CUR, b.dataset.openAll, b.dataset.on === '1'); flash(b.dataset.on === '1' ? 'All lessons are open for ' + b.dataset.openAll + '.' : b.dataset.openAll + ' follows the class lesson order again.'); await loadClass(); }\n  catch (err) { flash(cleanErr(err)); busy(b, false); }\n});\n\n$('#blockSave').addEventListener('click', async () => {\n  busy($('#blockSave'), true); $('#blockMsg').textContent = 'Saving…';\n  try { const w = await api('setBlockedWords', CUR, $('#blockBox').value); $('#blockBox').value = w; DATA.blockedWords = w; $('#blockMsg').textContent = 'Saved. Applies the next time students open Typing Trail.'; }\n  catch (e) { $('#blockMsg').textContent = cleanErr(e); }\n  busy($('#blockSave'), false);\n});\n$('#clearReports').addEventListener('click', async () => {\n  try { await api('clearReports', CUR); await loadClass(); } catch (e) { flash(cleanErr(e)); }\n});\n$$('[data-opt]').forEach(el => el.addEventListener('change', async () => {\n  el.disabled = true;\n  try {\n    DATA.options = await api('setClassOption', CUR, el.dataset.opt, el.value);\n    flash('Saved. Students see the change next time they open Typing Trail.');\n    if (el.dataset.opt === 'Language') { useCurriculum(DATA.options['Language']); render(); }\n  }\n  catch (e) { flash(cleanErr(e)); }\n  el.disabled = false;\n}));\n\ndocument.addEventListener('click', e => {\n  const b = e.target.closest('.name-btn');\n  if (!b) return;\n  selected = everyone(DATA)[+b.dataset.i].name;\n  render();\n  const det = $('#detail');\n  if (det.scrollIntoView) det.scrollIntoView({ behavior: 'smooth', block: 'start' });\n});\n$('#postBtn').addEventListener('click', async () => {\n  busy($('#postBtn'), true);\n  try { await api('postToClassroom', CUR); flash('Posted. Students open Typing Trail with one click from the Stream, and it is also under Classwork.'); }\n  catch (e) { flash(cleanErr(e)); }\n  busy($('#postBtn'), false);\n});\n$('#syncBtn').addEventListener('click', async () => {\n  busy($('#syncBtn'), true);\n  try { flash(syncMsg(await api('syncNow', CUR))); await loadClass(); }\n  catch (e) { flash(cleanErr(e)); }\n  busy($('#syncBtn'), false);\n});\nconst syncMsg = r => {\n  const p = [];\n  if (r.added) p.push(`${r.added} new student${r.added === 1 ? '' : 's'} added`);\n  if (r.back) p.push(`${r.back} back in the class`);\n  if (r.left) p.push(`${r.left} no longer in the Google Classroom class`);\n  return p.length ? 'From Google Classroom: ' + p.join(', ') + '.' : 'The list already matches the Google Classroom class.';\n};\n/** A class from an older version that isn't linked to Google Classroom: pick its Classroom class. */\nfunction renderLink(d) {\n  $('#linkBox').hidden = !!d.classroom;\n  if (d.classroom) return;\n  const free = (HOME.courses || []).filter(c => !c.classId);\n  $('#linkPick').innerHTML = free.map(c => `\u003coption value=\"${esc(c.id)}\">${esc(c.name)}\u003c/option>`).join('');\n  $('#linkPick').hidden = $('#linkGo').hidden = !free.length;\n  if (!free.length) $('#linkMsg').textContent = 'No free Google Classroom classes where you teach were found. Create one in Google Classroom, then reload this page.';\n}\n$('#linkGo').addEventListener('click', async () => {\n  busy($('#linkGo'), true); $('#linkMsg').textContent = 'Linking…';\n  try {\n    const courseId = $('#linkPick').value;\n    const r = await api('linkClassroom', CUR, courseId, $('#linkPost').checked);\n    const course = (HOME.courses || []).find(c => c.id === courseId);\n    if (course) course.classId = CUR;\n    const listed = HOME.classes.find(c => c.id === CUR);\n    if (listed) listed.courseId = courseId;\n    if (r.autoSync !== undefined) HOME.autoSync = r.autoSync;\n    $('#linkMsg').textContent = '';\n    await loadClass();\n    flash('Linked to Google Classroom. ' + syncMsg(r) + (r.posted ? ' The link is posted in the Classroom Stream and under Classwork.' : ''));\n  } catch (e) { $('#linkMsg').textContent = cleanErr(e); }\n  busy($('#linkGo'), false);\n});\n$('#copyLink').addEventListener('click', async () => {\n  const input = $('#classLink');\n  let ok = false;\n  try { await navigator.clipboard.writeText(input.value); ok = true; }\n  catch (e) { try { input.select(); ok = document.execCommand('copy'); } catch (e2) {} }\n  $('#copyLink').textContent = ok ? 'Copied' : 'Select and copy';\n  setTimeout(() => { $('#copyLink').textContent = 'Copy'; }, 1800);\n});\nsetInterval(() => { if (DATA && !$('#dash').hidden && !document.hidden) loadClass(); }, 60000);\nboot();\n})();\n\u003c/script>\n\u003cscript>\ndocument.getElementById('teacher-nav').addEventListener('click', event => {\n  const link = event.target.closest('a');\n  if (!link) return;\n  const section = document.getElementById(link.getAttribute('href').slice(1));\n  if (!section) return;\n  event.preventDefault();\n  const current = event.currentTarget.querySelector('[aria-current]');\n  if (current) current.removeAttribute('aria-current');\n  link.setAttribute('aria-current', 'location');\n  section.scrollIntoView({ block: 'start' });\n  section.setAttribute('tabindex', '-1');\n  section.focus({ preventScroll: true });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "Teacher_fr": "\u003c!DOCTYPE html>\n\u003chtml lang=\"fr-CA\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Typing Trail – Enseignants\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cs u_book\u003c/span>Coin lecture\u003c/a>\u003c/nav>\n\u003c/aside>\n\u003cheader class=\"top\">\n  \u003cp class=\"teacher-view-label\">Tableau de bord\u003c/p>\n  \u003cdiv class=\"top-actions\">\n    \u003cspan class=\"who\" id=\"who\">\u003c/span>\n    \u003cselect id=\"classPick\" aria-label=\"Choisir une classe\" hidden>\u003c/select>\n    \u003cbutton class=\"btn\" id=\"newClassBtn\" hidden>Nouvelle classe\u003c/button>\n    \u003cbutton class=\"btn\" id=\"refresh\" hidden>Actualiser\u003c/button>\n    \u003ca class=\"btn\" id=\"usageLink\" target=\"_blank\" rel=\"noopener\" hidden title=\"Chaque classe et chaque enseignant, et un journal quotidien. Des chiffres seulement. Mis à jour chaque matin.\">📊 Rapport d'utilisation\u003c/a>\n    \u003cbutton class=\"btn\" id=\"usageMake\" hidden title=\"Chaque classe et chaque enseignant, et un journal quotidien. Des chiffres seulement.\">📊 Créer le rapport d'utilisation\u003c/button>\n    \u003ca class=\"btn\" id=\"langLink\" target=\"_top\" hidden title=\"Change seulement la langue de ce tableau de bord. La langue des élèves se règle pour chaque classe, dans les réglages de la classe.\">English\u003c/a>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n  \u003cp id=\"loading\" class=\"muted\">Chargement…\u003c/p>\n  \u003csection id=\"notice\" class=\"panel\" hidden>\u003c/section>\n\n  \u003csection id=\"start\" class=\"panel start\" hidden>\n    \u003ch1 style=\"margin-top:0\">Démarrer une classe\u003c/h1>\n    \u003clabel class=\"lang-pick\">Langue de la classe \u003cselect id=\"newLang\">\u003coption value=\"English\">Anglais\u003c/option>\u003coption value=\"Français\">Français\u003c/option>\u003c/select>\n      \u003cspan class=\"small\">Ce que voient les élèves. Vous pourrez la changer plus tard dans les réglages de la classe.\u003c/span>\u003c/label>\n    \u003cdiv id=\"fromClassroom\" hidden>\n      \u003cp class=\"muted\">Choisissez une de vos classes Google Classroom. Typing Trail ajoute tous ses élèves, et ils se connectent avec leur compte de l'école.\u003c/p>\n      \u003cul class=\"course-list\" id=\"courseList\">\u003c/ul>\n      \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"postIt\" checked> Publier le lien de Typing Trail dans la classe Google Classroom\u003c/label>\n    \u003c/div>\n    \u003cp class=\"err\" id=\"startErr\" role=\"alert\">\u003c/p>\n    \u003cp class=\"muted\" id=\"noCourses\" hidden>Typing Trail fonctionne avec Google Classroom, et aucune classe Google Classroom où vous enseignez n'a été trouvée. Créez la classe dans Google Classroom, puis rechargez cette page.\u003c/p>\n    \u003cdetails>\n      \u003csummary>Vous avez déjà une feuille Typing Trail?\u003c/summary>\n      \u003cp>Collez son lien pour l'ajouter à vos classes.\u003c/p>\n      \u003cdiv class=\"copy-row\">\u003cinput type=\"text\" id=\"attachUrl\" placeholder=\"https://docs.google.com/spreadsheets/d/…\">\u003cbutton class=\"btn\" id=\"attachGo\">Ajouter\u003c/button>\u003c/div>\n    \u003c/details>\n    \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"cancelNew\" hidden>Retour à ma classe\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"dash\" hidden>\n    \u003cp class=\"flash\" id=\"flash\" role=\"status\" hidden>\u003c/p>\n    \u003cdiv class=\"dash-head\" id=\"teach-overview\">\n      \u003cdiv>\u003ch1 id=\"className\">\u003c/h1>\u003cp class=\"class-lang\" id=\"classLang\">\u003c/p>\u003c/div>\n      \u003cdiv class=\"acts\">\n        \u003ca class=\"btn\" id=\"sheetLink\" target=\"_blank\" rel=\"noopener\">Ouvrir la feuille\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"tiles\" id=\"tiles\">\u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-link\">\n      \u003ch2>Lien pour les élèves\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">Les élèves l'ouvrent depuis Google Classroom. Seuls les élèves de la classe Google Classroom liée peuvent se connecter.\u003c/p>\n      \u003cdiv class=\"copy-row\">\u003cinput type=\"text\" id=\"classLink\" readonly aria-label=\"Lien pour les élèves\">\u003cbutton class=\"btn\" id=\"copyLink\">Copier\u003c/button>\u003c/div>\n      \u003cdiv class=\"cr-box small\" id=\"crBox\" hidden>\n        \u003cspan>Liée à \u003cb id=\"crName\">\u003c/b>. \u003cspan id=\"crAuto\">Les élèves qui se joignent à cette classe ou la quittent sont ajoutés ou retirés en quelques minutes.\u003c/span> \u003cspan id=\"crChecked\">\u003c/span>\u003c/span>\n        \u003cbutton class=\"btn tiny\" id=\"postBtn\">Publier le lien dans Classroom\u003c/button>\n        \u003cbutton class=\"btn tiny\" id=\"syncBtn\">Synchroniser les élèves\u003c/button>\n        \u003ca class=\"btn tiny\" id=\"tryLink\" target=\"_blank\" rel=\"noopener\" title=\"Ouvre la classe avec votre compte. Vos résultats sont enregistrés, mais vous n'êtes ni dans les totaux de la classe ni dans le classement.\">Essayez-le vous-même\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"add-box link-box\" id=\"linkBox\" hidden>\n        \u003cp style=\"margin:0\">\u003cb>⚠️ Cette classe n'est pas liée à Google Classroom, alors les élèves ne peuvent pas se connecter.\u003c/b> Choisissez sa classe Google Classroom. Ses élèves sont ajoutés, et les autres ne peuvent plus se connecter (leur travail est conservé).\u003c/p>\n        \u003cdiv class=\"row\">\u003cselect id=\"linkPick\" aria-label=\"Classe Google Classroom\">\u003c/select>\u003cbutton class=\"btn primary\" id=\"linkGo\">Lier\u003c/button>\u003c/div>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"linkPost\" checked> Publier le lien de Typing Trail dans la classe Google Classroom\u003c/label>\n        \u003cp class=\"small\" id=\"linkMsg\" role=\"status\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-settings\">\n      \u003ch2>Réglages de la classe\u003c/h2>\n      \u003cdiv class=\"opts\">\n        \u003clabel>Langue\u003cselect data-opt=\"Language\">\u003coption value=\"English\">Anglais\u003c/option>\u003coption value=\"Français\">Français\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Ce que voient les élèves : leçons, histoires, jeux et clavier.\u003c/span>\u003c/label>\n        \u003clabel data-fr-only>Clavier\u003cselect data-opt=\"Keyboard\">\u003coption value=\"Auto\">Détection automatique\u003c/option>\u003coption value=\"Canadian French\">Canadien français\u003c/option>\u003coption value=\"Canadian Multilingual\">Canadien multilingue (CSA)\u003c/option>\u003coption value=\"English (US)\">Anglais (É.-U.)\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Pour les classes en français. Typing Trail le devine à partir des touches que les élèves utilisent.\u003c/span>\u003c/label>\n        \u003clabel>Jeux\u003cselect data-opt=\"Games\">\u003coption value=\"Always\">Toujours\u003c/option>\u003coption value=\"After a lesson\">Après une leçon\u003c/option>\u003coption value=\"Off\">Non\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">« Après une leçon » donne une partie de jeu par leçon terminée.\u003c/span>\u003c/label>\n        \u003clabel>Objectif de vitesse (mots par minute)\u003cselect data-opt=\"Speed goal\">\u003coption>8\u003c/option>\u003coption>10\u003c/option>\u003coption>12\u003c/option>\u003coption>15\u003c/option>\u003coption>20\u003c/option>\u003coption>25\u003c/option>\u003coption>30\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">L'atteindre donne la 5e étoile.\u003c/span>\u003c/label>\n        \u003clabel>Palmarès de la classe\u003cselect data-opt=\"Leaderboard\">\u003coption value=\"On\">Oui\u003c/option>\u003coption value=\"Off\">Non\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Montre les noms et les XP aux camarades.\u003c/span>\u003c/label>\n        \u003clabel>Coin lecture\u003cselect data-opt=\"Story Corner\">\u003coption value=\"On\">Oui\u003c/option>\u003coption value=\"Off\">Non\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Des textes à lire, avec des questions.\u003c/span>\u003c/label>\n        \u003clabel>Ordre des leçons\u003cselect data-opt=\"Lesson order\">\u003coption value=\"Any order\">Dans n'importe quel ordre\u003c/option>\u003coption value=\"In order\">Dans l'ordre\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">« Dans l'ordre » ouvre chaque leçon une fois la précédente terminée.\u003c/span>\u003c/label>\n        \u003clabel>Étoiles pour ouvrir la leçon suivante\u003cselect data-opt=\"Stars to unlock\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003coption>5\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Avec « Dans l'ordre ». 1 étoile veut dire simplement la terminer.\u003c/span>\u003c/label>\n        \u003clabel>Leçons ouvertes jusqu'à\u003cselect data-opt=\"Lessons open up to\">\u003coption value=\"All units\">Toutes les unités\u003c/option>\u003coption value=\"Home Row\">Rangée de base\u003c/option>\u003coption value=\"Top Row\">Rangée du haut\u003c/option>\u003coption value=\"Bottom Row\">Rangée du bas\u003c/option>\u003coption value=\"Accents\" data-fr-only>Les accents\u003c/option>\u003coption value=\"Capitals &amp; Punctuation\">Majuscules et ponctuation\u003c/option>\u003coption value=\"Numbers\">Les chiffres\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Ouvrez le sentier une unité à la fois. Les leçons déjà faites restent ouvertes.\u003c/span>\u003c/label>\n        \u003clabel>Secrets et surprises de saison\u003cselect data-opt=\"Extras\">\u003coption value=\"On\">Oui\u003c/option>\u003coption value=\"Off\">Non\u003c/option>\u003c/select>\n          \u003cspan class=\"small\">Des surprises cachées que les élèves peuvent découvrir.\u003c/span>\u003c/label>\n      \u003c/div>\n      \u003clabel style=\"display:block;margin-top:14px;font-family:var(--font-ui);font-weight:600\">Mots bloqués supplémentaires\n        \u003cspan class=\"small\" style=\"font-family:var(--font-read);font-weight:400\">Ils n'apparaissent jamais dans les leçons ni dans les jeux de cette classe. Séparez-les par des virgules.\u003c/span>\n        \u003ctextarea id=\"blockBox\" rows=\"2\" style=\"margin-top:6px\">\u003c/textarea>\u003c/label>\n      \u003cdiv class=\"row\" style=\"display:flex;gap:8px;align-items:center;margin-top:8px\">\u003cbutton class=\"btn\" id=\"blockSave\">Enregistrer les mots bloqués\u003c/button>\u003cspan class=\"small\" id=\"blockMsg\">\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"reportsPanel\" hidden>\n      \u003ch2>Signalé par les élèves\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">Texte qu'un élève a signalé avec le bouton 🚩. Ajoutez tout mot problématique à la liste des mots bloqués, plus haut.\u003c/p>\n      \u003cul class=\"recent\" id=\"reportList\">\u003c/ul>\n      \u003cbutton class=\"btn\" id=\"clearReports\" style=\"margin-top:8px\">Vider cette liste\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-students\">\n      \u003ch2>Élèves\u003c/h2>\n      \u003cdiv class=\"scroll\">\u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Élève\u003c/th>\u003cth>Leçons\u003c/th>\u003cth>Étoiles\u003c/th>\u003cth>Niveau\u003c/th>\u003cth>Précision\u003c/th>\u003cth>Vitesse\u003c/th>\u003cth>Dernière activité\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"rows\">\u003c/tbody>\n      \u003c/table>\u003c/div>\n      \u003cp class=\"small\" style=\"margin:10px 0 0\">La précision et la vitesse sont des moyennes des cinq dernières leçons de chaque élève. Cliquez sur un nom pour les détails.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"panel\" id=\"detail\" hidden>\u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"teach-roster\">\n      \u003ch2>Liste des élèves\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 10px\">Cette liste vient de la classe Google Classroom. Pour ajouter ou retirer un élève, changez la classe Google Classroom.\u003c/p>\n      \u003cdiv class=\"scroll\">\u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Élève\u003c/th>\u003cth>Courriel\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"rosterRows\">\u003c/tbody>\n      \u003c/table>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\" id=\"storyPanel\">\n      \u003ch2>Coin lecture\u003c/h2>\n      \u003cp class=\"small\" style=\"margin:-6px 0 12px\">Les élèves lisent et tapent un texte, puis répondent à vos questions. Ils voient aussi 8 histoires sur les outils du Chromebook, 9 histoires classiques et 8 histoires de Typing Trail. Ajoutez les vôtres ici.\u003c/p>\n      \u003cdiv id=\"passageList\">\u003c/div>\n      \u003cbutton class=\"btn\" id=\"newPassage\">Ajouter un texte\u003c/button>\n      \u003cdiv class=\"add-box pform\" id=\"passageForm\" hidden>\n        \u003clabel for=\"pTitle\">Titre\u003c/label>\n        \u003cinput type=\"text\" id=\"pTitle\" maxlength=\"60\" placeholder=\"Notre visite à la ferme\">\n        \u003clabel for=\"pText\">Texte \u003cspan class=\"small\" id=\"pCount\">\u003c/span>\u003c/label>\n        \u003ctextarea id=\"pText\" rows=\"6\" placeholder=\"Écrivez ou collez un court texte de quelques phrases.\">\u003c/textarea>\n        \u003cfieldset>\u003clegend>Question 1\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ1\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Réponse\u003cinput type=\"text\" id=\"pA1\" maxlength=\"80\" placeholder=\"Pierre / Pierre Lapin\">\u003c/label>\n          \u003clabel>Mauvais choix (facultatif)\u003cinput type=\"text\" id=\"pW1\" maxlength=\"180\" placeholder=\"Flopsy, Mopsy\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cfieldset>\u003clegend>Question 2\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ2\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Réponse\u003cinput type=\"text\" id=\"pA2\" maxlength=\"80\" placeholder=\"\">\u003c/label>\n          \u003clabel>Mauvais choix (facultatif)\u003cinput type=\"text\" id=\"pW2\" maxlength=\"180\" placeholder=\"\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cfieldset>\u003clegend>Question 3\u003c/legend>\u003cdiv class=\"qgrid\">\n          \u003clabel>Question\u003cinput type=\"text\" id=\"pQ3\" maxlength=\"150\">\u003c/label>\n          \u003clabel>Réponse\u003cinput type=\"text\" id=\"pA3\" maxlength=\"80\" placeholder=\"\">\u003c/label>\n          \u003clabel>Mauvais choix (facultatif)\u003cinput type=\"text\" id=\"pW3\" maxlength=\"180\" placeholder=\"\">\u003c/label>\n        \u003c/div>\u003c/fieldset>\n        \u003cp class=\"small\">Les élèves tapent leur réponse. Ajoutez de mauvais choix (séparés par des virgules) pour en faire un choix multiple. Si plusieurs réponses sont bonnes, séparez-les avec /. Utilisez un texte que vous avez écrit ou que vous avez le droit d'utiliser.\u003c/p>\n        \u003cdiv class=\"row\" style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\u003cbutton class=\"btn primary\" id=\"pSave\">Enregistrer le texte\u003c/button>\u003cbutton class=\"btn\" id=\"pCancel\">Annuler\u003c/button>\u003cspan class=\"small\" id=\"pMsg\" role=\"status\">\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"grid2\">\n      \u003cdiv class=\"panel\">\n        \u003ch2>Touches difficiles de la classe\u003c/h2>\n        \u003cp class=\"small\" style=\"margin:-6px 0 12px\">Les touches plus foncées ont eu plus d'erreurs dans toutes les leçons.\u003c/p>\n        \u003cdiv class=\"heat\" id=\"heat\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"panel\">\n        \u003ch2>Activité récente\u003c/h2>\n        \u003cul class=\"recent\" id=\"recent\">\u003c/ul>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003c/m  d + ' jours';\n  return new Date(t).toLocaleDateString('fr-CA');\n}\nfunction render() {\n  const d = DATA, total = TRAIL.length, now = Date.now();\n  $$('[data-opt]').forEach(el => { el.value = (d.options || {})[el.dataset.opt] || el.value; });\n  $$('[data-fr-only]').forEach(el => { el.hidden = LANG !== 'Français'; });\n  if (document.activeElement !== $('#blockBox')) $('#blockBox').value = d.blockedWords || '';\n  if ($('#passageForm').hidden) renderPassages();\n  $('#reportsPanel').hidden = !(d.reports && d.reports.length);\n  $('#reportList').innerHTML = (d.reports || []).map(r => `\u003cli>\u003cspan>\u003cb>${esc(r.name)}\u003c/b> dans ${esc(r.where)}\u003cbr>\u003cspan class=\"small\">${esc(r.text)}\u003c/span>\u003c/span>\u003cspan class=\"small\">${ago(r.t, now)}\u003c/span>\u003c/li>`).join('');\n  $('#className').textContent = d.className;\n  $('#classLang').innerHTML = `🗣️ Les élèves voient cette classe en \u003cb>${LANG === 'Français' ? 'français' : 'anglais'}\u003c/b>. \u003cbutton class=\"linkish\" id=\"changeLang\">Changer\u003c/button>`;\n  $('#sheetLink').href = d.sheetUrl;\n  $('#classLink').value = d.classLink;\n  $('#tryLink').href = d.classLink;\n  $('#crBox').hidden = !d.classroom;\n  $('#crName').textContent = d.classroom || '';\n  $('#crAuto').textContent = HOME.autoSync ? 'Les élèves qui se joignent à cette classe ou la quittent sont ajoutés ou retirés en quelques minutes.' : 'Quand des élèves se joignent à cette classe ou la quittent, cliquez sur Synchroniser les élèves.';\n  $('#crChecked').innerHTML = !d.classroom ? '' : d.checked && now - d.checked \u003c 864e5 ? `Dernière vérification : ${ago(d.checked, now).toLowerCase()}.`\n    : '\u003cspan class=\"flag\">⚠️ Typing Trail n\\'a pas pu vérifier cette classe Google Classroom dernièrement. Cliquez sur Synchroniser les élèves. Si ça ne marche pas, vérifiez que vous enseignez toujours dans cette classe.\u003c/span>';\n  renderLink(d);\n\n  const all = everyone(d), sumsAll = all.map(s => s élèves terminent des leçons.\u003c/li>';\n\n  const idx = all.findIndex(s => s.name === selected);\n  if (idx >= 0) renderDetail(idx); else $('#detail').hidden = true;\n}\n\n\n/** Students first, then the class's teachers (their own practice; never in the class numbers). */\nconst everyone = d => d.students.concat(d.staff || []);\nconst SPACE_LABEL = 'espace';\nfunction renderHeat(keys) {\n  const rows = LANG === 'Français' ? ['1234567890', 'qwertyuiop', 'asdfghjkl;', 'zxcvbnm,.é', 'èàçêâîôûëï'] : ['1234567890', 'qwertyuiop', \"asdfghjkl;'\", 'zxcvbnm,./'];\n  const max = Math.max(1, ...Object.values(keys));\n  const cell = (k, label, cls = '') => {\n    const c = keys[k] || 0, a = c ? 0.12 + 0.78 * c / max : 0;\n    return `\u003cdiv class=\"hk ${cls}\" style=\"background:rgba(var(--heat),${a.toFixed(2)})\" title=\"${c} erreur${c > 1 ? 's' : ''}\">${esc(label)}\u003csmall>${c || ''}\u003c/small>\u003c/div>`;\n  };\n  $('#heat').innerHTML = rows.map((r, i) => `\u003cdiv class=\"heat-row\" style=\"padding-left:${i * 14}px\">${[...r].map(k => cell(k, k)).join('')}\u003c/div>`).join('')\n    + `\u003cdiv class=\"heat-row\" style=\"padding-left:110px\">${cell('space', SPACE_LABEL, 'space')}\u003c/div>`;\n}\n\nfunction renderDetail(i) {\n  const s = everyone(DATA)[i], now = Date.now();\n  const tricky = Object.entries(s.keyErr).sort((a, b) => b[1] - a[1]).slice(0, 6);\n  const games = Object.entries(s.games);\n  $('#detail').hidden = false;\n  $('#detail').innerHTML = `\n    \u003cdiv class=\"detail-head\">\n      \u003cdiv>\u003ch2 style=\"margin-bottom:4px\">${esc(s.name)}\u003c/h2>\n        \u003cdiv class=\"detail-meta\">${s.email ? `\u003cspan>${esc(s.email)}\u003c/span>` : ''}\u003c/div>\u003c/div>\n      \u003cdiv class=\"pacts\">${lockControls(s)}\u003cbutton class=\"btn\" id=\"closeDetail\">Fermer\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003ch3>Leçons \u003cspan class=\"small\">(le nombre est la leçon, la couleur montre ses meilleures étoiles)\u003c/sp     s.progress.keyErr={f:i*2,j:i+1,space:Math.max(0,i-1)};
  });
  const passage=lang==='fr'?{title:'Une promenade au parc',text:'Maya marche dans le parc avec son ami. Ils voient un petit oiseau dans un arbre. Le soleil brille et les enfants sourient.',questions:[{q:'Où marche Maya?',a:'dans le parc',w:'à la plage,à la maison'}]}:{title:'A walk in the park',text:'Maya walks to the park with her friend. They see a small bird in a tall tree. The sun is shining and the children smile.',questions:[{q:'Where does Maya walk?',a:'the park',w:'the beach,the school'}]};
  return {id,name,lang,courseId:'course-'+id,options:defaultOptions(lang),students,passages:[{...passage,id:'t-sample',shown:true,readers:0,blockedWord:''}],reports:[],blockedWords:'',checked:Date.now()};
}
const initial = ()=>({classes:[seedClass('sample-en','en','Sample class · English'),seedClass('sample-fr','fr','Classe exemple · Français')]});
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){}
if(!state?.classes?.length)state=initial();
let context={role:'student',lang:'en',classId:'sample-en',studentId:'s0'};
try{const p=new URLSearchParams(location.search);if(p.get('view')==='teacher')context.role='teacher';if(p.get('lang')==='fr'){context.lang='fr';context.classId='sample-fr'}if(state.classes.some(c=>c.id===p.get('class')))context.classId=p.get('class')}catch(e){}
let statusTimer;
function message(text){$('status').textContent=text;$('status').hidden=false;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('status').hidden=true,5500)}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){message('Browser storage is unavailable. Changes will last only until this page closes.')}}
function currentClass(id=context.classId){const c=state.classes.find(c=>c.id===id);if(!c)throw Error('Unknown preview class.');return c}
function currentStudent(c){const s=c.students.find(s=>s.id===context.studentId)||c.students[0];if(!s)throw Error('No sample students.');return s}
function blocked(c){return c.blockedWords.toLowerCase().split(/[,\n]+/).map(w=>w.trim()).filter(Boolean)}
function blockedPassage(c,p){const tokens=[p.title,p.text,...p.questions.map(q=>q.q+' '+q.a+' '+q.w)].join(' ').toLowerCase().split(/[^a-zà-ÿ0-9]+/);return blocked(c).find(w=>tokens.includes(w))||''}
function teacherPassages(c){return c.passages.map(p=>({...p,blockedWord:blockedPassage(c,p),readers:c.students.filter(s=>s.progress.stories[p.id]).length}))}
function studentPassages(c){return teacherPassages(c).filter(p=>p.shown&&!p.blockedWord).map(p=>({...p,questions:p.questions.map(q=>({q:q.q,a:q.a.split('|').map(x=>x.trim()).filter(Boolean),w:q.w.split(',').map(x=>x.trim()).filter(Boolean)}))}))}
function records(c){return c.students.map(s=>({name:s.name,email:s.email,open:s.open,stars:Object.fromEntries(Object.entries(s.progress.lessons).map(([id,l])=>[id,l.s])),attempts:s.attempts.slice(-40),stories:Object.fromEntries(Object.entries(s.progress.stories).map(([id,st])=>[id,{...st,title:s.storyLog.find(r=>r.id===id)?.title||id,last:s.storyLog.filter(r=>r.id===id).at(-1)?.t||0}])),storyLog:s.storyLog.slice(-20),games:s.progress.games,keyErr:s.progress.keyErr,last:s.last||0,xp:s.progress.xp,level:level(s.progress.xp),avatar:s.profile.avatar||'bird',staff:false,status:s.status}))}
function dashboard(c){
  const all=records(c),students=all.filter(s=>!s.status),keys={};students.forEach(s=>Object.entries(s.keyErr).forEach(([k,n])=>keys[k]=(keys[k]||0)+n));
  return {id:c.id,className:c.name,sheetUrl:'preview:sheet',classLink:'preview:student?class='+c.id,classroom:'Sample Classroom · '+c.name,shared:true,synced:0,options:c.options,checked:c.checked,others:all.filter(s=>s.status).map(s=>({...s,status:'removed'})),blockedWords:c.blockedWords,passages:teacherPassages(c),reports:c.reports.slice(-15).reverse(),students,staff:[],classKeys:keys};
}
function award(c,s,r,kind){
  const p=s.progress,collection=kind==='story'?p.stories:p.lessons,prev=collection[r.id],stars=Math.max(1,Math.min(5,Number(r.stars)||1));
  let xp=4*stars+(!prev?.s?15:0)+(prev?.s&&stars>prev.s?5*(stars-prev.s):0);
  if(kind==='story')xp+=5*Math.max(0,r.right-(prev?.r||0))+(r.bonus&&!prev?.b?5:0);
  collection[r.id]={s:Math.max(prev?.s||0,stars),a:Math.max(prev?.a||0,r.acc),w:Math.max(prev?.w||0,r.wpm),n:(prev?.n||0)+1,...(kind==='story'?{r:Math.max(prev?.r||0,r.right),q:r.total,b:!!(prev?.b||r.bonus)}:{})};
  const t=Date.now();s.last=t;p.xp+=xp;if(!p.days.includes(day(t)))p.days.push(day(t));
  for(const pair of String(r.tricky||'').split(' ')){const at=pair.lastIndexOf(':');if(at>0){const k=pair.slice(0,at);p.keyErr[k]=(p.keyErr[k]||0)+(Number(pair.slice(at+1))||0)}}
  const entry={t,id:r.id,n:r.n,title:r.title,stars,acc:r.acc,wpm:r.wpm,sec:r.seconds,right:r.right,total:r.total};
  (kind==='story'?s.storyLog:s.attempts).push(entry);persist();return {ok:true,xp,totalXp:p.xp};
}
function api(fn,args){
  if(fn==='teacherHome')return {email:'teacher@example.test',ready:true,problems:[],autoSync:false,classes:state.classes.map(c=>({id:c.id,name:c.name,courseId:c.courseId})),courses:[...state.classes.map(c=>({id:c.courseId,name:c.name,classId:c.id})),{id:'new-sample',name:'New sample class'}]};
  if(fn==='startFromClassroom'){
    const existing=state.classes.find(c=>c.courseId===args[0]);if(existing)return {id:existing.id,name:existing.name};
    const lang=args[2]==='fr'?'fr':'en',id='sample-'+Date.now().toString(36),c=seedClass(id,lang,lang==='fr'?'Nouvelle classe exemple':'New sample class');c.courseId=args[0];state.classes.push(c);persist();return {id,name:c.name,courseId:c.courseId,added:c.students.length,posted:false,autoSync:false};
  }
  if(['postToClassroom','syncNow','attachClass','linkClassroom','usageReport'].includes(fn))throw Error('Available after Apps Script deployment. This preview has no Google connection.');
  const c=currentClass(args[0]),s=currentStudent(c),r=args[1];
  if(fn==='getDashboard'){context.classId=c.id;syncControls();return dashboard(c)}
  if(fn==='whoAmI'){
    if(s.status)return {className:c.name,email:s.email,linked:true,removed:true};
    return {className:c.name,name:s.name,progress:s.progress,profile:s.profile,options:c.options,blocked:blocked(c).map(hash),passages:studentPassages(c),allOpen:s.open,staff:false};
  }
  if(fn==='getLeaderboard'){
    const monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
    const list=records(c).filter(s=>!s.status).map(s=>({name:s.name,xp:s.xp,level:s.level,avatar:s.avatar}));
    const sort=a=>a.sort((a,b)=>b.xp-a.xp||a.name.localeCompare(b.name));
    return {all:sort(list),week:sort(list.map(row=>{const st=c.students.find(s=>s.name===row.name);return {...row,xp:st.weekXp??Math.round(row.xp*.6)}})),me:s.name,off:c.options.Leaderboard==='Off'};
  }
  if(fn==='saveProfile'){s.profile=clone(r);persist();return {ok:true}}
  if(fn==='saveLesson'||fn==='saveStory')return award(c,s,r,fn==='saveStory'?'story':'lesson');
  if(fn==='saveGame'){
    const p=s.progress,g=r.game;let xp=0;
    if(g.startsWith('Secret: ')){const id=g.slice(8);if(!p.eggs.includes(id)){p.eggs.push(id);xp=10}}
    else if(g==='Story Adventure'){xp=p.endings.includes(r.detail)?5:15;if(!p.endings.includes(r.detail))p.endings.push(r.detail)}
    else{xp=g==='Key Racer'?Math.min(25,Math.round(r.score/2)):Math.min(25,Math.round(r.score/(g.startsWith('Word Rain')?2:3)));p.games[g]=Math.max(p.games[g]||0,r.score)}
    p.xp+=xp;s.last=Date.now();persist();return {ok:true,xp,totalXp:p.xp};
  }
  if(fn==='setClassOption'){c.options[r]=String(args[2]);c.lang=c.options.Language==='Français'?'fr':'en';persist();return c.options}
  if(fn==='setAllOpen'){const target=c.students.find(s=>s.name===r);if(target)target.open=!!args[2];persist();return {ok:true}}
  if(fn==='removeStudent'||fn==='restoreStudent'){const target=c.students.find(s=>s.name===r);if(target)target.status=fn==='removeStudent'?'removed':'';persist();return {ok:true}}
  if(fn==='setBlockedWords'){c.blockedWords=String(r).split(/[,\n]+/).map(s=>s.trim().toLowerCase()).filter(Boolean).join(', ');persist();return c.blockedWords}
  if(fn==='reportText'){c.reports.push({t:Date.now(),name:s.name,where:r.where,text:r.text});persist();return {ok:true}}
  if(fn==='clearReports'){c.reports=[];persist();return {ok:true}}
  if(fn==='savePassage'){
    const title=String(r.title||'').trim().slice(0,60),text=String(r.text||'').trim();
    if(!title)throw Error('Give the passage a title.');if(text.length<40)throw Error('The passage is too short. Use at least a couple of sentences.');if(text.length>1500)throw Error('The passage is too long. Keep it under 1500 characters.');
    const questions=(r.questions||[]).filter(q=>q.q||q.a||q.w).map(q=>({q:String(q.q).trim(),a:String(q.a).trim(),w:String(q.w).trim()}));
    questions.forEach((q,i)=>{if(!q.q||!q.a)throw Error('Question '+(i+1)+' needs a question and an answer.')});
    const prev=c.passages.find(p=>p.id===r.id),p={id:r.id||'t-'+Math.random().toString(36).slice(2,8),title,text,questions,shown:prev?.shown??true,readers:0,blockedWord:''};
    const bad=blockedPassage(c,p);if(bad)throw Error('This passage has a blocked word: '+bad);
    c.passages=c.passages.filter(x=>x.id!==p.id).concat(p);persist();return teacherPassages(c);
  }
  if(fn==='deletePassage'){c.passages=c.passages.filter(p=>p.id!==r);persist();return teacherPassages(c)}
  if(fn==='setPassageShown'){const p=c.passages.find(p=>p.id===r);if(p)p.shown=!!args[2];persist();return teacherPassages(c)}
  throw Error('Unsupported preview action: '+fn);
}
function syncControls(){
  $('student').setAttribute('aria-pressed',context.role==='student');$('teacher').setAttribute('aria-pressed',context.role==='teacher');$('language').value=context.lang;
  $('learnerLabel').hidden=context.role!=='student';
  const picker=$('learner');picker.replaceChildren();currentClass().students.filter(s=>!s.status).forEach(s=>{const option=new Option(s.id==='s0'?s.name+' (new learner)':s.name,s.id);picker.add(option)});
  if(![...picker.options].some(o=>o.value===context.studentId))context.studentId=picker.options[0]?.value||'s0';picker.value=context.studentId;
}
function render(){
  syncControls();const isTeacher=context.role==='teacher';
  if(isTeacher){try{localStorage.setItem('tt-class',context.classId)}catch(e){}}
  const language=isTeacher?context.lang:currentClass().lang;
  const key=(isTeacher?'Teacher':'Student')+(language==='fr'?'_fr':'');
  const teacherUrl='preview:teacher?lang='+context.lang;
  let html=PAGES[key].replaceAll('<?= classId ?>',context.classId).replaceAll('<?= teacherUrl ?>',teacherUrl).replaceAll('<?= lang ?>',language);
  if (!isTeacher && new URLSearchParams(location.search).get('lesson') !== 'all') {
    html=html.replace('id="cfg"', 'id="cfg" data-preview-lesson="1"');
  }
  html=html.replace('Saved for your teacher','Saved in this preview').replace('Enregistré pour ton enseignant','Enregistré dans cet aperçu');
  html=html.replace('<head>','<head><script>'+ADAPTER+'</scr'+'ipt>');
  $('app').srcdoc=html;
}
function navigate(href){
  const target=href.slice(8).split('?')[0],p=new URLSearchParams(href.split('?')[1]||'');
  if(target==='sheet'){
    $('sheetRows').replaceChildren();currentClass().students.forEach(s=>s.attempts.slice(-10).forEach(a=>{const tr=document.createElement('tr');for(const value of [s.name,a.title,a.stars,a.acc+'%',a.wpm,new Date(a.t).toLocaleString()]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('sheetRows').append(tr)}));$('sheet').showModal();return;
  }
  if(target==='student'||target==='teacher')context.role=target;
  if(p.get('lang'))context.lang=p.get('lang')==='fr'?'fr':'en';
  if(p.get('class')&&state.classes.some(c=>c.id===p.get('class')))context.classId=p.get('class');
  render();
}
window.TypingPreview={call:api,navigate,message,error:msg=>{console.error('Typing Trail:',msg);message('Preview error: '+msg)}};
$('student').onclick=()=>{context.role='student';render()};$('teacher').onclick=()=>{context.role='teacher';render()};
$('language').onchange=e=>{context.lang=e.target.value;context.classId=state.classes.find(c=>c.lang===context.lang)?.id||state.classes[0].id;render()};
$('learner').onchange=e=>{context.studentId=e.target.value;render()};
$('reset').onclick=()=>{if(confirm('Reset all sample classes, progress, and settings in this preview?')){state=initial();context.classId=context.lang==='fr'?'sample-fr':'sample-en';context.studentId='s0';persist();render();message('Preview reset.')}};
$('closeSheet').onclick=()=>$('sheet').close();
persist();render();
</script>
