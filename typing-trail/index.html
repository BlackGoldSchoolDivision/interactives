<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Trail — Preview</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px system-ui,sans-serif;background:#f5f2e9;color:#153d34}

.preview-bar label{display:flex;align-items:center;gap:6px;font-size:13px}.preview-bar .spacer{flex:1}.preview-note{margin:0;font-size:12px;color:#496559;line-height:1.4}
#app{display:block;border:0;width:100%;flex:1;min-height:0;background:#f3f7ff}body{height:100dvh;display:flex;flex-direction:column}header{flex:none}
#status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 18px;background:#17213e;color:white;border-radius:10px;z-index:100;box-shadow:0 5px 22px #0003;font-size:14px}
dialog{width:min(980px,94vw);max-height:88dvh;border:1px solid #b9c8e7;border-radius:14px;padding:24px;color:#17213e;background:#fff}dialog::backdrop{background:#10193099}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head h2{margin:0}.dialog-head button{font:inherit;padding:8px 14px;cursor:pointer}dialog p{color:#4b5878}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce3ef}.table-wrap{overflow:auto}button:focus-visible,select:focus-visible{outline:3px solid #c9a7ff;outline-offset:3px}
@media(max-width:900px){.preview-note{display:none}}
@media(max-width:660px){.preview-bar{gap:7px;padding:7px}.preview-brand{width:100%}.preview-bar .spacer{display:none}.preview-bar label{font-size:12px}.preview-bar button,.preview-bar select{padding:4px 6px;font-size:12px}}
</style>
</head>
<body>

  <div class="preview-bar">
    <span class="preview-brand">Typing Trail <small>Preview</small></span>
    <div class="role-group" aria-label="Preview view"><button id="student" aria-pressed="true">Student</button><button id="teacher" aria-pressed="false">Teacher</button></div>
    <label>Language <select id="language"><option value="en">English</option><option value="fr">Français</option></select></label>
    <label id="learnerLabel">Try as <select id="learner" aria-label="Sample student"></select></label>

  </div>
</header>
<iframe id="app" title="Typing Trail app preview" allow="autoplay; clipboard-write"></iframe>
<div id="status" role="status" hidden></div>
<dialog id="sheet"><div class="dialog-head"><h2>Preview class records</h2><button id="closeSheet">Close</button></div><p>These sample records are stored in this browser. In the deployed app, records live in a Google Sheet.</p><div class="table-wrap"><table><thead><tr><th>Student</th><th>Lesson</th><th>Stars</th><th>Accuracy</th><th>WPM</th><th>Time</th></tr></thead><tbody id="sheetRows"></tbody></table></div></dialog>
<script>

2.1rem,4.8vw,3.1rem)}\n:root[data-spacing=\"wide\"]{--letter:.12em;--word:.25em;--line-h:2}\n:root[data-still=\"1\"] *,:root[data-still=\"1\"] *::before,:root[data-still=\"1\"] *::after{animation:none!important;transition:none!important}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--read-font);-webkit-font-smoothing:antialiased}\n[hidden]{display:none!important}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\nh1,h2,h3{font-family:var(--font-ui);font-weight:600}\n.f-pinky{--kc:var(--pinky);--fs:var(--pinky-s)}.f-ring{--kc:var(--ring);--fs:var(--ring-s)}.f-middle{--kc:var(--middle);--fs:var(--middle-s)}\n.f-index{--kc:var(--index);--fs:var(--index-s)}.f-thumb{--kc:var(--thumb);--fs:var(--thumb-s)}\nkbd{display:inline-grid;place-items:center;min-width:1.75em;height:1.75em;padding:0 .45em;margin:0 .1em;border-radius:.45em;background:var(--kc,var(--surface-2));\n  color:var(--key-ink);box-shadow:inset 0 -3px 0 var(--key-edge);font-family:var(--read-font);font-weight:700;font-size:.95em;line-height:1;vertical-align:middle}\n.muted{color:var(--muted)}\n.small{font-size:.9rem;color:var(--muted)}\n\n/* header */\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1080px;margin:0 auto;padding:12px 20px}\n.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-ui);font-weight:700;font-size:1.35rem}\n.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-family:var(--read-font);font-size:1.45rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:transform .6s}\n.logo.spin{transform:rotate(720deg) scale(1.2)}\n.nav{display:flex;gap:4px;flex-wrap:wrap}\n.nav button{background:none;border:0;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:var(--font-ui);font-weight:600;color:var(--muted)}\n.nav button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}\n.top-actions{display:flex;gap:8px;align-items:center}\n.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;font-family:var(--font-ui)}\n.me-chip .av{font-size:1.5rem;line-height:1}\n.me-chip small{display:block;color:var(--muted);font-size:.75rem;font-weight:600}\n.icon-btn{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.15rem;cursor:pointer}\nmain{max-width:1080px;margin:0 auto;padding:0 20px 40px}\n\n/* buttons, cards, panels */\n.btn{font-family:var(--font-ui);font-weight:600;font-size:1.05rem;border:2px solid var(--line);border-radius:14px;padding:10px 18px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s}\n.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}\n.btn.small{padding:6px 12px;font-size:.92rem}.btn.big{font-size:1.2rem;padding:13px 24px}\n.btn[disabled]{opacity:.55;cursor:default}\n.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}\n.notice{background:var(--surface);border:2px dashed var(--line);padding:12px 16px;border-radius:16px;margin-bottom:16px}\n.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-family:var(--font-ui);font-weight:600;white-space:nowrap}\n\n/* sign in */\n.signin{max-width:560px;margin:36px auto;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:32px 28px;box-shadow:var(--shadow)}\n.signin h1{font-size:clamp(1.7rem,4vw,2.2rem);margin:0 0 6px}\n.signin p{margin:0;color:var(--muted);font-size:1.1rem}\n.signin input{display:block;width:100%;max-width:380px;margin:20px auto 16px;padding:12px 16px;font:700 1.8rem var(--read-font);text-align:center;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);color:var(--ink)}\n.signin input:focus{outline:none;border-color:var(--accent)}\n.err{color:var(--bad)!important;min-height:1.5em;margin-top:12px!important}\n#classLine{font-family:var(--font-ui);font-weight:600;color:var(--accent)!important;margin-bottom:6px!important}\n#classLine:empty{display:none}\n.err-details{margin-top:18px;text-align:left;color:var(--muted);font-size:.9rem}\n.err-details summary{cursor:pointer;text-align:center}\n.teacher-link{display:inline-block;margin-top:22px;color:var(--muted);font-size:.95rem}\n\n/* home */\n.hero{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:20px 24px;box-shadow:var(--shadow)}\n.buddy{position:relative;width:96px;height:96px;display:grid;place-items:center;border-radius:24px;background:var(--surface-2);font-size:3.4rem;line-height:1}\n.buddy .acc{position:absolute;top:-8px;right:-8px;font-size:1.6rem}\n.buddy.big{width:140px;height:140px;font-size:5.2rem}\n.hero h1{margin:0 0 4px;font-size:clamp(1.4rem,3vw,1.9rem)}\n.xpbar{height:14px;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden;margin:8px 0 4px;max-width:420px}\n.xpbar i{display:block;height:100%;background:var(--xp);border-radius:99px;transition:width .4s}\n.hero-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}\n.unit{margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}\n.unit>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px}\n.unit>summary::-webkit-details-marker{display:none}\n.unit .uicon{font-size:1.8rem}\n.unit .uname{font-family:var(--font-ui);font-weight:600;font-size:1.2rem}\n.unit .uprog{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;white-space:nowrap}\n.mini-bar{width:110px;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}\n.mini-bar i{display:block;height:100%;background:var(--accent-2)}\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px 16px}\n.card{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:0 3px 0 var(--line)}\n.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}\n.card.next{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}\n.card.secret{border-style:dashed;border-color:var(--star)}\n.card .num{font-size:.8rem;color:var(--muted);font-family:var(--font-ui);font-weight:600}\n.card.next .num{color:var(--accent)}\n.card .ctitle{font-family:var(--font-ui);font-weight:600;font-size:1.02rem}\n.stars{letter-spacing:1px;line-height:1;font-size:1rem}\n.s{color:var(--line)}.s.on{color:var(--star)}\n\n/* lesson */\n.lesson-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 10px}\n.lesson-name{display:flex;flex-direction:column;line-height:1.2;font-family:var(--font-ui)}\n.lesson-name small{color:var(--muted);font-weight:600;font-size:.85rem}\n.lesson-name b{font-size:1.2rem;font-weight:600}\n.progress{flex:1 1 140px;min-width:110px;height:16px;background:var(--surface-2);border:2px solid var(--line);border-radius:99px;overflow:hidden}\n.progress i{display:block;height:100%;width:0;background:var(--accent-2);border-radius:99px;transition:width .15s}\n.tip{margin:0 0 8px;text-a  1 : -1;\n      const anchor = keyboard.keyElement(home[side][0]).getBoundingClientRect();\n      const origin = { x: anchor.left + anchor.width / 2 - stage.left, y: anchor.top + anchor.height / 2 - stage.top };\n      const toKey = key => {\n        const target = keyboard.keyElement(key);\n        if (!target) return null;\n        const box = target.getBoundingClientRect();\n        return { x: sign * (box.left + box.width / 2 - stage.left - origin.x) / unit,\n          y: (box.top + box.height / 2 - stage.top - origin.y) / unit };\n      };\n      let goal = { x: 0, y: 0, angle: 0, digit: -1 };\n      let tapping = false;\n      for (const [i, finger] of [5, 4, 3, 2, 1].entries()) {\n        const id = side + finger;\n        const tap = pressed.get(id);\n        if (tap && tap.until \u003c= now) pressed.delete(id);\n        const live = tap && tap.until > now;\n        const key = live ? tap.key : approach.get(id);\n        if (!key || (tapping && !live)) continue;\n        const target = toKey(key);\n        if (!target) continue;\n        const hover = live ? 0.045 : 0.11;\n        goal = rigidPose(i, { x: key === ' ' ? contactPoints[4].x : target.x, y: target.y + hover });\n        tapping = !!live;\n      }\n      const old = motions.get(side) || goal;\n      const rate = tapping ? 1 : step;\n      const pose = { x: lerp(old.x, goal.x, rate), y: lerp(old.y, goal.y, rate),\n        angle: lerp(old.angle, goal.angle, rate), digit: goal.digit };\n      motions.set(side, pose);\n\n      blend.clearRect(0, 0, stage.width, stage.height);\n      blend.save();\n      blend.translate(origin.x, origin.y);\n      blend.scale(sign * unit, unit);\n      blend.translate(wrist.x + pose.x, wrist.y + pose.y);\n      blend.rotate(pose.angle);\n      blend.translate(-wrist.x + restScale.biasX, -wrist.y + restScale.biasY);\n      blend.scale(-restScale.x / source.pitch, restScale.y / source.pitch);\n      blend.translate(-source.pinkyX, -source.topY);\n      blend.drawImage(sprites[pose.digit + 1], 0, 0, source.width, source.height);\n      blend.restore();\n\n      const wristEnd = Math.max(2, Math.min(stage.height - 1, origin.y + (4.36 + pose.y) * unit));\n      const fade = blend.createLinearGradient(0, Math.max(0, wristEnd - 1.11 * unit), 0, wristEnd);\n      fade.addColorStop(0, '#fff');\n      fade.addColorStop(1, 'rgba(255,255,255,0)');\n      blend.globalCompositeOperation = 'destination-in';\n      blend.fillStyle = fade;\n      blend.fillRect(0, 0, stage.width, stage.height);\n      blend.globalCompositeOperation = 'source-over';\n      ctx.drawImage(layer, 0, 0, stage.width, stage.height);\n      return tapping || Math.abs(pose.x - goal.x) + Math.abs(pose.y - goal.y) + Math.abs(pose.angle - goal.angle) > 0.004;\n    }\n\n    function draw(now) {\n      frame = 0;\n      if (canvas.hidden || !sprites) return;\n      const stage = canvas.getBoundingClientRect();\n      const a = keyboard.keyElement('a').getBoundingClientRect();\n      const s = keyboard.keyElement('s').getBoundingClientRect();\n      const unit = s.left - a.left;\n      if (!stage.width || !stage.height || unit \u003c 1) return;\n      const ratio = Math.min(devicePixelRatio || 1, 2);\n      const width = Math.round(stage.width * ratio), height = Math.round(stage.height * ratio);\n      if (canvas.width !== width || canvas.height !== height) {\n        canvas.width = layer.width = width;\n        canvas.height = layer.height = height;\n      }\n      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);\n      blend.setTransform(ratio, 0, 0, ratio, 0, 0);\n      ctx.clearRect(0, 0, stage.width, stage.height);\n      ctx.globalAlpha = document.documentElement.dataset.contrast === '1' ? 0.70 : 0.57;\n      const still = reduced.matches || document.documentElement.dataset.still === '1';\n      const elapsed = Math.min(now - last || 16, 42);\n      const step = still ? 1 : 1 - Math.exp(-elapsed / 35);\n      last = now;\n      const left = drawHand('L', stage, unit, now, step);\n      const right = drawHand('R', stage, unit, now, step);\n      ctx.globalAlpha = 1;\n      if (left || right) schedule();\n      else last = 0;\n    }\n\n    new ResizeObserver(schedule).observe(canvas.parentElement);\n    reduced.addEventListener('change', schedule);\n    if (!sprites) waiting.add(schedule);\n    return {\n      setActive(ids, keys = []) {\n        approach.clear();\n        if (keys.length === 1 && keys[0] === ' ') approach.set('R1', ' ');\n        else keys.forEach((key, i) => { if (ids[i]) approach.set(ids[i], key); });\n        canvas.dataset.finger = [...approach.keys()].join(' ');\n        canvas.dataset.key = keys.map(key => key === ' ' ? 'space' : key).join(' ');\n        schedule();\n      },\n      tap(key) {\n        for (const [id, destination] of approach) {\n          if (key === destination) pressed.set(id, { key, until: performance.now() + 105 });\n        }\n        schedule();\n      },\n      setVisible(visible) {\n        canvas.hidden = !visible;\n        if (visible) schedule();\n        else {\n          cancelAnimationFrame(frame);\n          frame = 0;\n          last = 0;\n          pressed.clear();\n          motions.clear();\n        }\n      },\n    };\n  };\n})();\n\u003c/script>\n\u003c/head>\n\u003cbody class=\"trail-redesign\">\n\u003cdiv id=\"cfg\" hidden data-class=\"\u003c?= classId ?>\" data-teacher=\"\u003c?= teacherUrl ?>\">\u003c/div>\n\u003cheader class=\"top\">\n  \u003cbutton class=\"brand\" id=\"brand\" aria-label=\"Typing Trail home\">\u003cspan class=\"trail-keymark\" id=\"logo\" aria-hidden=\"true\">\u003cspan>F\u003c/span>\u003cspan>J\u003c/span>\u003c/span>\u003cspan>Typing\u003cbr>Trail\u003c/span>\u003c/button>\n  \u003cnav class=\"nav\" id=\"nav\" hidden aria-label=\"Main\">\n    \u003cbutton data-go=\"home\">\u003cspan class=\"trail-icon\" aria-hidden=\"true\">menu_book\u003c/span>Lessons\u003c/button>\n    \u003cbutton data-go=\"corner\" id=\"navStories\">\u003cspan class=\"trail-icon\" aria-hidden=\"true\">book_2\u003c/span>Stories\u003c/button>\n    \u003cbutton data-go=\"games\">\u003cspan class=\"trail-icon\" aria-hidden=\"true\">sports_esports\u003c/span>Games\u003c/button>\n    \u003cbutton data-go=\"me\">\u003cspan class=\"trail-icon\" aria-hidden=\"true\">bar_chart\u003c/span>My progress\u003c/button>\n  \u003c/nav>\n  \u003cdiv class=\"top-actions\">\n    \u003cspan class=\"me-chip\" id=\"meChip\" hidden>\u003cspan class=\"av\" id=\"meAvatar\">\u003c/span>\u003cspan>\u003cb id=\"meName\">\u003c/b>\u003csmall id=\"meLevel\">\u003c/small>\u003c/span>\u003c/span>\n    \u003ca class=\"btn small\" id=\"dashLink\" target=\"_top\" hidden>← Teacher dashboard\u003c/a>\n    \u003cbutton class=\"btn small\" id=\"helpersBtn\" hidden>\u003cspan class=\"trail-icon\" aria-hidden=\"true\">settings\u003c/span>Helpers\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n  \u003csection id=\"signin\" class=\"view\">\n    \u003cdiv class=\"signin\">\n      \u003cp id=\"signinLoading\">Getting ready…\u003c/p>\n      \u003cdiv id=\"notListed\" hidden>\n        \u003cp id=\"classLine\">\u003c/p>\n        \u003ch1 id=\"nlTitle\">Checking Google Classroom…\u003c/h1>\n        \u003cp id=\"nlText\">If you just joined the Google Classroom class, this takes a few minutes. Keep this page open. It opens by itself.\u003c/p>\n        \u003cp class=\"small\" id=\"nlWho\">Signed in as \u003cb id=\"nlEmail\">\u003c/b>\u003c/p>\n        \u003cbutton class=\"btn\" id=\"nlRetry\" hidden>Try again\u003c/button>\n      \u003c/div>\n      \u003cdetails class=\"err-details\" id=\"errDetails\" hidden>\u003csummary>Details for teachers\u003c/summary>\u003cp id=\"errText\">\u003c/p>\u003c/details>\n      \u003ca class=\"teacher-link\" id=\"teacherLink\" target=\"_blank\" rel=\"noopener\" hidden>Teacher dashboard\u003c/a>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"home\" class=\"view\" hidden>\n    \u003cdiv class=\"notice\" id=\"touchNote\" hidden>⌨️ Typing Trail needs a real keyboard. Try it on a computer or Chromebook.\u003c/div>\n    \u003cheader class=\"trail-page-heading\">\u003ch1>Lessons\u003c/h1>\u003c/header>\n    \u003cdiv class=\"hero\">\n      \u003cdiv class=\"buddy\" id=\"heroBuddy\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv>\n        \u003ch1 id=\"heroTitle\">Welcome back!\u003c/h1>\n        \u003cdiv class=\"small\" id=\"heroLevel\">\u003c/div>\n        \u003cdiv class=\"xpbar\" aria-hidden=\"true\">\u003ci id=\"heroXp\">\u003c/i>\u003c/div>\n        \u003cdiv class=\"hero-stats\" id=\"heroStats\">\u003c/div>\n        \u003cp class=\"small teacher-note\" id=\"teacherNote\" hidden>👩‍🏫 Teacher practice: your results are saved, but you aren't in class totals or on the leaderboard.\u003c/p>\n      \u003c/div>\n      \u003cbutton class=\"btn primary big\" id=\"continueBtn\">Start\u003c/button>\n    \u003c/div>\n    \u003ch2 class=\"trail-section-heading\">Lesson trail\u003c/h2>\n    \u003cdiv id=\"trail\">\u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"lesson\" class=\"view\" hidden>\n    \u003cdiv class=\"trail-lesson-header\">\n      \u003cdiv>\u003csmall id=\"lNum\">\u003c/small>\u003ch1 id=\"lTitle\">\u003c/h1>\u003c/div>\n      \u003cdiv class=\"trail-metrics\">\n        \u003clabel id=\"lProgressLabel\">Lesson progress\u003c/label>\n        \u003cdiv class=\"trail-meter-row\">\n          \u003cdiv class=\"progress\" id=\"lProgress\" role=\"progressbar\" aria-labelledby=\"lProgressLabel\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\">\u003ci id=\"lProg\">\u003c/i>\u003c/div>\n          \u003cspan id=\"lPct\" aria-hidden=\"true\">0%\u003c/span>\n        \u003c/div>\n        \u003cspan id=\"lAcc\">\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"trail-studio\">\n      \u003ch2>Type the pattern\u003c/h2>\n      \u003cp class=\"tip\" id=\"lTip\">\u003c/p>\n      \u003cdiv class=\"text-panel\" id=\"lText\" tabindex=\"-1\" aria-label=\"Text to type\">\u003c/div>\n      \u003cdiv class=\"trail-hint-row\">\n        \u003cdiv class=\"hint-pill\" id=\"lHint\" aria-live=\"polite\">\u003c/div>\n        \u003cbutton class=\"say-btn trail-outline\" data-say=\"lhint\">\u003cspan class=\"trail-icon\" aria-hidden=\"true\">volume_up\u003c/span>Hear hint\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"trail-kb-top\">\n        \u003ch2>Keyboard\u003c/h2>\n        \u003cbutton type=\"button\" id=\"handGuide\" class=\"trail-guide-toggle\" role=\"switch\" aria-checked=\"true\" aria-controls=\"handsLesson\">\n          Hand guide\u003cspan class=\"trail-switch\" aria-hidden=\"true\">\u003c/span>\n        \u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"trail-kb-stage\">\n        \u003cdiv class=\"kb trail-keyboard\" id=\"kbLesson\" aria-hidden=\"true\">\u003c/div>\n        \u003ccanvas id=\"handsLesson\" class=\"trail-ghost-hands\" aria-hidden=\"true\">\u003c/canvas>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"trail-lesson-tools\">\n      \u003cspan id=\"lGoal\">\u003c/span>\n      \u003cbutton class=\"btn small\" id=\"reportBtn\">Report text\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"results\" class=\"view\" hidden>\n    \u003cdiv class=\"result-card\">\n      \u003cdiv class=\"big-stars\" id=\"rStars\" aria-hidden=\"true\">\u003c/div>\n      \u003ch2 id=\"rTitle\">\u003c/h2>\n      \u003cp class=\"muted\" id=\"rSub\">\u003c/p>\n      \u003cdiv class=\"xp-gain\" id=\"rXp\">\u003c/div>\n      \u003cdiv class=\"tiles\">\n        \u003cdiv class=\"tile\">\u003cb id=\"rAcc\">\u003c/b>\u003cspan>accuracy\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb id=\"rWpm\">\u003c/b>\u003cspan>words a minute\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb id=\"rTime\">\u003c/b>\u003cspan>time\u003c/span>\u003c/div>\n        \u003cdiv class=\"tile\">\u003cb id=\"rGoal\">\u003c/b>\u003cspan>speed goal\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003c  class=\"q-row\" id=\"qRow\">\u003cinput id=\"qInput\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" aria-label=\"Your answer\">\u003cbutton class=\"btn primary\" id=\"qGo\">Check\u003c/button>\u003c/div>\n        \u003cp class=\"q-feedback\" id=\"qFeedback\" aria-live=\"polite\">\u003c/p>\n        \u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"qNext\" hidden>Next question\u003c/button>\u003cbutton class=\"btn\" id=\"qSkip\" hidden>Skip the bonus\u003c/button>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"stDoneBox\" hidden>\n      \u003cdiv class=\"result-card\">\n        \u003cdiv class=\"big-stars\" id=\"sdStars\" aria-hidden=\"true\">\u003c/div>\n        \u003ch2 id=\"sdTitle\">\u003c/h2>\n        \u003cp class=\"muted\" id=\"sdSub\">\u003c/p>\n        \u003cdiv class=\"xp-gain\" id=\"sdXp\">\u003c/div>\n        \u003cdiv class=\"tiles\">\n          \u003cdiv class=\"tile\">\u003cb id=\"sdAcc\">\u003c/b>\u003cspan>accuracy\u003c/span>\u003c/div>\n          \u003cdiv class=\"tile\">\u003cb id=\"sdWpm\">\u003c/b>\u003cspan>words a minute\u003c/span>\u003c/div>\n          \u003cdiv class=\"tile\">\u003cb id=\"sdQs\">\u003c/b>\u003cspan>questions right\u003c/span>\u003c/div>\n          \u003cdiv class=\"tile\">\u003cb id=\"sdBonus\">\u003c/b>\u003cspan>bonus\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"actions\">\n          \u003cbutton class=\"btn\" id=\"sdAgain\">Read it again\u003c/button>\n          \u003cbutton class=\"btn primary\" data-go=\"corner\">Pick another story\u003c/button>\n          \u003cbutton class=\"btn\" id=\"sdGame\" hidden>🎟️ Play a game\u003c/button>\n        \u003c/div>\n        \u003cp class=\"small\" id=\"sdSaved\" aria-live=\"polite\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"games\" class=\"view\" hidden>\n    \u003cheader class=\"trail-page-heading\">\u003ch1>Games\u003c/h1>\u003c/hea \"view\" hidden>\n    \u003cheader class=\"trail-page-heading\">\u003ch1>Class leaderboard\u003c/h1>\u003c/header>\n    \u003cnav class=\"trail-progress-tabs\" aria-label=\"My progress\">\n      \u003cbutton class=\"btn small\" data-go=\"me\">My progress\u003c/button>\n      \u003cbutton class=\"btn small\" data-go=\"stickers\">Stickers\u003c/button>\n      \u003cbutton class=\"btn small\" data-go=\"board\">Class leaderboard\u003c/button>\n    \u003c/nav>\n    \u003cdiv class=\"tabs\">\u003cbutton class=\"btn small on\" data-board=\"week\">This week\u003c/button>\u003cbutton class=\"btn small\" data-board=\"all\">All time\u003c/button>\u003c/div>\n    \u003cdiv class=\"panel\">\u003col class=\"board\" id=\"boardList\">\u003c/ol>\u003c/div>\n    \u003cp class=\"small\">XP comes from lessons, games and secrets. Practise a little every day to climb the board.\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"me\" class=\"view\" hidden>\n    \u003cheader class=\"trail-page-heading\">\u003ch1>My progress\u003c/h1>\u003c/header>\n    \u003cnav class=\"trail-progress-tabs\" aria-label=\"My progress\">\n      \u003cbutton class=\"btn small\" data-go=\"me\">My progress\u003c/button>\n      \u003cbutton class=\"btn small\" data-go=\"stickers\">Stickers\u003c/button>\n      \u003cbutton class=\"btn small\" data-go=\"board\">Class leaderboard\u003c/button>\n    \u003c/nav>\n    \u003cdiv class=\"trail-progress-summary\" id=\"progressStats\">\u003c/div>\n    \u003cdiv class=\"me-grid\">\n      \u003cdiv class=\"panel\">\n        \u003ch2>My typing buddy\u003c/h2>\n        \u003cdiv style=\"display:flex;gap:16px;align-items:center;margin-bottom:12px\">\u003cdiv class=\"buddy big\" id=\"meBuddy\">\u003c/div>\u003cdiv id=\"meBuddyText\" class=\"muted\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"choose\" id=\"buddyPick\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"panel\">\n        \u003ch2>Colour theme\u003c/h2>\n        \u003cdiv class=\"choose\" id=\"themePic but it can still run fast and even jump over a fence.'],\n  ['Northern lights', 'On some clear winter nights, the sky glows green and pink. These northern lights happen when tiny bits from the sun crash into the air high above Earth.'],\n  ['Dinosaurs', 'Long ago, dinosaurs roamed the land that is now Alberta. Today, people visit the Royal Tyrrell Museum in Drumheller to see huge skeletons dug out of the badlands.'],\n  ['Honeybees', 'A honeybee that finds good flowers does a little dance back at the hive. The dance tells the other bees which way to fly and how far to go.'],\n  ['Canada geese', 'In the fall, Canada geese fly south in a V shape. Flying this way saves energy, and the birds take turns leading at the front.'],\n  ['The moon', 'The moon has no wind or rain, so footprints left by astronauts can stay there for a very long time. Daytime on the moon lasts about two weeks.'],\n  ['Maple syrup', 'It takes about 40 litres of maple sap to make just 1 litre of maple syrup. Farmers boil the sap for hours until it turns thick and sweet.'],\n  ['Basketball', 'Basketball was invented in 1891 by James Naismith, a teacher who was born in Ontario. The first hoops were peach baskets, so someone had to climb up to get the ball out!'],\n  ['Wildlife bridges', 'In Banff National Park, animals can cross the highway on bridges covered with trees and grass. Bears, elk, and wolves use these crossings to stay safe from cars.'],\n  ['Strong passwords', 'A strong password is long and hard to guess. Never share it with friends, and always sign out when you finish on a shared computer.'],\n  ['Kind words', 'Before you post or send a message, ask yourself: is it true, is it kind, and is it needed? Words on a screen can hurt or help, just like words out loud.'],\n  ['Octopus', 'An octopus has three hearts and blue blood. It can change colour in a blink to hide from danger.'],\n  ['The Rockies', 'The Rocky Mountains stretch all the way from Canada to New Mexico. Some peaks are so high );\nconst TRAIL = LESSONS.filter(l => l.kind !== 'secret');\n\n/* ---------- keeping text kid-safe ----------\n   Blocked words are stored only as hashes, so no offensive word is ever sent to a student's browser.\n   Random letter groups are checked inside every word; real words are checked whole; and a colour word\n   may never sit right before an animal or person word. Teachers and the app owner can add words. */\nconst BLOCK = new Set(['dzx596','16yqbm2','1aphvlf','1f62yaj','1ry26ve','1c8m2wt','1dwjp2n','1c9yn3z','ykn8e7','s31e38','1mdh5y7','1npkzk5','1vkskck','1y9t1r4','l0zz4','1051mqh','1oydxjx','7w40km','14fkbtf','1f5j5w8','zwanhs','u74m7v','1fhzz46','1uixnp3','19o6l49','zk9ty6','1esczzy','vy81mf','1frp2cz','1wqvgzk','12ysipo','1ob5fz3','1tuoqs8','1bq7o9k','1pe98ze','14h9oi0','1mb5nmv','vi8muy','18f92hz','1binbgb','1aa0xqj','1g4wmwe','susqjs','10xihbf','z4446r','141oxyt','1q5twaw','1tagl0t','1doppeb','1fcbu2d','vm7u20','dn85c5','tg06pa','1iodgnt','1f69yy7','1j5if9c','y4jmfn','19mj789','1ogqgnx','6u4ocd','a1y2su','iaifv6','1v7p2w2','5kl94a','3cofki','1p1uv49','1wfnhou','1x6y0cl','1kkzf58','9epqb5','e4iz3o','10yzs8e','1ubmu64','f79hgw','oi776v','157bpup','5wga14','81q8rh','1ddoja5','6ichpm','15fvo3p','1gepina','yy78ri','1jpkpg0','11sx6ip','vy4ozg','1gzjdas','1roh10m','1kp0e4d','ysn4c2','1afm2y0','qgxj9a','u1wi4w','aawr7v','ccykyw','1jzxp0l','3ky68g','17vwwqx','12h40ld','1plbjs8']);\nfunction fnv(s) { let h = 0x811c9dc5; for (let i = 0; i \u003c s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }\nfunction addBlocked(list) { (list || []).forEach(h => BLOCK.add(String(h))); }\nfunction blocked(tok, inside) {\n  tok = String(tok).toLowerCase();\n  if (!inside) return BLOCK.has(fnv(tok));\n  for (let i = 0; i \u003c tok.length; i++) for (let j = i + 2; j \u003c= tok.length && j - i \u003c= 12; j++) if (BLOCK.has(fnv(tok.slice(i, j)))) return true;\n  return false;\n}\nconst COLOURS = new Set(['black', 'brown', 'yellow', 'white', 'red', 'pink', 'green', 'blue', 'gold', 'silver']);\nconst BEINGS = new Set(('cat cow dog fox frog pig pup puppy kitty kitten bunny rabbit horse lamb calf chicken moose bison beaver eagle owl zebra ' +\n  'tiger turtle fish duck seal mice mouse panda bug bat rat bear bee ape crow goose whale hen hens cub cubs wolf deer elk ' +\n  'kid kids man mom dad lad lads lass sister friend family she he boy girl').split(' '));\nconst RANDOM_KINDS = new Set(['new', 'review', 'tricky', 'numbers', 'anchor', 'travel']);\nlet WORD_SET = null;\nfunction textOK(t, random) {\n  if (!WORD_SET) WORD_SET = new Set(WORDS);\n  const toks = String(t).toLowerCase().split(/\\s+/).filter(Boolean);\n  for (let i = 0; i \u003c toks.length; i++) {\n    const w = toks[i].replace(/[^a-z0-9]/g, '');\n    if (w && blocked(w, random && !WORD_SET.has(w))) return false;\n    if (i && COLOURS.has(toks[i - 1].replace(/[^a-z]/g, '')) && BEINGS.has(w)) return false;\n  }\n  return true;\n}\nconst pick = a => a[Math.floor(Math.random() * a.length)];\nconst shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };\nconst lettersOf = set => [...set].filter(c => /[a-z;,./]/.test(c));\nconst wordsFor = (learned, focus) => WORDS.filter(w => !blocked(w, false) && [...w].every(c => learned.has(c)) && (!focus || [...w].some(c => focus.includes(c))));\nconst triple = c => (blocked(c.repeat(3), true) ? c.repeat(2) : c.repeat(3));\n\nfunction drillGroups(fresh, others, count) {\n  const g = [];\n  for (let tries = 0; g.length \u003c count && tries \u003c 500; tries++) {\n    const len = 3 + (Math.random() \u003c 0.4 ? 1 : 0);\n    let s = '';\n    for (let i = 0; i \u003c len; i++) s += (others.length && Math.random() \u003c 0.35) ? pick(others) : pick(fresh);\n    if (!blocked(s.replace(/[^a-z0-9]/g, ''), true)) g.push(s);\n  }\n  return g;\n}\n\n/** Makes the text for a lesson, re-rolling anything that fails the safety check. */\nfunction lessonText(L, trickyKeys) {\n  for (let i = 0; i \u003c 40; i++) {\n    const t = makeText(L, trickyKeys);\n    if (t && textOK(t, RANDOM_KINDS.has(L.kind))) return t;\n  }\n  return 'asdf jkl; asdf jkl;';\n}\nfunction makeText(L, trickyKeys) {\n  const learned = L.learned;\n  const letters = lettersOf(learned);\n  switch (L.kind) {\n    case 'new': {\n      const fresh = [...L.arg], others = letters.filter(c => !fresh.includes(c));\n      const g = fresh.map(triple).concat([fresh.join(''), fresh.slice().reverse().join('')], drillGroups(fresh, others, 8));\n      const ws = shuffle(wordsFor(learned, fresh)).slice(0, 3);\n      return g.slice(0, 12 - ws.length).concat(ws).join(' ');\n    }\n    case 'review': {\n      const set = [...L.arg];\n      const ws = shuffle(wordsFor(learned, set)).slice(0, 4);\n      return drillGroups(set, [], 9 - ws.length).concat(ws).join(' ');\n    }\n    case 'anchor': case 'travel':\n      return shuffle(L.arg.concat(L.arg)).slice(0, 12).join(' ');\n    case 'words':\n      return shuffle(wordsFor(learned, L.arg)).slice(0, 12).join(' ');\n    case 'phrases':\n      return shuffle(PHRASES[L.unit].filter(p => [...p].every(c => learned.has(c)))).slice(0, 4).join(' ');\n    case 'sentences':\n      return shuffle(SENTENCES).slice(0, 3).join(' ');\n    case 'speed': {\n      const p = pick(SPEED[L.arg]);\n      return [p, p, p].join(' ');\n    }\n    case 'check':\n      if (L.arg === 'home' || L.arg === 'top') return shuffle(wordsFor(learned)).slice(0, 16).join(' ');\n      if (L.arg === 'bottom') return shuffle(SENTENCES).slice(0, 4).join(' ');\n      if (L.arg === 'shift') return shuffle([].concat(CAP_SENTENCES, PUNCT['?'], PUNCT['!'], PUNCT[\"'\"])).slice(0, 4).join(' ');\n      if (L.arg === 'numbers') return shuffle([].concat(NUM_LINES, TIME_LINES, SYMBOL_LINES)).slice(0, 4).join(' ');\n      return shuffle(PASSAGES).slice(0, 2).map(p => p[1]).join(' ');\n    case 'tricky': {\n      const keys = (trickyKeys || []).filter(k => learned.has(k) && /[a-z0-9;,./]/.test(k)).slice(0, 4);\n      const focus = keys.length ? keys : shuffle(letters).slice(0, 4);\n      const home = [...'asdfjkl'];\n      const g = focus.map(triple).concat(drillGroups(focus, home, 6));\n      const ws = shuffle(wordsFor(learned, focus.join(''))).slice(0, 4);\n      return g.concat(ws).join(' ');\n    }\n    case 'caps': {\n      const cap = c => c.toUpperCase() + c;\n      if (L.arg === 'left') return [...'jklhuiopnm'].slice(0, 5).map(cap).concat(shuffle(CAP_NAMES_LEFT_SHIFT).slice(0, 7)).join(' ');\n      if (L.arg === 'right') return [...'asdfgqwert'].slice(0, 5).map(cap).concat(shuffle(CAP_NAMES_RIGHT_SHIFT).slice(0, 7)).join(' ');\n      return shuffle(CAP_NAMES_LEFT_SHIFT.concat(CAP_NAMES_RIGHT_SHIFT)).slice(0, 12).join(' ');\n    }\n    case 'punct':\n      return shuffle(PUNCT[L.arg]).slice(0, 3).join(' ');\n    case 'numbers': {\n      const fresh = [...L.arg];\n      const g = fresh.map(triple).concat(drillGroups(fresh, [], 6));\n      const line = fresh.length === 10 ? pick(NUM_LINES)\n        : NUM_LINES.find(s => { const d = s.match(/[0-9]/g) || []; return d.length && d.every(c => fresh.includes(c)); });\n      return g.join(' ') + (line ? ' ' + line : '');\n    }\n    case 'static':\n      return shuffle(L.arg).slice(0, 3).join(' ');\n    case 'passage':\n      return PASSAGES[L.arg][1];\n    case 'secret':\n      return SECRET_TEXT;\n  }\n  return 'asdf jkl;';\n}\n\n/* ---------- stories for Story Adventure (original) ---------- */\nconst STORIES = [\n  {\n    id: 'kite', title: 'The Runaway Kite', icon: '🪁', start: 'a',\n    nodes: {\n      a: { say: 'A warm chinook wind rushes over the prairie. Your new kite tugs hard, the string slips, and away it flies!',\n        type: 'grab the string and run after the kite', choices: [['hill', 'Climb the hill to look around', 'b'], ['creek', 'Follow the creek where it flew', 'c']] },\n      b: { say: 'From the top of the hill you spot your kite stuck in a tall poplar tree beside a farmhouse.',\n        type: 'wave to the farmer and ask for help', choices: [['ladder', 'Borrow a ladder', 'd'], ['wait', 'Wait for the wind to change', 'e']] },\n      c: { say: 'Along the creek, a family of ducks paddles past. Something red flutters in the reeds.',\n        type: 'tiptoe through the reeds very quietly', choices: [['reeds', 'Reach into the reeds', 'f'], ['bridge', 'Cross the little bridge', 'g']] },\n      d: { say: 'The farmer holds the ladder steady while you climb.', type: 'climb up and free the kite',\n        end: ['rescue', 'Kite rescued!', 'You fly your kite all afternoon while the farmer cheers.'] },\n      e: { say: 'The wind swings around and the kite floats down... right onto a sleepy moose!', type: 'say hello to the moose very softly',\n        end: ['moose', 'The moose ending!', 'The moose sniffs your kite, sneezes, and trots away. Nobody will believe this.'] },\n      f: { say: 'It is not your kite. It is a lost red mitten.', type: 'hang the mitten on the fence for its owner',\n        end: ['mitten', 'The kind ending', 'You help someone you will never meet. Your kite can wait for tomorrow.'] },\n      g: { say: 'On the far side, your kite is tangled in a fence. A gopher pops up to watch.', type: 'untangle the string one knot at a time',\n        end: ['gopher', 'The gopher ending', 'Knot by knot, the kite comes free. The gopher whistles as you run home.'] },\n    },\n  },\n  {\n    id: 'moon', title: 'Moon Base Mix-up', icon: '🌙', start: 'a',\n    nodes: {\n      a: { say: 'You are the newest helper on Moon Base Maple. An alarm beeps: the snack robot has rolled away!',\n        type: 'put on your helmet and check the map', choices: [['tracks', 'Follow the wheel tracks', 'b'], ['radio', 'Call the base on the radio', 'c']] },\n      b: { say: 'The tracks lead to a deep crater. Something blinks at the bottom.', type: 'tie the rope and climb down slowly',\n        choices: [['light', 'Shine your light on the blink', 'd'], ['cave', 'Peek into the cave', 'e']] },\n      c: { say: 'The commander answers: the robot loves music. Maybe it rolled to the music room?', type: 'float down the hall to the music room',\n        choices: [['drum', 'Play the drum', 'f'], ['hum', 'Hum a tune', 'g']] },\n      d: { say: 'The blinking light is the robot! One wheel is stuck in moon dust.', type: 'give the robot a gentle push',\n        end: ['found', 'Mission complete!', 'The robot zooms home, and everyone gets a snack.'] },\n      e: { say: 'Inside the cave, moon rocks sparkle like stars.', type: 'pack three moon rocks for the scientists',\n        end: ['rocks', 'The science ending', 'The scientists cheer. Later the robot rolls in, covered in dust, as if nothing happened.'] },\n      f: { say: 'Boom, boom, boom! The room shakes a little.', type: 'play the drum loud and proud',\n        end: ['party', 'The party ending', 'The robot dances out from behind a speaker, handing out snacks.'] },\n      g: { say: 'Your humming echoes down the hall. Something hums back.', type: 'follow the humming to the snack closet',\n        end: ['closet', 'The silly ending', 'The robot was hiding in the snack closet the whole time.'] },\n    },\n  },\n];\nconst STORY_ENDINGS = STORIES.reduce((n, s) => n + Object.values(s.nodes).filter(x => x.end).length, 0);\n\n/* =====================================================================\n   STORY CORNER CONTENT — classics (public domain, adapted) and originals\n   Each question: q, a (accepted answers), and optional w (wrong choices -> multiple choice).\n   ===================================================================== */\nconst CLASSICS = [\n  { id: 'c-hare', icon: '🐢', title: 'The Tortoise and the Hare', source: 'Adapted from Aesop',\n    text: 'A hare loved to tell everyone how fast he could run. One day a tortoise said, \"Let\\'s have a race.\" The hare laughed, but he said yes. ' +\n      'The hare ran far ahead, so he lay down for a nap under a tree. The tortoise kept going, slow and steady, step after step. ' +\n      'When the hare woke up, the tortoise was already crossing the finish line. Slow and steady wins the race.',\n    questions: [\n      { q: 'Who won the race?', a: ['tortoise'] },\n      { q: 'Why did the hare lose?', a: ['He took a nap'], w: ['He got lost', 'He hurt his leg'] },\n      { q: 'Finish the saying: Slow and steady wins the ____.', a: ['race'] },\n    ] },\n  { id: 'c-lion', icon: '🦁', title: 'The Lion and the Mouse', source: 'Adapted from Aesop',\n    text: 'A lion was sleeping in the sun when a little mouse ran across his nose. The lion woke up and caught the mouse in his big paw. ' +\n      '\"Please let me go,\" said the mouse. \"One day I will help you.\" The lion laughed at the idea, but he let the mouse go. ' +\n      'Later, the lion was caught in a hunter\\'s net. The mouse heard him roar and chewed through the ropes until the lion was free. ' +\n      'Little friends can be great friends.',\n    questions: [\n      { q: 'What did the mouse chew through?', a: ['ropes', 'rope', 'net'] },\n      { q: 'What did the lion do when he first caught the mouse?', a: ['He let it go'], w: ['He ate it', 'He ran away'] },\n      { q: 'Which animal was caught in the net?', a: ['lion'] },\n    ] },\n  { id: 'c-ant', icon: '🐜', title: 'The Ant and the Grasshopper', source: 'Adapted from Aesop',\n    text: 'All summer long, the grasshopper sang and played in the warm sun. The ant worked hard every day, carrying food to her nest. ' +\n      '\"Why work so hard?\" asked the grasshopper. \"Come and sing with me!\" \"I am saving food for the winter,\" said the ant. ' +\n      'When winter came, the fields were covered in snow, and the grasshopper had no food. The ant shared some of hers. ' +\n      '\"Next summer,\" said the grasshopper, \"I will help you work.\"',\n    questions: [\n      { q: 'Who worked hard all summer?', a: ['ant'] },\n      { q: 'What covered the fields in winter?', a: ['Snow'], w: ['Leaves', 'Water'] },\n      { q: 'What was the ant saving for the winter?', a: ['food'] },\n    ] },\n  { id: 'c-crow', icon: '🦊', title: 'The Fox and the Crow', source: 'Adapted from Aesop',\n    text: 'A crow found a piece of cheese and flew up to a branch to eat it. A fox saw her and wanted the cheese for himself. ' +\n      '\"What a beautiful bird you are,\" said the fox. \"I bet your voice is just as lovely. Will you sing for me?\" ' +\n      'The crow was so pleased that she opened her beak to sing. Down fell the cheese, right into the fox\\'s mouth. ' +\n      'Be careful when someone says nice things just to get what they want.',\n    questions: [\n      { q: 'What did the crow find?', a: ['cheese'] },\n      { q: 'Why did the fox say nice things?', a: ['He wanted the cheese'], w: ['He wanted a friend', 'He loved music'] },\n      { q: 'Where did the cheese land?', a: ['mouth', 'fox'] },\n    ] },\n  { id: 'c-peter', icon: '🐇', title: 'The Tale of Peter Rabbit', source: 'Adapted from Beatrix Potter (1902)',\n    text: 'Once upon a time there were four little rabbits, and their names were Flopsy, Mopsy, Cotton-tail, and Peter. ' +\n      'They lived with their mother in a sand-bank, under the root of a very big fir tree. ' +\n      'One morning their mother said, \"You may go into the fields or down the lane, but don\\'t go into Mr. McGregor\\'s garden.\" ' +\n      'Flopsy, Mopsy, and Cotton-tail went down the lane to gather blackberries. ' +\n      'But Peter, who was very naughty, ran straight away to Mr. McGregor\\'s garden!',\n    questions: [\n      { q: 'How many little rabbits were there?', a: ['four', '4'] },\n      { q: 'Where did Peter go?', a: ['Mr. McGregor\\'s garden'], w: ['Down the lane', 'Into the fields'] },\n      { q: 'What did Flopsy, Mopsy, and Cotton-tail gather?', a: ['blackberries', 'berries'] },\n    ] },\n  { id: 'c-elephant', icon: '🐘', title: 'The Elephant\\'s Child', source: 'Adapted from Rudyard Kipling, Just So Stories (1902)',\n    text: 'Long, long ago, the elephant had no trunk. He had only a short, bulgy nose, about as big as a boot. ' +\n      'He could wiggle it from side to side, but he could not pick up anything with it. ' +\n      'There was one young elephant who was full of questions. He asked about everything he saw, ' +\n      'and most of all he wanted to know what the crocodile had for dinner. ' +\n      'That question took him on a long trip to the great grey-green, greasy Limpopo River, and it changed his nose forever.',\n    questions: [\n      { q: 'What did the elephant have long ago, before he had a trunk?', a: ['nose', 'short nose', 'bulgy nose'] },\n      { q: 'What did the young elephant want to know?', a: ['What the crocodile had for dinner'], w: ['How to swim', 'Where the sun goes at night'] },\n      { q: 'What is the name of the river?', a: ['Limpopo', 'Limpopo River'] },\n    ] },\n  { id: 'c-shadow', icon: '🌗', title: 'My Shadow', source: 'Adapted from Robert Louis Stevenson, A Child\\'s Garden of Verses (1885)',\n    text: 'I have a little shadow that goes in and out with me, and what can be the use of him is more than I can see. ' +\n      'He is very, very like me from the heels up to the head; and I see him jump before me, when I jump into my bed. ' +\n      'The funniest thing about him is the way he likes to grow, not at all like proper children, which is always very slow; ' +\n      'for he sometimes shoots up taller like an india-rubber ball, and he sometimes gets so little that there\\'s none of him at all.',\n    questions: [\n      { q: 'What goes in and out with the child?', a: ['shadow'] },\n      { q: 'Where does the child jump?', a: ['bed', 'into bed', 'into my bed'] },\n      { q: 'The shadow sometimes shoots up taller like...', a: ['a rubber ball'], w: ['a tall tree', 'a giant'] },\n    ] },\n  { id: 'c-bed', icon: '🛏️', title: 'Bed in Summer', source: 'Adapted from Robert Louis Stevenson, A Child\\'s Garden of Verses (1885)',\n    text: 'In winter I get up at night and dress by yellow candle-light. In summer, quite the other way, I have to go to bed by day. ' +\n      'I have to go to bed and see the birds still hopping on the tree, or hear the grown-up people\\'s feet still going past me in the street. ' +\n      'And does it not seem hard to you, when all the sky is clear and blue, and I should like so much to play, to have to go to bed by day?',\n    questions: [\n      { q: 'In winter, the child gets dressed by ____-light.', a: ['candle', 'candlelight'] },\n      { q: 'When does the child go to bed in summer?', a: ['While it is still day'], w: ['Very late at night', 'Right after lunch'] },\n      { q: 'What does the child see hopping on the tree?', a: ['birds', 'bird'] },\n    ] },\n  { id: 'c-anne', icon: '🏡', title: 'Anne of Green Gables', source: 'Adapted from L. M. Montgomery (1908)',\n    text: 'Anne Shirley was an eleven-year-old girl with red hair and a big imagination. ' +\n      'She came to live with Marilla and Matthew at a farm called Green Gables on Prince Edward Island. ' +\n      'Anne loved to talk, and she loved to find out new things. ' +\n      '\"Isn\\'t it splendid to think of all the things there are to find out about?\" she said. \"It just makes me feel glad to be alive.\" ' +\n      'Anne had a hopeful way of looking at mistakes, too. \"Isn\\'t it nice to think that tomorrow is a new day with no mistakes in it yet?\" she asked.',\n    questions: [\n      { q: 'What was the name of the farm?', a: ['Green Gables'] },\n      { q: 'Where is Green Gables?', a: ['Prince Edward Island'], w: ['Alberta', 'Ontario'] },\n      { q: 'Finish Anne\\'s words: tomorrow is a new day with no ____ in it yet.', a: ['mistakes', 'mistake'] },\n    ] },\n];\n\nconst ORIGINALS = [\n  { id: 'o-gopher', icon: '🐿️', title: 'The Gopher Lookout', source: 'A Typing Trail story',\n    text: 'On the prairie, a family of gophers lived in tunnels under the grass. Every morning, Pip stood up tall on the dirt mound to keep watch. ' +\n      'One day a hawk circled high in the sky. Pip let out a loud, sharp whistle. In a flash, every gopher dove down into the tunnels. ' +\n      'The hawk flew away hungry, and Pip\\'s family was safe. That night, Pip\\'s grandma said, \"A good lookout keeps everyone safe.\"',\n    questions: [\n      { q: 'What did Pip do when he saw the hawk?', a: ['whistle', 'whistled'] },\n      { q: 'Where do the gophers live?', a: ['In tunnels under the grass'], w: ['In nests in the trees', 'In a cave by the river'] },\n      { q: 'Which bird circled in the sky?', a: ['hawk'] },\n    ] },\n  { id: 'o-snow', icon: '⛄', title: 'First Snow', source: 'A Typing Trail story',\n    text: 'Leo woke up and his room looked extra bright. He ran to the window. Overnight, the whole yard had turned white! ' +\n      'Snow covered the swings, the fence, and his dad\\'s truck. Leo pulled on his snow pants, his warm coat, and his mitts. ' +\n      'He made a snow angel, then he built a snowman with a carrot for a nose. ' +\n      'When he came inside, his cheeks were pink and a mug of hot chocolate was waiting for him.',\n    questions: [\n      { q: 'Why did Leo\\'s room look extra bright?', a: ['There was snow outside'], w: ['He had a new lamp', 'The moon was full'] },\n      { q: 'What did Leo use for the snowman\\'s nose?', a: ['carrot'] },\n      { q: 'What drink was waiting for Leo?', a: ['hot chocolate', 'chocolate', 'cocoa'] },\n    ] },\n  { id: 'o-seed', icon: '🌱', title: 'The Seed That Waited', source: 'A Typing Trail story',\n    text: 'Ava planted a bean seed in a cup of soil and set it on the windowsill. Every day she gave it a little water. ' +\n      'For three days, nothing happened. \"Maybe it is broken,\" Ava said. ' +\n      'On the fourth day, a tiny green shoot pushed up through the soil. Its first two leaves opened toward the sunny window. ' +\n      'Ava learned that a seed needs water, soil, light, and a little bit of patience.',\n    questions: [\n      { q: 'What kind of seed did Ava plant?', a: ['bean'] },\n      { q: 'On which day did the shoot come up?', a: ['The fourth day'], w: ['The first day', 'The tenth day'] },\n      { q: 'Name one thing a seed needs to grow.', a: ['water', 'soil', 'light', 'sun', 'sunlight', 'patience', 'dirt'] },\n    ] },\n  { id: 'o-moose', icon: '🫎', title: 'Moose at the Pond', source: 'A Typing Trail story',\n    text: 'Early one summer morning, Grandpa and Nora sat very still beside the pond. Mist floated over the water like a soft blanket. ' +\n      'Then, without a sound, a moose stepped out of the trees. She was taller than Grandpa\\'s truck! A wobbly calf followed close behind her. ' +\n      'The moose waded into the pond and dipped her head under the water to eat plants. Nora held her breath and smiled. ' +\n      'Some of the best things happen when you are quiet.',\n    questions: [\n      { q: 'What is a baby moose called?', a: ['calf'] },\n      { q: 'What did the moose eat?', a: ['Plants under the water'], w: ['Fish from the pond', 'Apples from a tree'] },\n      { q: 'Who sat beside the pond with Nora?', a: ['Grandpa'] },\n    ] },\n  { id: 'o-fossil', icon: '🐚', title: 'The Fossil Hunter', source: 'A Typing Trail story',\n    text: 'Sam\\'s class took a trip to the badlands near Drumheller. The hills were striped in brown, tan, and grey, like the layers in a cake. ' +\n      '\"Each layer of rock took a very long time to form,\" said the guide. Sam looked down and saw a shape pressed into a flat stone. ' +\n      'It was a tiny shell! \"That is a fossil,\" said the guide. \"It is millions of years old.\" ' +\n      'Sam took a photo but left the fossil where it was, so the next visitor could find it too.',\n    questions: [\n      { q: 'What did Sam find pressed into the stone?', a: ['shell', 'fossil'] },\n      { q: 'What did the layers of rock look like?', a: ['The layers in a cake'], w: ['Waves in the sea', 'Steps on a ladder'] },\n      { q: 'What did Sam take instead of the fossil?', a: ['photo', 'picture', 'photograph'] },\n    ] },\n  { id: 'o-magnet', icon: '🧲', title: 'Magnet Magic', source: 'A Typing Trail story',\n    text: 'Mr. Lee gave each group a magnet and a box of small things. \"Guess which things the magnet will pick up,\" he said. ' +\n      'Zoe thought the magnet would pick up everything. She tried a paper clip. Click! It stuck. She tried a crayon. Nothing happened. ' +\n      'A pencil, an eraser, and a piece of foil did not stick either, but a nail did. ' +\n      'Zoe learned that magnets pull on some metals, like iron and steel, but not on everything.',\n    questions: [\n      { q: 'What was the first thing Zoe tried?', a: ['paper clip', 'paperclip', 'clip'] },\n      { q: 'Did the magnet pick up the crayon?', a: ['No'], w: ['Yes'] },\n      { q: 'Name a metal that a magnet pulls on.', a: ['iron', 'steel'] },\n    ] },\n  { id: 'o-mitten', icon: '🧤', title: 'The Lost Mitten', source: 'A Typing Trail story',\n    text: 'On the way home from school, Kai found a small purple mitten in the snow. It had a picture of a star on it. ' +\n      '\"Someone\\'s hand must be cold,\" Kai thought. The next morning, he took the mitten to the school office. ' +\n      'Mrs. Diaz put it in the lost and found box. At recess, a little girl named Ruby ran up to Kai. ' +\n      '\"You found my mitten!\" she said, holding up her warm hand. Kai felt warm too, right in the middle of his heart.',\n    questions: [\n      { q: 'What picture was on the mitten?', a: ['star'] },\n      { q: 'Where did Kai take the mitten?', a: ['The school office'], w: ['His house', 'The library'] },\n      { q: 'What was the girl\\'s name?', a: ['Ruby'] },\n    ] },\n  { id: 'o-sky', icon: '🌌', title: 'Lights Over the Farm', source: 'A Typing Trail story',\n    text: 'On a cold, clear night, Mia\\'s mom woke her up. \"Come outside and look,\" she whispered. ' +\n      'They wrapped up in blankets and stood on the porch. Above the barn, the sky was glowing with green ribbons of light. ' +\n      'The ribbons danced and swirled, and a little pink shimmered at the edges. ' +\n      '\"Those are the northern lights,\" said Mom. \"They happen when tiny bits from the sun hit the air high above Earth.\" ' +\n      'Mia watched until her toes were cold, then went back to bed with a head full of stars.',\n    questions: [\n      { q: 'What colour were the ribbons of light?', a: ['green'] },\n      { q: 'What are the lights called?', a: ['The northern lights'], w: ['Star lights', 'Moon beams'] },\n      { q: 'Where did Mia and her mom stand?', a: ['porch'] },\n    ] },\n];\n\n/* ---------- helpers shared by built-in and teacher passages ---------- */\n/** Turns any text into characters a student can type on a standard keyboard. */\nfunction typeable(s) {\n  return String(s || '')\n    .replace(/[‘’‚′`]/g, \"'\").replace(/[“”„″]/g, '\"')\n    .replace(/\\s*[–—−]\\s*/g, ' - ').replace(/…/g, '...')\n    .normalize('NFD').replace(/[̀-ͯ]/g, '')\n    .replace(/[\\r\\n\\t ]+/g, ' ').replace(/[^\\x20-\\x7e]/g, '')\n    .replace(/ {2,}/g, ' ').trim();\n}\n/** Whole words only: a story is hidden if any word is on the block lists. */\nfunction wordsOK(t) { return String(t || '').toLowerCase().split(/[^a-z0-9]+/).every(w => !w || !blocked(w, false)); }\nfunction storyOK(st) {\n  return wordsOK(st.title) && wordsOK(st.text) && st.questions.every(q => wordsOK(q.q) && q.a.every(wordsOK) && (q.w || []).every(wordsOK));\n}\n/** Splits a passage into parts of one or two sentences. */\nfunction chunkText(text, max = 110) {\n  const sentences = text.match(/[^.!?]+[.!?]+[\"')]*\\s*|[^.!?]+$/g) || [text];\n  const out = [];\n  let cur = '';\n  const push = s => { s = s.trim(); if (s) out.push(s); };\n  for (let s of sentences.map(x => x.trim()).filter(Boolean)) {\n    while (s.length > max * 1.5) {             // a very long sentence: break at a comma or space\n      let cut = s.lastIndexOf(', ', max);\n      if (cut \u003c max * 0.4) cut = s.lastIndexOf(' ', max);\n      if (cut \u003c 1) break;\n      if (cur) { push(cur); cur = ''; }\n      push(s.slice(0, cut + 1)); s = s.slice(cut + 1).trim();\n    }\n    if (cur && (cur + ' ' + s).length > max) { push(cur); cur = s; }\n    else cur = cur ? cur + ' ' + s : s;\n  }\n  push(cur);\n  return out;\n}\nconst normAnswer = s => typeable(s).toLowerCase().replace(/[^a-z0-9 ]+/g, '').replace(/\\s+/g, ' ').trim().replace(/^(the|a|an|my|his|her) /, '');\n/** Forgiving answer check for young typists: ignores capitals, punctuation, \"the\", and small endings like -s or -ed. */\nfunction answerMatches(input, accepted) {\n  const got = normAnswer(input);\n  if (!got || got.split(' ').length > 6) return false;\n  const words = got.split(' ');\n  const near = (w, a) => w === a || (a.length >= 4 && (w.startsWith(a) || a.startsWith(w)) && Math.abs(w.length - a.length) \u003c= 2);\n  return accepted.some(raw => {\n    const a = normAnswer(raw);\n    if (!a) return false;\n    if (got === a || (' ' + got + ' ').includes(' ' + a + ' ')) return true;\n    return !a.includes(' ') && words.some(w => near(w, a));\n  });\n}\nconst STOP = new Set(('about after again also because been before being could does down every from have here into just like more most much ' +\n  'only other over said some than that their them then there these they this those very were what when where which while will with would your ' +\n  'shall should upon once').split(' '));\n/** Builds a bonus round: type the missing word, or put three sentences back in order. */\nfunction makeBonus(text) {\n  const sentences = (text.match(/[^.!?]+[.!?]+[\"')]*/g) || []).map(s => s.trim()).filter(s => s.length > 12);\n  const kinds = [];\n  if (sentences.length >= 3) kinds.push('order');\n  const blanks = [];\n  sentences.forEach(s => (s.match(/[A-Za-z]{4,}/g) || []).forEach(w => {\n    if (!STOP.has(w.toLowerCase()) && w === w.toLowerCase() && !blocked(w, false)) blanks.push([s, w]);\n  }));\n  if (blanks.length) kinds.push('missing');\n  if (!kinds.length) return null;\n  if (pick(kinds) === 'missing') {\n    const [s, w] = pick(blanks);\n    return { kind: 'missing', prompt: s.replace(new RegExp('\\\\b' + w + '\\\\b'), '_____'), answer: w };\n  }\n  const start = Math.floor(Math.random() * (sentences.length - 2));\n  const three = sentences.slice(start, start + 3);\n  let order;\n  do { order = shuffle([0, 1, 2]); } while (order.join('') === '012');\n  const letters = 'abc';\n  return { kind: 'order', lines: order.map((i, k) => [letters[k], three[i]]), answer: [0, 1, 2].map(i => letters[order.indexOf(i)]).join('') };\n}\n\n/* ---------- Chromebook Helpers pack (ChromeOS accessibility features) ---------- */\nconst HELPER_STORIES = [\n  { id: 'h-speak', icon: '🗣️', title: 'Select-to-speak', source: 'Chromebook Helpers',\n    text: 'Your Chromebook can read words out loud to you. This helper is called Select-to-speak. First, turn it on in Settings, under Accessibility. ' +\n      'Then pick some words on the screen by clicking a word or dragging across a sentence. Press the Search key and the S key, and your Chromebook reads the words to you. ' +\n      'Listening while you read can help the words stick in your brain. Anyone can use it, any time.',\n    questions: [\n      { q: 'What is this helper called?', a: ['Select-to-speak', 'select to speak'] },\n      { q: 'Which keys do you press after you pick the words?', a: ['Search and S'], w: ['Ctrl and Z', 'Shift and A'] },\n      { q: 'Where do you turn it on? In Settings, under ____.', a: ['Accessibility'] },\n    ] },\n  { id: 'h-magnify', icon: '🔍', title: 'Magnifier', source: 'Chromebook Helpers',\n    text: 'Have you ever wished the whole screen could be bigger? Your Chromebook has a Magnifier. ' +\n      'The full-screen magnifier zooms in on everything, like looking through a magnifying glass. ' +\n      'The docked magnifier keeps a big view at the top of the screen, while the rest stays the same size. ' +\n      'You can find both in Settings, under Accessibility, in Display and magnification. Zoom in when the words feel tiny, and zoom out when you are done.',\n    questions: [\n      { q: 'What does the full-screen magnifier do?', a: ['Zooms in on everything'], w: ['Reads words out loud', 'Changes the colours'] },\n      { q: 'The docked magnifier keeps a big view at the ____ of the screen.', a: ['top'] },\n      { q: 'What is the magnifier like?', a: ['magnifying glass', 'a magnifying glass'] },\n    ] },\n  { id: 'h-dictate', icon: '🎤', title: 'Dictation', source: 'Chromebook Helpers',\n    text: 'Sometimes your ideas come faster than your fingers can type. Your Chromebook has a helper called Dictation that types what you say. ' +\n      'Turn it on in Settings, under Accessibility, in Keyboard and text input. Then click where you want to write, start Dictation, and speak clearly. ' +\n      'Watch your words appear on the screen! Typing is still a great skill to practise, and Dictation is one more way to get your ideas down.',\n    questions: [\n      { q: 'What does Dictation type?', a: ['what you say', 'what i say', 'your words', 'words you say', 'speech', 'talking'] },\n      { q: 'Where do you turn on Dictation?', a: ['Keyboard and text input'], w: ['Display and magnification', 'Cursor and touchpad'] },\n      { q: 'How should you speak when you use Dictation?', a: ['clearly', 'clear', 'slowly'] },\n    ] },\n  { id: 'h-sticky', icon: '🔑', title: 'Sticky Keys', source: 'Chromebook Helpers',\n    text: 'To make a capital letter, you hold Shift and press a letter at the same time. That can be tricky! ' +\n      'Sticky Keys is a helper that lets you press keys one at a time instead. Press Shift once, let go, and then press the letter. Your Chromebook remembers Shift for you. ' +\n      'Press Shift two times to keep it on, and a third time to turn it off. You can find Sticky Keys in Settings, under Accessibility, in Keyboard and text input.',\n    questions: [\n      { q: 'Which key do you hold to make a capital letter?', a: ['shift'] },\n      { q: 'What does Sticky Keys let you do?', a: ['Press keys one at a time'], w: ['Type with your voice', 'Make the screen bigger'] },\n      { q: 'Shift is kept on after two presses. Which press turns it off?', a: ['The third press'], w: ['The fifth press', 'The tenth press'] },\n    ] },\n  { id: 'h-cursor', icon: '🖱️', title: 'Big Cursor', source: 'Chromebook Helpers',\n    text: 'Is it hard to find the little arrow on the screen? That arrow is called the cursor, or mouse pointer. ' +\n      'Your Chromebook can make the cursor bigger and change its colour, so it is easy to spot. It can also put a ring around the cursor when it moves. ' +\n      'Look in Settings, under Accessibility, in Cursor and touchpad. Try a bigger cursor in a bright colour, and see how fast you find it!',\n    questions: [\n      { q: 'What is another name for the cursor?', a: ['mouse pointer', 'pointer', 'arrow'] },\n      { q: 'Where do you find the cursor helpers?', a: ['Cursor and touchpad'], w: ['Text-to-speech', 'Keyboard and text input'] },\n      { q: 'What can go around the cursor when it moves?', a: ['ring', 'circle'] },\n    ] },\n  { id: 'h-keyboard', icon: '⌨️', title: 'On-screen Keyboard', source: 'Chromebook Helpers',\n    text: 'Did you know your Chromebook can show a keyboard right on the screen? It is called the on-screen keyboard. ' +\n      'You can tap or click the keys instead of pressing the real ones. It is handy when a key is stuck, when you use a touch screen, ' +\n      'or when you just want to try a new way to type. Turn it on in Settings, under Accessibility, in Keyboard and text input.',\n    questions: [\n      { q: 'What is this helper called?', a: ['on-screen keyboard', 'on screen keyboard', 'onscreen keyboard'] },\n      { q: 'How do you use the on-screen keyboard?', a: ['Tap or click the keys'], w: ['Speak into a microphone', 'Shake the Chromebook'] },\n      { q: 'Name a time when the on-screen keyboard is handy.', a: ['stuck', 'touch screen', 'touch', 'new way'] },\n    ] },\n  { id: 'h-vox', icon: '🔊', title: 'ChromeVox', source: 'Chromebook Helpers',\n    text: 'ChromeVox is a screen reader. It reads out loud everything on the screen, like buttons, menus, and the words on a page. ' +\n      'It also tells you where you are as you move around with the keyboard. Many people use a screen reader every day, so they can use a computer without looking at the screen. ' +\n      'You can turn on ChromeVox in Settings, under Accessibility, in Text-to-speech. Try it with headphones, and listen to how much it can tell you!',\n    questions: [\n      { q: 'What kind of helper is ChromeVox?', a: ['A screen reader'], w: ['A magnifier', 'A drawing tool'] },\n      { q: 'What does ChromeVox read out loud?', a: ['everything on the screen', 'everything', 'the screen', 'buttons', 'menus', 'words'] },\n      { q: 'What should you wear when you try it?', a: ['headphones'] },\n    ] },\n  { id: 'h-colour', icon: '🎨', title: 'Colour Helpers', source: 'Chromebook Helpers',\n    text: 'Sometimes the screen is easier to read with different colours. Your Chromebook has colour helpers for that. ' +\n      'Colour inversion swaps the colours, so a white page turns dark and dark words turn light. ' +\n      'Colour correction changes the colours to make them easier to tell apart, and it can even make the whole screen grey. ' +\n      'You can find these in Settings, under Accessibility, in Display and magnification. Try them out and pick what feels best for your eyes.',\n    questions: [\n      { q: 'What does colour inversion do?', a: ['Swaps the colours'], w: ['Reads the page out loud', 'Makes the cursor bigger'] },\n      { q: 'With colour inversion, a white page turns ____.', a: ['dark', 'black'] },\n      { q: 'Finish the name of the section: Display and ____.', a: ['magnification'] },\n    ] },\n];\n\n/* ============
