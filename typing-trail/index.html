t aigu. En un éclair, tous les gophers ont plongé dans les tunnels. ' +\n      'Le faucon est reparti le ventre vide, et la famille de Pip était en sécurité. Ce soir-là, la grand-maman de Pip a dit : \"Un bon guetteur protège tout le monde.\"',\n    questions: [\n      { q: 'Qu\\'a fait Pip quand il a vu le faucon?', a: ['il a sifflé', 'sifflé', 'siffler', 'sifflement', 'un sifflement', 'il a sifflé fort'] },\n      { q: 'À quel endroit vivent les gophers?', a: ['Dans des tunnels sous l\\'herbe'], w: ['Dans des nids dans les arbres', 'Dans une grotte près de la rivière'] },\n      { q: 'Quel oiseau tournait dans le ciel?', a: ['faucon', 'un faucon', 'le faucon'] },\n    ] },\n  { id: 'o-snow', icon: '⛄', title: 'La première neige', source: 'Une histoire de Typing Trail',\n    text: 'Léo s\\'est réveillé et sa chambre semblait plus claire que d\\'habitude. Il a couru à la fenêtre. Pendant la nuit, toute la cour était devenue blanche! ' +\n      'La neige couvrait les balançoires, la clôture et le camion de son papa. Léo a enfilé son pantalon de neige, son manteau chaud et ses mitaines. ' +\n      'Il a fait un ange dans la neige, puis il a construit un bonhomme de neige avec une carotte pour le nez. ' +\n      'Quand il est rentré, il avait les joues roses, et une tasse de chocolat chaud l\\'attendait.',\n    questions: [\n      { q: 'Pourquoi la chambre de Léo semblait-elle plus claire?', a: ['Il avait neigé pendant la nuit'], w: ['Il avait une nouvelle lampe', 'C\\'était la pleine lune'] },\n      { q: 'Qu\\'est-ce que Léo a utilisé pour le nez du bonhomme de neige?', a: ['carotte', 'une carotte', 'la carotte'] },\n      { q: 'Quelle boisson attendait Léo?', a: ['chocolat chaud', 'du chocolat chaud', 'un chocolat chaud', 'le chocolat chaud', 'chocolat', 'cacao'] },\n    ] },\n  { id: 'o-seed', icon: '🌱', title: 'La graine qui attendait', source: 'Une histoire de Typing Trail',\n    text: 'Ava a planté une graine de haricot dans un verre rempli de terre et l\\'a posé sur le bord de la fenêtre. Chaque jour, elle lui donnait un peu d\\'eau. ' +\n      'Pendant trois jours, rien ne s\\'est passé. \"Elle est peut-être brisée\", a dit Ava. ' +\n      'Le quatrième jour, une toute petite pousse verte est sortie de la terre. Ses deux premières feuilles se sont ouvertes vers la fenêtre ensoleillée. ' +\n      'Ava a appris qu\\'une graine a besoin d\\'eau, de terre, de lumière et d\\'un peu de patience.',\n    questions: [\n      { q: 'Quelle sorte de graine Ava a-t-elle plantée?', a: ['haricot', 'un haricot', 'graine de haricot', 'une graine de haricot', 'fève', 'une fève'] },\n      { q: 'Quel jour la pousse est-elle sortie de la terre?', a: ['Le quatrième jour'], w: ['Le premier jour', 'Le dixième jour'] },\n      { q: 'Nomme une chose dont une graine a besoin pour pousser.', a: ['eau', 'l\\'eau', 'de l\\'eau', 'terre', 'la terre', 'de la terre', 'lumière', 'la lumière', 'de la lumière', 'soleil', 'le soleil', 'du soleil', 'patience', 'la patience', 'de la patience'] },\n    ] },\n  { id: 'o-moose', icon: '🫎', title: 'L\\'orignal près de l\\'étang', source: 'Une histoire de Typing Trail',\n    text: 'Tôt un matin d\\'été, Grand-papa et Nora étaient assis sans bouger au bord de l\\'étang. La brume flottait sur l\\'eau comme une douce couverture. ' +\n      'Puis, sans un bruit, une maman orignal est sortie du bois. Elle était plus haute que le camion de Grand-papa! ' +\n      'Son petit, qu\\'on appelle un veau, la suivait de près sur ses pattes tremblantes. ' +\n      'La maman orignal est entrée dans l\\'étang et a plongé la tête sous l\\'eau pour manger des plantes. Nora a retenu son souffle et a souri. ' +\n      'Certaines des plus belles choses arrivent quand on reste tranquille.',\n    questions: [\n      { q: 'Comment appelle-t-on le bébé de l\\'orignal?', a: ['veau', 'un veau', 'le veau'] },\n      { q: 'Qu\\'est-ce que l\\'orignal a mangé?', a: ['Des plantes sous l\\'eau'], w: ['Des poissons de l\\'étang', 'Des pommes dans un arbre'] },\n      { q: 'Qui était assis au bord de l\\'étang avec Nora?', a: ['Grand-papa', 'grand papa', 'grandpapa', 'son grand-papa', 'grand-père', 'son grand-père'] },\n    ] },\n  { id: 'o-fossil', icon: '🐚', title: 'La chasse aux fossiles', source: 'Une histoire de Typing Trail',\n    text: 'La classe de Sam a fait une sortie dans les badlands, près de Drumheller. Les collines avaient des rayures brunes, beiges et grises, comme les couches d\\'un gâteau. ' +\n      '\"Chaque couche de roche a pris très longtemps à se former\", a expliqué le guide. Sam a regardé par terre et a vu une forme imprimée dans une pierre plate. ' +\n      'C\\'était un tout petit coquillage! \"C\\'est un fossile\", a dit le guide. \"Il a des millions d\\'années.\" ' +\n      'Sam a pris une photo, mais a laissé le fossile à sa place, pour que la prochaine personne puisse le trouver aussi.',\n    questions: [\n      { q: 'Qu\\'est-ce que Sam a trouvé dans la pierre plate?', a: ['coquillage', 'un coquillage', 'le coquillage', 'coquille', 'fossile', 'un fossile'] },\n      { q: 'À quoi ressemblaient les couches de roche?', a: ['Aux couches d\\'un gâteau'], w: ['Aux vagues de la mer', 'Aux barreaux d\\'une échelle'] },\n      { q: 'Qu\\'est-ce que Sam a pris au lieu du fossile?', a: ['photo', 'une photo', 'la photo', 'photographie', 'une photographie', 'image'] },\n    ] },\n  { id: 'o-magnet', icon: '🧲', title: 'La magie des aimants', source: 'Une histoire de Typing Trail',\n    text: 'M. Lee a donné à chaque équipe un aimant et une boîte de petits objets. \"Devinez quels objets l\\'aimant va attraper\", a-t-il dit. ' +\n      'Zoé pensait que l\\'aimant attraperait tout. Elle a essayé un trombone. Clic! Il est resté collé. Elle a essayé un crayon de cire. Rien ne s\\'est passé. ' +\n      'Un crayon, une gomme à effacer et un morceau de papier d\\'aluminium n\\'ont pas collé non plus, mais un clou, oui! ' +\n      'Zoé a appris que les aimants attirent certains métaux, comme le fer et l\\'acier, mais pas tout.',\n    questions: [\n      { q: 'Quel est le premier objet que Zoé a essayé?', a: ['trombone', 'un trombone', 'le trombone'] },\n      { q: 'Qu\\'est-ce qui est arrivé quand Zoé a essayé le crayon de cire?', a: ['Rien ne s\\'est passé'], w: ['Il est resté collé', 'Il s\\'est cassé'] },\n      { q: 'Nomme un métal qu\\'un aimant attire.', a: ['fer', 'le fer', 'du fer', 'acier', 'l\\'acier', 'de l\\'acier'] },\n    ] },\n  { id: 'o-mitten', icon: '🧤', title: 'La mitaine perdue', source: 'Une histoire de Typing Trail',\n    text: 'En revenant de l\\'école, Kai a trouvé une petite mitaine mauve dans la neige. Il y avait une étoile dessinée dessus. ' +\n      '\"Quelqu\\'un doit avoir froid à la main\", a pensé Kai. Le lendemain matin, il a apporté la mitaine au secrétariat de l\\'école. ' +\n      'Mme Diaz l\\'a mise dans la boîte des objets perdus. À la récréation, une petite fille qui s\\'appelait Ruby a couru vers Kai. ' +\n      '\"Tu as trouvé ma mitaine!\" a-t-elle dit en montrant sa main bien au chaud. Kai s\\'est senti tout chaud lui aussi, en plein milieu du coeur.',\n    questions: [\n      { q: 'Quel dessin y avait-il sur la mitaine?', a: ['étoile', 'une étoile', 'l\\'étoile'] },\n      { q: 'À quel endroit Kai a-t-il apporté la mitaine?', a: ['Au secrétariat de l\\'école'], w: ['Chez lui', 'À la bibliothèque'] },\n      { q: 'Comment s\\'appelait la petite fille?', a: ['Ruby'] },\n    ] },\n  { id: 'o-sky', icon: '🌌', title: 'Des lumières au-dessus de la ferme', source: 'Une histoire de Typing Trail',\n    text: 'Par une nuit froide et claire, la maman de Mia l\\'a réveillée. \"Viens dehors voir\", a-t-elle chuchoté. ' +\n      'Elles se sont enroulées dans des couvertures et se sont installées sur la galerie. Au-dessus de la grange, le ciel brillait de longs rubans de lumière verte. ' +\n      'Les rubans dansaient et tourbillonnaient, et un peu de rose scintillait sur les bords. ' +\n      '\"Ce sont des aurores boréales\", a dit Maman. \"Elles se forment quand de minuscules particules venues du soleil frappent l\\'air très haut au-dessus de la Terre.\" ' +\n      'Mia les a regardées jusqu\\'à ce que ses orteils soient gelés, puis elle est retournée au lit, la tête pleine d\\'étoiles.',\n    questions: [\n      { q: 'De quelle couleur étaient les rubans de lumière?', a: ['vert', 'verts', 'verte', 'vertes'] },\n      { q: 'Comment s\\'appellent ces lumières?', a: ['Les aurores boréales'], w: ['Les lumières des étoiles', 'Les rayons de lune'] },\n      { q: 'À quel endroit Mia et sa maman se sont-elles installées?', a: ['galerie', 'la galerie', 'sur la galerie', 'perron', 'le perron', 'balcon'] },\n    ] },\n];\n\n\n/* ---------- helpers shared by built-in and teacher passages ---------- */\n/** Turns any text into characters a student can type on a Canadian French keyboard (accents kept, ù and œ spelled out). */\nfunction typeable(s) {\n  return String(s || '')\n    .replace(/[‘’‚′`´]/g, \"'\").replace(/«[\\s\\u00a0\\u202f]*/g, '\"').replace(/[\\s\\u00a0\\u202f]*»/g, '\"').replace(/[“”„″]/g, '\"')\n    .replace(/\\s*[–—−]\\s*/g, ' - ').replace(/…/g, '...')\n    .replace(/œ/g, 'oe').replace(/Œ/g, 'Oe').replace(/æ/g, 'ae').replace(/Æ/g, 'Ae')\n    .replace(/ù/g, 'u').replace(/Ù/g, 'U')\n    .replace(/[   ]/g, ' ').replace(/ ([!?;])/g, '$1')\n    .normalize('NFC')\n    .replace(/[\\r\\n\\t ]+/g, ' ')\n    .replace(/[^\\x20-\\x7eàâçéèêëîïôûüÀÂÇÉÈÊËÎÏÔÛÜ]/g, (c) => c.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\\x20-\\x7e]/g, ''))\n    .replace(/[\\[{]/g, '(').replace(/[\\]}]/g, ')').replace(/[~^|\\\\\u003c>@]/g, ' ')\n    .replace(/ {2,}/g, ' ').trim();\n}\nconst WORD_SPLIT = /[^a-z0-9àâçéèêëîïôûüù]+/;\n/** Whole words only: a story is hidden if any word is on the block lists. */\nfunction wordsOK(t) { return String(t || '').toLowerCase().split(WORD_SPLIT).every(w => !w || !blocked(w, false)); }\nfunction storyOK(st) {\n  return wordsOK(st.title) && wordsOK(st.text) && st.questions.every(q => wordsOK(q.q) && q.a.every(wordsOK) && (q.w || []).every(wordsOK));\n}\n/** Splits a passage into parts of one or two sentences. */\nfunction chunkText(text, max = 110) {\n  const sentences = text.match(/[^.!?]+[.!?]+[\"')]*\\s*|[^.!?]+$/g) || [text];\n  const out = [];\n  let cur = '';\n  const push = s => { s = s.trim(); if (s) out.push(s); };\n  for (let s of sentences.map(x => x.trim()).filter(Boolean)) {\n    while (s.length > max * 1.5) {             // a very long sentence: break at a comma or space\n      let cut = s.lastIndexOf(', ', max);\n      if (cut \u003c max * 0.4) cut = s.lastIndexOf(' ', max);\n      if (cut \u003c 1) break;\n      if (cur) { push(cur); cur = ''; }\n      push(s.slice(0, cut + 1)); s = s.slice(cut + 1).trim();\n    }\n    if (cur && (cur + ' ' + s).length > max) { push(cur); cur = s; }\n    else cur = cur ? cur + ' ' + s : s;\n  }\n  push(cur);\n  return out;\n}\n/** Lower case, no accents, no punctuation, and no little words in front (\"le\", \"la\", \"l'\", \"un\", \"des\"...). */\nconst normAnswer = s => typeable(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')\n  .replace(/[^a-z0-9' ]+/g, ' ').replace(/\\b(l|d|j|qu|c|s|n|m|t)'/g, '').replace(/'/g, ' ').replace(/\\s+/g, ' ').trim()\n  .replace(/^(le|la|les|un|une|des|du|de|au|aux|mon|ma|mes|ton|ta|tes|son|sa|ses) /, '');\n/** Forgiving answer check for young typists: ignores capitals, accents, punctuation, \"le/la/les\", and small endings like -s, -e or -x. */\nfunction answerMatches(input, accepted) {\n  const got = normAnswer(input);\n  if (!got || got.split(' ').length > 6) return false;\n  const words = got.split(' ');\n  const near = (w, a) => w === a || (a.length >= 4 && (w.startsWith(a) || a.startsWith(w)) && Math.abs(w.length - a.length) \u003c= 2);\n  return accepted.some(raw => {\n    const a = normAnswer(raw);\n    if (!a) return false;\n    if (got === a || (' ' + got + ' ').includes(' ' + a + ' ')) return true;\n    return !a.includes(' ') && words.some(w => near(w, a));\n  });\n}\nconst STOP = new Set(('avec avoir dans elle elles être fait faire leur leurs mais même nous pour plus puis quand quel quelle sans sont sous ' +\n  'tout tous toute toutes très vous était étaient avait avaient alors aussi comme cette ceux donc encore entre ici parce peut ' +\n  'pourquoi quoi rien sera seulement vers voici voilà déjà après avant chaque autre autres jamais toujours').split(' '));\nconst WORD_RE = /[a-zàâçéèêëîïôûü]{4,}/gi;\n/** Builds a bonus round: type the missing word, or put three sentences back in order. */\nfunction makeBonus(text) {\n  const sentences = (text.match(/[^.!?]+[.!?]+[\"')]*/g) || []).map(s => s.trim()).filter(s => s.length > 12);\n  const kinds = [];\n  if (sentences.length >= 3) kinds.push('order');\n  const blanks = [];\n  sentences.forEach(s => (s.match(WORD_RE) || []).forEach(w => {\n    if (!STOP.has(w.toLowerCase()) && w === w.toLowerCase() && !blocked(w, false)) blanks.push([s, w]);\n  }));\n  if (blanks.length) kinds.push('missing');\n  if (!kinds.length) return null;\n  if (pick(kinds) === 'missing') {\n    const [s, w] = pick(blanks);\n    const at = new RegExp('(^|[^a-zàâçéèêëîïôûü])' + w + '(?![a-zàâçéèêëîïôûü])', 'i');\n    return { kind: 'missing', prompt: s.replace(at, (m, pre) => pre + '_____'), answer: w };\n  }\n  const start = Math.floor(Math.random() * (sentences.length - 2));\n  const three = sentences.slice(start, start + 3);\n  let order;\n  do { order = shuffle([0, 1, 2]); } while (order.join('') === '012');\n  const letters = 'abc';\n  return { kind: 'order', lines: order.map((i, k) => [letters[k], three[i]]), answer: [0, 1, 2].map(i => letters[order.indexOf(i)]).join('') };\n}\n\n/* ---------- Chromebook Helpers pack (ChromeOS accessibility features, Canadian French names) ---------- */\nconst HELPER_STORIES = [\n  { id: 'h-speak', icon: '🗣️', title: 'Sélectionner pour énoncer', source: 'Les outils du Chromebook',\n    text: 'Ton Chromebook peut te lire des mots à voix haute. Cet outil s\\'appelle Sélectionner pour énoncer. D\\'abord, active-le dans les Paramètres, sous Accessibilité. ' +\n      'Ensuite, choisis des mots à l\\'écran : clique sur un mot ou fais glisser le pointeur sur une phrase. Appuie sur la touche Recherche et sur la touche S, et ton Chromebook te lit les mots. ' +\n      'Écouter pendant que tu lis peut aider les mots à rester dans ta tête. Tout le monde peut s\\'en servir, n\\'importe quand.',\n    questions: [\n      { q: 'Comment s\\'appelle cet outil?', a: ['Sélectionner pour énoncer', 'selectionner pour enoncer'] },\n      { q: 'Sur quelles touches appuies-tu après avoir choisi les mots?', a: ['Recherche et S'], w: ['Ctrl et Z', 'Maj et A'] },\n      { q: 'Pour l\\'activer, va dans les Paramètres, sous ____.', a: ['Accessibilité', 'accessibilite'] },\n    ] },\n  { id: 'h-magnify', icon: '🔍', title: 'La loupe', source: 'Les outils du Chromebook',\n    text: 'As-tu déjà souhaité que tout l\\'écran soit plus grand? Ton Chromebook a une loupe. ' +\n      'La Loupe plein écran agrandit tout, comme si tu regardais à travers un verre grossissant. ' +\n      'La Loupe ancrée garde une grande vue en haut de l\\'écran, et le reste ne change pas de taille. ' +\n      'Tu trouveras les deux dans les Paramètres, sous Accessibilité, dans Affichage et agrandissement. Fais un zoom avant quand les mots te semblent minuscules, et un zoom arrière quand tu as fini.',\n    questions: [\n      { q: 'Que fait la Loupe plein écran?', a: ['Elle agrandit tout'], w: ['Elle lit les mots à voix haute', 'Elle change les couleurs'] },\n      { q: 'La Loupe ancrée garde une grande vue en ____ de l\\'écran.', a: ['haut'] },\n      { q: 'À quoi ressemble la Loupe plein écran?', a: ['un verre grossissant', 'verre grossissant', 'une loupe', 'loupe'] },\n    ] },\n  { id: 'h-dictate', icon: '🎤', title: 'La dictée', source: 'Les outils du Chromebook',\n    text: 'Parfois, tes idées vont plus vite que tes doigts sur le clavier. Ton Chromebook a un outil appelé Dictée, qui écrit ce que tu dis. ' +\n      'Active-le dans les Paramètres, sous Accessibilité, dans Clavier et saisie de texte. Ensuite, clique dans la zone de texte que tu veux remplir, lance la Dictée et parle clairement. ' +\n      'Regarde tes mots apparaître à l\\'écran! Taper au clavier reste une belle habileté à pratiquer, et la Dictée est une autre façon de mettre tes idées par écrit.',\n    questions: [\n      { q: 'Qu\\'est-ce que la Dictée écrit?', a: ['ce que tu dis', 'ce que je dis', 'ce qu\\'on dit', 'tes mots', 'mes mots', 'les mots', 'les paroles', 'la parole', 'ma voix'] },\n      { q: 'Dans quelle section actives-tu la Dictée?', a: ['Clavier et saisie de texte'], w: ['Affichage et agrandissement', 'Curseur et pavé tactile'] },\n      { q: 'Comment dois-tu parler quand tu utilises la Dictée?', a: ['clairement', 'clair', 'lentement'] },\n    ] },\n  { id: 'h-sticky', icon: '🔑', title: 'Les touches rémanentes', source: 'Les outils du Chromebook',\n    text: 'Pour écrire une majuscule, tu dois tenir la touche Maj (Shift) enfoncée et appuyer sur une lettre en même temps. Ce n\\'est pas toujours facile! ' +\n      'Les Touches rémanentes sont un outil qui te permet d\\'appuyer sur les touches une à la fois. Appuie une fois sur Maj, relâche-la, puis appuie sur la lettre. Ton Chromebook se souvient de la touche Maj pour toi. ' +\n      'Appuie deux fois sur Maj pour la garder active, et une troisième fois pour la désactiver. Tu trouveras les Touches rémanentes dans les Paramètres, sous Accessibilité, dans Clavier et saisie de texte.',\n    questions: [\n      { q: 'Quelle touche tiens-tu enfoncée pour écrire une majuscule?', a: ['Maj', 'la touche Maj', 'touche Maj', 'Shift', 'la touche Shift'] },\n      { q: 'Que te permettent de faire les Touches rémanentes?', a: ['Taper une touche à la fois'], w: ['Écrire avec ta voix', 'Agrandir l\\'écran'] },\n      { q: 'Deux appuis sur Maj la gardent active. Quel appui la désactive?', a: ['Le troisième appui'], w: ['Le cinquième appui', 'Le dixième appui'] },\n    ] },\n  { id: 'h-cursor', icon: '🖱️', title: 'Le grand curseur', source: 'Les outils du Chromebook',\n    text: 'As-tu de la difficulté à trouver la petite flèche à l\\'écran? Cette flèche s\\'appelle le curseur, ou le pointeur de la souris. ' +\n      'Ton Chromebook peut afficher un grand curseur et changer sa couleur, pour qu\\'il soit facile à repérer. Il peut aussi ajouter un anneau autour du curseur quand il bouge. ' +\n      'Regarde dans les Paramètres, sous Accessibilité, dans Curseur et pavé tactile. Essaie un grand curseur d\\'une couleur vive, et vois à quelle vitesse tu le trouves!',\n    questions: [\n      { q: 'Quel est l\\'autre nom du curseur?', a: ['pointeur de la souris', 'le pointeur de la souris', 'pointeur de souris', 'pointeur', 'le pointeur', 'flèche', 'la flèche'] },\n      { q: 'Dans quelle section trouves-tu les outils pour le curseur?', a: ['Curseur et pavé tactile'], w: ['Synthèse vocale', 'Clavier et saisie de texte'] },\n      { q: 'Qu\\'est-ce qui peut apparaître autour du curseur quand il bouge?', a: ['anneau', 'un anneau', 'cercle', 'un cercle'] },\n    ] },\n  { id: 'h-keyboard', icon: '⌨️', title: 'Le clavier à l\\'écran', source: 'Les outils du Chromebook',\n    text: 'Savais-tu que ton Chromebook peut afficher un clavier directement à l\\'écran? On l\\'appelle le Clavier à l\\'écran. ' +\n      'Tu peux toucher les touches avec ton doigt ou cliquer dessus avec la souris, au lieu d\\'appuyer sur les vraies touches. C\\'est pratique quand une touche est coincée, quand tu utilises un écran tactile, ' +\n      'ou quand tu veux simplement essayer une nouvelle façon de taper. Active-le dans les Paramètres, sous Accessibilité, dans Clavier et saisie de texte.',\n    questions: [\n      { q: 'Comment s\\'appelle cet outil?', a: ['clavier à l\\'écran', 'le clavier à l\\'écran', 'clavier a l\\'ecran', 'clavier virtuel'] },\n      { q: 'Comment utilises-tu le clavier à l\\'écran?', a: ['Toucher ou cliquer sur les touches'], w: ['Parler dans un micro', 'Secouer le Chromebook'] },\n      { q: 'Nomme une situation dans laquelle le clavier à l\\'écran est pratique.', a: ['coincée', 'touche coincée', 'une touche coincée', 'bloquée', 'touche bloquée', 'écran tactile', 'tactile', 'nouvelle façon'] },\n    ] },\n  { id: 'h-vox', icon: '🔊', title: 'ChromeVox', source: 'Les outils du Chromebook',\n    text: 'ChromeVox est un lecteur d\\'écran. Il lit à voix haute tout ce qui se trouve à l\\'écran, comme les boutons, les menus et les mots d\\'une page. ' +\n      'Il te dit aussi à quel endroit tu es quand tu te déplaces avec le clavier. Beaucoup de gens utilisent un lecteur d\\'écran tous les jours, pour se servir d\\'un ordinateur sans regarder l\\'écran. ' +\n      'Tu peux activer ChromeVox dans les Paramètres, sous Accessibilité, dans Synthèse vocale. Essaie-le avec des écouteurs, et écoute tout ce qu\\'il peut te dire!',\n    questions: [\n      { q: 'Quel genre d\\'outil est ChromeVox?', a: ['Un lecteur d\\'écran'], w: ['Une loupe', 'Un outil de dessin'] },\n      { q: 'Qu\\'est-ce que ChromeVox lit à voix haute?', a: ['tout ce qui est à l\\'écran', 'tout', 'l\\'écran', 'les boutons', 'boutons', 'les menus', 'menus', 'les mots', 'mots'] },\n      { q: 'Que dois-tu porter quand tu l\\'essaies?', a: ['écouteurs', 'des écouteurs', 'les écouteurs', 'casque', 'un casque', 'casque d\\'écoute'] },\n    ] },\n  { id: 'h-colour', icon: '🎨', title: 'Les couleurs', source: 'Les outils du Chromebook',\n    text: 'Parfois, l\\'écran est plus facile à lire avec d\\'autres couleurs. Ton Chromebook a des outils pour les couleurs. ' +\n      'L\\'Inversion des couleurs échange les couleurs : une page blanche devient foncée et les mots foncés deviennent pâles. ' +\n      'La Correction des couleurs change les couleurs pour qu\\'elles soient plus faciles à distinguer, et elle peut même mettre tout l\\'écran en gris. ' +\n      'Tu les trouveras dans les Paramètres, sous Accessibilité, dans Affichage et agrandissement. Essaie-les et choisis ce qui est le plus confortable pour tes yeux.',\n    questions: [\n      { q: 'Que fait l\\'Inversion des couleurs?', a: ['Elle échange les couleurs'], w: ['Elle lit la page à voix haute', 'Elle agrandit le curseur'] },\n      { q: 'Avec l\\'Inversion des couleurs, une page blanche devient ____.', a: ['foncée', 'foncé', 'sombre', 'noire', 'noir'] },\n      { q: 'Termine le nom de la section : Affichage et ____.', a: ['agrandissement'] },\n    ] },\n];\n\n\n/* =====================================================================\n   CORE — state, server bridge, sound, settings, keyboard, typing engine\n   ===================================================================== */\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst CFG = document.getElementById('cfg').dataset;\nconst CLASS_ID = CFG.class || '', TEACHER_URL = CFG.teacher || '';\n\nfunction api(fn, ...args) {\n  return new Promise((resolve, reject) => {\n    const run = window.google && google.script && google.script.run;\n    if (!run) { reject(new Error('Ouvre Typing Trail avec son lien.')); return; }\n    run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);\n  });\n}\n\nconst FR_ERR = [\n  [/^Open Typing Trail with the teacher link\\.?$/, 'Ouvrez Typing Trail avec le lien des enseignants.'],\n  [/^Couldn.t open that Google Classroom class\\.?$/, 'Impossible d\\'ouvrir cette classe Google Classroom.'],\n  [/^This class isn.t linked to Google Classroom\\.?$/, 'Cette classe n\\'est pas liée à Google Classroom.'],\n  [/^Couldn.t post to Google Classroom[\\s\\S]*$/, 'Impossible de publier dans Google Classroom. Vérifiez que vous enseignez dans cette classe.'],\n  [/^That doesn.t look like a Google Sheets link\\.?$/, 'Ce lien ne ressemble pas à un lien Google Sheets.'],\n  [/^You need edit access to that sheet\\.?$/, 'Vous devez avoir le droit de modifier cette feuille.'],\n  [/^That student isn.t on the roster\\.?$/, 'Cet élève n\\'est pas dans la liste.'],\n  [/^That setting isn.t allowed\\.?$/, 'Ce réglage n\\'est pas permis.'],\n  [/^Google Classroom isn.t available for your account\\.?$/, 'Google Classroom n\\'est pas offert pour votre compte.'],\n  [/^You don.t have access to that class sheet\\.?$/, 'Vous n\\'avez pas accès à la feuille de cette classe.'],\n  [/^Couldn.t share the class sheet with the Typing Trail account \\((.*)\\)\\.?$/, 'Impossible de partager la feuille de la classe avec le compte Typing Trail ($1).'],\n  [/^Couldn.t reach Google Classroom\\.?$/, 'Impossible de joindre Google Classroom.'],\n  [/^Give the passage a title\\.?$/, 'Donnez un titre au texte.'],\n  [/^The passage is too short[\\s\\S]*$/, 'Le texte est trop court. Écrivez au moins quelques phrases.'],\n  [/^The passage is too long[\\s\\S]*$/, 'Le texte est trop long. Gardez-le sous 1500 caractères (environ 250 mots).'],\n  [/^Question (\\d) needs an answer\\.?$/, 'La question $1 a besoin d\\'une réponse.'],\n  [/^Answer (\\d) needs a question\\.?$/, 'La réponse $1 a besoin d\\'une question.'],\n  [/^This passage has a word that can.t be shown to students: \"(.*)\"\\. Change it and save again\\.$/, 'Ce texte contient un mot qui ne peut pas être montré aux élèves : \"$1\". Changez-le et enregistrez de nouveau.'],\n  [/^This class already has (\\d+) passages[\\s\\S]*$/, 'Cette classe a déjà $1 textes. Supprimez-en un d\\'abord.'],\n  [/^That passage is gone[\\s\\S]*$/, 'Ce texte n\\'existe plus. Actualisez la page.'],\n  [/^This class is already linked to Google Classroom\\.?$/, 'Cette classe est déjà liée à Google Classroom.'],\n  [/^That Google Classroom class already has its own Typing Trail class\\.?$/, 'Cette classe Google Classroom a déjà sa propre classe Typing Trail.'],\n  [/^You don.t teach that Google Classroom class\\.?$/, 'Vous n\\'enseignez pas dans cette classe Google Classroom.'],\n  [/^Typing Trail is busy\\. Try again in a minute\\.?$/, 'Typing Trail est occupé. Réessayez dans une minute.'],\n  [/^Something went wrong\\.?$/, 'Un problème est survenu.'],\n];\nfunction frErr(m) { m = String(m == null ? '' : m); for (const [re, fr] of FR_ERR) if (re.test(m)) return m.replace(re, fr); return m; }\nconst cleanErr = e => frErr(String((e && e.message) || e || '').replace(/^(Error|Exception):\\s*/, ''));\n\n/* ---------- state ---------- */\nlet ME = null;                         // { name } of the signed-in student (school Google account)\nlet PROG = emptyProgress();            // progress from the class sheet\nlet PROFILE = { sound: true };         // student's saved choices\nlet OPT = { games: 'Always', extras: 'On', leaderboard: 'On', goal: 12 };\nlet ROUNDS = 0;                        // game rounds earned this session (\"After a lesson\" mode)\nfunction emptyProgress() { return { lessons: {}, stories: {}, games: {}, eggs: [], endings: [], keyErr: {}, xp: 0, days: [] }; }\nconst extrasOn = () => OPT.extras !== 'Off';\n\n/* Results are queued and retried, so a dropped connection never loses work. */\nconst queue = [];\nlet flushing = false;\nfunction save(kind, data) { return new Promise(res => { queue.push({ kind, data, res }); flush(); }); }\nasync function flush() {\n  if (flushing) return;\n  flushing = true;\n  while (queue.length) {\n    const it = queue[0];\n    try { const r = await api(it.kind, CLASS_ID, it.data); queue.shift(); it.res(r || { ok: true }); }\n    catch (e) { it.res(null); it.res = () => {}; break; }\n  }\n  flushing = false;\n}\nsetInterval(() => { if (queue.length) flush(); }, 30000);\n\nlet profileTimer = 0;\nfunction saveProfile() {\n  clearTimeout(profileTimer);\n  profileTimer = setTimeout(() => { if (ME) api('saveProfile', CLASS_ID, PROFILE).catch(() => {}); }, 700);\n}\n\n/* ---------- sound ---------- */\nconst audio = {\n  ctx: null,\n  init() {\n    try {\n      if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); }\n      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();\n    } catch (e) {}\n  },\n  tone(freq, dur, type = 'sine', vol = 0.06, when = 0, slideTo = 0) {\n    if (PROFILE.sound === false || !this.ctx) return;\n    try {\n      const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();\n      o.type = type; o.frequency.setValueAtTime(freq, t);\n      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);\n      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);\n    } catch (e) {}\n  },\n  tick() { this.tone(880, 0.05, 'triangle', 0.03); },\n  err() { this.tone(210, 0.16, 'square', 0.03, 0, 150); },\n  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.07, i * 0.11)); },\n  pop() { this.tone(480, 0.09, 'sine', 0.08, 0, 1300); },\n  zap() { this.tone(1200, 0.12, 'sawtooth', 0.03, 0, 300); },\n  beep(f) { this.tone(f, 0.12, 'triangle', 0.06); },\n  secret() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'sine', 0.07, i * 0.09)); },\n};\n\n/* ---------- reading settings ---------- */\nconst FONTS = {\n  andika: { name: 'Andika', css: '\"Andika\",\"Verdana\",\"Segoe UI\",sans-serif' },\n  opendyslexic: { name: 'OpenDyslexic', css: '\"OpenDyslexic\",\"Andika\",\"Verdana\",sans-serif', style:\n    \"@font-face{font-family:'OpenDyslexic';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/files/opendyslexic-latin-400-normal.woff2) format('woff2')}\" +\n    \"@font-face{font-family:'OpenDyslexic';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/files/opendyslexic-latin-700-normal.woff2) format('woff2')}\" },\n  lexend: { name: 'Lexend', css: '\"Lexend\",\"Verdana\",sans-serif', link: 'https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap' },\n  atkinson: { name: 'Atkinson Hyperlegible', css: '\"Atkinson Hyperlegible\",\"Verdana\",sans-serif', link: 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap' },\n};\nfunction loadFont(f) {\n  if (f.loaded) return;\n  f.loaded = true;\n  if (f.style) { const s = document.createElement('style'); s.textContent = f.style; document.head.appendChild(s); }\n  if (f.link) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f.link; document.head.appendChild(l); }\n}\nfunction applySettings() {\n  const r = document.documentElement;\n  const f = FONTS[PROFILE.font] || FONTS.andika;\n  loadFont(f);\n  r.style.setProperty('--read-font', f.css);\n  r.dataset.size = PROFILE.size || 'm';\n  r.dataset.spacing = PROFILE.spacing || 'normal';\n  r.dataset.contrast = PROFILE.contrast ? '1' : '';\n  r.dataset.still = PROFILE.still ? '1' : '';\n  r.dataset.skin = (typeof skinNow === 'function') ? skinNow() : 'trail';\n  syncHandGuides();\n  $('#lText').style.fontFamily = PROFILE.font && PROFILE.font !== 'andika' ? f.css : '';\n  paintSound();\n}\n\n/* ---------- fingers, hints ---------- */\nconst TYPE = { 5: 'pinky', 4: 'ring', 3: 'middle', 2: 'index', 1: 'thumb' };\nconst NAME = { 5: 'auriculaire', 4: 'annulaire', 3: 'majeur', 2: 'index', 1: 'pouce' };\nconst ftype = f => f === 'T' ? 'thumb' : TYPE[f[1]];\nconst fname = f => f === 'T' ? 'pouce' : NAME[f[1]] + (f[0] === 'L' ? ' gauche' : ' droit');\nconst shiftFor = key => ((FINGER[key] || 'R2')[0] === 'L' ? 'R5' : 'L5');\n/** Keys to light up for a character. For ê, à... the accent key comes first, then the letter. */\nfunction stroke(ch, deadDone) {\n  if (ch === ' ') return { keys: [' '], fingers: ['L1', 'R1'] };\n  const b = baseKey(ch);\n  const one = (key, shift) => {\n    const f = FINGER[key] || 'R2';\n    if (!shift) return { keys: [key], fingers: [f] };\n    const sf = shiftFor(key);\n    return { keys: [sf === 'R5' ? 'shiftR' : 'shiftL', key], fingers: [sf, f] };\n  };\n  if (b.none) return { keys: [], fingers: [] };\n  if (b.dead && !deadDone) return one(b.dead.key, b.dead.shift);\n  return one(b.key, b.shift);\n}\nconst deadDoneFor = ch => { const b = baseKey(ch); return !!(b.dead && DEAD.mark === b.dead.mark); };\nfunction pressHTML(key, shift, shown) {\n  const f = FINGER[key] || 'R2', t = ftype(f), cap = keyCap(key);\n  const what = shown && shown !== cap && shown !== cap.toUpperCase()\n    ? `\u003ckbd class=\"f-${t}\">${esc(shown)}\u003c/kbd> (sur la touche \u003ckbd class=\"f-${t}\">${esc(cap)}\u003c/kbd>)` : `\u003ckbd class=\"f-${t}\">${esc(shown || cap)}\u003c/kbd>`;\n  if (!shift) return `appuie sur ${what} avec ton \u003cb>${fname(f)}\u003c/b>`;\n  return `tiens \u003ckbd class=\"f-pinky\">Maj\u003c/kbd> avec ton \u003cb>${fname(shiftFor(key))}\u003c/b> et appuie sur ${what} avec ton \u003cb>${fname(f)}\u003c/b>`;\n}\nconst cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);\nfunction hintHTML(ch, deadDone) {\n  if (ch === ' ') return `\u003cspan class=\"dot f-thumb\">\u003c/span>\u003cspan>Appuie sur la \u003ckbd class=\"f-thumb\">barre d'espacement\u003c/kbd> avec ton \u003cb>pouce\u003c/b>\u003c/span>`;\n  const b = baseKey(ch);\n  if (b.none) return `\u003cspan>⌨️ Pour taper \u003ckbd>${esc(ch)}\u003c/kbd>, ton Chromebook doit utiliser le clavier français (Canada). Demande de l'aide à ton enseignant ou à ton enseignante.\u003c/span>`;\n  if (b.dead) {\n    const t = ftype(FINGER[deadDone ? b.key : b.dead.key] || 'R2');\n    if (deadDone) return `\u003cspan class=\"dot f-${t}\">\u003c/span>\u003cspan>Bravo! Maintenant, ${pressHTML(b.key, b.shift, b.base)} pour faire \u003ckbd>${esc(ch)}\u003c/kbd>\u003c/span>`;\n    return `\u003csp nalements, alors parles-en aussi à ton prof.');\n  } catch (e) { toast('Impossible d\\'envoyer le signalement. Parles-en à ton prof.'); }\n}\n$('#reportBtn').addEventListener('click', e => {\n  e.currentTarget.blur();\n  if (!LS) return;\n  sendReport(LS.L, LS.text);\n  startLesson(LS.L.id); // fresh text right away\n});\n$('#rReport').addEventListener('click', e => { e.currentTarget.blur(); if (LAST) sendReport(LAST.L, LAST.text); });\n\n/* =====================================================================\n   GAMES — hub, Balloon Pop, Word Rain, Space Letters, Key Racer, Story\n   ===================================================================== */\nconst kbG = buildKeyboard($('#kbGame'));\nconst handsG = window.createTrailHands($('#handsGame'), kbG);\nfunction showGameKeyboard(visible, guide = false) {\n  const stage = $('#gameKeyboard');\n  stage.hidden = !visible;\n  stage.classList.toggle('has-guide', guide);\n  if (!guide) handsG.setActive([]);\n}\nconst GAME_DEFS = [\n  { id: 'balloon', name: 'Balloon Pop', label: 'Éclate-ballons', icon: '🎈', desc: 'Éclate chaque ballon en tapant sa lettre.', levels: true },\n  { id: 'rain', name: 'Word Rain', label: 'Pluie de mots', icon: '🌧️', desc: 'Tape les mots qui tombent avant qu\\'ils touchent le sol.', levels: true },\n  { id: 'space', name: 'Space Letters', label: 'Lettres de l\\'espace', icon: '🚀', desc: 'Pulvérise les astéroïdes-lettres pour sauver la planète.', levels: true },\n  { id: 'racer', name: 'Key Racer', label: 'Course au clavier', icon: '🏁', desc: 'Fais la course contre les animaux et contre ton fantôme.' },\n  { id: 'story', name: 'Story Adventure', label: 'Histoires à choix', icon: '📚', desc: 'Tape pour choisir la suite de l\\'histoire.' },\n];\nconst LEVELS = {\n  Easy: { keys: 'asdfghjkl', label: 'Facile', hint: 'rangée de base' },\n  Medium: { keys: 'asdfghjklqwertyuiop', label: 'Moyen', hint: 'rangées de base et du haut' },\n  Hard: { keys: 'abcdefghijklmnopqrstuvwxyzé', label: 'Difficile', hint: 'toutes les lettres et é' },\n};\nconst levelWords = lv => { const set = new Set(LEVELS[lv].keys); return WORDS.filter(w => w.length \u003c= 7 && !blocked(w, false) && [...w].every(c => set.has(c))); };\nconst bestOf = name => (PROG.games && PROG.games[name]) || 0;\nconst COLORS = ['#ff9cbd', '#ffd166', '#86dbf5', '#b6ef8f', '#c9b2ff', '#ffb38a'];\nconst arena = $('#arena'), arenaMsg = $('#arenaMsg');\nlet G = null; // current game state\n\n/* ---------- hub ---------- */\nRENDER.games = () => {\n  const gated = OPT.games === 'After a lesson';\n  $('#roundLine').hidden = !gated;\n  $('#roundLine').innerHTML = `\u003cspan class=\"pill\">🎟️ ${ROUNDS} partie${ROUNDS > 1 ? 's' : ''} de jeu\u003c/span>\u003cspan class=\"small\">Termine une leçon pour gagner une partie de jeu.\u003c/span>`;\n  if (OPT.games === 'Off') { $('#gameCards').innerHTML = '\u003cp class=\"muted\">Ton prof a fermé les jeux pour l\\'instant.\u003c/p>'; return; }\n  $('#gameCards').innerHTML = GAME_DEFS.map(d => {\n    const best = d.id === 'story' ? `${(PROG.endings || []).length} fins trouvées sur ${STORY_ENDINGS}`\n      : d.levels ? Object.keys(LEVELS).map(l => bestOf(`${d.name}: ${l}`)).some(x => x) ? 'Record : ' + Object.keys(LEVELS).map(l => `${LEVELS[l].label} ${bestOf(d.name + ': ' + l)}`).join(', ') : 'Pas encore joué'\n      : bestOf(d.name) ? `Record : ${bestOf(d.name)} mots/min` : 'Pas encore joué';\n    return `\u003cbutton class=\"game-card\" data-game=\"${d.id}\">\u003cspan class=\"gi\">${d.icon}\u003c/span>\u003cspan>\u003cb>${esc(d.label)}\u003c/b>\u003cspan class=\"game-desc\">${esc(d.desc)}\u003c/span>\u003cspan class=\"game-best\">${esc(best)}\u003c/span>\u003c/span>\u003c/button>`;\n  }).join('');\n};\ndocument.addEventListener('click', e => {\n  const b = e.target.closest('[data-game]');\n  if (b) openGame(b.dataset.game);\n});\nfunction canPlay() { return OPT.games === 'Always' || (OPT.games === 'After a lesson' && ROUNDS > 0); }\n\nfunction openGame(id) {\n  const def = GAME_DEFS.find(d => d.id === id);\n  if (!def) return;\n  if (!canPlay()) { toast('🎟️ Termine une leçon pour gagner une partie de jeu.'); return; }\n  go('play');\n  G = { def };\n  $('#playTitle').textContent = `${def.icon} ${def.label}`;\n  $('#playBelow').innerHTML = '';\n  setArena(def.id === 'space' ? 'space' : def.id === 'racer' ? 'track' : def.id === 'story' ? 'story' : '');\n  hud('');\n  kbG.setTargets([]); kbG.setLocked(null);\n  showGameKeyboard(def.id !== 'story');\n  onLeave = stopGame;\n  if (def.levels) {\n    msg(`\u003cdiv class=\"pick\">\u003ch3>Choisis un niveau\u003c/h3>\u003cp>${esc(def.desc)}\u003c/p>\u003cdiv class=\"pick-row\">${Object.entries(LEVELS).map(([k, v]) =>\n      `\u003cbutton class=\"btn\" data-level=\"${k}\">${v.label}\u003cbr>\u003cspan class=\"small\">${v.hint}\u003c/span>\u003c/button>`).join('')}\u003c/div>\u003c/div>`);\n  } else if (def.id === 'racer') countdown(racerStart);\n  else storyPicker();\n}\ndocument.addEventListener('click', e => {\n  const b = e.target.closest('[data-level]');\n  if (b && G) { G.level = b.dataset.level; countdown(() => ({ balloon: balloonStart, rain: rainStart, space: spaceStart })[G.def.id]()); }\n});\nfunction useRound() { if (OPT.games === 'After a lesson') ROUNDS = Math.max(0, ROUNDS - 1); }\nfunction setArena(cls) {\n  arena.className = 'arena ' + cls;\n  [...arena.children].forEach(c => { if (c !== arenaMsg) c.remove(); });\n  if (!cls) arena.insertAdjacentHTML('afterbegin', '\u003cdiv class=\"cloud\" style=\"left:8%;top:22%\">\u003c/div>\u003cdiv class=\"cloud\" style=\"left:62%;top:12%;transform:scale(.8)\">\u003c/div>');\n}\nfunction msg(html) { arenaMsg.hidden = !html; arenaMsg.innerHTML = html || ''; }\nfunction hud(html) { $('#hud').innerHTML = html; }\nfunction countdown(then) {\n  blurActive(); audio.init();\n  const show = t => msg(`\u003cdiv class=\"count\">${t}\u003c/div>`);\n  show(3); audio.beep(520);\n  G.timers = [1, 2, 3].map(i => setTimeout(() => { show(i === 3 ? 'Go!' : 3 - i); audio.beep(i === 3 ? 780 : 520); }, i * 600));\n  G.timers.push(setTimeout(() => { msg(''); useRound(); then(); }, 4 * 600));\n}\nfunction stopGame() {\n  Loop.stop();\n  if (G && G.timers) G.timers.forEach(clearTimeout);\n  if (G && G.box) G.box.stop();\n  onKey = null;\n  G = null;\n}\n/** Shared end screen: saves the round, shows score and XP. */\nfunction endRound(game, score, detail, line) {\n  Loop.stop(); onKey = null;\n  showGameKeyboard(false);\n  kbG.setTargets([]);\n  const isNew = game === 'Story Adventure' && !(PROG.endings || []).includes(detail);\n  const xp = gameXp(game, score, isNew);\n  const prevBest = bestOf(game);\n  if (game === 'Story Adventure') { if (isNew) PROG.endings.push(detail); }\n  else PROG.games[game] = Math.max(prevBest, score);\n  PROG.xp += xp;\n  save('saveGame', { game, score, detail: detail || '' }).then(r => { if (r && typeof r.totalXp === 'number') { PROG.xp = r.totalXp; refreshMe(); } });\n  audio.win();\n  const best = game !== 'Story Adventure' && score > prevBest && prevBest > 0;\n  if (best) confetti(20);\n  const def = G && G.def;\n  msg(`\u003cdiv class=\"pick\">\u003ch3>${best ? 'Nouveau record!' : esc(line.title)}\u003c/h3>\u003cp>${line.text}\u003c/p>\u003cp class=\"xp-gain\">+${xp} XP\u003c/p>\n    \u003cdiv class=\"pick-row\">\u003cbutton class=\"btn primary\" id=\"again\">Rejouer\u003c/button>\u003cbutton class=\"btn\" data-go=\"games\">Tous les jeux\u003c/button>\u003c/div>\u003c/div>`);\n  $('#again').onclick = () => { if (!canPlay()) { toast('🎟️ Termine une leçon pour gagner une autre partie de jeu.'); return; } const id = def.id; openGame(id); };\n  refreshMe(); checkBadges();\n}\n\n/* ---------- Balloon Pop ---------- */\nfunction balloonStart() {\n  const keys = [...LEVELS[G.level].keys], name = `Balloon Pop: ${G.level}`;\n  kbG.setLocked(allowedKeys([], keys.join('')));\n  const s = G.s = { list: [], score: 0, missed: 0, t: 0, lastSpawn: -1500, every: 1500, lastX: 50, shown: -1 };\n  const ROUND = 60000;\n  const paint = () => hud(`\u003cspan class=\"pill\">⏱ ${Math.max(0, Math.ceil((ROUND - s.t) / 1000))}\u003c/span>\u003cspan class=\"pill\">🎈 ${s.score}\u003c/span>`);\n  paint();\n  const targets = () => kbG.setTargets([...new Set(s.list.map(b => b.letter))]);\n  Loop.start(dt => {\n    s.t += dt;\n    if (Math.ceil((ROUND - s.t) / 1000) !== s.shown) { s.shown = Math.ceil((ROUND - s.t) / 1000); paint(); }\n    if (s.t >= ROUND) return finish();\n    if (s.t - s.lastSpawn >= s.every) {\n      s.lastSpawn = s.t; s.every = 1500 - 750 * Math.min(1, s.t / ROUND);\n      const on = new Set(s.list.map(b => b.letter)), choices = keys.filter(c => !on.has(c));\n      const letter = pick(choices.length ? choices : keys);\n      let x = 50;\n      for (let i = 0; i \u003c 8; i++) { x = 8 + Math.random() * 84; if (Math.abs(x - s.lastX) > 16) break; }\n      s.lastX = x;\n      const gold = extrasOn() && Math.random() \u003c 0.035;\n      const el = document.createElement('div');\n      el.className = 'balloon' + (gold ? ' gold' : '');\n      el.style.left = x + '%';\n      el.style.setProperty('--bc', gold ? '#ffd34d' : pick(COLORS));\n      el.innerHTML = `\u003cdiv class=\"b\">${esc(letter)}\u003c/div>`;\n      arena.appendChild(el);\n      s.list.push({ el, letter, y: 0, gold, speed: (arena.clientHeight + 230) / (7000 - 2300 * Math.min(1, s.t / ROUND)) });\n      targets();\n    }\n    const H = arena.clientHeight;\n    s.list = s.list.filter(b => {\n      b.y += b.speed * dt;\n      b.el.style.transform = `translateY(${-b.y}px)`;\n      if (b.y > H + 230) { b.el.remove(); s.missed++; return false; }\n      return true;\n    });\n  });\n  onKey = e => {\n    if (e.key.length !== 1) return;\n    e.preventDefault();\n    if (e.repeat) return;\n    const c = e.key.toLowerCase();\n    let best = null;\n    for (const b of s.list) if (b.letter === c && (!best || b.y > best.y)) best = b;\n    if (!best) { kbG.flash(c, 'wrong', 220); return; }\n    s.list = s.list.filter(b => b !== best);\n    best.el.classList.add('popped');\n    setTimeout(() => best.el.remove(), 220);\n    s.score += best.gold ? 5 : 1;\n    if (best.gold) { toast('🟡 Ballon doré! +5'); awardEgg('golden'); }\n    kbG.flash(c); audio.pop(); paint(); targets();\n  };\n  function finish() {\n    s.list.forEach(b => b.el.remove());\n    endRound(name, s.score, `missed ${s.missed}`, { title: 'Le temps est écoulé!', text: `Tu as éclaté \u003cb>${s.score}\u003c/b> ballon${s.score > 1 ? 's' : ''}. ${s.missed} ${s.missed > 1 ? 'se sont envolés' : 's\\'est envolé'}.` });\n  }\n}\n\n/* ---------- Word Rain ---------- */\nfunction rainStart() {\n  const words = levelWords(G.level), name = `Word Rain: ${G.level}`;\n  kbG.setLocked(allowedKeys([], LEVELS[G.level].keys));\n  arena.insertAdjacentHTML('beforeend', '\u003cdiv class=\"ground\">\u003c/div>\u003cdiv class=\"buffer\" id=\"rainBuf\">&nbsp;\u003c/div>');\n  const s = G.s = { drops: [], score: 0, lives: 3, t: 0, lastSpawn: -2600, buf: '', target: null };\n  const paint = () => hud(`\u003cspan class=\"pill\">${'❤️'.repeat(s.lives)}${'🤍'.repeat(3 - s.lives)}\u003c/span>\u003cspan class=\"pill\">🌧️ ${s.score}\u003c/span>`);\n  paint();\n  const showBuf = () => { $('#rainBuf').innerHTML = s.buf ? esc(s.buf) : '&nbsp;'; };\n  const mark = d => { d.el.innerHTML = `\u003cspan class=\"hit\">${esc(d.word.slice(0, d === s.target ? s.buf.length : 0))}\u003c/span>${esc(d.word.slice(d === s.target ? s.buf.length : 0))}`; d.el.classList.toggle('target', d === s.target); };\n  const nextKey = () => kbG.setTargets(s.target ? [s.target.word[s.buf.length]] : []);\n  Loop.start(dt => {\n    s.t += dt;\n    const every = Math.max(1300, 2600 - s.score * 60);\n    if (s.t - s.lastSpawn >= every) {\n      s.lastSpawn = s.t;\n      const on = new Set(s.drops.map(d => d.word[0]));\n      const pool = words.filter(w => !on.has(w[0]));\n      const word = pick(pool.length ? pool : words);\n      const el = document.createElement('div');\n      el.className = 'drop';\n      el.style.left = (6 + Math.random() * 70) + '%';\n      const d = { el, word, y: 0, speed: (0.028 + Math.min(0.05, s.score * 0.0018)) };\n      arena.appendChild(el); mark(d); s.drops.push(d);\n    }\n    const H = arena.clientHeight;\n    for (const d of s.drops.slice()) {\n      d.y += d.speed * dt;\n      d.el.style.transform = `translateY(${d.y}px)`;\n      if (d.y > H - 54) {\n        d.el.remove(); s.drops = s.drops.filter(x => x !== d);\n        if (d === s.target) { s.target = null; s.buf = ''; showBuf(); nextKey(); }\n        s.lives--; audio.err(); paint();\n        if (s.lives \u003c= 0) return finish();\n      }\n    }\n  });\n  onKey = e => {\n    if (e.key.length !== 1) return;\n    e.preventDefault();\n    if (e.repeat) return;\n    const c = e.key.toLowerCase();\n    if (!s.target) {\n      const cands = s.drops.filter(d => d.word[0] === c).sort((a, b) => b.y - a.y);\n      if (!cands.length) { kbG.flash(c, 'wrong', 220); audio.err(); return; }\n      s.target = cands[0]; s.buf = c;\n    } else if (s.target.word[s.buf.length] === c) s.buf += c;\n    else { kbG.flash(c, 'wrong', 220); audio.err(); const t = s.target; s.target = null; s.buf = ''; mark(t); showBuf(); nextKey(); return; }\n    kbG.flash(c); audio.tick();\n    const t = s.target;\n    mark(t); showBuf();\n    if (s.buf === t.word) {\n      s.score++; audio.pop();\n      t.el.classList.add('gone'); setTimeout(() => t.el.remove(), 220);\n      s.drops = s.drops.filter(x => x !== t);\n      s.target = null; s.buf = ''; showBuf(); paint();\n    }\n    nextKey();\n  };\n  function finish() {\n    s.drops.forEach(d => d.el.remove());\n    endRound(name, s.score, '', { title: 'La pluie s\\'est arrêtée!', text: `Tu as attrapé \u003cb>${s.score}\u003c/b> mot${s.score > 1 ? 's' : ''}.` });\n  }\n}\n\n/* ---------- Space Letters ---------- */\nfunction spaceStart() {\n  const keys = [...LEVELS[G.level].keys], name = `Space Letters: ${G.level}`;\n  kbG.setLocked(allowedKeys([], keys.join('')));\n  arena.insertAdjacentHTML('beforeend', '\u003cdiv class=\"planet\">\u003c/div>\u003cdiv class=\"ship\">🚀\u003c/div>');\n  const s = G.s = { rocks: [], kills: 0, shields: 3, t: 0, lastSpawn: -1800, nextComet: 20000 };\n  const wave = () => 1 + Math.floor(s.kills / 10);\n  const paint = () => hud(`\u003cspan class=\"pill\">🛡️ ${s.shields}\u003c/span>\u003cspan class=\"pill\">🌊 Vague ${wave()}\u003c/span>\u003cspan class=\"pill\">💥 ${s.kills}\u003c/span>`);\n  paint();\n  const targets = () => kbG.setTargets([...new Set(s.rocks.map(r => r.letter))]);\n  Loop.start(dt => {\n    s.t += dt;\n    const every = Math.max(650, 1800 - wave() * 120);\n    if (s.t - s.lastSpawn >= every) {\n      s.lastSpawn = s.t;\n      const on = new Set(s.rocks.map(r => r.letter)), choices = keys.filter(c => !on.has(c));\n      const comet = extrasOn() && s.t > s.nextComet;\n      if (comet) s.nextComet = s.t + 20000 + Math.random() * 10000;\n      const letter = pick(choices.length ? choices : keys);\n      const el = document.createElement('div');\n      el.className = 'rock' + (comet ? ' comet' : '');\n      const x = 8 + Math.random() * 84;\n      el.style.left = x + '%';\n      el.textContent = letter;\n      arena.appendChild(el);\n      s.rocks.push({ el, letter, x, y: -60, comet, speed: 0.03 + wave() * 0.006 });\n      targets();\n    }\n    const H = arena.clientHeight;\n    for (const r of s.rocks.slice()) {\n      r.y += r.speed * dt;\n      r.el.style.transform = `translateY(${r.y}px)`;\n      if (r.y > H - 110) {\n        r.el.remove(); s.rocks = s.rocks.filter(x => x !== r);\n        if (!r.comet) { s.shields--; audio.err(); paint(); }\n        targets();\n        if (s.shields \u003c= 0) return finish();\n      }\n    }\n  });\n  const zap = r => {\n    const W = arena.clientWidth, H = arena.clientHeight;\n    const sx = W / 2, sy = H - 60, tx = r.x / 100 * W, ty = r.y + 29;\n    const len = Math.hypot(tx - sx, ty - sy), ang = Math.atan2(ty - sy, tx - sx) * 180 / Math.PI;\n    const l = document.createElement('div');\n    l.className = 'laser';\n    l.style.left = sx + 'px'; l.style.top = sy + 'px'; l.style.width = len + 'px'; l.style.transform = `rotate(${ang}deg)`;\n    arena.appendChild(l);\n    setTimeout(() => l.remove(), 200);\n    r.el.classList.add('boom');\n    setTimeout(() => r.el.remove(), 220);\n  };\n  onKey = e => {\n    if (e.key.length !== 1) return;\n    e.preventDefault();\n    if (e.repeat) return;\n    const c = e.key.toLowerCase();\n    let hit = null;\n    for (const r of s.rocks) if (r.letter === c && (!hit || r.y > hit.y)) hit = r;\n    if (!hit) { kbG.flash(c, 'wrong', 220); return; }\n    kbG.flash(c); audio.zap();\n    if (hit.comet) {\n      toast('☄️ Explosion de comète! Tous les astéroïdes ont disparu.');\n      s.rocks.forEach(r => { zap(r); s.kills += r.comet ? 0 : 1; });\n      s.rocks = [];\n    } else { zap(hit); s.rocks = s.rocks.filter(r => r !== hit); s.kills++; }\n    paint(); targets();\n  };\n  function finish() {\n    s.rocks.forEach(r => r.el.remove());\n    endRound(name, s.kills, `wave ${wave()}`, { title: 'Plus de boucliers!', text: `Tu as pulvérisé \u003cb>${s.kills}\u003c/b> astéroïde${s.kills > 1 ? 's' : ''} et tu as atteint la vague ${wave()}.` });\n  }\n}\n\n/* ---------- Key Racer ---------- */\nconst RACES = SPEED.trail.map((t, i) => ['s' + i, t + ' ' + t]).concat(PASSAGES.filter(p => p[1].length \u003c 175).map((p, i) => ['p' + i, p[1]]));\nfunction racerStart() {\n  const [rid, text] = pick(RACES);\n  const goal = OPT.goal, ghost = PROFILE.ghosts && PROFILE.ghosts[rid];\n  const rivals = [{ who: 'Tortue', icon: '🐢', wpm: Math.max(4, Math.round(goal * 0.6)) }, { who: 'Lapin', icon: '🐇', wpm: Math.round(goal * 1.15) }];\n  if (ghost) rivals.push({ who: 'Ton record', icon: '👻', wpm: ghost });\n  const lane = (who, icon, id) => `\u003cdiv class=\"lane\">\u003cspan class=\"who\">${esc(who)}\u003c/span>\u003cdiv class=\"runway\">\u003cspan class=\"racer\" id=\"${id}\" style=\"left:9%\">${icon}\u003c/span>\u003cspan class=\"flag\">🏁\u003c/span>\u003c/div>\u003c/div>`;\n  arena.insertAdjacentHTML('beforeend', `\u003cdiv class=\"lanes\">${lane('Toi', esc(buddyEmoji(myBuddy(), levelOf(PROG.xp))), 'rYou')}${rivals.map((r, i) => lane(r.who + ` (${r.wpm} mots/min)`, r.icon, 'r' + i)).join('')}\u003c/div>`);\n  $('#playBelow').innerHTML = '\u003cdiv class=\"text-panel trail-typing-text\" id=\"raceText\" tabindex=\"-1\" aria-label=\"Texte à taper\">\u003c/div>\u003cdiv class=\"hint\">\u003cdiv class=\"hint-pill\" id=\"raceHint\">\u003c/div>\u003c/div>';\n  showGameKeyboard(true, true);\n  kbG.setLocked(allowedKeys(new Set(Object.keys(FINGER)), text));\n  const s = G.s = { t: 0, done: false };\n  const pos = p => `${9 + p * 80}%`;\n  G.box = TypeBox({\n    panel: $('#raceText'), hands: handsG, text, kb: kbG, hint: $('#raceHint'),\n    onStep: st => { $('#rYou').style.left = pos(st.pos / st.len); },\n    onDone: st => finish(st),\n  });\n  hud(`\u003cspan class=\"pill\" id=\"raceClock\">⏱ 0:00\u003c/span>`);\n  Loop.start(dt => {\n    s.t += dt;\n    const sec = Math.floor(s.t / 1000);\n    $('#raceClock').textContent = `⏱ ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;\n    rivals.forEach((r, i) => { r.p = Math.min(1, (s.t / 60000) * r.wpm * 5 / text.length); $('#r' + i).style.left = pos(r.p); });\n  });\n  onKey = e => G.box.key(e);\n  $('#raceText').focus({ preventScroll: true });\n  function finish(st) {\n    const mins = s.t / 60000, wpm = Math.round((text.length / 5) / Math.max(mins, 0.05));\n    const place = 1 + rivals.filter(r => (text.length / 5) / r.wpm \u003c mins).length;\n    PROFILE.ghosts = PROFILE.ghosts || {};\n    const beatGhost = ghost && wpm > ghost;\n    if (!ghost || wpm > ghost) { PROFILE.ghosts[rid] = wpm; saveProfile(); }\n    const medal = ['🥇', '🥈', '🥉', '🏅'][Math.min(3, place - 1)];\n    endRound('Key Racer', wpm, `place ${place}`, {\n      title: `${medal} ${['Première', 'Deuxième', 'Troisiè ait \"${SS.bonus.answer}\".`, 'bad');\n  else {\n    const q = SS.S.questions[SS.qi];\n    feedback(`La réponse était : ${q.a[0]}`, 'bad');\n    if (SS.opts) $$('[data-choice]').forEach(x => { if (SS.opts[Number(x.dataset.choice)] === q.a[0]) x.classList.add('right'); });\n  }\n  afterAnswer();\n}\nfunction afterAnswer() {\n  onKey = null;\n  $$('[data-choice]').forEach(x => { x.disabled = true; });\n  $('#qSkip').hidden = true;\n  const last = SS.phase === 'bonus' || SS.qi >= SS.S.questions.length - 1;\n  $('#qNext').textContent = SS.phase === 'bonus' ? 'Terminer' : last ? 'Ronde bonus' : 'Question suivante';\n  $('#qNext').hidden = false;\n  setTimeout(() => $('#qNext').focus(), 30);\n}\nfunction startBonus() {\n  const b = makeBonus(SS.S.text);\n  if (!b) return finishStory();\n  SS.phase = 'bonus'; SS.bonus = b; SS.tries = 0; SS.answered = false;\n  $('#stPart').textContent = 'Bonus';\n  $('#qNum').textContent = '⭐ Ronde bonus (tu peux la passer)';\n  $('#qChoices').innerHTML = '';\n  feedback('');\n  if (b.kind === 'missing') {\n    $('#qText').textContent = 'Tape le mot qui manque.';\n    $('#qLines').innerHTML = `\u003cp class=\"q-line\">${esc(b.prompt)}\u003c/p>`;\n    $('#qInput').placeholder = 'Le mot qui manque';\n  } else {\n    $('#qText').textContent = 'Ces phrases sont mélangées. Tape les lettres dans le bon ordre.';\n    $('#qLines').innerHTML = b.lines.map(([l, s]) => `\u003cp class=\"q-line\">\u003cb>${l.toUpperCase()}\u003c/b> ${esc(s)}\u003c/p>`).join('');\n    $('#qInput').placeholder = 'Par exemple : b a c';\n  }\n  $('#qRow').hidden = false;\n  $('#qInput').value = '';\n  $('#qNext').hidden = true; $('#qSkip').hidden = false;\n  onKey = null;\n  setTimeout(() => $('#qInput').focus(), 30);\n  autoSay(SAY_TEXT.question());\n}\n$('#qGo').addEventListener('click', checkTyped);\n$('#qInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkTyped(); } });\n$('#qNext').addEventListener('click', () => {\n  if (!SS) c/span>`).join('');\n  $('#sdTitle').textContent = total && right === total ? pick(['Super lecture!', 'Lecture incroyable!', 'Tout est bon!']) : stars >= 3 ? pick(['Beau travail!', 'Bien joué!']) : 'Tu as réussi!';\n  $('#sdSub').textContent = S.title + (acc \u003c 98 || wpm \u003c goal ? `. Pour 5 étoiles, vise ${[acc \u003c 98 ? '98 % de précision' : '', wpm \u003c goal ? goal + ' mots par minute' : ''].filter(Boolean).join(' et ')}.` : '');\n  $('#sdXp').textContent = `+${xp} XP`;\n  $('#sdAcc').textContent = acc + '%';\n  $('#sdWpm').textContent = wpm;\n  $('#sdQs').textContent = total ? `${right} sur ${total}` : '–';\n  $('#sdBonus').textContent = bonus ? '⭐' : '–';\n  $('#sdGame').hidden = !(OPT.games === 'After a lesson' && ROUNDS > 0);\n  $('#sdAgain').onclick = () => startStory(S.id);\n  audio.win();\n  if (stars === 5 && total && right === total) confetti();\n  refreshMe();\n  checkBadges();\n  queueTip('dictate');\n}\n$('#sdGame').addEventListener('click', () => go('games'));\n$('#stReport').addEventListener('click', async e => {\n  e.currentTarget.blur();\n  if (!SS) return;\n  const where = `Histoire : ${SS.S.title}`, text = SS.phase === 'type' ? SS.chunks[SS.i] || SS.S.text : SS.S.text;\n  try {\n    const r = await api('reportText', CLASS_ID, { where, text });\n    toast(r && r.ok ? '🚩 Merci de nous l\\'avoir dit. Ton prof va le voir. Choisis une autre histoire pour l\\'instant.' : 'Merci! Parles-en aussi à ton prof.');\n  } catch (err) { toast('Impossible d\\'envoyer le signalement. Parles-en à ton prof.'); }\n  go('corner');\n});\n\n/* =====================================================================\n   HELPERS — read-aloud, \"Make it comfy\", the Helpers panel, and tips\n   Helper choices are saved with the student's profile so they follow them\n   to any Chromebook. They are never shown on the teacher dashboard.\n   ===================================================================== */\nconst TTS = { ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance === 'function' };\nfunction ttsVoice() {\n  try {\n    const vs = speechSynthesis.getVoices() || [];\n    const by = re => vs.filter(v => re.test(v.lang || ''));\n    const pool = by(/^fr-CA/i).concat(by(/^fr/i));\n    return pool.find(v => v.localService) || pool[0] || null;\n  } catch (e) { return null; }\n}\n/** Reads text aloud with the Chromebook's own French voice. */\nfunction say(text) {\n  if (!TTS.ok || !text) return;\n  try {\n    speechSynthesis.cancel();\n    const u = new SpeechSynthesisUtterance(String(text));\n    u.lang = 'fr-CA';\n    const v = ttsVoice();\n    if (v) u.voice = v;\n    u.rate = PROFILE.rate === 'slow' ? 0.8 : 1;\n    speechSynthesis.speak(u);\n  } catch (e) {}\n}\nfunction ttsStop() { if (TTS.ok) { try { speechSynthesis.cancel(); } catch (e) {} } }\nconst autoSpeak = () => TTS.ok && PROFILE.speak === true;\nfunction autoSay(text) { if (autoSpeak()) say(text); }\n\nconst KEY_WORDS = { ' ': 'la barre d\\'espacement', ';': 'le point-virgule', ',': 'la virgule', '.': 'le point', \"'\": 'l\\'apostrophe',\n  '-': 'le trait d\\'union', '=': 'le signe égal', '!': 'le point d\\'exclamation', '?': 'le point d\\'interrogation', ':': 'le deux-points',\n  '\"': 'le guillemet', '$': 'le signe dollar', '%': 'le signe pour cent', '&': 'le et commercial', '(': 'la parenthèse ouvrante',\n  ')': 'la parenthèse fermante', '#': 'le carré', '+': 'le signe plus', '/': 'la barre oblique', '*': 'l\\'astérisque', '_': 'le trait de soulignement',\n  '\u003c': 'le signe plus petit que', '>': 'le signe plus grand que', '@': 'l\\'arobase', '|': 'la barre verticale', '\\\\': 'la barre oblique inversée',\n  '«': 'le guillemet ouvrant', '»': 'le guillemet fermant' };\nconst ACCENT_SAY = { 'é': 'e accent aigu', 'è': 'e accent grave', 'ê': 'e accent circonflexe', 'ë': 'e tréma', 'à': 'a accent grave',\n  'â': 'a accent circonflexe', 'î': 'i accent circonflexe', 'ï': 'i tréma', 'ô': 'o accent circonflexe', 'û': 'u a ut.';\n  const st = COMFY[comfyStep];\n  if (st.key === 'size') return st.q + ' Normale, grande ou très grande.';\n  if (st.key === 'font') return st.q + ' Choisis celle qui te plaît le plus.';\n  return TTS.ok ? st.q + ' Oui, lis-moi. Ou bien, non merci.' : st.q;\n}\nfunction renderComfy() {\n  const done = comfyStep >= COMFY.length;\n  $('#comfyStep').textContent = done ? 'C\\'est fait!' : `Étape ${comfyStep + 1} sur ${COMFY.length}`;\n  $('#comfyBack').hidden = comfyStep === 0 || done;\n  $('#comfyNext').textContent = done ? 'On tape!' : comfyStep === COMFY.length - 1 ? 'Terminer' : 'Suivant';\n  if (done) {\n    $('#comfyQ').textContent = 'C\\'est prêt!';\n    $('#comfyBody').innerHTML = '\u003cp class=\"comfy-done\">Tu peux changer ces choix quand tu veux avec le bouton \u003cb>🧰 Outils\u003c/b> , en haut.\u003c/p>';\n    return;\n  }\n  const st = COMFY[comfyStep];\n  $('#comfyQ').textContent = st.q;\n  if (st.key === 'size') {\n    const cur = PROFILE.size || 'm';\n    $('#comfyBody').innerHTML = `\u003cdiv class=\"comfy-opts\">${st.opts.map(([v, name, px]) =>\n      `\u003cbutton class=\"copt ${cur === v ? 'on' : ''}\" data-comfy=\"size\" data-val=\"${v}\" aria-pressed=\"${cur === v}\">\u003cspan class=\"csample\" style=\"font-size:${px}\">Bonjour, mon ami!\u003c/span>\u003cspan class=\"cname\">${name}\u003c/span>\u003c/button>`).join('')}\u003c/div>`;\n  } else if (st.key === 'font') {\n    const cur = PROFILE.font || 'andika';\n    $('#comfyBody').innerHTML = `\u003cdiv class=\"comfy-opts\">${Object.entries(FONTS).map(([id, f]) =>\n      `\u003cbutton class=\"copt ${cur === id ? 'on' : ''}\" data-comfy=\"font\" data-val=\"${id}\" aria-pressed=\"${cur === id}\">\u003cspan class=\"csample\" style=\"font-family:${esc(f.css)}\">Le renard brun saute.\u003c/span>\u003cspan class=\"cname\">${esc(f.name)}\u003c/span>\u003c/button>`).join('')}\u003c/div>`;\n  } else if (!TTS.ok) {\n    $('#comfyBody').innerHTML = '\u003cp class=\"muted\">La lecture à voix haute ne fonctionne pas sur cet appareil, alors on passe cette étape.\u003c/p>';\n  } else {\n    const on = PROFILE.speak === true;\n    $('#comfyBody').innerHTML = `\u003cdiv class=\"comfy-opts two\">\n      \u003cbutton class=\"copt ${on ? 'on' : ''}\" data-comfy=\"speak\" data-val=\"1\" aria-pressed=\"${on}\">\u003cspan class=\"csample\">🔊\u003c/span>\u003cspan class=\"cname\">Oui, lis-moi\u003c/span>\u003c/button>\n      \u003cbutton class=\"copt ${on ? '' : 'on'}\" data-comfy=\"speak\" data-val=\"0\" aria-pressed=\"${!on}\">\u003cspan class=\"csample\">🤫\u003c/span>\u003cspan class=\"cname\">Non merci\u003c/span>\u003c/button>\u003c/div>\n      \u003cp style=\"text-align:center;margin:14px 0 0\">\u003cbutton class=\"btn small\" id=\"comfySample\">▶ Écouter un exemple\u003c/button>\u003c/p>`;\n  }\n}\ndocument.addEventListener('click', e => {\n  const b = e.target.closest('[data-comfy]');\n  if (b) {\n    const key = b.dataset.comfy, v = b.dataset.val;\n    PROFILE[key] = key === 'speak' ? v === '1' : v;\n    applySettings();\n    helperChanged(key, PROFILE[key]);\n    renderComfy();\n    return;\n  }\n  if (e.target.closest('#comfySample')) { audio.init(); say('Salut! Je peux te lire les histoires, les questions et les indices.'); }\n});\n$('#comfyBack').addEventListener('click', () => { comfyStep = Math.max(0, comfyStep - 1); renderComfy(); });\n$('#comfyNext').addEventListener('click', () => {\n  if (comfyStep \u003c COMFY.length) { comfyStep++; renderComfy(); if (autoSpeak()) say(comfyQuestion()); return; }\n  PROFILE.comfy = true;\n  saveProfile();\n  $('#comfy').hidden = true;\n  Loop.paused = false;\n  ttsStop();\n  setTimeout(nextTip, 500);\n});\n\n/* ---------- the Helpers panel ---------- */\nconst CHROMEBOOK_HELPERS = [\n  ['h-speak', '🗣️', 'Sélectionner pour énoncer', 'Lit à voix haute les mots que tu choisis.'],\n  ['h-magnify', '🔍', 'Loupe', 'Agrandit tout l\\'écran.'],\n  ['h-dictate', '🎤', 'Dictée', 'Écrit ce que tu dis.'],\n  ['h-sticky', '🔑', 'Touches rémanentes', 'Appuie sur les touches comme Maj une à la fois.'],\n  ['h-cursor', '🖱️', 'Grand curseur', 'Rend le pointeur de la souris facile à trouver.'],\n  ['h-keyboard', '⌨️', 'Clavier à l\\'écran', 'Tape en touchant les touches à l\\'écran.'],\n  ['h-vox', '🔊', 'ChromeVox', 'Lit tout ce qu\\'il y a à l\\'écran.'],\n  ['h-colour', '🎨', 'Couleurs', 'Change les couleurs de l\\'écran.'],\n];\nfunction renderHelpers() {\n  seg('#setSpeak', 'speak', [[false, 'Non'], [true, 'Oui']], false);\n  seg('#setRate', 'rate', [['slow', 'Plus lente'], ['normal', 'Normale']], 'normal');\n  seg('#setFont', 'font', Object.entries(FONTS).map(([id, f]) => [id, `\u003cspan style=\"font-family:${esc(f.css)}\">${esc(f.name)}\u003c/span>`]), 'andika');\n  seg('#setSize', 'size', [['m', 'Normale'], ['l', 'Grande'], ['xl', 'Très grande']], 'm');\n  seg('#setSpacing', 'spacing', [['normal', 'Normal'], ['wide', 'Large']], 'normal');\n  seg('#setContrast', 'contrast', [[false, 'Non'], [true, 'Oui']], false);\n  seg('#setStill', 'still', [[false, 'Non'], [true, 'Oui']], false);\n  seg('#setHands', 'nohands', [[false, 'Oui'], [true, 'Non']], false);\n  $('#ttsRows').hidden = !TTS.ok;\n  const canRead = OPT.stories !== 'Off';\n  $('#helperList').innerHTML = CHROMEBOOK_HELPERS.map(([id, icon, name, what]) =>\n    `\u003cli>\u003cspan class=\"hl-icon\">${icon}\u003c/span>\u003cspan>\u003cb>${esc(name)}\u003c/b>\u003cbr>\u003cspan class=\"small\">${esc(what)}\u003c/span>\u003c/span>${canRead ? `\u003cbutton class=\"btn tiny\" data-read-helper=\"${id}\">En savoir plus\u003c/button>` : ''}\u003c/li>`).join('');\n}\nfunction openHelpers() {\n  Object.values(FONTS).forEach(loadFont);\n  renderHelpers();\n  $('#helpers').hidden = false;\n  Loop.paused = true;\n  setTimeout(() => $('#helpersClose').focus(), 30);\n}\nfunction closeHelpers() {\n  $('#helpers').hidden = true;\n  Loop.paused = false;\n  $('#helpersBtn').focus();\n  setTimeout(nextTip, 300);\n}\n$('#helpersBtn').addEventListener('click', openHelpers);\n$('#helpersClose').addEventListener('click', closeHelpers);\n$('#helpers').addEventListener('click', e => { if (e.target === $('#helpers')) closeHelpers(); });\ndocument.addEventListener('click', e => {\n  if (e.target.closest('[data-open-helpers]')) openHelpers();\n  const r = e.target.closest('[data-read-helper]');\n  if (r) { if (helpersOpen()) closeHelpers(); hideTip(); startStory(r.dataset.readHelper); }\n});\n/** Called whenever a helper setting changes (Helpers panel, Me page, or Make it comfy). */\nfunction helperChanged(key, val) {\n  if (helpersOpen()) renderHelpers();\n  if (key === 'size' && val === 'xl') queueTip('magnify');\n  if (key === 'speak' && val === true) queueTip('speak');\n  if (key === 'contrast' && val === true) queueTip('colour');\n}\n\n/* ---------- tips at the right moment, shown once each ---------- */\nconst TIP_LIST = {\n  sticky: ['🔑', 'C\\'est difficile de tenir deux touches en même temps? Avec les touches rémanentes, tu peux les enfoncer une à la fois.', 'h-sticky'],\n  magnify: ['🔍', 'Ton Chromebook peut aussi agrandir tout l\\'écran.', 'h-magnify'],\n  speak: ['🗣️', 'Ton Chromebook peut te lire n\\'importe quelle page, pas seulement celle-ci. Cet outil s\\'appelle Sélectionner pour énoncer.', 'h-speak'],\n  colour: ['🎨', 'Ton Chromebook peut changer les couleurs de toutes les applications, pas seulement celle-ci.', 'h-colour'],\n  dictate: ['🎤', 'Tu as plein d\\'idées à écrire? Ton Chromebook peut écrire ce que tu dis avec la Dictée.', 'h-dictate'],\n};\nconst tipQueue = [];\nfunction queueTip(id) {\n  if (!ME || !TIP_LIST[id] || (PROFILE.tips || []).includes(id) || tipQueue.includes(id)) return;\n  tipQueue.push(id);\n  if (!modalOpen()) setTimeout(nextTip, 300);\n}\nfunction nextTip() {\n  if (!ME || modalOpen() || !$('#tipCard').hidden || !tipQueue.length) return;\n  const id = tipQueue.shift(), [icon, text, story] = TIP_LIST[id];\n  PROFILE.tips = (PROFILE.tips || []).concat(id).slice(-20);\n  saveProfile();\n  $('#tipIcon').textContent = icon;\n  $('#tipText').textContent = text;\n  $('#tipRead').hidden = OPT.stories === 'Off';\n  $('#tipRead').dataset.readHelper = story;\n  $('#tipCard').hidden = false;\n  autoSay(text);\n}\nfunction hideTip() { $('#tipCard').hidden = true; }\n$('#tipGot').addEventListener('click', e => { e.currentTarget.blur(); hideTip(); setTimeout(nextTip, 400); });\n\n/* =====================================================================\n   LESSON ORDER — teacher-controlled release of lessons\n   Class settings: \"Lesson order\" (Any order / In order), \"Stars to unlock\",\n   and \"Lessons open up to\" (a unit). A teacher can also open every lesson\n   for one student. Lessons a student has already done always stay open.\n   ===================================================================== */\nfunction releasedUnitIndex() {\n  const up = OPT.upTo || 'All units';\n  if (OPT.allOpen || up === 'All units') return UNITS.length - 1;\n  const uid = { 'Home Row': 'home', 'Top Row': 'top', 'Bottom Row': 'bottom', 'Accents': 'accents', 'Capitals & Punctuation': 'shift', 'Numbers': 'numbers' }[up];\n  const i = UNITS.findIndex(u => u.id === uid);\n  return i \u003c 0 ? UNITS.length - 1 : i;\n}\nconst unitLocked = u => !OPT.allOpen && UNITS.indexOf(u) > releasedUnitIndex();\n/** Why a lesson is locked for this student, or null when it's open. */\nfunction lockOf(L) {\n  if (!L || L.kind === 'secret' || OPT.allOpen) return null;\n  if (bestStars(L.id) > 0) return null;\n  if (UNITS.findIndex(u => u.id === L.unit) > releasedUnitIndex()) return { why: 'teacher' };\n  if (OPT.order !== 'In order') return null;\n  const i = TRAIL.indexOf(L);\n  if (i \u003c= 0) return null;\n  const prev = TRAIL[i - 1], need = Math.max(1, Number(OPT.need) || 1);\n  return bestStars(prev.id) >= need ? null : { why: 'stars', prev, need };\n}\nfunction lockText(lk) {\n  if (lk.why === 'teacher') return 'Ton prof va ouvrir ces leçons bientôt.';\n  return lk.need > 1 ? `Obtiens ${lk.need} étoiles à « ${lk.prev.title} » pour ouvrir cette leçon.` : `Termine d\\'abord « ${lk.prev.title} ».`;\n}\n/** What the big Continue button should do when the next lesson is locked. */\nfunction continueTarget(next) {\n  const lk = next && lockOf(next);\n  if (!lk) return null;\n  if (lk.why === 'stars') return { id: lk.prev.id, text: `Obtiens ${lk.need} ★ à ${lk.prev.title}` };\n  const open = TRAIL.filter(l => !lockOf(l));\n  const pickL = open.filter(l => l.kind === 'speed').pop() || open[open.length - 1] || TRAIL[0];\n  return { id: pickL.id, text: `Pratiquer : ${pickL.title}` };\n}\n/** The note under the results when the next lesson is still locked. */\nfunction nextLockNote(next) {\n  const lk = next && lockOf(next);\n  if (!lk) return '';\n  if (lk.why === 'teacher') return '🎉 Tu as fait toutes les leçons que ton prof a ouvertes pour l\\'instant. Essaie le Coin lecture ou un jeu!';\n  return `🔒 Obtiens ${lk.need} étoiles à cette leçon pour ouvrir la suivante. Tu es capable!`;\n}\n\nboot();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "Teacher": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Typing Trail – Teacher\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#eef5ff;--surface:#ffffff;--surface-2:#e3eefc;--ink:#1f2a52;--muted:#56628a;--line:#d3e0f4;\n  --accent:#5b3cc4;--accent-ink:#ffffff;--accent-2:#1f9e8c;--good:#17905a;--bad:#e0424b;--warn:#c77800;--star:#ffbf1f;\n  --heat:224,66,75;--shadow:0 5px 0 rgba(31,42,82,.08);\n  --font-ui:\"Fredoka\",\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif;\n  --font-read:\"Andika\",\"Verdana\",\"Segoe UI\",system-ui,sans-serif;\n  color-scheme:light;\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#131a2e;--surface:#1c2440;--surface-2:#252f50;--ink:#eef2ff;--muted:#a5b0d2;--line:#323f69;\n    --accent:#a88dff;--accent-ink:#151a2c;--accent-2:#3fc6b2;--good:#4ad493;--bad:#ff6b73;--warn:#f5b24a;--star:#ffcc3d;\n    --heat:255,107,115;--shadow:0 5px 0 rgba(0,0,0,.25);color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#131a2e;--surface:#1c2440;--surface-2:#252f50;--ink:#eef2ff;--muted:#a5b0d2;--line:#323f69;\n  --accent:#a88dff;--accent-ink:#151a2c;--accent-2:#3fc6b2;--good:#4ad493;--bad:#ff6b73;--warn:#f5b24a;--star:#ffcc3d;\n  --heat:255,107,115;--shadow:0 5px 0 rgba(0,0,0,.25);color-scheme:dark;\n}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-read);-webkit-font-smoothing:antialiased}\n[hidden]{display:none!important}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--accent);outline-offset:3px}\n.muted{color:var(--muted)}\n\n.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:14px 20px}\n.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-ui);font-weight:700;font-size:1.35rem}\n.brand small{font-weight:500;color:var(--muted);font-size:1rem}\n.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-read);font-size:1.45rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}\n.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.btn{font-family:var(--font-ui);font-weight:600;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:8px 16px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}\n.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}\n\nmain{max-width:1100px;margin:0 auto;padding:0 20px 40px}\nh1{font-family:var(--font-ui);font-weight:700;font-size:clamp(1.6rem,3.5vw,2.2rem);margin:6px 0 16px}\nh2{font-family:var(--font-ui);font-weight:600;font-size:1.25rem;margin:0 0 12px}\nh3{font-family:var(--font-ui);font-weight:600;font-size:1.05rem;margin:18px 0 8px}\n.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}\n.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}\n.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}\n.tile b{display:block;font-family:var(--font-ui);font-weight:600;font-size:1.9rem}\n.tile span{color:var(--muted);font-size:.95rem}\n\n.scroll{overflow-x:auto}\ntable{width:100%;border-collapse:collapse}\nth{text-align:left;font-family:var(--font-ui);font-weight:600;color:var(--muted);font-size:.9rem;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}\ntd{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}\ntr.sel td{background:var(--surface-2)}\n.name-btn{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:1.05rem;color:var(--ink);text-align:left}\n.name-btn:hover{text-decoration:underline}\n.bar{width:160px;height:12px;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent-2);border-radius:99px}\n.small{font-size:.88rem;color:var(--muted)}\n.flag.ok{background:rgba(23,144,90,.14);color:var(--good)}\n.flag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:rgba(var(--heat),.15);color:var(--bad);font-size:.8rem;font-family:var(--font-ui);font-weight
