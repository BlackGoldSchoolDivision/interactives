<script>const DATA={"research":[{"title":"Colenbrander et al. (2024)","url":"https://link.springer.com/article/10.1007/s10648-024-09953-3","note":"A preregistered review of 28 studies found positive reading and spelling outcomes, strongest for directly taught words. Transfer to untaught spelling was possible; reading transfer and comprehension benefits were not clearly established. Evidence certainty varied."},{"title":"Goodwin & Ahn (2013)","url":"https://scholarship.miami.edu/esploro/outputs/journalArticle/A-Meta-Analysis-of-Morphological-Interventions-in/991031575910102976","note":"A meta-analysis of 30 studies reported benefits for morphological knowledge, vocabulary, decoding and spelling. It did not find significant effects on reading comprehension or fluency."},{"title":"Bowers, Kirby & Deacon (2010)","url":"https://langlabatdal.weebly.com/uploads/1/0/6/3/10631014/bowers.kirby.deacon.2010.pdf","note":"This earlier review of 22 studies supported teaching meaningful word parts and found stronger outcomes when morphology was integrated with other literacy instruction. Later reviews add caution about transfer and comparisons with other approaches."}],"sources":[{"title":"Cambridge: English spelling","url":"https://dictionary.cambridge.org/us/grammar/british-grammar/spelling_2"},{"title":"Language Portal of Canada: final y","url":"https://our-languages.canada.ca/en/writing-tips-plus/spelling-words-ending-in-y"},{"title":"Language Portal of Canada: doubling consonants","url":"https://our-languages.canada.ca/en/writing-tips-plus/spelling-final-consonants-doubled-before-a-suffix"},{"title":"Merriam-Webster: flower","url":"https://www.merriam-webster.com/dictionary/flower"},{"title":"Merriam-Webster: corner","url":"https://www.merriam-webster.com/dictionary/corner"},{"title":"Merriam-Webster: display","url":"https://www.merriam-webster.com/dictionary/display"},{"title":"Merriam-Webster: scare","url":"https://www.merriam-webster.com/dictionary/scare"},{"title":"American Heritage: unicorn","url":"https://ahdictionary.com/word/search.html?q=unicorn"}],"cases":[{"id":"flow","title":"The flower puzzle","kind":"Word families","intro":"Investigate the base flow, meaning move steadily, like water. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"flow family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"flowed","group":"family","evidence":"flow + ed → flowed: moved steadily in the past.","sentence":"","id":"flow-0"},{"word":"flowing","group":"family","evidence":"flow + ing → flowing: moving steadily.","sentence":"","id":"flow-1"},{"word":"overflow","group":"family","evidence":"over + flow → overflow: flow beyond a limit.","sentence":"","id":"flow-2"},{"word":"overflowing","group":"family","evidence":"over + flow + ing → overflowing: flowing beyond a limit.","sentence":"","id":"flow-3"},{"word":"flower","group":"lookalike","evidence":"Flower means a bloom. It is not flow + er; the letters do not make that meaning.","sentence":"","id":"flow-4"},{"word":"flowers","group":"lookalike","evidence":"flower + s → flowers. The base is flower, not flow.","sentence":"","id":"flow-5"}],"evidence":{"prompt":"Why is flower outside this flow family?","answers":["Its base and meaning are different, even though some letters match.","Every word ending in -er is a person who does something.","A family member must sound exactly like its base."],"explanation":"A spelling resemblance is a clue to investigate, not proof. Flower has its own base and word history."},"apply":{"prompt":"“Rain made the pond overflow.” What happened?","answers":["Water flowed beyond the pond’s limit.","Flowers grew in the pond.","The water stopped moving."],"explanation":"Over- adds the idea of going beyond a limit to flow."},"tip":"Use both structure and meaning. Do not cut a word just because a familiar letter string appears."},{"id":"play","title":"Play or display?","kind":"Word families","intro":"Investigate the base play, meaning take part in a game or activity. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"play family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"player","group":"family","evidence":"play + er → player: a person who plays.","sentence":"","id":"play-0"},{"word":"playing","group":"family","evidence":"play + ing → playing: taking part in the activity.","sentence":"","id":"play-1"},{"word":"replay","group":"family","evidence":"re + play → replay: play again.","sentence":"","id":"play-2"},{"word":"playful","group":"family","evidence":"play + ful → playful: enjoying play; full of fun.","sentence":"","id":"play-3"},{"word":"display","group":"lookalike","evidence":"Display means show. It is not dis + play meaning “not play”.","sentence":"","id":"play-4"},{"word":"displayed","group":"lookalike","evidence":"display + ed → displayed. Its base here is display, not play.","sentence":"","id":"play-5"}],"evidence":{"prompt":"What is the strongest evidence that replay belongs?","answers":["Re- means again, and the word still means play.","It has the same number of letters as player.","Every word ending in play belongs automatically."],"explanation":"Replay has a meaningful prefix plus the base play. Display has a different base and history."},"apply":{"prompt":"“Let’s replay the final scene.” What should we do?","answers":["Play the scene again.","Stop playing the scene.","Show a poster of the scene."],"explanation":"Re- means again in replay."},"tip":"A word family is based on a meaningful base, not just a matching ending."},{"id":"care","title":"The missing e","kind":"Word families","intro":"Investigate the base care, meaning look after; give attention. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"care family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"careful","group":"family","evidence":"care + ful → careful: taking care. Keep the final e before -ful.","sentence":"","id":"care-0"},{"word":"careless","group":"family","evidence":"care + less → careless: not taking enough care.","sentence":"","id":"care-1"},{"word":"caring","group":"family","evidence":"care + ing → caring: looking after someone. Remove final e before -ing.","sentence":"","id":"care-2"},{"word":"cared","group":"family","evidence":"care + ed → cared: gave care in the past. Remove final e before -ed.","sentence":"","id":"care-3"},{"word":"scare","group":"lookalike","evidence":"Scare means frighten. There is no prefix s- meaning “frighten” attached to care.","sentence":"","id":"care-4"},{"word":"scared","group":"lookalike","evidence":"scare + ed → scared: frightened. Its base is scare, not care.","sentence":"","id":"care-5"}],"evidence":{"prompt":"Why does caring still belong to care?","answers":["The full base is care; its final e is removed before -ing.","Its base is always car because those letters stay.","Any word starting with car belongs to care."],"explanation":"Word sums show the underlying base even when a suffix changes its written ending."},"apply":{"prompt":"“A careless spill soaked the notebook.” What does careless tell us?","answers":["Someone did not take enough care.","Someone took extra care.","Someone frightened the notebook."],"explanation":"-less adds the idea of lacking care in this context."},"tip":"Compare care + ful → careful with care + ing → caring. The base is the same; the suffix boundary behaves differently."},{"id":"hope","title":"Hoping or hopping?","kind":"Word families","intro":"Investigate the base hope, meaning want something good to happen. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"hope family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"hopeful","group":"family","evidence":"hope + ful → hopeful: feeling hope. Keep final e before -ful.","sentence":"","id":"hope-0"},{"word":"hopeless","group":"family","evidence":"hope + less → hopeless: without hope.","sentence":"","id":"hope-1"},{"word":"hoping","group":"family","evidence":"hope + ing → hoping: wanting something good to happen. Remove final e.","sentence":"","id":"hope-2"},{"word":"hoped","group":"family","evidence":"hope + ed → hoped: felt hope in the past. Remove final e.","sentence":"","id":"hope-3"},{"word":"hop","group":"lookalike","evidence":"Hop means jump on one foot or make a small jump. It is a different base.","sentence":"","id":"hope-4"},{"word":"hopping","group":"lookalike","evidence":"hop + ing → hopping. Double p at this boundary. It belongs to hop, not hope.","sentence":"","id":"hope-5"}],"evidence":{"prompt":"Which word sum explains hoping?","answers":["hope + ing → hoping","hop + ing → hoping","hop + ping → hoping"],"explanation":"Hoping keeps the meaning of hope. Hopping comes from hop and doubles p."},"apply":{"prompt":"“Ari is hoping for snow.” What is Ari doing?","answers":["Wishing that snow will fall.","Jumping on one foot.","Playing in snow that already fell."],"explanation":"The spelling and the sentence point to hope, not hop."},"tip":"Say and compare hoping and hopping. Read the whole sentence before deciding."},{"id":"heat","title":"Heat hidden in wheat?","kind":"Word families","intro":"Investigate the base heat, meaning make warm or hot. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"heat family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"heated","group":"family","evidence":"heat + ed → heated: made warm in the past.","sentence":"","id":"heat-0"},{"word":"heating","group":"family","evidence":"heat + ing → heating: making warm.","sentence":"","id":"heat-1"},{"word":"reheat","group":"family","evidence":"re + heat → reheat: heat again.","sentence":"","id":"heat-2"},{"word":"heater","group":"family","evidence":"heat + er → heater: a thing that provides heat.","sentence":"","id":"heat-3"},{"word":"wheat","group":"lookalike","evidence":"Wheat is a grain. It is not w + heat; w- is not a meaningful prefix here.","sentence":"","id":"heat-4"},{"word":"cheat","group":"lookalike","evidence":"Cheat means act dishonestly. Its base is cheat, not heat.","sentence":"","id":"heat-5"}],"evidence":{"prompt":"What makes heater a member of the heat family?","answers":["It names something that provides heat.","All words ending in -er are people.","Any word with h-e-a-t letters has the base heat."],"explanation":"Here -er makes a noun for a thing that does the action. Meaning matters as well as letters."},"apply":{"prompt":"“Reheat the soup before lunch.” What should happen?","answers":["The soup should be heated again.","Wheat should be added to the soup.","The soup should be cooled."],"explanation":"Re- adds again to heat."},"tip":"An -er noun can name a person or a thing. Check what the word means."},{"id":"corn","title":"Two bases can join","kind":"Word families","intro":"Investigate the base corn, meaning the grain we eat. A family member keeps a connection to this base and its meaning.","groups":[{"id":"family","label":"corn family","detail":"The base and its meaning connect"},{"id":"lookalike","label":"Another base","detail":"Similar letters or sounds are not enough"}],"cards":[{"word":"popcorn","group":"family","evidence":"pop + corn → popcorn: corn that has popped. This is a compound.","sentence":"","id":"corn-0"},{"word":"cornfield","group":"family","evidence":"corn + field → cornfield: a field of corn. Both parts are bases.","sentence":"","id":"corn-1"},{"word":"cornbread","group":"family","evidence":"corn + bread → cornbread: bread made with cornmeal. Both parts are bases.","sentence":"","id":"corn-2"},{"word":"sweetcorn","group":"family","evidence":"sweet + corn → sweetcorn: a kind of corn. This is a compound.","sentence":"","id":"corn-3"},{"word":"corner","group":"lookalike","evidence":"Corner means a place where edges meet. It is not corn (the grain) + er.","sentence":"","id":"corn-4"},{"word":"unicorn","group":"lookalike","evidence":"Unicorn’s corn comes from a Latin word for horn, not the grain corn.","sentence":"","id":"corn-5"}],"evidence":{"prompt":"Why is cornfield a compound?","answers":["It joins two bases: corn and field.","Field is a suffix meaning person.","Every long word is a compound."],"explanation":"Both corn and field can stand as words and contribute meaning. A compound joins bases."},"apply":{"prompt":"“We walked beside the cornfield.” What did we walk beside?","answers":["A field where corn grows.","A corner of a room.","An animal with one horn."],"explanation":"Corn + field gives a useful clue to the compound’s meaning."},"tip":"The grain corn and the Latin element for horn have similar spellings but different meanings and histories."},{"id":"er","title":"The -er mystery","kind":"Affix jobs","intro":"The ending -er can do different jobs. Read each word and its sentence before deciding.","groups":[{"id":"doer","label":"Person who does it","detail":"Names someone who does the base action"},{"id":"compare","label":"More than another","detail":"Compares a quality"}],"cards":[{"word":"teacher","group":"doer","evidence":"teach + er → teacher: a person who teaches.","sentence":"The teacher explained the task.","id":"er-0"},{"word":"runner","group":"doer","evidence":"run + er → runner: a person who runs. Double n.","sentence":"The runner crossed the line.","id":"er-1"},{"word":"baker","group":"doer","evidence":"bake + er → baker: a person who bakes. Remove final e.","sentence":"The baker made bread.","id":"er-2"},{"word":"faster","group":"compare","evidence":"fast + er → faster: more fast.","sentence":"The rabbit is faster than the turtle.","id":"er-3"},{"word":"smaller","group":"compare","evidence":"small + er → smaller: less large.","sentence":"This box is smaller than that one.","id":"er-4"},{"word":"colder","group":"compare","evidence":"cold + er → colder: more cold.","sentence":"Today is colder than yesterday.","id":"er-5"}],"evidence":{"prompt":"How can we decide what -er does?","answers":["Look at the base, the word’s meaning, and its sentence.","-er always means a person.","-er always means more."],"explanation":"The same written ending can serve different grammatical jobs. Context and the kind of base help."},"apply":{"prompt":"“This coat is warmer than mine.” What does -er do?","answers":["It compares warmth: more warm.","It names a person who warms things.","It means warmth happened in the past."],"explanation":"Warmer is a comparison here, not a name for a person."},"tip":"Compare teach → teacher with small → smaller. Ask: a person, or a comparison?"},{"id":"s","title":"The two jobs of -s","kind":"Affix jobs","intro":"An -s ending can mark more than one noun, or a present-tense verb with he, she, it, or one named person. Use the sentences.","groups":[{"id":"plural","label":"More than one","detail":"Plural noun"},{"id":"verb","label":"One subject does it","detail":"Present-tense verb"}],"cards":[{"word":"cats","group":"plural","evidence":"cat + s → cats: more than one cat.","sentence":"Three cats sat on the wall.","id":"s-0"},{"word":"books","group":"plural","evidence":"book + s → books: more than one book.","sentence":"I borrowed several books.","id":"s-1"},{"word":"paints","group":"plural","evidence":"paint + s → paints: more than one kind or container of paint here.","sentence":"The artist chose three paints.","id":"s-2"},{"word":"jumps","group":"verb","evidence":"jump + s → jumps: what one named person does.","sentence":"Amir jumps over the puddle.","id":"s-3"},{"word":"reads","group":"verb","evidence":"read + s → reads: what one named person does.","sentence":"Mia reads after lunch.","id":"s-4"},{"word":"paints","group":"verb","evidence":"paint + s → paints: what one named person does here.","sentence":"Noah paints the fence.","id":"s-5"}],"evidence":{"prompt":"Why are the two paints cards in different groups?","answers":["One is a plural noun; the other is a verb in its sentence.","Identical spellings must always have the same job.","The longer sentence always contains a plural."],"explanation":"The spelling alone does not settle the job. Read “three paints” and “Noah paints” in context."},"apply":{"prompt":"“The dog barks at the door.” What does -s mark?","answers":["A present-tense action with one subject: the dog.","More than one dog.","An action in the past."],"explanation":"Barks is a verb here. The noun dog is singular."},"tip":"Read aloud: “Three paints are on the shelf” and “Noah paints the fence.” Same spelling, different jobs."},{"id":"un","title":"What does un- undo?","kind":"Affix jobs","intro":"Un- can mean “not” with a quality, or reverse an action. Investigate its job in each word.","groups":[{"id":"not","label":"Not this quality","detail":"Describes the opposite state"},{"id":"reverse","label":"Reverse the action","detail":"Undo what the base action does"}],"cards":[{"word":"unhappy","group":"not","evidence":"un + happy → unhappy: not happy.","sentence":"","id":"un-0"},{"word":"unfair","group":"not","evidence":"un + fair → unfair: not fair.","sentence":"","id":"un-1"},{"word":"unkind","group":"not","evidence":"un + kind → unkind: not kind.","sentence":"","id":"un-2"},{"word":"unwrap","group":"reverse","evidence":"un + wrap → unwrap: remove the wrapping.","sentence":"","id":"un-3"},{"word":"untie","group":"reverse","evidence":"un + tie → untie: undo a knot.","sentence":"","id":"un-4"},{"word":"unlock","group":"reverse","evidence":"un + lock → unlock: undo the locked state.","sentence":"","id":"un-5"}],"evidence":{"prompt":"Does un- always mean exactly “not”?","answers":["No. It can also mean reverse an action, as in untie.","Yes. Untie means never tie anything.","No. Un- always means again."],"explanation":"Unhappy describes a state. Untie describes undoing an action. Keep the meaning connected to the base."},"apply":{"prompt":"“Please unwrap the gift.” What should you do?","answers":["Remove the wrapping.","Wrap it a second time.","Decide that it is not a gift."],"explanation":"Here un- reverses wrap."},"tip":"Act out wrap/unwrap and tie/untie, then contrast happy/unhappy."},{"id":"ed","title":"One ending, three sounds","kind":"Affix jobs","intro":"These words all use -ed for a past action. Sort by the ending you hear when you say the whole word. /t/ sounds like t; /d/ like d; /ɪd/ adds a syllable, like id.","groups":[{"id":"t","label":"/t/ sound","detail":"No extra syllable"},{"id":"d","label":"/d/ sound","detail":"No extra syllable"},{"id":"id","label":"/ɪd/ sound","detail":"An extra syllable"}],"cards":[{"word":"jumped","group":"t","evidence":"jump + ed → jumped. The ending sounds like /t/; it still marks the past.","sentence":"","id":"ed-0"},{"word":"helped","group":"t","evidence":"help + ed → helped. The ending sounds like /t/.","sentence":"","id":"ed-1"},{"word":"played","group":"d","evidence":"play + ed → played. The ending sounds like /d/.","sentence":"","id":"ed-2"},{"word":"cleaned","group":"d","evidence":"clean + ed → cleaned. The ending sounds like /d/.","sentence":"","id":"ed-3"},{"word":"wanted","group":"id","evidence":"want + ed → wanted. The ending sounds like /ɪd/ and adds a syllable.","sentence":"","id":"ed-4"},{"word":"needed","group":"id","evidence":"need + ed → needed. The ending sounds like /ɪd/ and adds a syllable.","sentence":"","id":"ed-5"}],"evidence":{"prompt":"What stays the same in these six words?","answers":["The -ed spelling and its job of marking a past action.","The ending always sounds exactly the same.","Every ending adds an extra syllable."],"explanation":"A morpheme can keep its spelling and grammatical job while its pronunciation varies."},"apply":{"prompt":"“We walked home yesterday.” What does -ed tell us?","answers":["The walking happened in the past, even though the ending sounds like /t/.","There was more than one walk.","The action is happening now."],"explanation":"Walk + ed → walked. The suffix marks the past; its sound here is /t/."},"tip":"Read each whole word. Do not pronounce every -ed as a separate “ed” syllable."}]};
/* Shared pure functions: no word generation, network calls, or student accounts. */
const MorphCore = (() => {
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function random(seed) { let s = seed >>> 0; return () => { s = (Math.imul(1664525,s)+1013904223) >>> 0; return s / 4294967296; }; }
  function shuffle(items, rng = Math.random) { const result = [...items]; for(let i=result.length-1;i>0;i--) { const j=Math.floor(rng()*(i+1)); [result[i],result[j]]=[result[j],result[i]]; } return result; }
  function options(answer, pool, rng = Math.random) { return shuffle([answer,...shuffle([...new Set(pool)].filter(x=>x!==answer),rng).slice(0,2)],rng); }
  const partsCorrect = (selected, parts) => selected.length === parts.length && selected.every((p,i)=>p===parts[i]);
  const wrongGroups = (assignments, cards) => cards.filter(c=>assignments[c.id]!==c.group).map(c=>c.id);
  const wordSum = parts => parts.filter(Boolean).join(' + ');
  const summary = entries => ({completed:entries.filter(x=>x.completed).length,independent:entries.filter(x=>x.completed&&!x.supported).length,supported:entries.filter(x=>x.completed&&x.supported).length});
  return {escape,random,shuffle,options,partsCorrect,wrongGroups,wordSum,summary};
})();
if(typeof module !== 'undefined' && module.exports) module.exports=MorphCore;

function speak(text) {
  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){announce('Read-aloud is unavailable in this browser. Read the sentence together.');return;}

}

function sort(){const active=current.cards.find(c=>c.id===selectedCard);const unassigned=orderedCards.filter(c=>!assignments[c.id]);return `<h2>Sort the evidence cards</h2><p class="muted space-sm">${e(current.intro)}</p><p class="smalltext space"><strong>1.</strong> Select a card. <strong>2.</strong> Select its group. To move a placed card, return it to the pool first.</p><div class="pool space-sm" aria-label="Unsorted cards">${unassigned.length?unassigned.map(c=>button(`<strong>${e(c.word)}</strong>${c.sentence?`<small>${e(c.sentence)}</small>`:''}`,'select-card',`data-id="${c.id}" aria-pressed="${c.id===selectedCard}"`,'sort-card'+(c.id===selectedCard?' selected':''))).join(''):`<p class="muted smalltext">All six cards are placed. Check your evidence.</p>`}</div><div class="row space-sm" id="selection-tools"><span class="tiny muted" role="status">${active?`Selected: ${e(active.word)}${active.sentence?' — '+e(active.sentence):''}`:'Select a card to choose a group.'}</span>${active?button('Hear this card','speak',`data-text="${e(active.sentence||active.word)}"`,'small'):''}</div><div class="sort-groups" style="--group-count:${current.groups.length}">${current.groups.map(g=>{const members=orderedCards.filter(c=>assignments[c.id]===g.id);return `<section class="sort-group">${button(`${e(g.label)}<small>${e(g.detail)}</small>`,'put-card',`data-group="${g.id}" ${!active||sortSolved?'disabled':''} aria-label="${e(active?'Place '+active.word+' in '+g.label:g.label)}"`)}<ul aria-label="Cards in ${e(g.label)}">${members.map(c=>`<li>${button(`${checked&&!wrongIds.includes(c.id)?'✓ ':wrongIds.includes(c.id)?'↺ ':''}${e(c.word)}${c.sentence?`<small class="muted" style="display:block;font-weight:600;font-size:.75rem">${e(c.sentence)}</small>`:''}`,'return-card',`data-id="${c.id}" ${sortSolved?'disabled':''} aria-label="Return ${e(c.word)}${c.sentence?' — '+e(c.sentence):''} to the pool"`,wrongIds.includes(c.id)?'wrong':checked?'correct':'')}</li>`).join('')}</ul>${!members.length?'<p class="empty-group">Cards placed here will appear below.</p>':''}</section>`;}).join('')}</div><div class="actions">${sortSolved?button('Investigate the pattern →','to-evidence','','primary'):button('Check my sort','check-sort',`${unassigned.length?'disabled':''}`,'primary')}${!sortSolved?button('Clear this sort','clear-sort'):''}</div>${checked?`<div class="evidence-list">${(sortSolved?current.cards:current.cards.filter(c=>wrongIds.includes(c.id))).map(c=>`<div><strong>${e(c.word)}${c.sentence?' — '+e(c.sentence):''}</strong>${e(c.evidence)}</div>`).join('')}</div>`:''}`;}
function questionView(){const q=stage==='evidence'?current.evidence:current.apply;const choices=stage==='evidence'?evidenceOptions:applyOptions;return `<p class="eyebrow">${stage==='evidence'?'Explain the pattern':'Use your discovery'}</p><h2>${e(q.prompt)}</h2>${stage==='evidence'?`<div class="info-strip space">${current.cards.slice(0,4).map(c=>`<span><strong>${e(c.word)}</strong></span>`).join('')}</div>`:''}<div class="answers">${choices.map(a=>button(e(a),'answer',`data-answer="${e(a)}" ${answered?'disabled':''}`,chosen===a?(answered?'correct':'incorrect'):'')).join('')}</div>${answered?stage==='evidence'?`<div class="actions">${button('Apply it in context →','to-apply','','primary')}</div>`:`<label class="field wide space">My evidence <span class="tiny muted" style="font-weight:600">Optional: explain the base or affix in your own words. You can discuss it aloud instead.</span><textarea id="reflection" placeholder="The word’s parts help me because…" maxlength="1500">${e(reflection)}</textarea></label><div class="actions">${button('Solve this case →','finish','','primary')}</div>`:''}`;}
function completed(){return `<p class="eyebrow">Case solved</p><h2>You followed the evidence.</h2><p class="lead">${e(current.tip)}</p><div class="info-strip space"><span><strong>6 cards</strong> sorted by meaning or job</span><span><strong>Pattern</strong> explained</span><span><strong>Context</strong> investigated</span></div><div class="evidence-list">${current.cards.map(c=>`<div><strong>${e(c.word)}${c.sentence?' — '+e(c.sentence):''}</strong>${e(c.evidence)}</div>`).join('')}</div>${reflection?`<div class="feedback space"><h3>My evidence</h3><p>${e(reflection)}</p></div>`:''}<p class="note space">${supported?'You solved this case with hints or retries. Revisit it later and see which ideas you remember.':'You solved this case without hints or retries.'} This describes the activity, not a reading level or grade.</p><div class="actions">${button('Choose another case','all','','primary')}${button('Print my case notes','print-notes')}${button('Investigate again','open',`data-id="${current.id}"`)}</div>`;}
function investigation(){return `<div class="solo">${head()}<section class="card">${stage==='sort'?sort():stage==='complete'?completed():questionView()}${message?feedback(message,messageType):''}${hint&&stage!=='complete'?feedback(stage==='sort'?current.tip:stage==='evidence'?current.evidence.explanation:current.apply.explanation,'hint','A clue to investigate'):''}</section></div>`;}
function teacher(){return `<div class="section-head"><div><p class="eyebrow">Teacher corner</p><h1 style="font-size:2.7rem">Ask “What is your evidence?”</h1><p>Designed for roughly Grades 3–6, with discussion and reading support as needed.</p></div></div><div class="split"><section class="card"><h2>A detective routine</h2><div class="evidence-list"><div><strong>Notice</strong>Read each card aloud. Name a possible base or affix. Treat a matching letter string as a question to investigate.</div><div><strong>Test</strong>Sort by a meaningful relationship or grammatical job. Use the context sentence. Explain a decision before checking it.</div><div><strong>Apply</strong>Discuss the evidence question. Write a new sentence using the word. Look for a related example in classroom reading.</div></div><p class="note space">Word-family cases focus on the stated base and its meaning. Related spellings or deep historical connections alone do not automatically place a word in that base family.</p></section><section class="card"><h2>Print a case file</h2><p>Sort the words on paper, explain the pattern, and use your discovery in context.</p><label class="field space">Investigation<select id="print-case">${DATA.cases.map(c=>`<option value="${c.id}" ${c.id===printCase?'selected':''}>${e(c.title)}</option>`).join('')}</select></label><div class="actions">${button('Print activity','print',`data-key="false"`,'primary')}${button('Print with answer key','print',`data-key="true"`)}</div><p class="tiny muted space">The answer key explains every card. A printed activity does not show multiple-choice answers.</p></section></div><section class="card space"><h2>Teaching details</h2><p>Six cases investigate bases, including compounds and spelling changes. Four compare affix jobs: -er, -s, un- and the three sounds of past-tense -ed.</p><p>Read both <strong>paints</strong> cards carefully: their sentences give them different jobs. Make each decision from the word and its context.</p><p>Read-aloud uses an available browser voice. For the -ed case, say the words together if pronunciation is unclear.</p><div class="actions">${button('Reset solved-case marks','reset')}</div><p class="tiny muted space">Marks last while this tab stays open. They do not record names or written responses.</p></section><div class="space">${researchPanel()}</div>`;}
function printable(key,notes=false){const c=notes?current:DATA.cases.find(c=>c.id===printCase);const sheet=`<p>${e(c.title)} · Name: ____________________ &nbsp; Date: ______________</p><p>${e(c.intro)}</p><h2>1 · Sort the evidence</h2><div class="print-word-list">${c.cards.map((a,i)=>`${i+1}. ${e(a.word)}${a.sentence?' — '+e(a.sentence):''}`).join('<br>')}</div><table><thead><tr>${c.groups.map(g=>`<th>${e(g.label)}<br><span style="font-weight:normal">${e(g.detail)}</span></th>`).join('')}</tr></thead><tbody><tr>${c.groups.map(g=>`<td style="height:110px">${notes?c.cards.filter(a=>a.group===g.id).map(a=>e(a.word)+(a.sentence?' — '+e(a.sentence):'')).join('<br>'):''}</td>`).join('')}</tr></tbody></table><div class="keep"><h2>2 · Explain the pattern</h2><p>${e(c.evidence.prompt)}</p>${notes?`<p>${e(c.evidence.answers[0])}</p>`:'<div class="writing-lines"></div><div class="writing-lines"></div>'}</div><div class="keep"><h2>3 · Apply your discovery</h2><p>${e(c.apply.prompt)}</p>${notes?`<p>${e(c.apply.answers[0])}</p><p>My evidence: ${e(reflection||'Discussed aloud.')}</p>`:'<div class="writing-lines"></div><div class="writing-lines"></div>'}</div><p class="print-footer">Word Detective · interactives.blackgold.ca/word-detective/</p>`;const answers=key?`<section class="key"><h2>Teacher answer key · ${e(c.title)}</h2><table><thead><tr><th>Card</th><th>Group</th><th>Evidence</th></tr></thead><tbody>${c.cards.map(a=>`<tr><td>${e(a.word)}${a.sentence?'<br>'+e(a.sentence):''}</td><td>${e(c.groups.find(g=>g.id===a.group).label)}</td><td>${e(a.evidence)}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:18px">Explain</h3><p>${e(c.evidence.answers[0])} ${e(c.evidence.explanation)}</p><h3>Apply</h3><p>${e(c.apply.answers[0])} ${e(c.apply.explanation)}</p><p>Accept accurate explanations in learners’ own words.</p></section>`:'';printPage(notes?'Word Detective — my case notes':'Word Detective — case file',sheet+answers);}
function render(focus=false){navActive(route);draw(route==='teacher'?teacher():current?investigation():home(),focus);}
function focusNextCard(){const target=main.querySelector('.pool button')||main.querySelector('[data-action="check-sort"]');target?.focus({preventScroll:true});}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled||b.dataset.action==='speak')return;const action=b.dataset.action;
 if(action==='route'){route=b.dataset.route;render(true);return;}
 if(action==='all'){current=null;route='cases';render(true);return;}
 if(action==='resume'){route='cases';render(true);return;}
 if(action==='filter'){filter=b.dataset.filter;render();return;}
 if(action==='open'){openCase(b.dataset.id);return;}
 if(action==='select-card'){
 selectedCard=b.dataset.id;message='';const active=current.cards.find(c=>c.id===selectedCard);
 main.querySelectorAll('button[data-action="select-card"]').forEach(card=>{const isSelected=card.dataset.id===selectedCard;card.setAttribute('aria-pressed',String(isSelected));card.classList.toggle('selected',isSelected);});
 main.querySelectorAll('button[data-action="put-card"]').forEach(group=>{group.disabled=false;group.setAttribute('aria-label','Place '+active.word+' in '+current.groups.find(g=>g.id===group.dataset.group).label);});
 main.querySelector('#selection-tools').innerHTML=`<span class="tiny muted" role="status">Selected: ${e(active.word)}${active.sentence?' — '+e(active.sentence):''}</span>${button('Hear this card','speak',`data-text="${e(active.sentence||active.word)}"`,'small')}`;
 main.querySelectorAll('.feedback.error').forEach(f=>f.remove());announce('Card selected. Choose a group.');return;
 }
 if(action==='put-card'){if(!selectedCard)return;assignments[selectedCard]=b.dataset.group;selectedCard=null;wrongIds=[];checked=false;message='';render();focusNextCard();return;}
 if(action==='return-card'){delete assignments[b.dataset.id];selectedCard=b.dataset.id;wrongIds=[];checked=false;message='';render();return;}
 if(action==='check-sort'){wrongIds=MorphCore.wrongGroups(assignments,current.cards);checked=true;sortSolved=wrongIds.length===0;if(!sortSolved)supported=true;message=sortSolved?'All six cards fit their groups. Read the explanations, then investigate the pattern.':`${wrongIds.length} ${wrongIds.length===1?'card needs':'cards need'} another look. Read the evidence below, return those cards to the pool, and try a different group.`;messageType=sortSolved?'success':'error';announce(message);render();return;}
 if(action==='clear-sort'){assignments={};selectedCard=null;wrongIds=[];checked=false;message='';render();focusNextCard();return;}
 if(action==='hint'){supported=true;hint=true;announce('A clue is shown below the activity.');render();return;}
 if(action==='to-evidence'){stage='evidence';chosen=null;answered=false;hint=false;message='';render(true);return;}
 if(action==='answer'){const q=stage==='evidence'?current.evidence:current.apply;chosen=b.dataset.answer;answered=chosen===q.answers[0];if(!answered)supported=true;message=answered?q.explanation:'Revisit the word’s base, affix and meaning in this context. Try another explanation, or use a hint.';messageType=answered?'success':'error';announce(message);render();return;}
 if(action==='to-apply'){stage='apply';chosen=null;answered=false;hint=false;message='';render(true);return;}
 if(action==='finish'){stage='complete';solved[current.id]={supported};hint=false;message='';render(true);return;}
 if(action==='reset'){solved={};announce('Solved-case marks cleared.');render();return;}
 if(action==='print'){printable(b.dataset.key==='true');return;}
 if(action==='print-notes'){printable(false,true);return;}
});
document.addEventListener('change',event=>{if(event.target.id==='print-case')printCase=event.target.value;});
document.addEventListener('input',event=>{if(event.target.id==='reflection')reflection=event.target.value;});
render();
</script></body></html>
