<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canada expanded · screen checks</title><style>body{font:16px system-ui;margin:16px;color:#18344c}button,select{font:inherit;padding:10px;margin:3px;min-height:44px}iframe{display:block;border:2px solid #789;max-width:none}pre{white-space:pre-wrap;background:#eef3f7;padding:12px}#viewport{max-width:100%;overflow:auto}</style><h1>Expanded map: classroom screen checks</h1><p>Resize the embedded app without reloading it, and inspect the timeline, selection and map view.</p><label for="size">Screen size</label><select id="size"><option>1024 × 540</option><option>1366 × 650</option><option>768 × 900</option><option>390 × 667</option><option>320 × 568</option><option>640 × 360</option><option>512 × 270</option></select><button id="inspect">Inspect layout</button><button id="run">Check all dates and screens</button><pre id="results" role="status">Waiting for the embedded app.</pre><div id="viewport"><iframe id="app" title="Expanded Canada timeline" width="1024" height="540" src="./?year=1713"></iframe></div><script>
const frame=document.querySelector('#app'),result=document.querySelector('#results'),size=document.querySelector('#size');
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const doc=()=>frame.contentDocument;
async function ready(){for(let i=0;i<200;i++){if(doc()?.documentElement.dataset.ready==='true' && doc().querySelector('#loading').hidden)return;await delay(75);}throw Error('App failed to become ready');}
function metrics(){const d=doc(),map=d.querySelector('#map'),controls=[...d.querySelectorAll('button,select,.map-toggles label')].filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height);return {screen:`${frame.width}x${frame.height}`,documentWidth:d.documentElement.scrollWidth,viewportWidth:frame.contentWindow.innerWidth,overflow:d.documentElement.scrollWidth>frame.contentWindow.innerWidth+1,mapHeight:Math.round(map.getBoundingClientRect().height),smallControls:controls.filter(e=>e.getBoundingClientRect().height<43.5).map(e=>e.id||e.textContent.trim()),date:d.querySelector('#story-year').textContent,selection:d.querySelector('#region-title').textContent,transform:d.querySelector('#map-world').getAttribute('transform')};}
function resize(){const [w,h]=size.value.split(' × ').map(Number);frame.width=w;frame.height=h;}
size.onchange=async()=>{resize();await delay(150);result.textContent=JSON.stringify(metrics(),null,2);};
document.querySelector('#inspect').onclick=()=>{result.textContent=JSON.stringify(metrics(),null,2);};
frame.onload=async()=>{try{await ready();result.textContent=JSON.stringify(metrics(),null,2);}catch(e){result.textContent=e.message;}};
document.querySelector('#run').onclick=async()=>{const lines=[];const report=s=>{lines.push(s);result.textContent=lines.join('\n');};const check=(ok,message)=>{if(!ok)throw Error(message);};try{await ready();const d=doc(),select=d.querySelector('#year-select');
for(let i=0;i<select.options.length;i++){select.value=i;select.dispatchEvent(new Event('change',{bubbles:true}));await ready();const label=select.options[i].textContent.split(' · ')[0];check(d.querySelector('#story-year').textContent===label,`Wrong date ${label}`);check(!d.querySelector('#loading').classList.contains('error'),`Error ${label}`);check(!!d.querySelector('#inquiry-question').textContent,`Missing inquiry ${label}`);if(i>0&&i<7)check(d.querySelector('#source-map image')&&d.querySelectorAll('#geography circle').length>0,`Missing source/markers ${label}`);if(i>=7)check(d.querySelectorAll('#regions path').length>0,`Missing vector regions ${label}`);if(label==='1840 / 1841')check(d.querySelector('#map-note').textContent.includes('1849'), 'Missing reference-map qualification');if(Number(label)>=1912&&Number(label)<1999)check(d.querySelector('.nwt-title'),`Missing unified NWT ${label}`);report(`PASS date ${label}`);}
for(const option of size.options){size.value=option.value;resize();await delay(150);const m=metrics();check(!m.overflow,`Horizontal overflow ${m.screen}`);check(!m.smallControls.length,`Small controls ${m.screen}: ${m.smallControls}`);check(m.mapHeight>=210&&m.mapHeight<=770,`Map height ${m.screen}`);report(`PASS screen ${m.screen}: ${m.mapHeight}px map, no horizontal overflow`);}
// Selection, pan/zoom and date must survive a live resize.
select.value=timelineIndex(1912);select.dispatchEvent(new Event('change',{bubbles:true}));await ready();d.querySelector('#region-list button').click();d.querySelector('#zoom-in').click();await delay(300);const before=metrics();size.value='390 × 667';resize();await delay(200);const after=metrics();check(before.date===after.date&&before.selection===after.selection&&before.transform===after.transform,'Resize lost work');report('PASS live resize preserves date, selection and zoom');
d.querySelector('#compare-button').click();for(let i=0;i<150&&d.querySelector('#compare-status').textContent!=='Comparison ready.';i++)await delay(75);check(d.querySelector('#compare-status').textContent==='Comparison ready.','Comparison failed');check(d.querySelector('#compare-map-left svg')&&d.querySelector('#compare-map-right svg'),'Vector comparison missing');d.querySelector('#close-compare').click();report('PASS two-date comparison');
select.value=timelineIndex(1713);select.dispatchEvent(new Event('change',{bubbles:true}));await ready();d.querySelector('#compare-button').click();for(let i=0;i<150&&d.querySelector('#compare-status').textContent!=='Comparison ready.';i++)await delay(75);check(d.querySelector('#compare-map-left img')&&d.querySelector('#compare-map-right img'),'Source comparison missing');d.querySelector('#close-compare').click();report('PASS colonial source comparison');
d.querySelector('#show-labels').click();check(d.querySelector('#region-labels').getAttribute('display')==='none','Labels toggle failed');d.querySelector('#show-labels').click();report('PASS label toggle');report('ALL CHECKS PASSED');function timelineIndex(year){return [...select.options].findIndex(o=>o.textContent.startsWith(year+' ·'));}
}catch(e){report('FAIL: '+e.message);}};
</script></html>
