<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Routes screen checks</title><style>body{font:15px Arial,sans-serif;margin:22px;background:#f2f3ee;color:#193e34}h1{font-size:22px}nav{display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;padding:8px 16px;border:1px solid #99ae98;border-radius:6px;background:white;color:#193e34;cursor:pointer}#stage{width:max-content;border:1px solid #78937c;margin-top:14px}iframe{display:block;border:0}p{line-height:1.5}pre{white-space:pre-wrap;max-width:1100px}</style></head><body><h1>River Routes · rendered screen checks</h1><p>Same-origin iframe checks. Camp discoveries, cargo loads, river journeys, portages, trading visits and map choices must remain intact when switching sizes.</p><nav id="sizes"></nav><p id="report"></p><div id="stage"><iframe id="frame" title="River Routes preview" src="./?screencheck=20261009-journey1"></iframe></div><button id="audit">Audit current screen</button><pre id="details"></pre><script>
const sizes=[[1024,540],[1366,650],[768,900],[390,667],[320,568],[640,360]],frame=document.getElementById('frame');let size=sizes[0];
function audit(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w.RiverRoutesPreview)return;const b=[...d.querySelectorAll('button')].filter(el=>el.getClientRects().length);const small=b.filter(el=>el.getBoundingClientRect().height<43.9);const errors=[];if(d.documentElement.scrollWidth>size[0]+1)errors.push('Horizontal overflow');if(small.length)errors.push('Short controls: '+small.map(el=>el.textContent.trim()).join(', '));document.getElementById('report').textContent=size.join(' × ')+' · '+(errors.length?errors.join('; '):'No horizontal overflow; visible buttons ≥ 44 px');document.getElementById('details').textContent=JSON.stringify({viewport:size,state:w.RiverRoutesPreview.getState(),documentWidth:d.documentElement.scrollWidth,visibleButtons:b.length,errors},null,2);}
function resize(s){size=s;frame.width=s[0];frame.height=s[1];document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===s.join('x')));setTimeout(audit,150)}
document.getElementById('sizes').innerHTML=sizes.map(s=>'<button data-size="'+s.join('x')+'">'+s.join(' × ')+'</button>').join('');document.getElementById('sizes').addEventListener('click',e=>{if(e.target.dataset.size)resize(e.target.dataset.size.split('x').map(Number));});frame.addEventListener('load',audit);document.getElementById('audit').addEventListener('click',audit);resize(size);
</script></body></html>
