name: Build NOAA Earth photo bank
on:
  push:
    paths:
      - 'science-practice-lab/tools/build-earth-noaa-bank.py'
      - '.github/workflows/build-earth-photo-bank.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earth-noaa-photo-bank-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact NOAA-owned image panels
        run: |
          python -m pip install Pillow
          python science-practice-lab/tools/build-earth-noaa-bank.py
      - name: Commit reproducible attributed image bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-practice-lab/assets/earth/noaa-forecast-sources.webp science-practice-lab/assets/earth/noaa-weather-events.webp science-practice-lab/assets/image-bank.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add credited NOAA forecasting images to Earth Systems image bank'
            git pull --rebase origin main
            git push origin main
          fi
