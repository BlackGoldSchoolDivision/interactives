name: Verify Double Take sticker game
on:
  push:
    paths:
      - '.github/workflows/verify-double-take.yml'
      - 'double-take/*.js'
      - 'double-take/index.html'
      - 'double-take/style.css'
      - 'double-take/tools/**'
      - 'double-take/assets/**'
      - 'double-take/vendor/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: double-take-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verification requirements
        run: |
          npm install --no-save playwright-core@1.55.0
          python -m pip install Pillow pdfplumber
      - name: Validate all word questions and paper plans
        run: |
          node --check double-take/app.js
          node --check double-take/pdf.js
          node double-take/tools/check-model.cjs
      - name: Check browser play, touch input and actual downloads
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/double-take-web.log 2>&1 &
          sleep 2
          node double-take/tools/check-browser.cjs
          python double-take/tools/check-pdfs.py
      - name: Prepare classroom previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps
          p=Path('double-take/validation')
          for file in p.glob('*.png'):
              Image.open(file).convert('RGB').save(file.with_suffix('.webp'),'WEBP',quality=85,method=6)
              file.unlink()
          target=Path('interactive-learning-lab/images/double-take-20261024.webp')
          target.parent.mkdir(parents=True,exist_ok=True)
          ImageOps.pad(Image.open(p/'desktop.webp').convert('RGB'),(600,450),color='#76cbed').save(target,'WEBP',quality=85,method=6)
          PY
      - name: Save verified previews and practice examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add double-take/validation/*.webp double-take/validation/*.pdf interactive-learning-lab/images/double-take-20261024.webp
          if ! git diff --cached --quiet; then
            git commit -m "Capture verified Double Take game and paper examples"
            git pull --rebase origin main
            git push
          fi
