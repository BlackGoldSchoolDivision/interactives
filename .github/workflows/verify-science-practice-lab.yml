name: Verify Science Practice Lab
on:
  push:
    paths:
      - 'science-practice-lab/index.html'
      - 'science-practice-lab/*.js'
      - 'science-practice-lab/style.css'
      - 'science-practice-lab/tests/**'
      - 'science-practice-lab/assets/**/*.png'
      - '.github/workflows/verify-science-practice-lab.yml'
  workflow_dispatch:
concurrency:
  group: science-practice-lab-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  matter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify content and scoring
        run: node --test science-practice-lab/tests/*.test.cjs
      - name: Prepare browser and optimized artwork
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for source in Path('science-practice-lab/assets').rglob('*.png'):
              target = source.with_suffix('.webp')
              image = Image.open(source).convert('RGB')
              image.thumbnail((1600, 1200))
              image.save(target, 'WEBP', quality=82, method=6)
              print(f'Optimized {target}: {target.stat().st_size} bytes')
          PY
      - name: Exercise all questions and responsive layouts
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/science-lab-server.log 2>&1 &
          node science-practice-lab/tests/browser.cjs
          if [ -f science-practice-lab/tests/energy-browser.cjs ]; then
            node science-practice-lab/tests/energy-browser.cjs
          fi
          if [ -f science-practice-lab/tests/earth-browser.cjs ]; then
            node science-practice-lab/tests/earth-browser.cjs
          fi
          if [ -f science-practice-lab/tests/living-browser.cjs ]; then
            node science-practice-lab/tests/living-browser.cjs
          fi
          if [ -f science-practice-lab/tests/space-browser.cjs ]; then
            node science-practice-lab/tests/space-browser.cjs
          fi
          if [ -f science-practice-lab/tests/earth-showcase-browser.cjs ]; then
            node science-practice-lab/tests/earth-showcase-browser.cjs
          fi
          if [ -f science-practice-lab/tests/matter-showcase-browser.cjs ]; then
            node science-practice-lab/tests/matter-showcase-browser.cjs
          fi
          if [ -f science-practice-lab/tests/picture-card-browser.cjs ]; then
            node science-practice-lab/tests/picture-card-browser.cjs
          fi
          if [ -f science-practice-lab/tests/flowchart-browser.cjs ]; then
            node science-practice-lab/tests/flowchart-browser.cjs
          fi
      - name: Build question review contact sheets
        if: always()
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          folder = Path('science-practice-lab/validation/question-review')
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 20)
          for group in ('particles', 'temperature', 'expansion'):
              files = sorted(p for p in folder.glob(f'{group}-*.png') if '-phone' not in p.stem)
              for batch in range(0, len(files), 6):
                  sheet = Image.new('RGB', (1240, 2070), '#e5edef')
                  draw = ImageDraw.Draw(sheet)
                  for index, file in enumerate(files[batch:batch + 6]):
                      x, y = (index % 2) * 620, (index // 2) * 690
                      draw.text((x + 12, y + 8), file.stem, fill='#142b3d', font=font)
                      image = Image.open(file).convert('RGB')
                      image = ImageOps.contain(image, (600, 640))
                      sheet.paste(image, (x + 10, y + 40))
                  sheet.save(folder / f'review-{group}-{batch // 6 + 1}.jpg', quality=90)
          PY
      - name: Preserve validation images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-browser-validation
          path: science-practice-lab/validation/
          if-no-files-found: ignore
      - name: Publish optimized image bank only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Screenshots are retained as workflow artifacts rather than committed on every run.
          # This avoids binary image conflicts when the verification is run repeatedly.
          git add science-practice-lab/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Optimize Science Practice Lab image bank'
            git pull --rebase origin main
            git push origin main
          fi
