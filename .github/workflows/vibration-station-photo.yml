name: Prepare Vibration Station photographic asset
on:
  push:
    paths:
      - '.github/workflows/vibration-station-photo.yml'
      - 'vibration-station/tools/make-photo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python vibration-station/tools/make-photo.py
      - name: Publish photograph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vibration-station/assets/string-box.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add Creative Commons wooden instrument photograph to Vibration Station'
            git pull --rebase origin main
            git push origin main
          fi
