name: Verify Magnet Workshop and capture Lab screenshot
on:
  push:
    paths:
      - '.github/workflows/verify-magnet-workshop.yml'
      - 'magnet-workshop/index.html'
      - 'magnet-workshop/freeplay.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lean browser test tools
        run: |
          npm install --no-save playwright-core@1.55.0
          python -m pip install Pillow
      - name: Validate browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          content=Path('magnet-workshop/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',content)
          assert len(blocks)==1
          Path('/tmp/magnet-workshop.js').write_text(blocks[0])
          PY
          node --check /tmp/magnet-workshop.js
      - name: Test experiments and capture actual screen
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/magnet-server.log 2>&1 &
          sleep 2
          node <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/magnet-workshop/',{waitUntil:'networkidle'});
            assert.equal(await page.locator('#experimentTitle').innerText(),'Same Poles');
            assert.equal(await page.locator('#test').isDisabled(),true);
            const asset=await page.request.get('http://127.0.0.1:8765/magnet-workshop/assets/bar-magnet.webp');
            assert(asset.ok(),'Photographic magnet asset missing');
            await page.screenshot({path:'/tmp/magnet-workshop-desktop.png',animations:'disabled'});
            await page.locator('#choiceB').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('Push apart'),'Repulsion result');
            await page.locator('#flip').click();
            await page.locator('#choiceA').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('Pull together'),'Attraction result after flip');
            const touchingPoles=await page.evaluate(()=>{
              const a=document.querySelector('#magLeft').getBoundingClientRect();
              const b=document.querySelector('#magRight').getBoundingClientRect();
              return b.left-a.right;
            });
            assert(Math.abs(touchingPoles)<=4,'Opposite poles should meet; remaining gap: '+touchingPoles);
            await page.screenshot({path:'/tmp/magnet-contact-poles.png',animations:'disabled'});
            await page.locator('[data-mode="distance"]').click();
            await page.locator('#choiceB').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('weaker'),'Far-distance result');
            await page.locator('#distance').evaluate(el=>{el.value='8';el.dispatchEvent(new Event('input',{bubbles:true}));});
            await page.locator('#choiceA').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('stronger'),'Near-distance result');
            await page.locator('[data-mode="objects"]').click();
            await page.locator('#choiceA').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('pulls'),'Paperclip result');
            const paperclipContact=await page.evaluate(()=>{
              const a=document.querySelector('#magLeft').getBoundingClientRect();
              const b=document.querySelector('#objectLab').getBoundingClientRect();
              return {horizontal:a.right-b.left,vertical:(a.top+a.height/2)-(b.top+b.height/2)};
            });
            assert(paperclipContact.horizontal>=0&&paperclipContact.horizontal<=28,
              'Paper clip should reach the magnet: '+JSON.stringify(paperclipContact));
            assert(Math.abs(paperclipContact.vertical)<=3,
              'Paper clip should align with the magnet: '+JSON.stringify(paperclipContact));
            await page.screenshot({path:'/tmp/magnet-contact-object.png',animations:'disabled'});
            await page.locator('#test').click();
            await page.locator('#choiceB').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            assert((await page.locator('#question').innerText()).includes('No pull'),'Pencil result');
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            assert(!await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),'Unexpected horizontal overflow at 390px');
            await page.locator('[data-mode="objects"]').click();
            await page.locator('#choiceA').click();await page.locator('#test').click();await page.waitForTimeout(1350);
            const phoneContact=await page.evaluate(()=>{
              const a=document.querySelector('#magLeft').getBoundingClientRect();
              const b=document.querySelector('#objectLab').getBoundingClientRect();
              return {horizontal:a.right-b.left,vertical:(a.top+a.height/2)-(b.top+b.height/2)};
            });
            assert(phoneContact.horizontal>=0&&phoneContact.horizontal<=28&&Math.abs(phoneContact.vertical)<=3,
              'Mobile paper clip should touch magnet: '+JSON.stringify(phoneContact));
            await page.screenshot({path:'/tmp/magnet-workshop-phone.png',fullPage:true});
            await page.setViewportSize({width:320,height:700});
            assert(!await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),'Unexpected horizontal overflow at 320px');
            // Free Play: mouse hover magnet collects steel, not wood, and objects
            // remain visibly attached as the cursor moves.
            await page.setViewportSize({width:1440,height:900});
            await page.locator('[data-mode="free"]').click();
            assert(await page.locator('#freeLab').isVisible(),'Free Play panel not shown');
            const sweep=async id=>{
              const b=await page.locator('[data-free-item="'+id+'"] .specimen').boundingBox();
              if(!b)throw Error('Missing scatter object '+id);
              await page.mouse.move(b.x+b.width/2,b.y+b.height/2);
              await page.waitForTimeout(80);
            };
            await sweep('pencil');
            assert.equal(await page.locator('#freeCount').innerText(),'0 / 6','Pencil should not stick');
            await sweep('clip');
            assert(await page.locator('#freeCarry [data-free-item="clip"]').count(),'Paperclip should attach');
            const first=await page.locator('#freeCarry [data-free-item="clip"]').boundingBox();
            const boardBox=await page.locator('#freeBoard').boundingBox();
            await page.mouse.move(boardBox.x+boardBox.width*.52,boardBox.y+boardBox.height*.5);
            const second=await page.locator('#freeCarry [data-free-item="clip"]').boundingBox();
            assert(Math.abs(second.x-first.x)>20,'Collected paperclip did not move with the magnet');
            for(const id of ['bolt','pin','washer','tack','key'])await sweep(id);
            assert.equal(await page.locator('#freeCount').innerText(),'6 / 6','All six steel objects should be collected');
            await page.screenshot({path:'/tmp/magnet-free-play.png',animations:'disabled'});
            await page.locator('#freeReset').click();
            assert.equal(await page.locator('#freeCount').innerText(),'0 / 6','Reset should scatter the pieces');
            assert.equal(await page.locator('#freeObjects .free-object').count(),12);
            await page.locator('[data-mode="poles"]').click();
            assert(await page.locator('#lesson').isVisible(),'Original experiment should return');
            assert(!(await page.locator('#freeLab').isVisible()),'Free panel should be hidden');
            await page.setViewportSize({width:390,height:844});
            await page.locator('[data-mode="free"]').click();
            assert(!await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),'Horizontal overflow in Free Play at 390px');
            const key=await page.locator('#freeBoard').focus();
            await page.keyboard.press('ArrowRight');
            assert((await page.locator('#freeMagnet').evaluate(el=>parseFloat(el.style.left)))>60,'Arrow keyboard control');
            await page.screenshot({path:'/tmp/magnet-free-phone.png',fullPage:true});
            await page.setViewportSize({width:320,height:700});
            assert(!await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),'Horizontal overflow in Free Play at 320px');
            assert.equal(errors.length,0,'Browser JS errors: '+errors.join(', '));
            await browser.close();console.log('Magnet Workshop passed poles, flip, force-distance, magnetic-object and mobile smoke tests');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Prepare full-screen Learning Lab image
        run: |
          python - <<'PY'
          from PIL import Image,ImageStat
          from pathlib import Path
          im=Image.open('/tmp/magnet-workshop-desktop.png').convert('RGB')
          assert im.size==(1440,900),im.size
          assert max(ImageStat.Stat(im).stddev)>22
          # Preserve a contact-state screenshot for visual QA without changing the Lab thumbnail.
          dest=Path('magnet-workshop/validation')
          dest.mkdir(parents=True,exist_ok=True)
          for name in ['poles','object']:
              picture=Image.open('/tmp/magnet-contact-'+name+'.png').convert('RGB')
              picture.thumbnail((900,600),Image.Resampling.LANCZOS)
              picture.save(dest/('contact-'+name+'.webp'),'WEBP',quality=85)
          thumb=im.copy();thumb.thumbnail((600,450),Image.Resampling.LANCZOS)
          out=Image.new('RGB',(600,450),(250,246,239))
          out.paste(thumb,((600-thumb.width)//2,(450-thumb.height)//2))
          dest=Path('interactive-learning-lab/images/magnet-workshop-full-20261023.webp')
          out.save(dest,'WEBP',quality=88,method=6)
          print(dest,dest.stat().st_size)
          for source,name in [('/tmp/magnet-free-play.png','free-play-desktop'),('/tmp/magnet-free-phone.png','free-play-phone')]:
              img=Image.open(source).convert('RGB')
              img.thumbnail((1000,1600),Image.Resampling.LANCZOS)
              out=Path('magnet-workshop/validation')/(name+'.webp')
              out.parent.mkdir(parents=True,exist_ok=True)
              img.save(out,'WEBP',quality=88)
              print(out,out.stat().st_size)

          PY
      - name: Publish screenshot and mobile QA artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interactive-learning-lab/images/magnet-workshop-full-20261023.webp magnet-workshop/validation/contact-*.webp magnet-workshop/validation/free-play-*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Capture verified Magnet Workshop gameplay screenshot'
            git pull --rebase origin main
            git push origin main
          fi
