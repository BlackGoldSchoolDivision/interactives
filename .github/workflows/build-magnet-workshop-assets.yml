name: Magnet Workshop photo asset
on:
  push:
    paths:
      - 'magnet-workshop/tools/build-assets.py'
      - '.github/workflows/build-magnet-workshop-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python magnet-workshop/tools/build-assets.py
      - name: Commit reproducible photographic magnet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add magnet-workshop/assets/bar-magnet.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Publish attributed magnet photograph for Grade 4'
            git pull --rebase origin main
            git push origin main
          fi
