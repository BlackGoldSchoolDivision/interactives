name: Prepare Chantelle math hub screenshots

on:
  push:
    paths:
      - .github/workflows/prepare-chantelle-math-thumbs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Optimize verified real-game browser captures for Learning Lab
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps,ImageStat
          from pathlib import Path
          shots = [
            ('forest-math-adventure/validation-menu-desktop.png', 'interactive-learning-lab/images/forest-math-adventure-20261019.webp'),
            ('space-math-explorers/validation-menu-desktop.png', 'interactive-learning-lab/images/space-math-explorers-20261019.webp'),
          ]
          for source, destination in shots:
              src=Path(source)
              assert src.is_file() and src.stat().st_size>50000, f'Expected actual browser capture: {source}'
              im=Image.open(src).convert('RGB')
              assert im.width>=900 and im.height>=550, f'Unexpected game capture dimensions: {im.size}'
              assert max(ImageStat.Stat(im).stddev)>28, f'Blank screenshot? {source}'
              thumb=ImageOps.fit(im, (600,450), method=Image.Resampling.LANCZOS, centering=(.5,.35))
              out=Path(destination)
              out.parent.mkdir(exist_ok=True,parents=True)
              for quality in (86,82,76,70,64,58):
                  thumb.save(out,'WEBP',quality=quality,method=6)
                  if out.stat().st_size<=150000:break
              assert out.stat().st_size<=150000, f'Preview too large: {out.stat().st_size}'
              print(source,'->',destination,'source-size',im.size,'bytes',out.stat().st_size)
          PY
      - name: Commit verified screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interactive-learning-lab/images/forest-math-adventure-20261019.webp interactive-learning-lab/images/space-math-explorers-20261019.webp
          git commit -m 'Add actual Forest and Space Math game screenshots to Learning Lab'
          git pull --rebase origin main
          git push origin main
