name: Verify Word Ladders and teacher PDFs
on:
  push:
    paths:
      - '.github/workflows/verify-word-ladders.yml'
      - 'word-ladders/*.js'
      - 'word-ladders/index.html'
      - 'word-ladders/style.css'
      - 'word-ladders/tools/**'
      - 'word-ladders/assets/**'
      - 'word-ladders/vendor/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: word-ladders-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install verification requirements
        run: |
          npm install --no-save playwright-core@1.55.0
          python -m pip install Pillow pdfplumber pypdf
      - name: Check every six-word ladder and PDF plan
        run: |
          node --check word-ladders/app.js
          node --check word-ladders/pdf.js
          node word-ladders/tools/check-model.cjs
          node -e "require('fs').writeFileSync('word-ladders/validation/puzzles.json',JSON.stringify(require('./word-ladders/data.js')))"
      - name: Check browser play and actual teacher downloads
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/word-ladders-web.log 2>&1 &
          sleep 2
          node word-ladders/tools/check-browser.cjs
          python word-ladders/tools/check-pdfs.py
      - name: Prepare classroom previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps
          p=Path('word-ladders/validation')
          for file in p.glob('*.png'):
              Image.open(file).convert('RGB').save(file.with_suffix('.webp'),'WEBP',quality=85,method=6)
              file.unlink()
          target=Path('interactive-learning-lab/images/word-ladders-20261024.webp')
          ImageOps.pad(Image.open(p/'desktop.webp').convert('RGB'),(600,450),color='#12314c').save(target,'WEBP',quality=85,method=6)
          PY
      - name: Save verified previews and PDF examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add word-ladders/validation/*.webp word-ladders/validation/*.pdf interactive-learning-lab/images/word-ladders-20261024.webp
          if ! git diff --cached --quiet; then
            git commit -m "Capture verified Word Ladders and teacher PDF examples"
            git pull --rebase origin main
            git push
          fi
