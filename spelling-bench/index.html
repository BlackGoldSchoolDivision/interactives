<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Gold Spelling Bench</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="app-shell">
    <!-- ==================== SLIM TOP NAVIGATION BAR ==================== -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="bench-mark" aria-hidden="true">b</span>
        <button class="home-pill-btn" id="btnHome" aria-label="Choose an activity">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.1 2.7 10.7a1 1 0 0 0 .64 1.77H5v7.53a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1v-7.53h1.66a1 1 0 0 0 .64-1.77L12 3.1Z"/></svg>
          <span>Activities</span>
        </button>

        <span class="topbar-mode-title" id="topModeTitle">Spelling Bench</span>

        

        <button class="list-dropdown-btn" id="btnListDropdown" title="Choose or Create Word Lists">
          <span id="topListLabel">Three-letter words</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <div class="topbar-right">
        <button class="user-medallion-btn" id="btnUserMedallion" title="Choose a learner or view session reports">
          <!-- Gold scalloped medallion avatar -->
          <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M20 2 L24.2 5.4 L29.5 4.6 L31.6 9.6 L36.6 11.7 L35.8 17 L39.2 21.2 L35.8 25.4 L36.6 30.7 L31.6 32.8 L29.5 37.8 L24.2 37 L20 40.4 L15.8 37 L10.5 37.8 L8.4 32.8 L3.4 30.7 L4.2 25.4 L0.8 21.2 L4.2 17 L3.4 11.7 L8.4 9.6 L10.5 4.6 L15.8 5.4 Z" fill="#f4c65d" stroke="#1b1a38" stroke-width="2"/>
            <circle cx="20" cy="21" r="12" fill="#e6ab3c" stroke="#9e6a15" stroke-width="1.3"/>
            <circle cx="20" cy="17.5" r="4.2" fill="#1b1a38" opacity="0.72"/>
            <path d="M12.5 28.5 C13.5 23.8 16.5 22.5 20 22.5 C23.5 22.5 26.5 23.8 27.5 28.5" fill="#1b1a38" opacity="0.72"/>
          </svg>
          <span class="user-medallion-name" id="topUserName">Learner</span>
        </button>

        <div class="audio-switch-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M18.8 5.2a9.5 9.5 0 0 1 0 13.6"/>
          </svg>
          <button class="pill-switch on" id="btnAudioToggle" role="switch" aria-checked="true" aria-label="Toggle Audio On or Off">
            <span class="pill-switch-knob"></span>
          </button>
        </div>

        <button class="gear-btn" id="btnSettings" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ==================== MAIN VIEWPORT ==================== -->
    <main id="mainView" style="flex: 1; display: flex; flex-direction: column;"></main>
  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Word Lists</h2>
        <button class="modal-close-btn" id="btnCloseModal" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="bench-feedback" id="benchFeedback" role="status" aria-live="polite"></div>
  <div class="toast-pill" id="toast" role="status" aria-live="polite"></div>
  <div class="confetti-layer" id="confettiLayer"></div>

  <script src="audio-index.js?v=2"></script>
<script src="app.js?v=3"></script>
</body>
</html>
