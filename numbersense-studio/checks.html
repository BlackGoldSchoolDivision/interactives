<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Number Sense screen checks</title>
<style>body{margin:0;background:#edf2f5;color:#17344d;font:16px/1.4 system-ui,sans-serif}header{padding:12px 18px;background:white}h1{font-size:20px;margin:0 0 8px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:10px;border:1px solid #b7c6d0;border-radius:6px;background:white;color:inherit}#status{font-size:14px}.stage{padding:16px;overflow:auto}iframe{display:block;border:1px solid #a7bac6;background:white}</style></head>
<body><header><h1>Number Sense release checks</h1><div class="controls"><label>Activity <select id="activity"><option value="">Main menu</option></select></label><label>Screen <select id="screen"><option value="1024,540">1024 × 540</option><option value="1366,650">1366 × 650</option><option value="768,900">768 × 900</option><option value="390,667">390 × 667</option><option value="320,568">320 × 568</option><option value="640,360">640 × 360</option><option value="1200,900">Menu capture · 1200 × 900</option></select></label><label>Text <select id="text"><option value="100">100%</option><option value="200">200%</option></select></label><button id="measure">Check layout</button></div><p id="status" role="status">Loading…</p></header><main class="stage"><iframe id="preview" title="Number Sense screen preview" src="./index.html#/"></iframe></main>
<script type="module">
import {activities,bonusGames} from './catalogue.js';
const frame=document.querySelector('#preview'),activity=document.querySelector('#activity'),screen=document.querySelector('#screen'),status=document.querySelector('#status'),text=document.querySelector('#text');
for(const [value,label] of [...activities.map(a=>['activity/'+a.id,a.name]),...bonusGames.map(g=>['game/'+g.id,g.name]),['progress','Progress'],['credits','Credits']]){const option=new Option(label,value);activity.add(option);}
function size(){const [w,h]=screen.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}
function textSize(){frame.contentDocument.documentElement.style.fontSize=text.value+'%';requestAnimationFrame(measure);}
function measure(){try{const doc=frame.contentDocument,root=doc.documentElement;const overflow=Math.max(root.scrollWidth,doc.body.scrollWidth)-root.clientWidth;const controls=[...doc.querySelectorAll('button,input,select,a.button')].filter(e=>e.getBoundingClientRect().height&&e.type!=='checkbox');const small=controls.filter(e=>e.getBoundingClientRect().height<43.5);status.textContent=`${frame.contentWindow.innerWidth} × ${frame.contentWindow.innerHeight} · Horizontal overflow: ${Math.max(0,overflow)} px · Controls under 44px: ${small.length}`;}catch{status.textContent='Frame not ready';}}
activity.addEventListener('change',()=>{frame.contentWindow.location.hash='#/'+activity.value;});screen.addEventListener('change',size);text.addEventListener('change',textSize);document.querySelector('#measure').addEventListener('click',measure);frame.addEventListener('load',()=>{textSize();frame.contentDocument.fonts.ready.then(measure);});size();
</script></body></html>
