<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#057fac">
<meta name="description" content="Ocean Counting Explorer: count sea creatures, compare groups and solve simple addition and subtraction stories. A playful Grade 1 mathematics game.">
<title>Ocean Counting Explorer · Interactive Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900;1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=illustrated-2">
<script type="module" src="app.js?v=illustrated-2"></script>
</head>
<body>
<a class="skip-link" href="#reef-game">Skip to the activity</a>
<!-- Sea creatures and reef are local illustrated WebP files in assets/. No external image API. -->
<header class="masthead">
  <div class="masthead-inner">
    <div class="mini-mark" aria-hidden="true">✦</div>
    <div class="brand"><a class="lab-link" href="../interactive-learning-lab/">← Interactive Learning Lab</a>
      <h1>Ocean <span>Counting</span> Explorer <span class="title-starfish" aria-hidden="true">★</span></h1>
      <p>Count the sea creatures!</p>
    </div>
    <div class="progress-pill"><span id="level-label">Grade 1 reef</span><strong id="progress-text">1 / 5</strong><div class="progress-pips" id="progress-pips" aria-label="Round progress"></div></div>
  </div>
</header>
<nav class="modebar" aria-label="Choose how to play">
 <div class="modebar-inner">
   <div class="mode-switch" role="group" aria-label="Activity mode">
     <button type="button" data-mode="count" aria-pressed="true">Count</button>
     <button type="button" data-mode="compare" aria-pressed="false">Compare</button>
     <button type="button" data-mode="story" aria-pressed="false">Sea stories</button>
     <button type="button" data-mode="mix" aria-pressed="false">Ocean mix</button>
   </div>
   <label class="range-picker">Numbers to
     <select id="number-range"><option value="10">10</option><option value="20">20</option></select>
   </label>
 </div>
</nav>
<main id="reef-game" class="reef">
  <div class="reef-background" aria-hidden="true"></div>
  <div class="reef-layout">
    <section class="sea-stage" aria-labelledby="scene-heading">
      <div class="scene-heading" id="scene-heading">Explore the reef</div>
      <div class="mobile-question" id="mobile-question" aria-hidden="true"></div>
      <div id="scene" class="creature-stage" aria-label="Underwater animal counting scene"></div>
      <div class="scene-tip" id="scene-tip">Tap sea creatures to count them!</div>
    </section>
    <aside class="challenge" aria-label="Counting challenge">
      <div class="question-top">
        <div class="question-label" id="question-tag">LOOK &amp; COUNT</div>
        <button type="button" id="hear" class="sound-button" aria-label="Hear the question and instructions" title="Hear the question">♫ <span>Listen</span></button>
      </div>
      <h2 id="question-text">How many fish do you see?</h2>
      <div id="number-pad" class="answer-pad" aria-label="Choose your answer"></div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      <div class="question-actions">
        <button type="button" id="hint" class="action-secondary">💡 Hint</button>
        <button type="button" id="retry" class="action-secondary">↻ Try again</button>
        <button type="button" id="next" class="action-next" disabled>Next →</button>
      </div>
    </aside>
  </div>
</main>
<div class="game-footer"><span>Made for curious young mathematicians · Grade 1</span><span>Count • Compare • Add • Subtract</span></div>
</body>
</html>
