// Float Lab: SI forces; masses in g, volumes in mL (= cm³), density in g/mL.
const G=9.80665;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const FLUIDS=[

 {id:'salt',name:'Salt water',rho:1.0726,color:'#609cdf',aqueous:true},
 {id:'oil',name:'Vegetable oil',rho:0.92,color:'#f8ce52',aqueous:false},
 {id:'glycerin',name:'Glycerin',rho:1.26,color:'#a4cbe7',aqueous:true},
 {id:'syrup',name:'Corn syrup',rho:1.33,color:'#e6a568',aqueous:true},
 {id:'honey',name:'Honey',rho:1.42,color:'#d98a38',aqueous:true},
 {id:'ethanol',name:'Alcohol (ethanol)',rho:0.78932,color:'#b9a9e4',aqueous:true}
];
const MATERIALS=[
 {id:'oak',name:'Oak sample',rho:0.8,texture:0,color:'#c78b3d'},
 {id:'concrete',name:'Concrete sample',rho:2.4,texture:4,color:'#8294ad'},
 {id:'cork',name:'Cork sample',rho:0.24,texture:1,color:'#bd8644'},
 {id:'wax',name:'Paraffin wax',rho:0.9,texture:2,color:'#eadcc5'},
 {id:'plastic',name:'HDPE plastic',rho:0.95,texture:3,color:'#e96b51'},
 {id:'aluminium',name:'Aluminium sample',rho:2.7,texture:5,color:'#9eb3c5'}
];
// True densities at 20°C, 0..100 mass % ethanol in 5-point steps.
// CRC/International Critical Tables, hosted by Jefferson Lab. Interpolate between points.
const ETHANOL_RHO=[.99820,.98935,.98184,.97511,.96861,.96165,.95379,.94491,.93515,.92469,.91381,.90255,.89110,.87945,.86763,.85561,.84341,.83093,.81795,.80422,.78932];
function ethanolDensity(percent){let p=clamp(percent,0,100)/5,i=Math.min(19,Math.floor(p));return ETHANOL_RHO[i]+(ETHANOL_RHO[i+1]-ETHANOL_RHO[i])*(p-i);}

 const side=Math.cbrt(volume)/100,half=side/2;

 // Stable, semi-implicit linear drag. Drag increases upon immersion.
 const k=drag*(.02+.98*fraction);

 const ingredients=entries.flatMap(e=>e.ingredients||[{id:e.id,volume:e.volume,mass:e.mass}]);
 const mass=ingredients.reduce((s,i)=>s+i.mass,0),idealVolume=ingredients.reduce((s,i)=>s+i.volume,0);

function layerOrder(entries){return [...entries].sort((a,b)=>b.rho-a.rho);}

function layerEquilibrium(layers,sampleRho,volume=8,depth=.18){

function boatModel(width,height,cargo,rho=0.9982){

function persist(){try{localStorage.setItem(KEY,JSON.stringify({...S,version:1}));}catch{}updateCount();}
function announce(s){$('#announcement').textContent=s;}
function feedback(s){notice=s;const e=$('#feedback');if(e)e.textContent=s;announce(s);}
function updateCount(){$('#trials-count').textContent='My trials · '+S.trials.length;}
const option=(values,id)=>values.map(v=>`<option value="${v.id}" ${id===v.id?'selected':''}>${esc(v.name)}</option>`).join('');
function challengeSelect(mode,items){return `<div class="challenge"><label for="challenge">Investigation</label><select id="challenge" data-state="${mode}.challenge">${items.map(([id,s])=>`<option value="${id}" ${S[mode].challenge===id?'selected':''}>${s}</option>`).join('')}</select></div>`;}
function prediction(mode,items){return `<div class="prediction"><fieldset><legend>Your prediction</legend>${items.map(([id,text])=>`<button class="small" data-predict="${mode}:${id}" aria-pressed="${S[mode].prediction===id}">${text}</button>`).join('')}</fieldset></div>`;}
function shell(title,sub,inside){return `<section aria-labelledby="investigation-title"><div class="intro"><h1 id="investigation-title">${title}</h1><p>${sub}</p></div>${inside}<p id="feedback" class="feedback" aria-live="polite">${esc(notice)}</p></section>`;}
function compareHTML(){const c=S.compare,solids=c.kind==='solids';let ma=MATERIALS.find(m=>m.id===c.a),mb=MATERIALS.find(m=>m.id===c.b),fa=fluid(c.fa,c.salt),fb=fluid(c.fb,c.salt);let a=solids?ma:fa,b=solids?mb:fb;
return shell(solids?'Which sample is denser?':'Same volume. Which liquid has more mass?',solids?(c.challenge==='big'?'Compare mass and volume together, then test the solids in a fluid.':'Compare equal-volume solids, then test them in a fluid.'):'Measure matching volumes. Weigh them on the tared digital balances.',`

function keepTrial(){let title,data,prediction;const c=S.compare,l=S.layers,d=S.drop,b=S.boat;
if(S.mode==='compare'){if(!c.measured){feedback('Weigh the samples before keeping a trial.');return;}const solids=c.kind==='solids',a=solids?MATERIALS.find(m=>m.id===c.a):fluid(c.fa,c.salt),bb=solids?MATERIALS.find(m=>m.id===c.b):fluid(c.fb,c.salt);title=solids?'Compare solids':'Compare liquids';data={'Sample A':a.name+' · '+num(a.rho*volA())+' g · '+num(volA())+(solids?' cm³':' mL'),'Sample B':bb.name+' · '+num(bb.rho*c.volume)+' g · '+num(c.volume)+(solids?' cm³':' mL')};if(solids){data['Fluids']=fluid(c.fa,c.salt).name+' / '+fluid(c.fb,c.salt).name;data['Observation']=c.tested?compareFeedback():'Mass measurements only; floating test not run.';}prediction=c.prediction;}
else if(S.mode==='layers'){if(!l.entries.length)return;title='Layer liquids';data={'Order, bottom to top':layerOrder(l.entries).map(e=>e.name+' ('+num(e.volume)+' mL)').join(' → '),'Observation stage':({early:'Early observation',standing:'After standing',stirred:'After stirring'}[l.phase]),'Poured liquids':l.entries.flatMap(e=>e.ingredients).map(i=>fluid(i.id).name+' ('+num(i.volume)+' mL)').join('; '),'Added liquid':fluid(l.selected,l.salt).name};if(l.released)data['Test object']=MATERIALS.find(m=>m.id===l.sample).name;prediction=l.prediction;}
else if(S.mode==='drop'){if(!d.released)return;title='Suspend an oil drop';data={'Mixture':num(d.percent)+' g ethanol + '+num(100-d.percent)+' g water per 100 g mixture','Drop':d.volume+' mL castor oil','Observation':Math.abs(ethanolDensity(d.percent)-.969)<.00018?'Near neutral buoyancy':ethanolDensity(d.percent)>.969?'Tends to rise':'Tends to sink'};prediction=d.prediction;}
else {if(!b.tested)return;const m=boatModel(b.width,b.height,b.cargo);title='Build a floater';data={'Hull':num(b.width)+' cm wide × 12 cm long × '+num(b.height)+' cm high','Clay':'100 g · 50 cm³','Cargo':b.cargo+' g','Observation':m.flooded?'Flooded and sank':num(m.freeboard)+' cm freeboard; floating'};prediction=b.prediction;}
if(S.trials.length>=100){feedback('100 trials are kept. Download your records before clearing space for another investigation.');return;}S.trials.push({id:(typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),title,data,prediction:({a:'A is denser',b:'B is denser',same:'Same density',lower:'Settle lower',upper:'Stay higher',blend:'Blend with another liquid',unsure:'I need more evidence',rise:'Rise',stay:'Stay suspended',sink:'Sink',float:'Floats',flood:'Floods and sinks'}[prediction]||'Not recorded'),reflection:''});persist();feedback('Trial kept. Open My trials to add your explanation or compare it with another trial.');}
function changed(path,value,el){let [group,key]=path.split('.');S[group][key]=value;if(group==='compare'){if(['a','b','fa','fb','volume','salt','kind','challenge'].includes(key)){S.compare.measured=false;S.compare.tested=false;S.compare.prediction='';resetBodies();notice='';}if(key==='challenge'){let c=S.compare;if(value==='big'){c.kind='solids';c.a='cork';c.b='concrete';}if(value==='fluid'){c.kind='solids';c.a=c.b='plastic';c.fa='ethanol';c.fb='water';}}render();}
else if(group==='drop'&&key==='percent'){S.drop.percent=clamp(+value,0,60);dropSuccess=0;$('#alcohol-output').textContent=`${num(S.drop.percent)} g alcohol · ${num(100-S.drop.percent)} g water`;$('#mixture-density').textContent=num(ethanolDensity(S.drop.percent),4);$('#alcohol').value=S.drop.percent;notice='';$('#feedback').textContent='';persist();draw();}
else if(group==='boat'){if(key!=='prediction'){S.boat.tested=false;boatProgress=0;notice='';}render();}
else if(group==='layers'){if(key==='sample')S.layers.released=false;render();}
else {if(group==='drop'&&key==='volume'){S.drop.released=false;resetBodies();}render();}persist();}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;
if(el.dataset.mode){S.mode=el.dataset.mode;notice='';resetBodies();render();history.replaceState(null,'','#'+S.mode);return;}
if(el.dataset.dialog){openDialog(el.dataset.dialog);return;}
if(el.dataset.predict){let [mode,value]=el.dataset.predict.split(':');S[mode].prediction=value;document.querySelectorAll(`[data-predict^="${mode}:"]`).forEach(b=>b.setAttribute('aria-pressed',b===el));persist();return;}
if(el.dataset.kind){S.compare.kind=el.dataset.kind;S.compare.prediction='';S.compare.measured=false;S.compare.tested=false;notice='';resetBodies();render();return;}
if(el.dataset.fluid){S.layers.selected=el.dataset.fluid;S.layers.prediction='';render();return;}
if(el.dataset.nudge){changed('drop.percent',Math.round(clamp(S.drop.percent+Number(el.dataset.nudge),0,60)*10)/10);return;}
const act=el.dataset.action;
if(act==='weigh'){S.compare.measured=true;notice=compareFeedback();render();announce(notice);}
if(act==='compare-test'){if(S.compare.tested){resetBodies();}S.compare.tested=true;notice=compareFeedback();render();announce(notice);}
if(act==='compare-reset'){S.compare.tested=false;S.compare.measured=false;notice='';resetBodies();render();}
if(act==='pour'){let l=S.layers;if(l.entries.reduce((a,e)=>a+e.volume,0)+l.portion>600)return;currentPour=entry(l.selected,l.portion,l.salt);l.entries.push(currentPour);layerTween=reduced?1:0;l.phase='early';l.released=false;notice=`Poured ${l.portion} mL of ${fluid(l.selected,l.salt).name.toLowerCase()}. Observe its position before keeping or revising your explanation.`;render();announce(notice);}
if(act==='wait'||act==='stir'){let l=S.layers;l.entries=blendLayers(l.entries,act==='stir');l.phase=act==='stir'?'stirred':'standing';notice=act==='stir'?'Water-compatible liquids blend. Oil separates again. In this model the waiting time is shortened.':'Adjacent water-compatible liquids blend; oil can keep water and alcohol apart when it lies between them.';render();announce(notice);}
if(act==='layer-object'){S.layers.released=true;let m=MATERIALS.find(m=>m.id===S.layers.sample);const eq=layerEquilibrium(S.layers.entries,m.rho);notice=eq.state==='bottom'?'The sample reaches the bottom. Compare its density with every liquid in the stack.':eq.state==='surface'?'The sample floats at the upper surface. Explain why.':'The sample settles within the stack. Its weight balances buoyant forces from the liquid around it.';render();announce(notice);}
if(act==='layer-reset'){S.layers.entries=[];S.layers.phase='early';S.layers.released=false;notice='';render();}
if(act==='release'){S.drop.released=true;dropBody={z:-.07,v:0};dropSuccess=0;dropTime=0;notice='Drop released at the centre. Observe its motion, then adjust the mixture in small steps.';render();announce(notice);}
if(act==='boat-test'){S.boat.tested=true;boatProgress=0;const b=S.boat,m=boatModel(b.width,b.height,b.cargo),goal=Number(b.challenge);notice=m.flooded?'Water comes over the rim and fills the hull. Reshape the same clay, reduce the cargo, or both.':(goal&&b.cargo>=goal?'Challenge met! ':'')+'The hull floats. Compare this design with a trial using the same cargo.';render();announce(notice);}
if(act==='boat-reset'){S.boat.tested=false;notice='';render();}
if(act==='cargo-plus'){S.boat.cargo=Math.min(650,S.boat.cargo+25);S.boat.tested=false;notice='';render();}
if(act==='save')keepTrial();
if(act==='csv')exportCSV();
if(act==='print-trials')printPage(false);
if(act==='print-worksheet')printPage(true);
if(act==='clear-trials'){if(confirm('Clear your kept trials and explanations on this browser?')){S.trials=[];persist();openDialog('trials');}}
if(el.id==='motion'){S.paused=!S.paused;el.textContent=S.paused?'Resume motion':'Pause motion';persist();}
if(el.id==='close-dialog')$('#dialog').close();
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.state){let val=el.type==='checkbox'?el.checked:el.type==='range'||['volume','portion'].includes(el.dataset.state.split('.')[1])?Number(el.value):el.value;changed(el.dataset.state,val,el);}if(el.id==='show-density')$('#density-values').hidden=!el.checked;});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.state&&el.type==='range'){if(el.dataset.state==='drop.percent'){changed(el.dataset.state,Number(el.value),el);return;}const label=el.closest('.range-control')?.querySelector('output');if(label){let suffix=label.textContent.replace(/[0-9.,\s]/g,'');label.textContent=el.value+' '+suffix;}}
if(el.dataset.reflection){const trial=S.trials.find(t=>String(t.id)===el.dataset.reflection);if(trial){trial.reflection=el.value.slice(0,6000);persist();}}});
function download(name,content,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';let rows=[['Investigation','Prediction','Measurements and observations','Explanation'],...S.trials.map(t=>[t.title,t.prediction,Object.entries(t.data).map(([k,v])=>k+': '+v).join('; '),t.reflection])];download('Float-Lab-Trials.csv','\ufeff'+rows.map(r=>r.map(s=>quote(/^[=+@-]/.test(String(s))?'\''+s:s)).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function trialHTML(t,i){return `<article class="trial"><h3>${i+1}. ${esc(t.title)}</h3><dl><dt>Prediction</dt><dd>${esc(t.prediction)}</dd>${Object.entries(t.data).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><label>My explanation: what evidence supports it?<textarea maxlength="6000" data-reflection="${t.id}">${esc(t.reflection)}</textarea></label></article>`;}
function openDialog(type){const dialog=$('#dialog'),body=$('#dialog-body');let html='',title='';
if(type==='outcomes'){title='Connected Alberta Grade 5 outcomes';html=outcomesHTML();}
if(type==='teacher'){title='Teacher notes';html=teacherHTML();}
if(type==='trials'){title='My trials';html=`<p>Kept measurements remain as recorded. Add or revise your explanation below. Work stays in this browser; download or print it to keep a separate copy.</p><div class="trial-actions"><button data-action="csv" ${!S.trials.length?'disabled':''}>Download CSV</button><button data-action="print-trials" ${!S.trials.length?'disabled':''}>Print / save PDF</button><button class="ghost" data-action="clear-trials" ${!S.trials.length?'disabled':''}>Clear my trials</button></div>${S.trials.length?S.trials.map(trialHTML).join(''):'<div class="empty">No kept trials yet. Run an investigation, then choose Keep trial.</div>'}`;}
if(type==='print'){title='Print / save PDF';html='<p>Choose a blank investigation sheet or your kept trials. In your browser’s print window, choose Save as PDF for a PDF copy.</p><div class="trial-actions"><button data-action="print-worksheet">Blank investigation sheet</button><button data-action="print-trials" '+(!S.trials.length?'disabled':'')+'>My trials and explanations</button></div><p>Printed student sheets contain prompts and spaces for evidence. They do not include an answer key.</p>';}
$('#dialog-title').textContent=title;body.innerHTML=html;if(!dialog.open)dialog.showModal();}
function outcomesHTML(){return `<p>These connections describe the tasks in Float Lab. Each broad learning outcome has additional expectations beyond this simulation.</p>
<article class="outcome"><span class="basis">MATTER · DIRECT PRACTICE</span><h3>Particle model and physical properties</h3><p>Students investigate the particle model of matter in relation to the physical properties of solids, liquids, and gases.</p><ul><li>Measure the mass of solids and liquids using a balance scale and SI units.</li><li>Measure the volume of liquids using appropriate instruments and SI units.</li><li>Directly compare the density of solid objects that have the same volume.</li><li>Directly compare the density of liquids.</li></ul><p><b>Where:</b> Compare samples and Layer liquids. Mass is measured with simulated tared balances. Model volumes are selected and displayed in the measuring workspace.</p><p class="coverage">Focused coverage: mass, volume, and comparative density. This version does not teach the full particle model, gas density, compressibility, or all physical measurement techniques.</p></article>
<article class="outcome"><span class="basis">ENERGY · DIRECT PRACTICE / VIRTUAL DESIGN</span><h3>Forces in water and air</h3><p>Students investigate and compare how forces affect living things and objects in water and air.</p><ul><li>Relate buoyant force and weight to the tendency to float or sink in water.</li><li>Conduct controlled experiments to determine if various objects and materials float in different fluids.</li><li>Construct a device that can float.</li></ul><p><b>Where:</b> Compare solids, Suspend a drop, and Build a floater.</p><p class="coverage">The design task is virtual. Pair it with a physical build to address actual construction and safe tool use. Flight, living things in air, and other forces are outside this lab’s scope.</p></article>
<article class="outcome"><span class="basis">SCIENTIFIC METHODS · DIRECT PRACTICE</span><h3>Evidence and controlled experiments</h3><p>Students investigate how evidence is gathered and explain the importance of ethics in science.</p><ul><li>Plan and conduct a controlled experiment.</li><li>Identify the variables in a controlled experiment.</li><li>Apply vocabulary for variables correctly in science contexts.</li><li>Evaluate the effect of the manipulated variable on the responding variable in a controlled experiment.</li><li>Defend a conclusion about cause and effect based on evidence produced in a controlled experiment.</li></ul><p><b>Where:</b> Choose what changes, compare kept trials, and write explanations. Teacher prompts ask students to name manipulated, responding, and controlled variables.</p><p class="coverage">Supports discussion of bias, accurate records, ethical reporting, and communicating evidence. Those topics need explicit discussion; a simulation or exported table alone does not establish full coverage.</p></article>
<article class="outcome"><span class="basis">COMPUTER SCIENCE / DESIGN · SUPPORTING CONNECTION</span><h3>Design to meet a need</h3><p>Students apply design processes when creating artifacts that can be used by a human or machine to address a need.</p><ul><li>Design an artifact to meet a need.</li><li>Evaluate an artifact based on various factors.</li><li>Develop multiple iterations of an artifact.</li><li>Discuss examples of designs that have been enhanced or refined to better meet needs.</li><li>Propose enhancements and refinements to an artifact in collaboration with others.</li></ul><p><b>Where:</b> Build a floater. Compare designs carrying the same cargo, then explain a refinement to a partner.</p><p class="coverage">Supports part of the design outcome. The app does not teach block coding, algorithms, or loops.</p></article>
<p class="sources">Source: <a href="https://curriculum.learnalberta.ca/curriculum/en/c/sci5" target="_blank" rel="noopener">Alberta Grade 5 Science curriculum</a>. Learning outcome and listed skills wording checked against the supplied Alberta curriculum workbook, October 2026.</p>`;}
function teacherHTML(){return `<h3>A short investigation sequence</h3><ol><li>Teach or revisit mass, volume, density, and a fair comparison.</li><li>Ask for a prediction with a reason. Keep a measurement trial before changing a setting.</li><li>Change one variable. Have students name the manipulated variable, responding variable, and the factors held constant.</li><li>Keep a second trial, compare the evidence, and explain whether the prediction was supported.</li><li>Later, use a different sample or challenge without showing the earlier results.</li></ol><h3>Questions worth discussing</h3><ul><li>Would the heavier sample always be denser? What must you know about its volume?</li><li>Can you make the same object sink in one fluid and float in another?</li><li>Which liquid layers remain after stirring? Why is density alone insufficient to explain mixing?</li><li>Does changing the drop’s volume change the mixture needed for neutral buoyancy?</li><li>Which hull change made a difference when clay mass and cargo stayed the same?</li><li>Could your expectations influence which trials you choose to report?</li></ul><h3>Scientific model</h3><p>Density is mass divided by volume. Buoyant force equals the weight of displaced fluid. At rest, a freely floating object’s buoyant force balances its weight. A sinking object may also receive a support force from the bottom. Surface tension rounds an immiscible oil drop; buoyancy determines its rise or fall.</p><p>Water–ethanol density uses a 20°C reference table indexed by <b>mass percentage</b>, with interpolation. Mixture volumes are not assumed additive for this binary pair. The drop is a model castor-oil sample with density 0.969 g/mL. The slider replaces the surrounding uniform mixture between tests; it does not model the turbulence of pouring directly onto a drop.</p><p>Liquid-layer motion and waiting times are illustrative. Compatible adjacent layers blend when allowed to stand; an intervening oil layer acts as a barrier. Stirring combines water-compatible components and the oil separates again. Complex multi-ingredient blend densities use an additive-volume approximation. Honey, syrup, wood, plastic, and oil vary in real life; the values represent selected model samples, not every product.</p><p>The clay-hull model keeps clay volume and mass fixed while changing the dimensions of an open rectangular hull. It models displacement and flooding at the rim; it omits tipping, cracks, surface tension effects on tiny objects, and material strength.</p><h3>Physical classroom connection</h3><p>Follow local classroom safety procedures for any physical activity. The alcohol investigation here is virtual. Choose suitable classroom materials and supervision for hands-on demonstrations.</p><h3>Access and student work</h3><p>Controls work by tap, mouse, or keyboard. No dragging is required. Motion can be paused. Work is stored locally in this browser, with no account, microphone, analytics, or upload of student explanations. Print or download records before clearing browser storage. The offline copy contains the same models and assets.</p><h3>References</h3><ul class="sources"><li><a href="https://www.jlab.org/ir/CRCHandBooks/15_20_84.pdf" target="_blank" rel="noopener">CRC: density of ethanol–water mixtures</a> (International Critical Tables; hosted by Jefferson Lab).</li><li><a href="https://www.sfu.ca/phys/demos/demoindex/fluids/fl2b/density.html" target="_blank" rel="noopener">Simon Fraser University: fluid and salt-solution reference densities</a>.</li><li><a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter5/lesson7.html" target="_blank" rel="noopener">American Chemical Society: liquids dissolving in water</a>.</li><li><a href="https://sciencemuseum.ugent.be/engl-plat9.html" target="_blank" rel="noopener">Ghent University Science Museum: Plateau’s experiment</a>.</li><li><a href="https://www.learningscientists.org/blog/2019/1/31-1" target="_blank" rel="noopener">The Learning Scientists: implementing learning strategies</a>.</li></ul><p>Original interface, investigation prompts, models, and generated material artwork for Black Gold School Division. No Gizmos artwork, code, questions, or interface elements are used.</p>`;}
function printPage(blank){let old=$('.print-page');old?.remove();let section=document.createElement('section');section.className='print-page';if(blank){section.innerHTML=`<h1>Float Lab · Investigation record</h1><p>Grade 5 Science · Name: _____________________ Date: ______________</p><div class="print-box"><h3>My question and prediction</h3><div class="worksheet-line"></div><div class="worksheet-line"></div></div><div class="print-box"><h3>A fair test</h3><p>Manipulated variable (what I change):</p><div class="worksheet-line"></div><p>Responding variable (what I observe or measure):</p><div class="worksheet-line"></div><p>Controlled variables (what I keep the same):</p><div class="worksheet-line"></div></div><h3>My evidence</h3><table><tr><th>Trial / what changed</th><th>Measurements, with units</th><th>Observation</th></tr>${Array.from({length:4},()=>'<tr><td style="height:45px"></td><td></td><td></td></tr>').join('')}</table><div class="print-box"><h3>My conclusion</h3><p>Use evidence to explain what happened. Was your prediction supported?</p>${'<div class="worksheet-line"></div>'.repeat(4)}</div><p class="muted">Float Lab · Black Gold School Division · Model results are evidence about the simulation. Compare with real investigations where possible.</p>`;}else{section.innerHTML='<h1>Float Lab · My trials</h1><p>Predictions, measurements, observations, and explanations.</p>'+S.trials.map((t,i)=>`<article class="print-box"><h3>${i+1}. ${esc(t.title)}</h3><p><b>Prediction:</b> ${esc(t.prediction)}</p>${Object.entries(t.data).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}<p><b>My explanation:</b></p><p class="reflection-text">${esc(t.reflection||'No explanation recorded.')}</p></article>`).join('');}document.body.append(section);window.print();}
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close();}});
window.addEventListener('hashchange',()=>{let m=location.hash.slice(1);if(['compare','layers','drop','boat'].includes(m)){S.mode=m;resetBodies();notice='';render();}});
if(['compare','layers','drop','boat'].includes(location.hash.slice(1)))S.mode=location.hash.slice(1);
resetBodies();render();requestAnimationFrame(frame);

if(location.protocol==='file:'){const a=document.querySelector('a[download]');a.href=location.href;}
</script>
