<script>
'use strict';
const frame=document.querySelector('#preview'),activity=document.querySelector('#activity'),screen=document.querySelector('#screen'),status=document.querySelector('#status');
function size(){const [width,height]=screen.value.split(',').map(Number);frame.style.width=width+'px';frame.style.height=height+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}
function load(){frame.src='../'+activity.value;status.textContent='Loading…';}
function measure(){try{const win=frame.contentWindow,doc=frame.contentDocument,root=doc.documentElement,map=doc.querySelector('#map');if(!root||!doc.body){status.textContent='Loading…';return;}const overflow=Math.max(root.scrollWidth,doc.body.scrollWidth)-root.clientWidth;const box=map?.getBoundingClientRect();status.textContent=`${win.innerWidth} × ${win.innerHeight} · Horizontal overflow: ${Math.max(0,overflow)} px`+(box?` · Map: ${Math.round(box.width)} × ${Math.round(box.height)} px`:'')+' · Resize the preview during a question to check that work is preserved.';}catch{status.textContent='Preview loaded. Check the activity visually.';}}
activity.addEventListener('change',load);screen.addEventListener('change',size);document.querySelector('#measure').addEventListener('click',measure);frame.addEventListener('load',()=>{measure();frame.contentDocument?.fonts?.ready.then(measure);});size();load();
